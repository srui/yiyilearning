<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>申申的英语小世界 · 二年级上册</title>
<style>
@import url('https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;600;700;900&family=Fredoka:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(170deg,#0d1b2a 0%,#1b2838 40%,#2d4a3e 100%);min-height:100vh;color:#ecf0f1}

/* ===== Back Link ===== */
.back-home{display:inline-block;color:rgba(255,255,255,.25);font-size:.8em;text-decoration:none;padding:10px 16px 0;transition:color .2s}
.back-home:hover{color:rgba(255,255,255,.5)}

/* ===== Top Nav ===== */
.topnav{position:sticky;top:0;z-index:100;background:rgba(13,27,42,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:center;gap:4px;padding:10px 12px 0;overflow-x:auto}
.topnav button{border:none;background:none;color:rgba(255,255,255,.4);font-family:inherit;font-size:.88em;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.topnav button:hover{color:rgba(255,255,255,.7)}
.topnav button.on{color:#ffd200;border-bottom-color:#ffd200}

/* ===== Pages ===== */
.page{display:none;max-width:760px;margin:0 auto;padding:30px 20px 60px}
.page.on{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.page-title{font-family:'Fredoka',sans-serif;font-size:1.8em;color:#ffd200;margin-bottom:4px}
.page-desc{color:rgba(255,255,255,.35);font-size:.9em;margin-bottom:30px}

/* ===== READ Page ===== */
.legend{display:flex;justify-content:center;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px;font-size:.82em;color:rgba(255,255,255,.4)}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend .lv{background:#ff7675}.legend .ln{background:#74b9ff}.legend .lo{background:#ffeaa7}

.story-hd{font-family:'Fredoka',sans-serif;font-size:1.3em;color:#ffd200;margin:36px 0 4px;padding-top:20px;border-top:1px solid rgba(255,255,255,.05)}
.story-hd:first-child{margin-top:0;border-top:none;padding-top:0}
.story-sub{color:rgba(255,255,255,.28);font-size:.82em;margin-bottom:18px}

.para{margin-bottom:22px}
.en{font-family:'Fredoka','Noto Sans SC',sans-serif;font-size:1.12em;line-height:2.3;color:#ecf0f1}
.zh{font-size:.9em;line-height:2;color:rgba(255,255,255,.28);margin-top:4px;padding-left:14px;border-left:2px solid rgba(255,255,255,.05)}
.v{color:#ff7675;font-weight:600}.n{color:#74b9ff;font-weight:600}.o{color:#ffeaa7;font-weight:600}

/* ===== Finale special ===== */
.para.highlight{text-align:center;padding-top:10px}
.para.highlight .en{font-size:1.3em;line-height:2.6}
.para.highlight .zh{border-left:none;padding:0;text-align:center}
.para.ending{text-align:center}
.para.ending .en{font-size:1.4em;line-height:2.8;color:#ffd200}
.para.ending .zh{border-left:none;padding:0;text-align:center;font-size:1.05em;color:rgba(255,255,255,.5)}

/* ===== TEXTBOOK Page ===== */
.tb-nav{display:flex;gap:6px;margin:0 0 16px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tb-nav::-webkit-scrollbar{display:none}
.tb-nav-btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:8px 14px;font-family:'Fredoka',sans-serif;font-size:.82em;color:rgba(255,255,255,.35);cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0;text-align:center;line-height:1.3}
.tb-nav-btn:hover{background:rgba(255,255,255,.08)}
.tb-nav-btn.active{background:rgba(255,210,0,.1);border-color:rgba(255,210,0,.2);color:#ffd200}
.tb-nav-btn .nb-zh{display:block;font-family:'Noto Sans SC',sans-serif;font-size:.72em;margin-top:1px;opacity:.6}
.tb-card{display:none;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:20px;overflow:hidden;animation:fadeUp .3s ease}
.tb-card.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.tb-card-hd{padding:22px 20px 14px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)}
.tb-card-num{font-family:'Fredoka',sans-serif;font-size:.72em;color:rgba(255,255,255,.15);letter-spacing:3px}
.tb-card-title{font-family:'Fredoka',sans-serif;font-size:1.3em;color:#ffd200;margin:4px 0 2px}
.tb-card-titleZh{font-size:.85em;color:rgba(255,255,255,.3)}
.tb-card-body{padding:4px 20px 24px}
.tb-section{font-size:.72em;color:rgba(255,255,255,.2);margin:18px 0 8px;letter-spacing:2px;display:flex;align-items:center;gap:8px}
.tb-section::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.04)}
.tb-words{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.tb-word{background:rgba(116,185,255,.08);border-radius:8px;padding:5px 12px;font-family:'Fredoka',sans-serif;font-size:.88em;color:#74b9ff}
.tb-sent{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.03);line-height:1.7}
.tb-sent:last-child{border-bottom:none}
.tb-sent .se{font-family:'Fredoka',sans-serif;font-size:.95em;color:#ecf0f1}
.tb-sent .sz{font-size:.8em;color:rgba(255,255,255,.25);margin-top:1px}
.tb-chant{background:rgba(255,210,0,.05);border-left:3px solid rgba(255,210,0,.3);border-radius:0 10px 10px 0;padding:14px 16px;margin:0 0 4px;font-size:.92em;line-height:2;color:#ffeaa7;font-style:italic}
.tb-dlg{margin:0 0 4px}
.tb-dlg-line{display:flex;align-items:baseline;gap:8px;padding:5px 0}
.tb-dlg-role{font-size:.75em;font-weight:700;color:#74b9ff;min-width:68px;flex-shrink:0}
.tb-dlg-en{font-size:.92em;color:#dfe6e9;line-height:1.5}
.tb-story{margin:0 0 4px;background:rgba(116,185,255,.04);border-radius:10px;padding:12px 14px}
.tb-story-line{display:flex;align-items:baseline;gap:8px;padding:4px 0}
.tb-story-role{font-size:.72em;font-weight:700;color:#fd79a8;min-width:68px;flex-shrink:0}
.tb-story-en{font-size:.9em;color:#dfe6e9;line-height:1.5}
.tb-project{margin:0 0 4px;background:rgba(85,239,196,.04);border-radius:10px;padding:12px 14px}
.tb-project-step{display:flex;align-items:baseline;gap:8px;padding:4px 0;font-size:.88em;color:#b2bec3;line-height:1.6}
.tb-step-num{background:rgba(85,239,196,.15);color:#55efc4;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:.7em;font-weight:700;flex-shrink:0}

/* ===== WORDS Page ===== */
.theme-section{margin-bottom:28px}
.theme-name{font-size:.95em;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:10px;padding-left:4px;border-left:3px solid #ffd200}
.word-grid{display:flex;flex-wrap:wrap;gap:8px}
.word-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px 14px;cursor:pointer;transition:all .2s;min-width:90px;text-align:center}
.word-card:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
.word-card .wc-e{font-family:'Fredoka',sans-serif;font-size:1.1em;font-weight:600;color:#fff}
.word-card .wc-z{font-size:.72em;color:rgba(255,255,255,.35);margin-top:2px}
.word-card .wc-sentence{font-size:.7em;color:#74b9ff;margin-top:6px;line-height:1.4;max-height:0;overflow:hidden;transition:max-height .3s}
.word-card.open .wc-sentence{max-height:60px}

/* ===== SENTENCES Page ===== */
.sent-theme{margin-bottom:28px}
.sent-theme-name{font-size:.95em;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:10px;padding-left:4px;border-left:3px solid #74b9ff}
.sent-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px 18px;margin-bottom:8px;display:flex;align-items:center;gap:14px;transition:background .2s}
.sent-card:hover{background:rgba(255,255,255,.07)}
.sent-num{font-family:'Fredoka',sans-serif;font-size:.85em;color:rgba(255,255,255,.15);min-width:24px;text-align:center}
.sent-body{flex:1}
.sent-en{font-family:'Fredoka','Noto Sans SC',sans-serif;font-size:1.05em;color:#ecf0f1;line-height:1.6}
.sent-zh{font-size:.82em;color:rgba(255,255,255,.28);margin-top:2px}
.sent-en b{color:#ff7675;font-weight:600}
.sent-en .nb{color:#74b9ff;font-weight:600}

/* ===== FLASH Page ===== */
.flash-controls{display:flex;justify-content:center;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.flash-mode,.flash-speed{display:flex;align-items:center;gap:6px}
.fmode,.fspeed{border:none;background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);font-family:inherit;font-size:.88em;padding:8px 18px;border-radius:20px;cursor:pointer;transition:all .2s}
.fmode.on{background:rgba(255,210,0,.15);color:#ffd200}
.fspeed{padding:8px 14px;min-width:42px;text-align:center}
.fspeed.on{background:rgba(116,185,255,.15);color:#74b9ff}
.fspeed-label{color:rgba(255,255,255,.3);font-size:.88em;margin-right:4px}
.flash-counter{text-align:center;color:rgba(255,255,255,.2);font-size:.85em;margin-bottom:12px}
.flash-stage{min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:20px;margin-bottom:24px;padding:40px 20px}
.flash-big{font-family:'Fredoka','Noto Sans SC',sans-serif;font-size:2.6em;font-weight:700;color:#fff;text-align:center;line-height:1.3;transition:opacity .15s}
.flash-big.bump{animation:flashBump .3s ease}
@keyframes flashBump{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}
.flash-sub{font-size:1.15em;color:rgba(255,255,255,.35);margin-top:14px;text-align:center}
.flash-actions{display:flex;justify-content:center;gap:10px}
.fbtn{border:none;border-radius:14px;padding:14px 32px;font-size:1em;font-family:inherit;cursor:pointer;transition:all .2s}
.fbtn:active{transform:scale(.95)}
.fbtn.play{background:#ffd200;color:#1a1a2e;font-weight:700}
.fbtn.playing{background:#ef5350;color:#fff}
.fbtn.reset{background:rgba(255,255,255,.06);color:rgba(255,255,255,.5)}

/* ===== WRITE Page ===== */
.write-tabs{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
.wtab{border:none;background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);font-family:inherit;font-size:.88em;padding:8px 20px;border-radius:20px;cursor:pointer;transition:all .2s}
.wtab:hover{color:rgba(255,255,255,.6)}
.wtab.on{background:rgba(255,210,0,.15);color:#ffd200}
.write-progress{text-align:center;margin-bottom:24px;color:rgba(255,255,255,.3);font-size:.9em}
.write-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:28px 20px;text-align:center;margin-bottom:16px}
.write-card .wc-zh{font-size:1.3em;font-weight:700;color:#fff;margin-top:8px}
.write-card .wc-hint{font-size:.82em;color:rgba(255,255,255,.3);margin-top:4px}
.write-input{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.write-input input{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 16px;font-size:1.1em;font-family:'Fredoka',sans-serif;color:#fff;width:220px;outline:none;transition:border-color .2s}
.write-input input:focus{border-color:#ffd200}
.write-input input.correct{border-color:#66bb6a;background:rgba(102,187,106,.1)}
.write-input input.wrong{border-color:#ef5350;background:rgba(239,83,80,.08)}
.write-btn{border:none;border-radius:10px;padding:10px 20px;font-size:.95em;font-family:inherit;cursor:pointer;transition:transform .15s}
.write-btn:active{transform:scale(.95)}
.write-btn.check{background:#ffd200;color:#1a1a2e;font-weight:700}
.write-btn.skip{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5)}
.write-answer{font-size:1.1em;color:#66bb6a;margin-top:10px;font-family:'Fredoka',sans-serif;display:none}
.write-answer.show{display:block}

/* ===== TEST Page ===== */
.test-progress{margin-bottom:20px}
.test-progress .bar-bg{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.test-progress .bar-fill{height:100%;background:linear-gradient(90deg,#ffd200,#f7971e);border-radius:3px;transition:width .4s}
.test-progress .info{display:flex;justify-content:space-between;font-size:.8em;color:rgba(255,255,255,.3);margin-top:4px}
.test-q{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:24px;margin-bottom:16px;text-align:center}
.test-q .tq-label{font-size:.75em;color:rgba(255,255,255,.3);margin-bottom:10px}
.test-q .tq-text{font-family:'Fredoka',sans-serif;font-size:1.6em;font-weight:700;color:#fff}
.test-q .tq-text.small{font-size:1.2em}
.test-opts{display:flex;flex-direction:column;gap:8px}
.test-opt{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:12px;padding:13px 18px;font-size:1em;font-family:'Fredoka','Noto Sans SC',sans-serif;color:#ecf0f1;cursor:pointer;transition:all .2s;text-align:left}
.test-opt:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06)}
.test-opt:active{transform:scale(.98)}
.test-opt.right{border-color:#66bb6a;background:rgba(102,187,106,.12);color:#a5d6a7}
.test-opt.wrong{border-color:#ef5350;background:rgba(239,83,80,.08);color:#ef9a9a}

/* Result */
.result{text-align:center;padding:40px 0}
.result .big{font-size:64px;margin-bottom:12px}
.result h2{font-size:1.6em;color:#ffd200;margin-bottom:8px}
.result p{color:rgba(255,255,255,.4)}
.result .stats{display:flex;gap:14px;justify-content:center;margin:24px 0}
.result .st{background:rgba(255,255,255,.04);border-radius:12px;padding:14px 20px;text-align:center}
.result .st .sv{font-size:1.5em;font-weight:900;font-family:'Fredoka',sans-serif}
.result .st .sl{font-size:.72em;color:rgba(255,255,255,.35)}
.result button{border:none;border-radius:12px;padding:12px 28px;font-size:1em;font-family:inherit;cursor:pointer;margin:4px}
.result .rb1{background:#ffd200;color:#1a1a2e;font-weight:700}

/* ===== Finale tag ===== */
.finale-tag{text-align:center;margin-bottom:30px}
.finale-tag span{background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e;padding:4px 16px;border-radius:20px;font-size:.8em;font-weight:700}

/* ===== Responsive ===== */
@media(max-width:600px){
  .topnav{gap:2px;padding:8px 8px 0}
  .topnav button{padding:8px 10px;font-size:.8em}
  .page-title{font-size:1.4em}
  .en{font-size:1em;line-height:2.1}
  .word-card{min-width:75px;padding:8px 10px}
}
@media(min-width:601px) and (max-width:1024px){
  .page{max-width:90%;padding:30px 30px 60px}
  .topnav button{padding:14px 22px;font-size:.98em}
  .en{font-size:1.18em;line-height:2.4}
  .zh{font-size:.98em}
  .page-title{font-size:2em}
  .word-card{min-width:100px;padding:12px 16px}
  .word-card .wc-e{font-size:1.2em}
  .write-input input{font-size:1.2em;padding:14px 18px;width:320px}
  .write-btn{padding:14px 24px;font-size:1.05em}
  .test-opt{padding:16px 22px;font-size:1.1em}
  .sent-card{padding:16px 22px}
  .sent-en{font-size:1.15em}
  .sent-zh{font-size:.92em}
  .flash-big{font-size:3em}
  .flash-stage{min-height:340px;padding:50px 30px}
  .fbtn{padding:16px 36px;font-size:1.1em}
}
@media(min-width:1025px){
  .page{max-width:920px;padding:36px 40px 60px}
  .topnav button{padding:14px 24px;font-size:1em}
}
</style>
</head>
<body>

<a class="back-home" href="../">&#8592; 选择年级</a>

<div class="topnav">
<button class="on" onclick="go('textbook')">温故</button>
<button onclick="go('expand')">拓展</button>
<button onclick="go('flash')">速认</button>
<button onclick="go('recall')">速答</button>
<button onclick="go('write')">默写</button>
<button onclick="go('test')">测试</button>
<button onclick="go('finale')">The Big Story</button>
<button onclick="go('words')">单词</button>
<button onclick="go('sentences')">短句</button>
</div>

<!-- ==================== TEXTBOOK ==================== -->
<div id="pg-textbook" class="page on">
<div class="page-title">温故</div>
<div class="page-desc">回顾课本每个单元</div>
<div id="tbNav" class="tb-nav"></div>
<div id="textbookBody"></div>
</div>

<!-- ==================== EXPAND ==================== -->
<div id="pg-expand" class="page">
<div class="page-title">拓展</div>
<div class="page-desc">在故事中遇见每一个词</div>
<div class="legend"><span><i class="lv"></i>动作</span><span><i class="ln"></i>事物</span><span><i class="lo"></i>其他</span></div>
<div id="expandBody"></div>
</div>

<!-- ==================== WORDS ==================== -->
<div id="pg-words" class="page">
<div class="page-title">Words</div>
<div class="page-desc">点击卡片看例句</div>
<div id="wordsContainer"></div>
</div>

<!-- ==================== SENTENCES ==================== -->
<div id="pg-sentences" class="page">
<div class="page-title">Sentences</div>
<div class="page-desc">一句一句，积少成多</div>
<div id="sentencesContainer"></div>
</div>

<!-- ==================== FLASH (速认) ==================== -->
<div id="pg-flash" class="page">
<div class="page-title">速认</div>
<div class="page-desc">看英文，快速认出意思</div>
<div class="flash-controls">
  <div class="flash-mode">
    <button class="fmode on" onclick="setFlashMode('word',this)">单词</button>
    <button class="fmode" onclick="setFlashMode('sent',this)">短句</button>
    <button class="fmode" onclick="setFlashMode('all',this)">混合</button>
  </div>
  <div class="flash-speed">
    <span class="fspeed-label">速度</span>
    <button class="fspeed on" onclick="setFlashSpeed(3,this)">3s</button>
    <button class="fspeed" onclick="setFlashSpeed(1,this)">1s</button>
    <button class="fspeed" onclick="setFlashSpeed(2,this)">2s</button>
    <button class="fspeed" onclick="setFlashSpeed(4,this)">4s</button>
    <button class="fspeed" onclick="setFlashSpeed(5,this)">5s</button>
  </div>
</div>
<div class="flash-counter" id="flashCounter"></div>
<div class="flash-stage" id="flashStage">
  <div class="flash-big" id="flashBig">—</div>
  <div class="flash-sub" id="flashSub">准备好了吗？</div>
</div>
<div class="flash-actions">
  <button class="fbtn play" id="flashPlayBtn" onclick="toggleFlash()">开始</button>
  <button class="fbtn reset" onclick="resetFlash()">重来</button>
</div>
</div>

<!-- ==================== RECALL (速答) ==================== -->
<div id="pg-recall" class="page">
<div class="page-title">速答</div>
<div class="page-desc">看中文，快速说出英文</div>
<div class="flash-controls">
  <div class="flash-mode">
    <button class="fmode on" onclick="setRecallMode('word',this)">单词</button>
    <button class="fmode" onclick="setRecallMode('sent',this)">短句</button>
    <button class="fmode" onclick="setRecallMode('all',this)">混合</button>
  </div>
  <div class="flash-speed">
    <span class="fspeed-label">揭晓</span>
    <button class="fspeed" onclick="setRecallDelay(2,this)">2s</button>
    <button class="fspeed on" onclick="setRecallDelay(3,this)">3s</button>
    <button class="fspeed" onclick="setRecallDelay(5,this)">5s</button>
    <button class="fspeed" onclick="setRecallDelay(8,this)">8s</button>
  </div>
</div>
<div class="flash-counter" id="recallCounter"></div>
<div class="flash-stage" id="recallStage">
  <div class="flash-big" id="recallBig">—</div>
  <div class="flash-sub" id="recallSub">准备好了吗？</div>
</div>
<div class="flash-actions">
  <button class="fbtn play" id="recallPlayBtn" onclick="toggleRecall()">开始</button>
  <button class="fbtn reset" onclick="resetRecall()">重来</button>
</div>
</div>

<!-- ==================== WRITE ==================== -->
<div id="pg-write" class="page">
<div class="page-title">Spelling</div>
<div class="page-desc">看中文，拼出来</div>
<div class="write-tabs">
  <button class="wtab on" onclick="switchWriteTab('word',this)">单词</button>
  <button class="wtab" onclick="switchWriteTab('sent',this)">短句</button>
</div>
<div class="write-progress" id="writeProg">0 / 0</div>
<div id="writeArea"></div>
</div>

<!-- ==================== TEST ==================== -->
<div id="pg-test" class="page">
<div class="page-title">Test</div>
<div class="page-desc">混在一起才是真正的掌握</div>
<div id="testArea"></div>
</div>

<!-- ==================== FINALE ==================== -->
<div id="pg-finale" class="page">
<div class="page-title">The Big Story</div>
<div class="page-desc">一篇完整的故事，串联全部词汇</div>
<div class="finale-tag"><span>全部词汇 · 一个故事</span></div>
<div class="legend"><span><i class="lv"></i>动作</span><span><i class="ln"></i>事物</span><span><i class="lo"></i>其他</span></div>
<div id="finaleBody"></div>
</div>

<script src="data.js"></script>
<script>
// ============================
// SHORTHAND
// ============================
var W = DATA.words;
var S = DATA.sentences;

// ============================
// NAV
// ============================
function go(name){
  document.querySelectorAll('.topnav button').forEach(function(b){b.classList.remove('on')});
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('on')});
  event.target.classList.add('on');
  document.getElementById('pg-'+name).classList.add('on');
  if(name==='textbook') renderTextbook();
  if(name==='expand') renderExpand();
  if(name==='words') renderWords();
  if(name==='sentences') renderSentences();
  if(name==='flash') resetFlash();
  if(name==='recall') resetRecall();
  if(name==='write') initWrite();
  if(name==='test') initTest();
  if(name==='finale') renderFinale();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ============================
// EXPAND PAGE
// ============================
function renderExpand(){
  var c = document.getElementById('expandBody');
  c.innerHTML = DATA.expand.map(function(story){
    return '<div class="story-hd">' + story.title + '</div>' +
      '<div class="story-sub">' + story.titleZh + '</div>' +
      story.paras.map(function(p){
        return '<div class="para"><div class="en">' + p.en + '</div><div class="zh">' + p.zh + '</div></div>';
      }).join('');
  }).join('');
}

// ============================
// TEXTBOOK PAGE (温故知新)
// ============================
var tbCurrentUnit = 1;
function switchTbUnit(n){
  tbCurrentUnit = n;
  document.querySelectorAll('.tb-card').forEach(function(c){c.classList.remove('active')});
  document.querySelectorAll('.tb-nav-btn').forEach(function(b){b.classList.remove('active')});
  var card = document.getElementById('tb-card-'+n);
  var btn = document.getElementById('tb-btn-'+n);
  if(card) card.classList.add('active');
  if(btn){btn.classList.add('active');btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}
}
function renderTextbook(){
  // Nav
  var nav = document.getElementById('tbNav');
  nav.innerHTML = DATA.textbook.map(function(u){
    return '<div class="tb-nav-btn" id="tb-btn-'+u.unit+'" onclick="switchTbUnit('+u.unit+')">' +
      '<span>U'+u.unit+'</span><span class="nb-zh">'+u.titleZh+'</span></div>';
  }).join('');
  // Cards
  var c = document.getElementById('textbookBody');
  c.innerHTML = DATA.textbook.map(function(u){
    var html = '<div class="tb-card" id="tb-card-'+u.unit+'">' +
      '<div class="tb-card-hd">' +
        '<div class="tb-card-num">UNIT ' + u.unit + '</div>' +
        '<div class="tb-card-title">' + u.title + '</div>' +
        '<div class="tb-card-titleZh">' + u.titleZh + '</div>' +
      '</div>' +
      '<div class="tb-card-body">';
    // Chant / Song
    if(u.chant){
      html += '<div class="tb-section">&#127926; CHANT</div>' +
        '<div class="tb-chant">' + u.chant.replace(/\n/g,'<br>') + '</div>';
    }
    if(u.song){
      html += '<div class="tb-section">&#127925; SONG</div>' +
        '<div class="tb-chant">' + u.song.replace(/\n/g,'<br>') + '</div>';
    }
    // Dialogue
    if(u.dialogue){
      html += '<div class="tb-section">&#128172; DIALOGUE</div><div class="tb-dlg">';
      u.dialogue.forEach(function(d){
        html += '<div class="tb-dlg-line"><span class="tb-dlg-role">' + d.role + '</span><span class="tb-dlg-en">' + d.en + '</span></div>';
      });
      html += '</div>';
    }
    // Words
    html += '<div class="tb-section">WORDS</div>' +
      '<div class="tb-words">' + u.words.map(function(w){return '<span class="tb-word">' + w + '</span>'}).join('') + '</div>';
    // Sentences
    html += '<div class="tb-section">SENTENCES</div>';
    html += u.sentences.map(function(s){
      return '<div class="tb-sent"><div class="se">' + s.en + '</div><div class="sz">' + s.zh + '</div></div>';
    }).join('');
    // Story
    if(u.story){
      html += '<div class="tb-section">&#128214; STORY — ' + u.story.title + '</div><div class="tb-story">';
      u.story.lines.forEach(function(l){
        html += '<div class="tb-story-line"><span class="tb-story-role">' + l.role + '</span><span class="tb-story-en">' + l.en + '</span></div>';
      });
      html += '</div>';
    }
    // Mini-project
    if(u.miniProject){
      html += '<div class="tb-section">&#9997; MINI-PROJECT — ' + u.miniProject.title + '</div><div class="tb-project">';
      u.miniProject.steps.forEach(function(s,i){
        html += '<div class="tb-project-step"><span class="tb-step-num">' + (i+1) + '</span>' + s + '</div>';
      });
      html += '</div>';
    }
    html += '</div></div>';
    return html;
  }).join('');
  switchTbUnit(1);
}

// ============================
// WORDS PAGE
// ============================
function renderWords(){
  var c = document.getElementById('wordsContainer');
  var themes = [];
  var seen = {};
  W.forEach(function(w){ if(!seen[w.t]){seen[w.t]=1; themes.push(w.t)} });
  c.innerHTML = themes.map(function(t){
    return '<div class="theme-section"><div class="theme-name">' + t + '</div><div class="word-grid">' +
      W.filter(function(w){return w.t===t}).map(function(w){
        return '<div class="word-card" onclick="this.classList.toggle(\'open\')">' +
          '<div class="wc-e">' + w.en + '</div>' +
          '<div class="wc-z">' + w.zh + '</div>' +
          '<div class="wc-sentence">' + w.s + '</div></div>';
      }).join('') + '</div></div>';
  }).join('');
}

// ============================
// SENTENCES PAGE
// ============================
function renderSentences(){
  var c = document.getElementById('sentencesContainer');
  var themes = [];
  var seen = {};
  S.forEach(function(s){ if(!seen[s.t]){seen[s.t]=1; themes.push(s.t)} });
  c.innerHTML = themes.map(function(t){
    var items = S.filter(function(s){return s.t===t});
    return '<div class="sent-theme"><div class="sent-theme-name">' + t + '</div>' +
      items.map(function(s, i){
        return '<div class="sent-card"><div class="sent-num">' + (i+1) + '</div><div class="sent-body">' +
          '<div class="sent-en">' + s.en + '</div><div class="sent-zh">' + s.zh + '</div></div></div>';
      }).join('') + '</div>';
  }).join('');
}

// ============================
// FLASH PAGE
// ============================
var flashCfg = {mode:'word', speed:3, timer:null, idx:0, list:[], running:false};

function setFlashMode(mode, btn){
  flashCfg.mode = mode;
  document.querySelectorAll('.fmode').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  if(flashCfg.running) resetFlash();
}
function setFlashSpeed(s, btn){
  flashCfg.speed = s;
  document.querySelectorAll('.fspeed').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  if(flashCfg.running){clearInterval(flashCfg.timer); flashCfg.timer = setInterval(flashNext, s*1000)}
}
function buildFlashList(){
  var list = [];
  if(flashCfg.mode==='word'||flashCfg.mode==='all')
    list = list.concat(W.map(function(w){return {big:w.en, sub:w.zh}}));
  if(flashCfg.mode==='sent'||flashCfg.mode==='all')
    list = list.concat(S.map(function(s){return {big:s.p, sub:s.zh}}));
  return shuffle(list);
}
function flashNext(){
  var el = document.getElementById('flashBig');
  var sub = document.getElementById('flashSub');
  var counter = document.getElementById('flashCounter');
  if(flashCfg.idx >= flashCfg.list.length) flashCfg.idx = 0;
  var item = flashCfg.list[flashCfg.idx];
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  el.textContent = item.big;
  sub.textContent = item.sub;
  flashCfg.idx++;
  counter.textContent = flashCfg.idx + ' / ' + flashCfg.list.length;
}
function toggleFlash(){
  var btn = document.getElementById('flashPlayBtn');
  if(flashCfg.running){
    clearInterval(flashCfg.timer);
    flashCfg.running = false;
    btn.textContent = '继续';
    btn.classList.remove('playing');
  } else {
    if(flashCfg.list.length === 0) flashCfg.list = buildFlashList();
    flashCfg.running = true;
    btn.textContent = '暂停';
    btn.classList.add('playing');
    flashNext();
    flashCfg.timer = setInterval(flashNext, flashCfg.speed*1000);
  }
}
function resetFlash(){
  clearInterval(flashCfg.timer);
  flashCfg.running = false;
  flashCfg.list = buildFlashList();
  flashCfg.idx = 0;
  var btn = document.getElementById('flashPlayBtn');
  if(btn){btn.textContent='开始'; btn.classList.remove('playing')}
  var big = document.getElementById('flashBig');
  var sub = document.getElementById('flashSub');
  var counter = document.getElementById('flashCounter');
  if(big) big.textContent = '—';
  if(sub) sub.textContent = '准备好了吗？';
  if(counter) counter.textContent = '0 / ' + flashCfg.list.length;
}

// ============================
// RECALL PAGE (速答)
// ============================
var recallCfg = {mode:'word', delay:3, timer:null, idx:0, list:[], running:false, revealed:false, revealTimer:null};

function setRecallMode(mode, btn){
  recallCfg.mode = mode;
  document.querySelectorAll('#pg-recall .fmode').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  if(recallCfg.running) resetRecall();
}
function setRecallDelay(s, btn){
  recallCfg.delay = s;
  document.querySelectorAll('#pg-recall .fspeed').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
}
function buildRecallList(){
  var list = [];
  if(recallCfg.mode==='word'||recallCfg.mode==='all')
    list = list.concat(W.map(function(w){return {big:w.zh, answer:w.en}}));
  if(recallCfg.mode==='sent'||recallCfg.mode==='all')
    list = list.concat(S.map(function(s){return {big:s.zh, answer:s.p}}));
  return shuffle(list);
}
function recallNext(){
  var big = document.getElementById('recallBig');
  var sub = document.getElementById('recallSub');
  var counter = document.getElementById('recallCounter');
  if(recallCfg.idx >= recallCfg.list.length) recallCfg.idx = 0;
  var item = recallCfg.list[recallCfg.idx];
  recallCfg.revealed = false;

  // Show Chinese
  big.classList.remove('bump');
  void big.offsetWidth;
  big.classList.add('bump');
  big.textContent = item.big;
  big.style.color = '#fff';
  sub.textContent = '…';
  sub.style.color = 'rgba(255,255,255,.15)';
  recallCfg.idx++;
  counter.textContent = recallCfg.idx + ' / ' + recallCfg.list.length;

  // Reveal answer after delay
  clearTimeout(recallCfg.revealTimer);
  recallCfg.revealTimer = setTimeout(function(){
    if(!recallCfg.running) return;
    sub.textContent = item.answer;
    sub.style.color = '#66bb6a';
    recallCfg.revealed = true;
  }, recallCfg.delay * 1000);
}
function toggleRecall(){
  var btn = document.getElementById('recallPlayBtn');
  if(recallCfg.running){
    clearInterval(recallCfg.timer);
    clearTimeout(recallCfg.revealTimer);
    recallCfg.running = false;
    btn.textContent = '继续';
    btn.classList.remove('playing');
  } else {
    if(recallCfg.list.length === 0) recallCfg.list = buildRecallList();
    recallCfg.running = true;
    btn.textContent = '暂停';
    btn.classList.add('playing');
    recallNext();
    recallCfg.timer = setInterval(recallNext, recallCfg.delay * 1000 + 2500);
  }
}
function resetRecall(){
  clearInterval(recallCfg.timer);
  clearTimeout(recallCfg.revealTimer);
  recallCfg.running = false;
  recallCfg.list = buildRecallList();
  recallCfg.idx = 0;
  var btn = document.getElementById('recallPlayBtn');
  if(btn){btn.textContent='开始'; btn.classList.remove('playing')}
  var big = document.getElementById('recallBig');
  var sub = document.getElementById('recallSub');
  var counter = document.getElementById('recallCounter');
  if(big){big.textContent='—'; big.style.color='#fff'}
  if(sub){sub.textContent='准备好了吗？'; sub.style.color='rgba(255,255,255,.35)'}
  if(counter) counter.textContent = '0 / ' + recallCfg.list.length;
}

// ============================
// WRITE PAGE
// ============================
var writeState = {};
var writeMode = 'word';

function switchWriteTab(mode, btn){
  writeMode = mode;
  document.querySelectorAll('.wtab').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  initWrite();
}
function initWrite(){
  var list = writeMode === 'word' ?
    shuffle(W.slice()).map(function(w){return {prompt:w.zh, hint:w.en.length+' 个字母', answer:w.en}}) :
    shuffle(S.slice()).map(function(s){return {prompt:s.zh, hint:'', answer:s.p}});
  writeState = {list:list, idx:0, done:0};
  renderWriteCard();
}
function renderWriteCard(){
  var ws = writeState;
  if(ws.idx >= ws.list.length){
    document.getElementById('writeArea').innerHTML = '<div class="result"><div class="big">&#127881;</div><h2>全部完成！</h2><p>你默写了 ' + ws.done + '/' + ws.list.length + ' 个' + (writeMode==='word'?'词':'句') + '</p><br><button class="rb1" onclick="initWrite()">再来一轮</button></div>';
    return;
  }
  var item = ws.list[ws.idx];
  document.getElementById('writeProg').textContent = (ws.idx+1) + ' / ' + ws.list.length;
  document.getElementById('writeArea').innerHTML =
    '<div class="write-card">' +
      '<div class="wc-zh">' + item.prompt + '</div>' +
      (item.hint ? '<div class="wc-hint">' + item.hint + '</div>' : '') +
      '<div class="write-input">' +
        '<input id="writeInp" placeholder="输入英文…" autocomplete="off" autocapitalize="off" spellcheck="false">' +
        '<button class="write-btn check" onclick="checkWrite()">确认</button>' +
        '<button class="write-btn skip" onclick="skipWrite()">跳过</button>' +
      '</div>' +
      '<div class="write-answer" id="writeAns">答案：' + item.answer + '</div>' +
    '</div>';
  document.getElementById('writeInp').focus();
  document.getElementById('writeInp').onkeydown = function(e){if(e.key==='Enter') checkWrite()};
}
function checkWrite(){
  var inp = document.getElementById('writeInp');
  var ans = writeState.list[writeState.idx].answer.toLowerCase().trim();
  var val = inp.value.toLowerCase().trim();
  if(val === ans){
    inp.classList.add('correct');
    writeState.done++;
    setTimeout(function(){writeState.idx++; renderWriteCard()}, 600);
  } else {
    inp.classList.add('wrong');
    document.getElementById('writeAns').classList.add('show');
    setTimeout(function(){writeState.idx++; renderWriteCard()}, 1500);
  }
}
function skipWrite(){
  document.getElementById('writeAns').classList.add('show');
  setTimeout(function(){writeState.idx++; renderWriteCard()}, 1200);
}

// ============================
// TEST PAGE
// ============================
var testState = {};
function initTest(){
  var qs = W.map(function(w){
    var types = ['en2zh','zh2en','sentence'];
    var type = types[Math.floor(Math.random()*3)];
    var distractors = shuffle(W.filter(function(x){return x.en!==w.en})).slice(0,3);
    var q, opts, ans;
    if(type==='en2zh'){
      q = w.en;
      opts = shuffle([w.zh].concat(distractors.map(function(d){return d.zh})));
      ans = opts.indexOf(w.zh);
    } else if(type==='zh2en'){
      q = w.zh;
      opts = shuffle([w.en].concat(distractors.map(function(d){return d.en})));
      ans = opts.indexOf(w.en);
    } else {
      var sent = w.s.replace(new RegExp(w.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'____');
      q = sent;
      opts = shuffle([w.en].concat(distractors.map(function(d){return d.en})));
      ans = opts.indexOf(w.en);
    }
    return {q:q, opts:opts, ans:ans, qType:type};
  });
  testState = {qs:shuffle(qs), idx:0, correct:0};
  renderTestQ();
}
function renderTestQ(){
  var ts = testState;
  if(ts.idx >= ts.qs.length){
    var r = Math.round(ts.correct/ts.qs.length*100);
    document.getElementById('testArea').innerHTML = '<div class="result"><div class="big">' + (r>=80?'&#127942;':r>=50?'&#128170;':'&#127793;') + '</div><h2>' + (r>=80?'太棒了！':r>=50?'继续加油！':'别灰心！') + '</h2><p>正确率 ' + r + '%</p><div class="stats"><div class="st"><div class="sv" style="color:#66bb6a">' + ts.correct + '</div><div class="sl">正确</div></div><div class="st"><div class="sv" style="color:#ef5350">' + (ts.qs.length-ts.correct) + '</div><div class="sl">错误</div></div><div class="st"><div class="sv" style="color:#ffd200">' + r + '%</div><div class="sl">正确率</div></div></div><button class="rb1" onclick="initTest()">再测一次</button></div>';
    return;
  }
  var q = ts.qs[ts.idx];
  document.getElementById('testArea').innerHTML =
    '<div class="test-progress"><div class="bar-bg"><div class="bar-fill" style="width:' + (ts.idx/ts.qs.length*100) + '%"></div></div><div class="info"><span>' + (ts.idx+1) + ' / ' + ts.qs.length + '</span><span>得分 ' + (ts.correct*10) + '</span></div></div>' +
    '<div class="test-q"><div class="tq-label">' + (q.qType==='en2zh'?'选出中文':q.qType==='zh2en'?'选出英文':'填入单词') + '</div><div class="tq-text ' + (q.q.length>20?'small':'') + '">' + q.q + '</div></div>' +
    '<div class="test-opts">' + q.opts.map(function(o,i){return '<button class="test-opt" onclick="answerTest(this,'+i+','+q.ans+')">' + o + '</button>'}).join('') + '</div>';
}
function answerTest(el, idx, correct){
  document.querySelectorAll('.test-opt').forEach(function(b){b.style.pointerEvents='none'});
  if(idx===correct){el.classList.add('right'); testState.correct++}
  else{el.classList.add('wrong'); document.querySelectorAll('.test-opt')[correct].classList.add('right')}
  setTimeout(function(){testState.idx++; renderTestQ()}, 900);
}

// ============================
// FINALE PAGE (data-driven)
// ============================
function renderFinale(){
  var c = document.getElementById('finaleBody');
  c.innerHTML = DATA.finale.paras.map(function(p){
    var cls = 'para';
    if(p.cls) cls += ' ' + p.cls;
    return '<div class="' + cls + '"><div class="en">' + p.en + '</div><div class="zh">' + p.zh + '</div></div>';
  }).join('');
}

// ============================
// HELPERS
// ============================
function shuffle(a){
  var b = a.slice();
  for(var i=b.length-1; i>0; i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

// Auto-init read page
renderTextbook();
</script>
</body>
</html>
