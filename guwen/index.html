飏青旗，流水桥旁。","t":"远远望去有一圈围墙，隐约可见几间茅草屋。青色的酒旗在风中飘扬，小桥旁边有流水潺潺。"},{"o":"偶然乘兴，步过东冈。正莺儿啼，燕儿舞，蝶儿忙。","t":"偶然间乘着游兴，走过东边的山冈。正是黄莺啼叫、燕子飞舞、蝴蝶忙碌的时节。"}],"n":[{"w":"行香子","m":"词牌名"},{"w":"陂塘","m":"池塘"},{"w":"徜徉","m":"闲游，安闲自得地行走"},{"w":"几许","m":"多少"},{"w":"飏","m":"飘扬"},{"w":"青旗","m":"酒店的青色旗幌"},{"w":"东冈","m":"东边的山冈"}],"a":"这首词描绘了一幅充满生机的田园春景图。词人用白描手法，以极为轻快的笔调写出了春天的美丽和生机。上下片末尾各用一组排比句——\"有桃花红，李花白，菜花黄\"和\"正莺儿啼，燕儿舞，蝶儿忙\"，色彩鲜明，动静相宜，将春天的绚烂和热闹展现得淋漓尽致。全词语言朴素自然，节奏明快流畅，洋溢着词人对田园生活的热爱和对自然美景的赞美之情。"},"121":{"o":"少年不识愁滋味，爱上层楼。爱上层楼，为赋新词强说愁。\n而今识尽愁滋味，欲说还休。欲说还休，却道天凉好个秋。","t":[{"o":"少年不识愁滋味，爱上层楼。","t":"少年时代不懂得什么是愁的滋味，喜欢登上高楼。"},{"o":"爱上层楼，为赋新词强说愁。","t":"喜欢登上高楼，为了写一首新词而勉强说愁。"},{"o":"而今识尽愁滋味，欲说还休。","t":"如今尝尽了愁的滋味，想说却又说不出、不愿说。"},{"o":"欲说还休，却道天凉好个秋。","t":"想说却又说不出、不愿说，只好说好一个凉爽的秋天啊。"}],"n":[{"w":"丑奴儿","m":"词牌名，即\"采桑子\""},{"w":"博山","m":"在今江西广丰"},{"w":"层楼","m":"高楼"},{"w":"强","m":"勉强"},{"w":"识尽","m":"深刻体会"},{"w":"欲说还休","m":"想说又止住不说"}],"a":"这首词是辛弃疾被弹劾去职、闲居带湖时所作。全词以\"愁\"字贯穿，通过\"少年\"与\"而今\"的对比，巧妙地写出了词人由少年时的无愁装愁到中年后的有愁难言的转变。\"为赋新词强说愁\"写出少年的天真做作，\"却道天凉好个秋\"写出中年历经沧桑后的深沉无奈——真正的愁苦是说不出来的，只好顾左右而言他。全词以轻松诙谐的口吻写深沉痛切的愁苦，以淡语写深情，更具感染力。"},"122":{"o":"九州生气恃风雷，万马齐喑究可哀。\n我劝天公重抖擞，不拘一格降人才。","t":[{"o":"九州生气恃风雷，万马齐喑究可哀。","t":"中国要恢复生气需要依靠风雷般的变革，如今人们都不敢讲话的死气沉沉的局面毕竟令人悲哀。"},{"o":"我劝天公重抖擞，不拘一格降人才。","t":"我奉劝老天爷重新振作精神，不要拘泥于常规，降下各种各样的人才来拯救国家。"}],"n":[{"w":"己亥","m":"己亥年，即清道光十九年（1839年）"},{"w":"九州","m":"指中国"},{"w":"生气","m":"生命力，活力"},{"w":"恃","m":"依靠"},{"w":"万马齐喑","m":"比喻人们沉默不语，不敢发表意见"},{"w":"天公","m":"老天爷，这里暗指皇帝"},{"w":"抖擞","m":"振作精神"},{"w":"不拘一格","m":"不局限于一种规格或方式"}],"a":"这首诗是龚自珍辞官南归后途经镇江时应道士之请而写的祭神诗。诗人以\"万马齐喑\"比喻清朝末年社会政治的黑暗和压抑，人们在思想禁锢下噤若寒蝉。\"我劝天公重抖擞，不拘一格降人才\"是全诗的核心，表达了诗人对变革现实的强烈渴望和对人才的殷切呼唤。全诗以奇特的想象和大胆的比喻，抒发了诗人忧国忧民的情怀和期待社会变革的宏大志向，是近代思想启蒙的先声。"},"123":{"o":"国破山河在，城春草木深。\n感时花溅泪，恨别鸟惊心。\n烽火连三月，家书抵万金。\n白头搔更短，浑欲不胜簪。","t":[{"o":"国破山河在，城春草木深。","t":"国都已经沦陷，只有山河依旧存在；春天来到长安城，但人烟稀少，杂草丛生。"},{"o":"感时花溅泪，恨别鸟惊心。","t":"感伤时局，连花儿都使人流泪；怨恨离别，连鸟鸣都令人心惊。"},{"o":"烽火连三月，家书抵万金。","t":"战火连续三个月不断，一封家书抵得上万两黄金。"},{"o":"白头搔更短，浑欲不胜簪。","t":"满头白发越搔越稀少，简直连簪子都插不住了。"}],"n":[{"w":"国破","m":"指国都长安被叛军攻占"},{"w":"感时","m":"感叹时局"},{"w":"溅泪","m":"流泪"},{"w":"烽火","m":"古时边防报警的烟火，此处指战火"},{"w":"抵万金","m":"值万两黄金，形容家书极其珍贵"},{"w":"浑欲","m":"简直"},{"w":"不胜簪","m":"插不住簪子，形容头发稀少"}],"a":"这首诗作于安史之乱中长安陷落之时，诗人目睹国都残破、战火连绵的惨状，以极其沉痛的笔触书写了忧国思家的深情。全诗以\"望\"字统摄，将国破家亡的悲恸、战乱中音讯隔绝的焦虑以及诗人衰老悲苦的形象融为一体，情感真挚深沉，被后人誉为\"古今五律之第一\"。"},"124":{"o":"黑云压城城欲摧，甲光向日金鳞开。\n角声满天秋色里，塞上燕脂凝夜紫。\n半卷红旗临易水，霜重鼓寒声不起。\n报君黄金台上意，提携玉龙为君死。","t":[{"o":"黑云压城城欲摧，甲光向日金鳞开。","t":"敌军如黑云般压向城头，城墙仿佛即将崩塌；阳光照在将士的铠甲上，金光闪闪如鱼鳞般闪耀。"},{"o":"角声满天秋色里，塞上燕脂凝夜紫。","t":"号角声在萧瑟的秋色中响彻天际；边塞将士的血迹在夜色中凝结成暗紫色。"},{"o":"半卷红旗临易水，霜重鼓寒声不起。","t":"红旗半卷，军队悄然逼近易水；寒霜浓重，战鼓声沉闷敲不响。"},{"o":"报君黄金台上意，提携玉龙为君死。","t":"为报答君王在黄金台上的知遇之恩，手提宝剑甘愿为国战死。"}],"n":[{"w":"摧","m":"崩塌、塌陷"},{"w":"甲光","m":"铠甲的光辉"},{"w":"金鳞","m":"形容铠甲像金色的鱼鳞"},{"w":"角","m":"号角"},{"w":"燕脂","m":"即胭脂，此处指战士流的血"},{"w":"夜紫","m":"在夜色中呈现暗紫色"},{"w":"易水","m":"河名，在今河北省"},{"w":"黄金台","m":"战国时燕昭王所筑，用以招贤纳士"},{"w":"玉龙","m":"宝剑的代称"}],"a":"这首诗以色彩浓烈的意象描绘了一幅悲壮的边塞战争画卷，从\"黑云\"\"金鳞\"到\"燕脂\"\"夜紫\"，用斑斓而凝重的色彩渲染出战争的惨烈与壮美。全诗意境苍凉雄浑，将战士誓死报国的豪情与边塞战争的残酷交织在一起，体现了李贺独特的\"诗鬼\"风格，色彩瑰丽、想象奇特。"},"125":{"o":"暮投石壕村，有吏夜捉人。\n老翁逾墙走，老妇出门看。\n吏呼一何怒！妇啼一何苦！\n听妇前致词：三男邺城戍。\n一男附书至，二男新战死。\n存者且偷生，死者长已矣！\n室中更无人，惟有乳下孙。\n有孙母未去，出入无完裙。\n老妪力虽衰，请从吏夜归。\n急应河阳役，犹得备晨炊。\n夜久语声绝，如闻泣幽咽。\n天明登前途，独与老翁别。","t":[{"o":"暮投石壕村，有吏夜捉人。","t":"傍晚投宿石壕村，有差役在夜间来抓人服役。"},{"o":"老翁逾墙走，老妇出门看。","t":"老翁翻墙逃走，老妇出门应付。"},{"o":"吏呼一何怒！妇啼一何苦！","t":"差役吆喝得多么凶暴！老妇啼哭得多么凄苦！"},{"o":"听妇前致词：三男邺城戍。","t":"听老妇上前诉说：三个儿子都被征去邺城戍守。"},{"o":"一男附书至，二男新战死。","t":"一个儿子捎信回来，另外两个儿子最近战死了。"},{"o":"存者且偷生，死者长已矣！","t":"活着的暂且苟且偷生，死去的就永远完了！"},{"o":"室中更无人，惟有乳下孙。","t":"家里再没有别的男丁，只有还在吃奶的孙子。"},{"o":"有孙母未去，出入无完裙。","t":"因为有孙子，所以儿媳没有离开，但她进进出出连一件完整的衣裙都没有。"},{"o":"老妪力虽衰，请从吏夜归。","t":"老妇我虽然年老力衰，请让我跟你们连夜回去。"},{"o":"急应河阳役，犹得备晨炊。","t":"赶快到河阳去服役，还来得及为部队做早饭。"},{"o":"夜久语声绝，如闻泣幽咽。","t":"夜深了，说话声消失了，好像听到有人在隐隐约约地哭泣。"},{"o":"天明登前途，独与老翁别。","t":"天亮后我继续赶路，只能与逃回来的老翁告别。"}],"n":[{"w":"投","m":"投宿"},{"w":"逾墙走","m":"翻墙逃跑"},{"w":"一何","m":"多么"},{"w":"致词","m":"诉说、回答"},{"w":"邺城戍","m":"在邺城服役戍守"},{"w":"附书","m":"捎信"},{"w":"乳下孙","m":"还在吃奶的孙子"},{"w":"完裙","m":"完好的衣裙"},{"w":"老妪","m":"老妇人，此处老妇自称"},{"w":"幽咽","m":"低声哭泣"},{"w":"前途","m":"前行的路途"}],"a":"这首诗是杜甫\"三吏\"之一，以纪实手法记录了安史之乱中差役夜间抓丁的悲惨场景。全诗以老妇的诉苦为核心，层层递进地展现了一个普通家庭在战争中家破人亡的惨状——三子从军、二子战死、儿媳衣不蔽体、老妇自请服役，字字血泪。诗人不着一字评论，却以白描手法将战争的残酷与百姓的苦难展现得淋漓尽致，体现了杜甫\"诗史\"的深刻现实主义精神。"},"126":{"o":"八月秋高风怒号，卷我屋上三重茅。\n茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。\n\n南村群童欺我老无力，忍能对面为盗贼。\n公然抱茅入竹去，唇焦口燥呼不得，归来倚杖自叹息。\n\n俄顷风定云墨色，秋天漠漠向昏黑。\n布衾多年冷似铁，娇儿恶卧踏里裂。\n床头屋漏无干处，雨脚如麻未断绝。\n自经丧乱少睡眠，长夜沾湿何由彻！\n\n安得广厦千万间，大庇天下寒士俱欢颜！\n风雨不动安如山。\n呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！","t":[{"o":"八月秋高风怒号，卷我屋上三重茅。","t":"八月的秋天，狂风怒号，卷走了我屋顶上的几层茅草。"},{"o":"茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。","t":"茅草飞过江面散落在江边郊野，飞得高的挂在了树林的枝头，飞得低的飘转沉入了池塘洼地。"},{"o":"南村群童欺我老无力，忍能对面为盗贼。","t":"南村的一群儿童欺负我年老无力，竟然忍心当着我的面做\"盗贼\"。"},{"o":"公然抱茅入竹去，唇焦口燥呼不得，归来倚杖自叹息。","t":"他们公然抱着茅草跑入竹林中去，我喊得唇焦口燥也无济于事，只好拄着拐杖回来独自叹息。"},{"o":"俄顷风定云墨色，秋天漠漠向昏黑。","t":"一会儿风停了，乌云如墨一般，秋天的天空渐渐昏暗下来。"},{"o":"布衾多年冷似铁，娇儿恶卧踏里裂。","t":"盖了多年的布被冷得像铁一样，孩子睡相不好把被里都蹬破了。"},{"o":"床头屋漏无干处，雨脚如麻未断绝。","t":"屋顶漏雨，床头没有一块干燥的地方，雨点像麻线一样密密地下个不停。"},{"o":"自经丧乱少睡眠，长夜沾湿何由彻！","t":"自从经历了战乱就很少安眠，漫漫长夜浑身湿透，怎么才能熬到天亮！"},{"o":"安得广厦千万间，大庇天下寒士俱欢颜！","t":"怎样才能得到千万间宽敞的大屋，庇护天下所有贫寒的读书人让他们都露出笑脸！"},{"o":"风雨不动安如山。","t":"在风雨中安稳不动，像山一样坚固。"},{"o":"呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！","t":"啊！什么时候眼前能突然出现这样的房屋，即使我自己的茅屋破败受冻而死也心甘情愿！"}],"n":[{"w":"秋高","m":"秋天天高气爽"},{"w":"三重茅","m":"几层茅草"},{"w":"挂罥","m":"挂结、缠绕"},{"w":"塘坳","m":"池塘洼地"},{"w":"忍能","m":"忍心这样"},{"w":"俄顷","m":"一会儿、片刻"},{"w":"漠漠","m":"阴沉迷蒙的样子"},{"w":"布衾","m":"布被子"},{"w":"恶卧","m":"睡相不好"},{"w":"雨脚如麻","m":"雨点如麻线般密集"},{"w":"丧乱","m":"指安史之乱"},{"w":"何由彻","m":"如何熬到天亮"},{"w":"广厦","m":"宽敞的大屋"},{"w":"大庇","m":"全部遮蔽、庇护"},{"w":"寒士","m":"贫寒的读书人"},{"w":"突兀","m":"高耸的样子"}],"a":"这首诗从个人遭遇出发，由秋风破屋的困苦生活写起，层层推进，最终升华到\"安得广厦千万间\"的博大胸怀。诗人在自己\"床头屋漏无干处\"的窘境中，想到的不是一己之苦，而是天下所有贫寒之士的温饱，甚至表示\"吾庐独破受冻死亦足\"。这种由己及人、舍己为人的崇高精神，使全诗超越了一般的贫困叙事，成为千古传诵的名篇。"},"127":{"o":"卖炭翁，伐薪烧炭南山中。\n满面尘灰烟火色，两鬓苍苍十指黑。\n卖炭得钱何所营？身上衣裳口中食。\n可怜身上衣正单，心忧炭贱愿天寒。\n夜来城外一尺雪，晓驾炭车辗冰辙。\n牛困人饥日已高，市南门外泥中歇。\n翩翩两骑来是谁？黄衣使者白衫儿。\n手把文书口称敕，回车叱牛牵向北。\n一车炭，千余斤，宫使驱将惜不得。\n半匹红纱一丈绫，系向牛头充炭直。","t":[{"o":"卖炭翁，伐薪烧炭南山中。","t":"有个卖炭的老翁，在终南山中砍柴烧炭。"},{"o":"满面尘灰烟火色，两鬓苍苍十指黑。","t":"满脸都是灰尘和烟火的颜色，两鬓斑白，十指乌黑。"},{"o":"卖炭得钱何所营？身上衣裳口中食。","t":"卖炭得来的钱用来做什么？换取身上穿的衣裳和口中吃的食物。"},{"o":"可怜身上衣正单，心忧炭贱愿天寒。","t":"可怜他身上穿的衣裳正单薄，却担心炭价太低而盼望天气更加寒冷。"},{"o":"夜来城外一尺雪，晓驾炭车辗冰辙。","t":"夜里城外下了一尺厚的大雪，天亮就赶着炭车碾着冰冻的车辙赶路。"},{"o":"牛困人饥日已高，市南门外泥中歇。","t":"牛累乏了，人也饿了，太阳已经升得很高，在集市南门外的泥泞中歇息。"},{"o":"翩翩两骑来是谁？黄衣使者白衫儿。","t":"两个骑马翩翩而来的人是谁？是皇宫里的太监及其随从。"},{"o":"手把文书口称敕，回车叱牛牵向北。","t":"手里拿着文书口称是皇帝的命令，掉转车头吆喝着牛把车拉向北方皇宫。"},{"o":"一车炭，千余斤，宫使驱将惜不得。","t":"一车炭，一千多斤，被宫使强行赶走，再怎么舍不得也无能为力。"},{"o":"半匹红纱一丈绫，系向牛头充炭直。","t":"他们把半匹红纱和一丈绫绸系在牛头上充当炭钱。"}],"n":[{"w":"南山","m":"终南山"},{"w":"何所营","m":"做什么用"},{"w":"辗冰辙","m":"碾着冰冻的车辙"},{"w":"翩翩","m":"轻快的样子"},{"w":"黄衣使者","m":"指宫中采办太监"},{"w":"白衫儿","m":"太监的随从"},{"w":"敕","m":"皇帝的命令"},{"w":"叱","m":"大声吆喝"},{"w":"驱将","m":"强行赶走"},{"w":"惜不得","m":"舍不得也没有办法"},{"w":"直","m":"同\"值\"，价钱"}],"a":"这首诗是白居易《新乐府》中的名篇，以叙事手法揭露了中唐时期\"宫市\"制度的黑暗——宫廷太监以皇权为名，强行低价掠夺百姓财物。诗人以\"衣正单\"而\"愿天寒\"的矛盾心理刻画卖炭翁的辛酸，又以\"千余斤\"炭仅换得\"半匹红纱\"的强烈反差突出宫市掠夺的残酷，字里行间充满了对底层人民的深切同情和对统治者的无声控诉。"},"128":{"o":"金樽清酒斗十千，玉盘珍羞直万钱。\n停杯投箸不能食，拔剑四顾心茫然。\n欲渡黄河冰塞川，将登太行雪满山。\n闲来垂钓碧溪上，忽复乘舟梦日边。\n行路难，行路难，多歧路，今安在？\n长风破浪会有时，直挂云帆济沧海。","t":[{"o":"金樽清酒斗十千，玉盘珍羞直万钱。","t":"金杯中的清酒一斗价值十千钱，玉盘中的珍馐美味价值万钱。"},{"o":"停杯投箸不能食，拔剑四顾心茫然。","t":"停下酒杯放下筷子吃不下饭，拔出宝剑环顾四方心中一片茫然。"},{"o":"欲渡黄河冰塞川，将登太行雪满山。","t":"想要渡过黄河，冰雪却堵塞了河川；想要登上太行山，大雪却铺满了山岭。"},{"o":"闲来垂钓碧溪上，忽复乘舟梦日边。","t":"闲暇时在碧溪边垂钓，忽然又梦见乘船驶向太阳旁边。"},{"o":"行路难，行路难，多歧路，今安在？","t":"行路难啊行路难！这么多的岔路，我如今身在何处？"},{"o":"长风破浪会有时，直挂云帆济沧海。","t":"乘长风破万里浪的时刻终会到来，到那时我将高挂云帆横渡沧海。"}],"n":[{"w":"樽","m":"酒杯"},{"w":"斗十千","m":"一斗酒值十千钱，形容酒美价贵"},{"w":"珍羞","m":"珍贵的菜肴，羞同\"馐\""},{"w":"直","m":"同\"值\""},{"w":"箸","m":"筷子"},{"w":"茫然","m":"迷茫、不知所措的样子"},{"w":"垂钓碧溪","m":"用姜太公在磻溪垂钓的典故"},{"w":"乘舟梦日","m":"用伊尹梦见乘舟经过日月旁的典故"},{"w":"歧路","m":"岔路"},{"w":"长风破浪","m":"用南朝宗悫\"愿乘长风破万里浪\"的典故"},{"w":"云帆","m":"高高的帆"}],"a":"这首诗以起伏跌宕的情感变化展现了李白在政治失意时内心的矛盾与挣扎。从美酒佳肴前的茫然失落，到\"冰塞川\"\"雪满山\"的仕途受阻，再到借用姜太公、伊尹的典故寄托希望，最终以\"长风破浪会有时\"的豪迈自信收束全篇。全诗由抑到扬，由愁到壮，充分体现了李白乐观豪放的性格和浪漫主义诗风，成为千古传诵的励志名篇。"},"129":{"o":"巴山楚水凄凉地，二十三年弃置身。\n怀旧空吟闻笛赋，到乡翻似烂柯人。\n沉舟侧畔千帆过，病树前头万木春。\n今日听君歌一曲，暂凭杯酒长精神。","t":[{"o":"巴山楚水凄凉地，二十三年弃置身。","t":"在巴山楚水这些凄凉偏远的地方，我被贬谪流放已有二十三年。"},{"o":"怀旧空吟闻笛赋，到乡翻似烂柯人。","t":"怀念故友，只能空自吟诵《思旧赋》；回到故乡，恍如隔世，倒像是那观棋烂掉的斧柄的王质。"},{"o":"沉舟侧畔千帆过，病树前头万木春。","t":"沉船旁边有千帆竞发，枯树前头是万木争春。"},{"o":"今日听君歌一曲，暂凭杯酒长精神。","t":"今天听你为我唱这一首歌，暂且借这杯美酒来振奋精神吧。"}],"n":[{"w":"巴山楚水","m":"指贬谪之地，四川和湖南一带"},{"w":"弃置","m":"被贬谪、被弃用"},{"w":"闻笛赋","m":"指西晋向秀所作《思旧赋》"},{"w":"烂柯人","m":"用王质入山观棋、斧柄朽烂的典故，比喻世事变迁、恍如隔世"},{"w":"长精神","m":"振奋精神"}],"a":"这首诗是刘禹锡在扬州与白居易相遇时的酬答之作。诗人以\"二十三年弃置身\"概括了漫长的贬谪生涯，又以\"闻笛赋\"\"烂柯人\"两个典故表达了对故友的追念和对世事沧桑的感慨。\"沉舟侧畔千帆过，病树前头万木春\"是千古名句，以自然景象比喻新事物必将取代旧事物的哲理，既含蓄地表达了个人的豁达胸襟，又蕴含着深刻的人生感悟。"},"130":{"o":"丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。\n\n明月几时有？把酒问青天。\n不知天上宫阙，今夕是何年。\n我欲乘风归去，又恐琼楼玉宇，高处不胜寒。\n起舞弄清影，何似在人间。\n\n转朱阁，低绮户，照无眠。\n不应有恨，何事长向别时圆？\n人有悲欢离合，月有阴晴圆缺，此事古难全。\n但愿人长久，千里共婵娟。","t":[{"o":"明月几时有？把酒问青天。","t":"明月是从什么时候开始有的呢？我端起酒杯来问青天。"},{"o":"不知天上宫阙，今夕是何年。","t":"不知道天上的宫殿，今晚是哪一年。"},{"o":"我欲乘风归去，又恐琼楼玉宇，高处不胜寒。","t":"我想乘着清风回到天上去，又怕那美玉砌成的楼宇，高处太寒冷。"},{"o":"起舞弄清影，何似在人间。","t":"在月光下翩翩起舞，与自己的影子为伴，天上哪里比得上人间的快乐呢。"},{"o":"转朱阁，低绮户，照无眠。","t":"月光转过朱红色的楼阁，低低地照进雕花的门窗，照着因思念而不能入眠的人。"},{"o":"不应有恨，何事长向别时圆？","t":"明月不该有什么怨恨吧，为什么总是在人们离别时才圆呢？"},{"o":"人有悲欢离合，月有阴晴圆缺，此事古难全。","t":"人有悲欢离合的变迁，月有阴晴圆缺的转换，这种事自古以来就难以两全。"},{"o":"但愿人长久，千里共婵娟。","t":"只希望人们都能平安长久，虽然远隔千里，也能共享这美好的月光。"}],"n":[{"w":"丙辰","m":"指宋神宗熙宁九年（1076年）"},{"w":"子由","m":"苏轼的弟弟苏辙"},{"w":"把酒","m":"端起酒杯"},{"w":"宫阙","m":"宫殿"},{"w":"琼楼玉宇","m":"美玉砌成的楼宇，指想象中的月中宫殿"},{"w":"不胜","m":"经受不住"},{"w":"绮户","m":"雕花的窗户"},{"w":"何事","m":"为什么"},{"w":"婵娟","m":"月亮的美称"}],"a":"这首词是苏轼在中秋之夜思念弟弟苏辙所作，被誉为中秋词中的千古绝唱。上阕由\"把酒问天\"引出对天上人间的哲思，在出世与入世之间徘徊，最终选择了对人间的眷恋；下阕由月照无眠写起，将对亲人的思念融入对人生离合规律的通达理解之中。全词以月起兴，以月作结，既浪漫飘逸又深情旷达，将人生的哲理与真挚的情感完美融合。"},"131":{"o":"天接云涛连晓雾，星河欲转千帆舞。\n仿佛梦魂归帝所。\n闻天语，殷勤问我归何处。\n\n我报路长嗟日暮，学诗谩有惊人句。\n九万里风鹏正举。\n风休住，蓬舟吹取三山去！","t":[{"o":"天接云涛连晓雾，星河欲转千帆舞。","t":"天空连接着如波涛般的云层，又与晨雾相连，银河似乎在转动，无数的帆船在天上飞舞。"},{"o":"仿佛梦魂归帝所。","t":"恍惚中梦魂仿佛回到了天帝的居所。"},{"o":"闻天语，殷勤问我归何处。","t":"听到天帝关切地问我：你要回到哪里去？"},{"o":"我报路长嗟日暮，学诗谩有惊人句。","t":"我回答说路途漫长而天色已晚，学写诗歌空有惊人之句却无用武之地。"},{"o":"九万里风鹏正举。","t":"大鹏正展翅高飞九万里。"},{"o":"风休住，蓬舟吹取三山去！","t":"风不要停啊，将我这如蓬草般的小舟吹到海上的三座仙山去吧！"}],"n":[{"w":"星河","m":"银河"},{"w":"帝所","m":"天帝居住的地方"},{"w":"殷勤","m":"关切地"},{"w":"嗟","m":"叹息"},{"w":"日暮","m":"天色将晚，比喻年岁已老"},{"w":"谩有","m":"空有"},{"w":"鹏正举","m":"大鹏展翅高飞"},{"w":"蓬舟","m":"像蓬草一样飘荡的小舟"},{"w":"三山","m":"传说中的蓬莱、方丈、瀛洲三座仙山"}],"a":"这首词风格豪放雄奇，在李清照的词作中别具一格。词人借助梦游天界的奇特想象，展现了自己虽有才华却无力改变现实的苦闷，以及渴望冲破束缚、追求自由的精神境界。\"九万里风鹏正举\"一句气势磅礴，借用庄子《逍遥游》中大鹏的意象，表达了词人不甘沉沦的豪迈气概，与其婉约词风形成鲜明对照。"},"132":{"o":"关关雎鸠，在河之洲。窈窕淑女，君子好逑。\n\n参差荇菜，左右流之。窈窕淑女，寤寐求之。\n\n求之不得，寤寐思服。悠哉悠哉，辗转反侧。\n\n参差荇菜，左右采之。窈窕淑女，琴瑟友之。\n\n参差荇菜，左右芼之。窈窕淑女，钟鼓乐之。","t":[{"o":"关关雎鸠，在河之洲。窈窕淑女，君子好逑。","t":"雎鸠鸟关关和鸣，在河中沙洲之上。美丽贤淑的女子，正是君子的好配偶。"},{"o":"参差荇菜，左右流之。窈窕淑女，寤寐求之。","t":"参差不齐的荇菜，在船的左右两边去捞取。美丽贤淑的女子，无论醒着还是睡梦中都在追求她。"},{"o":"求之不得，寤寐思服。悠哉悠哉，辗转反侧。","t":"追求却得不到，醒着睡着都在思念。思念绵绵不断啊，翻来覆去难以入眠。"},{"o":"参差荇菜，左右采之。窈窕淑女，琴瑟友之。","t":"参差不齐的荇菜，在船的左右两边去采摘。美丽贤淑的女子，弹起琴瑟来亲近她。"},{"o":"参差荇菜，左右芼之。窈窕淑女，钟鼓乐之。","t":"参差不齐的荇菜，在船的左右两边去挑选。美丽贤淑的女子，敲起钟鼓来使她快乐。"}],"n":[{"w":"关关","m":"鸟鸣声"},{"w":"雎鸠","m":"一种水鸟，相传雌雄形影不离"},{"w":"洲","m":"水中的沙洲"},{"w":"窈窕","m":"文静美好的样子"},{"w":"淑女","m":"贤良美好的女子"},{"w":"好逑","m":"好的配偶"},{"w":"参差","m":"长短不齐的样子"},{"w":"荇菜","m":"一种水生植物"},{"w":"流之","m":"顺着水流去捞取"},{"w":"寤寐","m":"醒着和睡着"},{"w":"思服","m":"思念"},{"w":"悠哉","m":"思念绵长的样子"},{"w":"芼","m":"挑选"},{"w":"友之","m":"亲近她"},{"w":"乐之","m":"使她快乐"}],"a":"《关雎》是《诗经》的开篇之作，被誉为\"千古情诗之祖\"。全诗以雎鸠和鸣起兴，描写了一位男子对心仪女子的爱慕、追求和思念。从\"寤寐求之\"到\"辗转反侧\"，刻画了求而不得的相思之苦；从\"琴瑟友之\"到\"钟鼓乐之\"，展现了追求成功后的欢庆场面。全诗情感真挚，意境优美，音韵和谐，开创了中国古典诗歌以自然景物起兴抒情的艺术传统。"},"133":{"o":"蒹葭苍苍，白露为霜。所谓伊人，在水一方。\n溯洄从之，道阻且长。溯游从之，宛在水中央。\n\n蒹葭萋萋，白露未晞。所谓伊人，在水之湄。\n溯洄从之，道阻且跻。溯游从之，宛在水中坻。\n\n蒹葭采采，白露未已。所谓伊人，在水之涘。\n溯洄从之，道阻且右。溯游从之，宛在水中沚。","t":[{"o":"蒹葭苍苍，白露为霜。所谓伊人，在水一方。","t":"芦苇茂盛青苍，露水凝结成霜。我心中思念的那个人，就在河水的那一方。"},{"o":"溯洄从之，道阻且长。溯游从之，宛在水中央。","t":"逆流而上去追寻她，道路险阻又漫长。顺流而下去找她，她仿佛就在水中央。"},{"o":"蒹葭萋萋，白露未晞。所谓伊人，在水之湄。","t":"芦苇茂密繁盛，露水还没有干。我心中思念的那个人，就在河水岸边。"},{"o":"溯洄从之，道阻且跻。溯游从之，宛在水中坻。","t":"逆流而上去追寻她，道路险阻难登攀。顺流而下去找她，她仿佛就在水中的小沙洲上。"},{"o":"蒹葭采采，白露未已。所谓伊人，在水之涘。","t":"芦苇鲜明茂盛，露水还未全干。我心中思念的那个人，就在河水边。"},{"o":"溯洄从之，道阻且右。溯游从之，宛在水中沚。","t":"逆流而上去追寻她，道路险阻又弯曲。顺流而下去找她，她仿佛就在水中的小沙滩上。"}],"n":[{"w":"蒹葭","m":"芦苇"},{"w":"苍苍","m":"茂盛的样子"},{"w":"伊人","m":"那个人，指所爱之人"},{"w":"溯洄","m":"逆流而上"},{"w":"溯游","m":"顺流而下"},{"w":"萋萋","m":"茂盛的样子"},{"w":"晞","m":"干"},{"w":"湄","m":"岸边，水草交接之处"},{"w":"跻","m":"升高，此处指道路险峻"},{"w":"坻","m":"水中的小沙洲"},{"w":"采采","m":"茂盛鲜明的样子"},{"w":"未已","m":"还没有完"},{"w":"涘","m":"水边"},{"w":"右","m":"弯曲"},{"w":"沚","m":"水中的小沙滩"}],"a":"《蒹葭》是《诗经·秦风》中的名篇，以深秋河畔的芦苇和露水为背景，反复咏叹对\"伊人\"的追寻与渴望。全诗通过\"溯洄\"与\"溯游\"的反复交错，营造出一种可望而不可即的距离感和朦胧美。三章重章叠唱，以景物变化暗示时间推移，而\"伊人\"始终若即若离、不可企及，表达了一种执着追求却难以如愿的怅惘之情，意境空灵深邃，极具艺术感染力。"},"134":{"o":"式微式微，胡不归？\n微君之故，胡为乎中露！\n\n式微式微，胡不归？\n微君之躬，胡为乎泥中！","t":[{"o":"式微式微，胡不归？","t":"天黑了，天黑了，为什么还不回家？"},{"o":"微君之故，胡为乎中露！","t":"如果不是为了君主的缘故，怎么会在露水中劳作！"},{"o":"式微式微，胡不归？","t":"天黑了，天黑了，为什么还不回家？"},{"o":"微君之躬，胡为乎泥中！","t":"如果不是为了君主的身体，怎么会在泥泞中受苦！"}],"n":[{"w":"式微","m":"天黑，引申为衰微"},{"w":"胡","m":"为什么"},{"w":"微","m":"非，要不是"},{"w":"君之故","m":"君主的缘故"},{"w":"中露","m":"即\"露中\"，在露水中"},{"w":"君之躬","m":"君主的身体"},{"w":"泥中","m":"在泥泞中"}],"a":"《式微》是《诗经·邶风》中的一首短诗，以简练的语言表达了服役者的怨愤之情。全诗以设问起句，\"胡不归\"三字反复出现，将归家不得的无奈和悲愤层层加重。诗句虽短，却以质直有力的语言控诉了繁重劳役对普通百姓的压榨，反映了劳动者在露水泥泞中昼夜辛劳的困苦生活，具有深刻的社会批判意义。"},"135":{"o":"青青子衿，悠悠我心。\n纵我不往，子宁不嗣音？\n\n青青子佩，悠悠我思。\n纵我不往，子宁不来？\n\n挑兮达兮，在城阙兮。\n一日不见，如三月兮！","t":[{"o":"青青子衿，悠悠我心。","t":"你那青色的衣领，让我思念不断。"},{"o":"纵我不往，子宁不嗣音？","t":"即使我不去看你，你难道就不能传个音信？"},{"o":"青青子佩，悠悠我思。","t":"你那青色的佩饰，让我牵挂不止。"},{"o":"纵我不往，子宁不来？","t":"即使我不去看你，你难道就不能来看看我？"},{"o":"挑兮达兮，在城阙兮。","t":"独自在城楼上走来走去，焦急地等候。"},{"o":"一日不见，如三月兮！","t":"一天见不到你，就像过了三个月一样漫长！"}],"n":[{"w":"子衿","m":"你的衣领，衿指衣领"},{"w":"悠悠","m":"绵长不断的样子，形容思念"},{"w":"嗣音","m":"传递音信"},{"w":"子佩","m":"指你的佩饰"},{"w":"挑兮达兮","m":"形容走来走去、焦急等待的样子"},{"w":"城阙","m":"城门两侧的观楼"}],"a":"《子衿》是《诗经·郑风》中的一首爱情诗，以女子的口吻表达对恋人的深切思念和微妙嗔怪。前两章以\"青青子衿\"\"青青子佩\"借代心上人，\"纵我不往，子宁不嗣音\"既含埋怨又蕴深情；末章\"一日不见，如三月兮\"以夸张手法将相思之苦表达得淋漓尽致。全诗情感细腻真挚，语言活泼明快，心理刻画生动传神。"},"136":{"o":"北风卷地白草折，胡天八月即飞雪。\n忽如一夜春风来，千树万树梨花开。\n散入珠帘湿罗幕，狐裘不暖锦衾薄。\n将军角弓不得控，都护铁衣冷难着。\n瀚海阑干百丈冰，愁云惨淡万里凝。\n中军置酒饮归客，胡琴琵琶与羌笛。\n纷纷暮雪下辕门，风掣红旗冻不翻。\n轮台东门送君去，去时雪满天山路。\n山回路转不见君，雪上空留马行处。","t":[{"o":"北风卷地白草折，胡天八月即飞雪。","t":"北风席卷大地，白草被吹折了；塞北的天空八月就纷飞着大雪。"},{"o":"忽如一夜春风来，千树万树梨花开。","t":"忽然间仿佛一夜春风吹来，千万棵树上如同梨花盛开一般（挂满了雪花）。"},{"o":"散入珠帘湿罗幕，狐裘不暖锦衾薄。","t":"雪花飘入珠帘打湿了丝织的幕帐，狐皮大衣不觉得暖和，锦缎被子也嫌太薄。"},{"o":"将军角弓不得控，都护铁衣冷难着。","t":"将军的角弓冻得无法拉开，都护的铁甲冷得难以穿上。"},{"o":"瀚海阑干百丈冰，愁云惨淡万里凝。","t":"大沙漠上纵横交错着百丈厚的冰层，万里长空凝聚着惨淡愁苦的阴云。"},{"o":"中军置酒饮归客，胡琴琵琶与羌笛。","t":"主帅帐中设置酒宴为归客饯行，演奏起胡琴、琵琶和羌笛。"},{"o":"纷纷暮雪下辕门，风掣红旗冻不翻。","t":"傍晚大雪纷纷扬扬落在辕门外，红旗被冰雪冻住，即使有风也无法飘动。"},{"o":"轮台东门送君去，去时雪满天山路。","t":"在轮台东门送你离去，出发时大雪已经覆盖了天山的道路。"},{"o":"山回路转不见君，雪上空留马行处。","t":"山路蜿蜒曲折，很快就看不见你的身影了，雪地上只留下马走过的蹄印。"}],"n":[{"w":"白草","m":"西域的一种草，秋天变白"},{"w":"胡天","m":"指塞北的天空"},{"w":"罗幕","m":"丝织的幕帐"},{"w":"狐裘","m":"狐皮大衣"},{"w":"锦衾","m":"锦缎被子"},{"w":"角弓","m":"用兽角装饰的弓"},{"w":"不得控","m":"无法拉开"},{"w":"瀚海","m":"浩瀚的沙漠"},{"w":"阑干","m":"纵横交错的样子"},{"w":"中军","m":"主帅的营帐"},{"w":"辕门","m":"军营的门"},{"w":"掣","m":"拉、扯"},{"w":"轮台","m":"地名，在今新疆"}],"a":"这首诗是岑参边塞诗的代表作，以奇丽的笔触描绘了西北边塞的壮美雪景，同时表达了送别友人时的依依惜别之情。\"忽如一夜春风来，千树万树梨花开\"是千古名句，以春花喻冬雪，想象奇绝，将冰天雪地写得如诗如画。全诗从写雪景到写军营生活，再到写送别场景，由宏大壮阔渐转深情绵邈，最后以\"雪上空留马行处\"收束，意境深远，余味悠长。"},"137":{"o":"何处望神州？满眼风光北固楼。\n千古兴亡多少事？悠悠。不尽长江滚滚流。\n\n年少万兜鍪，坐断东南战未休。\n天下英雄谁敌手？曹刘。生子当如孙仲谋。","t":[{"o":"何处望神州？满眼风光北固楼。","t":"从哪里可以眺望中原故土？在北固楼上满眼都是壮丽的风光。"},{"o":"千古兴亡多少事？悠悠。不尽长江滚滚流。","t":"千百年来经历了多少兴亡更替？悠悠岁月，如同那滚滚流淌的长江水无穷无尽。"},{"o":"年少万兜鍪，坐断东南战未休。","t":"年纪轻轻就统领百万雄师，占据东南一方，征战不休。"},{"o":"天下英雄谁敌手？曹刘。生子当如孙仲谋。","t":"天下的英雄谁是他的对手？只有曹操和刘备。生儿子就应当像孙权那样。"}],"n":[{"w":"神州","m":"指中原故土"},{"w":"北固楼","m":"即北固亭，在今江苏镇江"},{"w":"兜鍪","m":"头盔，此处借指士兵"},{"w":"坐断","m":"占据"},{"w":"曹刘","m":"曹操和刘备"},{"w":"孙仲谋","m":"孙权，字仲谋，三国时吴国国君"}],"a":"这首词是辛弃疾登临北固亭时的怀古之作。上阕以\"何处望神州\"开篇，抒发了对中原沦陷的悲愤；以长江滚滚暗喻时光流逝和壮志难酬。下阕借赞颂孙权年少英雄、雄踞江东的事迹，以古讽今，暗含对南宋朝廷偏安一隅、不思进取的讽谏。全词气势雄浑，语言铿锵，在怀古中寄托了词人收复失地的壮志和对国家命运的深沉忧思。"},"138":{"o":"辛苦遭逢起一经，干戈寥落四周星。\n山河破碎风飘絮，身世浮沉雨打萍。\n惶恐滩头说惶恐，零丁洋里叹零丁。\n人生自古谁无死？留取丹心照汗青。","t":[{"o":"辛苦遭逢起一经，干戈寥落四周星。","t":"我艰辛的人生际遇从精通经书参加科举开始，在频繁的抗元战争中度过了四年。"},{"o":"山河破碎风飘絮，身世浮沉雨打萍。","t":"国家山河破碎如同风中飘散的柳絮，个人身世飘泊如同雨中浮沉的浮萍。"},{"o":"惶恐滩头说惶恐，零丁洋里叹零丁。","t":"在惶恐滩头说起令人惶恐不安的往事，在零丁洋里慨叹自己的孤苦零丁。"},{"o":"人生自古谁无死？留取丹心照汗青。","t":"自古以来人谁能不死？留下一颗赤诚的爱国之心光照史册。"}],"n":[{"w":"遭逢","m":"遭遇，指遇到朝廷的选拔"},{"w":"起一经","m":"因精通某一种经书而通过科举考试出仕"},{"w":"干戈","m":"兵器，此处指战争"},{"w":"寥落","m":"荒凉冷落"},{"w":"四周星","m":"四年"},{"w":"絮","m":"柳絮"},{"w":"惶恐滩","m":"在今江西万安，急流险滩"},{"w":"零丁洋","m":"在今广东珠江口外"},{"w":"丹心","m":"红心，比喻忠诚的心"},{"w":"汗青","m":"史册"}],"a":"这首诗是文天祥兵败被俘后押经零丁洋时所作，是一首震古烁今的爱国壮歌。诗人以\"风飘絮\"\"雨打萍\"比喻国势危亡和个人命运的坎坷，以\"惶恐\"\"零丁\"的双关巧妙地名与情融合。最后两句\"人生自古谁无死？留取丹心照汗青\"掷地有声，以舍生取义的壮烈气概超越了个人生死，成为中华民族气节精神的不朽宣言。"},"139":{"o":"醉里挑灯看剑，梦回吹角连营。\n八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。\n\n马作的卢飞快，弓如霹雳弦惊。\n了却君王天下事，赢得生前身后名。\n可怜白发生！","t":[{"o":"醉里挑灯看剑，梦回吹角连营。","t":"醉酒后挑亮油灯端详宝剑，梦中回到了号角声声的军营。"},{"o":"八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。","t":"把牛肉分给部下将士们烤食，乐器演奏出雄壮的边塞乐曲，这是秋天在战场上阅兵。"},{"o":"马作的卢飞快，弓如霹雳弦惊。","t":"战马像的卢一样飞驰，弓弦拉响时如同霹雳般震耳。"},{"o":"了却君王天下事，赢得生前身后名。","t":"完成收复中原、统一天下的大业，赢得生前死后的英名。"},{"o":"可怜白发生！","t":"可惜壮志未酬，两鬓已经生出了白发！"}],"n":[{"w":"挑灯","m":"拨亮灯火"},{"w":"吹角连营","m":"各个营垒接连响起号角"},{"w":"八百里","m":"牛的代称，出自《世说新语》"},{"w":"麾下","m":"部下"},{"w":"炙","m":"烤肉"},{"w":"五十弦","m":"泛指乐器"},{"w":"的卢","m":"骏马名，刘备所乘之名马"},{"w":"霹雳","m":"雷声，形容弓弦声响"},{"w":"天下事","m":"指收复中原、统一天下的大业"}],"a":"这首词以壮怀激烈的笔调描写了一场激昂的战斗场面，寄托了辛弃疾渴望抗金收复失地的壮志。上阕从醉中看剑、梦回军营写起，铺写出军营中的雄壮景象；下阕写战场上的英勇搏杀和建功立业的豪情。然而末句\"可怜白发生\"陡然一转，将全词从壮烈的梦境拉回到残酷的现实，以理想与现实的巨大反差，抒发了壮志难酬的悲愤之情，具有极强的艺术感染力。"},"140":{"o":"小住京华，早又是中秋佳节。\n为篱下黄花开遍，秋容如拭。\n四面歌残终破楚，八年风味徒思浙。\n苦将侬强派作蛾眉，殊未屑！\n\n身不得，男儿列，心却比，男儿烈。\n算平生肝胆，因人常热。\n俗子胸襟谁识我？英雄末路当磨折。\n莽红尘何处觅知音？青衫湿！","t":[{"o":"小住京华，早又是中秋佳节。","t":"短暂居住在京城，不知不觉又到了中秋佳节。"},{"o":"为篱下黄花开遍，秋容如拭。","t":"篱笆下菊花已经开遍，秋天的景色如同擦拭过一样明净。"},{"o":"四面歌残终破楚，八年风味徒思浙。","t":"四面楚歌最终国家被攻破，八年来徒然思念着浙江故乡。"},{"o":"苦将侬强派作蛾眉，殊未屑！","t":"苦苦地将我派作女儿身，我实在不甘心！"},{"o":"身不得，男儿列，心却比，男儿烈。","t":"身体不能列入男儿的行列，心却比男儿还要刚烈。"},{"o":"算平生肝胆，因人常热。","t":"想想自己一生的肝胆义气，为他人、为世事常常热血沸腾。"},{"o":"俗子胸襟谁识我？英雄末路当磨折。","t":"那些凡俗之人的胸襟怎么能理解我？英雄到了穷途末路自然要遭受磨难。"},{"o":"莽红尘何处觅知音？青衫湿！","t":"在这茫茫尘世间到哪里去寻找知音？不觉泪湿衣衫！"}],"n":[{"w":"京华","m":"京城"},{"w":"秋容如拭","m":"秋天的景色明净如洗"},{"w":"四面歌残终破楚","m":"用项羽四面楚歌的典故，比喻列强环伺、国家危难"},{"w":"侬","m":"我"},{"w":"蛾眉","m":"女子的代称"},{"w":"殊未屑","m":"实在不愿意、不甘心"},{"w":"烈","m":"刚烈"},{"w":"肝胆","m":"义气、热忱"},{"w":"莽红尘","m":"茫茫尘世"},{"w":"青衫湿","m":"用白居易《琵琶行》\"江州司马青衫湿\"典故，指落泪"}],"a":"这首词是秋瑾的代表作，以女革命家的豪迈气概抒发了不甘为女儿身、渴望投身革命的壮志情怀。\"身不得，男儿列，心却比，男儿烈\"是全词的核心，以铿锵有力的语言表达了词人突破性别束缚的强烈愿望和比男子更加刚烈的爱国之心。全词风格豪壮，情感激越，既有英雄气概的慷慨，又有知音难觅的悲怆，展现了秋瑾作为革命先驱的精神风貌。"},"141":{"o":"莫听穿林打叶声，何妨吟啸且徐行。\n竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。\n\n料峭春风吹酒醒，微冷，山头斜照却相迎。\n回首向来萧瑟处，归去，也无风雨也无晴。","t":[{"o":"莫听穿林打叶声，何妨吟啸且徐行。","t":"不要去听那雨点穿过树林打在树叶上的声音，不妨一边吟咏长啸一边慢慢前行。"},{"o":"竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。","t":"拄着竹杖穿着草鞋比骑马还要轻快，怕什么呢？披着一件蓑衣在风雨中度过一生也无所畏惧。"},{"o":"料峭春风吹酒醒，微冷，山头斜照却相迎。","t":"微寒的春风把酒意吹醒了，感到一丝冷意，山头上的夕阳却迎面照来。"},{"o":"回首向来萧瑟处，归去，也无风雨也无晴。","t":"回头看看刚才走过的风雨萧瑟的地方，回去吧，对我来说既没有风雨也没有晴天。"}],"n":[{"w":"吟啸","m":"吟咏长啸，形容态度从容"},{"w":"徐行","m":"慢慢走"},{"w":"芒鞋","m":"草鞋"},{"w":"一蓑烟雨","m":"披着蓑衣在风雨中"},{"w":"任平生","m":"任凭一生风雨"},{"w":"料峭","m":"形容微寒"},{"w":"萧瑟","m":"风雨吹打树木的声音，形容冷落凄清"}],"a":"这首词是苏轼被贬黄州期间所作，表面写一次途中遇雨的经历，实则蕴含深刻的人生哲理。面对突如其来的风雨，词人不惊不避，以\"竹杖芒鞋轻胜马\"的从容和\"一蓑烟雨任平生\"的豁达应对。结尾\"也无风雨也无晴\"更是全词的点睛之笔，超越了对阴晴风雨的执念，表达了宠辱不惊、超然物外的人生态度，充分体现了苏轼旷达乐观的精神境界。"},"142":{"o":"忆昔午桥桥上饮，坐中多是豪英。\n长沟流月去无声。\n杏花疏影里，吹笛到天明。\n\n二十余年如一梦，此身虽在堪惊。\n闲登小阁看新晴。\n古今多少事，渔唱起三更。","t":[{"o":"忆昔午桥桥上饮，坐中多是豪英。","t":"回忆当年在午桥上饮酒聚会的情景，在座的大多是英雄豪杰。"},{"o":"长沟流月去无声。","t":"月光倒映在长长的河沟中，随着流水悄悄逝去。"},{"o":"杏花疏影里，吹笛到天明。","t":"在杏花稀疏的影子底下，吹着笛子一直到天亮。"},{"o":"二十余年如一梦，此身虽在堪惊。","t":"二十多年的岁月如同一场梦，虽然此身还在，回想起来令人心惊。"},{"o":"闲登小阁看新晴。","t":"闲暇时登上小楼阁观看雨后的新晴。"},{"o":"古今多少事，渔唱起三更。","t":"古往今来多少兴衰往事，都化作了半夜渔夫的歌声。"}],"n":[{"w":"午桥","m":"桥名，在洛阳"},{"w":"豪英","m":"英雄豪杰"},{"w":"长沟流月","m":"月光映在河水中随流而去"},{"w":"堪惊","m":"令人心惊"},{"w":"新晴","m":"雨后初晴"},{"w":"渔唱","m":"渔夫的歌声"},{"w":"三更","m":"半夜"}],"a":"这首词是陈与义晚年追忆洛中旧游之作。上阕以\"杏花疏影里，吹笛到天明\"的优美意境，再现了往昔与好友欢聚的豪迈与浪漫；下阕以\"二十余年如一梦\"感叹时光飞逝、世事沧桑。经历了靖康之变的国破家亡，词人将个人身世之感与历史兴亡之叹融为一体，以\"古今多少事，渔唱起三更\"作结，将千古兴亡都化作渔歌的悠远意境，含蓄深沉，韵味无穷。"},"143":{"o":"一轮秋影转金波。飞镜又重磨。\n把酒问姮娥：被白发欺人奈何！\n\n乘风好去，长空万里，直下看山河。\n斫去桂婆娑，人道是清光更多。","t":[{"o":"一轮秋影转金波。飞镜又重磨。","t":"一轮中秋明月洒下金色的月光，月亮像重新磨亮的飞镜一样皎洁。"},{"o":"把酒问姮娥：被白发欺人奈何！","t":"举起酒杯来问嫦娥：被白头发欺负该怎么办啊！"},{"o":"乘风好去，长空万里，直下看山河。","t":"乘风飞上万里长空，从天上俯瞰祖国的大好山河。"},{"o":"斫去桂婆娑，人道是清光更多。","t":"砍去月宫中那棵枝叶繁茂的桂树，人们说这样月光会更加明亮。"}],"n":[{"w":"金波","m":"指月光"},{"w":"飞镜","m":"比喻月亮如飞在天上的铜镜"},{"w":"姮娥","m":"即嫦娥"},{"w":"白发欺人","m":"指年华老去"},{"w":"斫","m":"砍"},{"w":"桂婆娑","m":"指月宫中的桂树枝叶纷披"},{"w":"清光","m":"月光"}],"a":"这首词是辛弃疾在建康（今南京）中秋之夜所作。上阕以\"被白发欺人奈何\"发出壮志难酬的感慨，将年华老去与报国无门的悲愤融入对月问天的豪情之中。下阕笔锋一转，以\"乘风好去\"的浪漫想象表达了对祖国山河的深情，而\"斫去桂婆娑\"则暗含扫除朝中投降势力、收复失地的政治理想。全词将中秋赏月的传统主题与爱国壮志巧妙结合，意境开阔，气势不凡。"},"144":{"o":"谁念西风独自凉，萧萧黄叶闭疏窗，沉思往事立残阳。\n\n被酒莫惊春睡重，赌书消得泼茶香，当时只道是寻常。","t":[{"o":"谁念西风独自凉，萧萧黄叶闭疏窗，沉思往事立残阳。","t":"秋天的西风吹来，有谁会念及我独自感受的凉意？萧萧落下的黄叶遮蔽了稀疏的窗户，我在夕阳下陷入对往事的沉思。"},{"o":"被酒莫惊春睡重，赌书消得泼茶香，当时只道是寻常。","t":"酒后沉睡不要惊扰我春日的好梦，夫妻以书赌胜负泼洒了满杯的茶香，当时只觉得那是寻常的日子。"}],"n":[{"w":"萧萧","m":"风吹叶落的声音"},{"w":"疏窗","m":"雕刻着花纹的窗户"},{"w":"被酒","m":"醉酒"},{"w":"赌书泼茶","m":"用李清照与赵明诚赌书泼茶的典故，形容夫妻间情趣相投"},{"w":"消得","m":"禁得起、经受得住"},{"w":"只道","m":"只以为"}],"a":"这首词是纳兰性德悼念亡妻之作，以极为朴素的语言写出了深沉的丧妻之痛。上阕以西风、黄叶、残阳等萧瑟秋景烘托出孤寂凄凉的心境；下阕借用李清照与赵明诚\"赌书泼茶\"的典故，回忆与妻子生前的美好时光。\"当时只道是寻常\"是全词的灵魂，道出了人们往往在失去之后才懂得珍惜的深切感慨，以平淡之语写至深之情，令人动容。"}};

  { id:136, title:'南乡子·登京口北固亭有怀', author:'【宋】辛弃疾', quote:'天下英雄谁敌手？曹刘' },
  { id:137, title:'过零丁洋', author:'【宋】文天祥', quote:'人生自古谁无死？留取丹心照汗青' },
  { id:138, title:'破阵子·为陈同甫赋壮词以寄之', author:'【宋】辛弃疾', quote:'了却君王天下事，赢得生前身后名' },
  { id:139, title:'满江红', author:'【清】秋瑾', quote:'身不得，男儿列，心却比，男儿烈' },
  { id:140, title:'定风波', author:'【宋】苏轼', quote:'一蓑烟雨任平生' },
  { id:141, title:'临江仙·夜登小阁忆洛中旧游', author:'【宋】陈与义', quote:'闲登小阁看新晴' },
  { id:142, title:'太常引·建康中秋夜为吕叔潜赋', author:'【宋】辛弃疾', quote:'乘风好去，长空万里，直下看山河' },
  { id:143, title:'浣溪沙', author:'【清】纳兰性德', quote:'谁念西风独自凉' },
  { id:144, title:'己亥杂诗（我劝天公）', author:'【清】龚自珍', quote:'我劝天公重抖擞，不拘一格降人才' }
];

// ── Extract authors ──
function extractAuthors(data) {
  const map = {};
  data.forEach(d => { map[d.author] = (map[d.author] || 0) + 1; });
  return Object.entries(map).sort((a,b) => b[1] - a[1]).map(e => e[0]);
}
const proseAuthors = extractAuthors(proseData);
const poetryAuthors = extractAuthors(poetryData);

// ── State ──
let currentTab = 'prose';
let currentAuthor = '';
let searchQuery = '';
let allCollapsed = false;
let bookmarks = {};
try { bookmarks = JSON.parse(localStorage.getItem('gs-bookmarks') || '{}'); } catch(e) {}

function saveBookmarks() {
  try { localStorage.setItem('gs-bookmarks', JSON.stringify(bookmarks)); } catch(e) {}
}

function isBookmarked(type, id) {
  return !!bookmarks[type + '-' + id];
}

function toggleBookmark(type, id) {
  const key = type + '-' + id;
  if (bookmarks[key]) delete bookmarks[key];
  else bookmarks[key] = true;
  saveBookmarks();
  renderGrid();
}

// ── SVG helpers ──
const chevronSVG = '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"/></svg>';

// ── Render filters ──
function renderFilters() {
  const row = document.getElementById('filterRow');
  const authors = currentTab === 'prose' ? proseAuthors : poetryAuthors;
  let html = '<button class="filter-chip' + (currentAuthor === '' ? ' active' : '') + '" data-author="">全部' + (authors.length > 0 ? chevronSVG : '') + '</button>';
  if (authors.length > 0) {
    html += '<div class="filter-authors">';
    authors.forEach(a => {
      html += '<button class="filter-chip' + (currentAuthor === a ? ' active' : '') + '" data-author="' + a.replace(/"/g, '&quot;') + '">' + a + '</button>';
    });
    html += '</div>';
  }
  row.innerHTML = html;
}

// ── Get filtered data ──
function getFilteredData() {
  const data = currentTab === 'prose' ? proseData : poetryData;
  return data.filter(item => {
    if (currentAuthor && item.author !== currentAuthor) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const haystack = (item.title + item.author + (item.quote || '') + (item.tips || '') + (item.sub || '')).toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });
}

// ── Render grid ──
function renderGrid() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  const items = getFilteredData();

  if (items.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const type = currentTab;

  let html = '';
  items.forEach(item => {
    const bk = isBookmarked(type, item.id);
    html += '<div class="card' + (allCollapsed ? ' collapsed' : '') + '" data-type="' + type + '" data-id="' + item.id + '" tabindex="0" role="button">'
      + '<div class="card-header">'
      + '<span class="card-num">' + String(item.id).padStart(2,'0') + '</span>'
      + '<span class="card-title">' + esc(item.title) + (item.sub ? '<br><small style="font-weight:400;font-size:13px;color:var(--muted);">' + esc(item.sub) + '</small>' : '') + '</span>'
      + '<button class="bookmark-btn' + (bk ? ' active' : '') + '" data-bk-type="' + type + '" data-bk-id="' + item.id + '" title="标记已学" aria-label="' + (bk ? '取消标记' : '标记已学') + '">' + (bk ? '★' : '☆') + '</button>'
      + '</div>'
      + '<div class="card-author">' + esc(item.author) + '<button class="card-toggle" data-toggle="collapse" aria-label="展开/折叠">' + chevronSVG + '</button></div>'
      + '<div class="card-body">'
      + (item.quote
        ? '<div class="card-quote poetry-quote">' + esc(item.quote) + '</div>'
        : item.tips
          ? '<div class="card-quote">' + esc(item.tips) + '</div>'
          : '')
      + '</div>'
      + '</div>';
  });
  grid.innerHTML = html;
}

// ── Render modal ──

function openModal(type, id) {
  const data = type === 'prose' ? proseData : poetryData;
  const item = data.find(d => d.id === id);
  if (!item) return;
  const content = type === 'prose' ? (proseContent[String(id).padStart(2,'0')] || null) : (poetryContent[String(id).padStart(3,'0')] || null);
  const overlay = document.getElementById('modalOverlay');
  const mc = document.getElementById('modalContent');

  let html = '<div class="modal-header-bar">'
    + '<div class="modal-num">' + String(item.id).padStart(2,'0') + '</div>'
    + (content ? '<button class="pinyin-toggle' + (pinyinEnabled ? ' on' : '') + '" id="pinyinBtn">拼音</button>' : '')
    + '</div>'
    + '<h2 class="modal-title">' + esc(item.title) + (item.sub ? '<br><small style="font-weight:400;font-size:15px;color:var(--muted);">' + esc(item.sub) + '</small>' : '') + '</h2>'
    + '<div class="modal-author">' + esc(item.author) + '</div>';

  if (content) {
    // Tabs
    html += '<div class="modal-tabs">';
    html += '<button class="mtab active" data-mtab="orig">原文</button>';
    if (content.t && content.t.length > 0) html += '<button class="mtab" data-mtab="trans">翻译</button>';
    if (content.n && content.n.length > 0) html += '<button class="mtab" data-mtab="notes">注释</button>';
    if (content.a) html += '<button class="mtab" data-mtab="analysis">赏析</button>';
    html += '</div>';

    // Original text
    html += '<div class="mtab-content active' + (pinyinEnabled ? ' pinyin-show' : '') + '" data-mc="orig">';
    html += '<div class="original-text' + (type === 'poetry' ? ' poetry-center' : '') + '">' + annotatePinyin(esc(content.o)).replace(/\n/g, '<br>') + '</div>';
    html += '</div>';

    // Translation
    if (content.t && content.t.length > 0) {
      html += '<div class="mtab-content" data-mc="trans">';
      content.t.forEach(p => {
        html += '<div class="trans-pair"><div class="trans-orig">' + esc(p.o) + '</div><div class="trans-mod">' + esc(p.t) + '</div></div>';
      });
      html += '</div>';
    }

    // Notes
    if (content.n && content.n.length > 0) {
      html += '<div class="mtab-content" data-mc="notes">';
      html += '<table class="notes-table">';
      content.n.forEach(n => {
        html += '<tr><td>' + esc(n.w) + '</td><td>' + esc(n.m) + '</td></tr>';
      });
      html += '</table></div>';
    }

    // Analysis
    if (content.a) {
      html += '<div class="mtab-content" data-mc="analysis">';
      html += '<div class="analysis-text">' + esc(content.a).replace(/\n/g, '<br>') + '</div>';
      html += '</div>';
    }
  } else {
    // Fallback for items without detailed content
    if (item.quote) {
      html += '<div class="modal-section-label">名句</div><div class="modal-quote poetry-quote">' + esc(item.quote) + '</div>';
    }
    if (item.tips) {
      html += '<div class="modal-section-label">学习提示</div><div class="modal-tips">' + esc(item.tips) + '</div>';
    }
  }

  mc.innerHTML = html;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  // Tab switching
  mc.querySelectorAll('.mtab').forEach(tab => {
    tab.addEventListener('click', () => {
      mc.querySelectorAll('.mtab').forEach(t => t.classList.remove('active'));
      mc.querySelectorAll('.mtab-content').forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      mc.querySelector('[data-mc="' + tab.dataset.mtab + '"]').classList.add('active');
    });
  });
  // Pinyin toggle
  var pinyinBtn = document.getElementById('pinyinBtn');
  if (pinyinBtn) {
    pinyinBtn.addEventListener('click', function() {
      pinyinEnabled = !pinyinEnabled;
      pinyinBtn.classList.toggle('on', pinyinEnabled);
      var origDiv = mc.querySelector('[data-mc="orig"]');
      origDiv.classList.toggle('pinyin-show', pinyinEnabled);
      // Re-render original text with/without pinyin
      if (content) {
        var otEl = origDiv.querySelector('.original-text');
        otEl.innerHTML = annotatePinyin(esc(content.o)).replace(/\n/g, '<br>');
        if (type === 'poetry') otEl.classList.add('poetry-center');
      }
    });
  }
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ── Events ──
// Tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    currentAuthor = '';
    searchQuery = '';
    document.getElementById('filterRow').classList.remove('expanded');
    document.getElementById('searchInput').value = '';
    renderFilters();
    renderGrid();
  });
});

// Filters (delegated)
document.getElementById('filterRow').addEventListener('click', e => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  // "全部" chip toggles author list expand/collapse
  if (chip.dataset.author === '') {
    const row = document.getElementById('filterRow');
    row.classList.toggle('expanded');
    currentAuthor = '';
    renderFilters();
    renderGrid();
    return;
  }
  // Author chip selects filter
  currentAuthor = chip.dataset.author;
  renderFilters();
  renderGrid();
});

// Search
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderGrid();
});

// Collapse all toggle
document.getElementById('collapseAllBtn').addEventListener('click', function() {
  allCollapsed = !allCollapsed;
  this.textContent = allCollapsed ? '展开全部' : '折叠全部';
  document.querySelectorAll('#grid .card').forEach(card => {
    card.classList.toggle('collapsed', allCollapsed);
  });
}

// Grid click (delegated)
document.getElementById('grid').addEventListener('click', e => {
  // Collapse toggle
  const togBtn = e.target.closest('.card-toggle');
  if (togBtn) {
    e.stopPropagation();
    togBtn.closest('.card').classList.toggle('collapsed');
    return;
  }
  // Bookmark
  const bkBtn = e.target.closest('.bookmark-btn');
  if (bkBtn) {
    e.stopPropagation();
    toggleBookmark(bkBtn.dataset.bkType, parseInt(bkBtn.dataset.bkId));
    return;
  }
  // Card → modal
  const card = e.target.closest('.card');
  if (card) {
    openModal(card.dataset.type, parseInt(card.dataset.id));
  }
});
// Card keyboard support (Enter/Space)
document.getElementById('grid').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    const card = e.target.closest('.card');
    if (card) {
      e.preventDefault();
      openModal(card.dataset.type, parseInt(card.dataset.id));
    }
  }
});

// Modal close
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ── Init ──
try {
  renderFilters();
  renderGrid();
} catch(e) {
  document.getElementById('grid').innerHTML = '<div style="padding:40px;text-align:center;color:#C84B31;">加载出错：' + e.message + '</div>';
}
</script>
</body>
</html>
