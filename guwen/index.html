<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古诗文背诵大全</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
<style>
/* ── Design Tokens ── */
:root {
  --bg:        #F7F4EF;
  --surface:   #FFFFFF;
  --fg:        #2A2118;
  --muted:     #8C7E6A;
  --border:    #E3DAD0;
  --accent:    #C84B31;
  --accent-soft: rgba(200,75,49,0.07);
  --jade:      #3D7A5F;
  --jade-soft: rgba(61,122,95,0.08);
  --gold:      #B8860B;
  --radius:    10px;
  --font-display: 'Noto Serif SC', 'Songti SC', 'SimSun', Georgia, serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --shadow-sm: 0 1px 3px rgba(42,33,24,0.06);
  --shadow-md: 0 4px 16px rgba(42,33,24,0.08);
  --shadow-lg: 0 8px 32px rgba(42,33,24,0.12);
  --max-w: 1200px;
  color-scheme: light;
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  min-height: 100vh;
}
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font: inherit; border: none; outline: none; background: none; color: inherit; }

/* ── Header ── */
.header {
  text-align: center;
  padding: 48px 24px 32px;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -60%; left: -10%; right: -10%;
  height: 200%;
  background: radial-gradient(ellipse at 50% 0%, rgba(200,75,49,0.04) 0%, transparent 60%);
  pointer-events: none;
}
.header-title {
  font-family: var(--font-display);
  font-size: clamp(32px, 6vw, 56px);
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--fg);
  margin-bottom: 8px;
  position: relative;
}
.header-sub {
  font-size: 15px;
  color: var(--muted);
  letter-spacing: 0.02em;
}
.header-sub span {
  display: inline-block;
  margin: 0 4px;
  color: var(--border);
}

/* ── Controls ── */
.controls {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  padding-top: 16px;
  padding-bottom: 12px;
}
.controls::after {
  content: '';
  position: absolute;
  bottom: -12px; left: 0; right: 0;
  height: 12px;
  background: linear-gradient(var(--bg), transparent);
  pointer-events: none;
}

.tabs {
  display: flex;
  gap: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 12px;
}
.tab-btn {
  flex: 1;
  padding: 12px 16px;
  font-size: 15px;
  font-weight: 500;
  text-align: center;
  transition: all 0.2s;
  border-right: 1px solid var(--border);
  position: relative;
}
.tab-btn:last-child { border-right: none; }
.tab-btn.active {
  background: var(--fg);
  color: var(--bg);
  font-weight: 600;
}
.tab-btn:not(.active):hover {
  background: var(--accent-soft);
}

.filter-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 12px;
}
.filter-row .filter-chip[data-author=""] {
  cursor: pointer;
}
.filter-row .filter-chip[data-author=""] svg {
  width: 12px; height: 12px;
  transition: transform 0.3s;
  vertical-align: middle;
  margin-left: 2px;
}
.filter-row.expanded .filter-chip[data-author=""] svg {
  transform: rotate(180deg);
}
.filter-authors {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.3s ease, opacity 0.25s ease;
  width: 100%;
}
.filter-row.expanded .filter-authors {
  max-height: 600px;
  opacity: 1;
  margin-top: 4px;
}
.filter-chip {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--surface);
  transition: all 0.2s;
  white-space: nowrap;
}
.filter-chip.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.filter-chip:not(.active):hover {
  border-color: var(--accent);
  color: var(--accent);
}

.search-wrap {
  position: relative;
}
.search-icon {
  position: absolute;
  left: 14px; top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  font-size: 14px;
}
.search-input {
  width: 100%;
  padding: 11px 16px 11px 40px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  font-size: 14px;
  transition: border-color 0.2s;
}
.search-input::placeholder { color: var(--muted); }
.search-input:focus { border-color: var(--accent); }

/* ── Card Grid ── */
.grid-wrap {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 8px 24px 48px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
  border-color: var(--accent);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.card-num {
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
  margin-top: 3px;
}
.card-title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--fg);
  flex: 1;
}
.bookmark-btn {
  flex-shrink: 0;
  width: 28px; height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 16px;
  transition: all 0.2s;
  color: var(--border);
}
.bookmark-btn:hover { color: var(--gold); }
.bookmark-btn.active { color: var(--gold); }
.card-author {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-quote {
  font-size: 14px;
  color: var(--fg);
  line-height: 1.6;
  padding: 10px 12px;
  background: var(--accent-soft);
  border-radius: 6px;
  border-left: 3px solid var(--accent);
  font-style: italic;
  margin-top: 2px;
}
.card-quote.poetry-quote {
  font-style: normal;
  background: var(--jade-soft);
  border-left-color: var(--jade);
  font-family: var(--font-display);
}
.card-body {
  overflow: hidden;
  max-height: 200px;
  transition: max-height 0.3s ease, opacity 0.25s ease;
  opacity: 1;
}
.card.collapsed .card-body {
  max-height: 0;
  opacity: 0;
  margin: 0;
  padding: 0;
}
.card.collapsed .card-body .card-quote {
  display: none;
}
.card-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 2px;
  color: var(--border);
  transition: color 0.2s;
}
.card-toggle:hover { color: var(--accent); }
.card-toggle svg {
  width: 14px; height: 14px;
  transition: transform 0.3s ease;
}
.card.collapsed .card-toggle svg {
  transform: rotate(-90deg);
}
.collapse-all-btn {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--muted);
  margin-left: auto;
  transition: all 0.2s;
  white-space: nowrap;
}
.collapse-all-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(42,33,24,0.4);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.modal {
  background: var(--surface);
  border-radius: 14px;
  max-width: 640px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  padding: 32px;
  box-shadow: var(--shadow-lg);
  transform: translateY(12px);
  transition: transform 0.25s;
  position: relative;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-close {
  position: absolute;
  top: 16px; right: 16px;
  width: 32px; height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 18px;
  color: var(--muted);
  transition: all 0.2s;
}
.modal-close:hover { background: var(--bg); color: var(--fg); }
.modal-num { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.modal-title {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 6px;
}
.modal-author { font-size: 14px; color: var(--muted); margin-bottom: 16px; }
.modal-section-label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-bottom: 8px;
  margin-top: 20px;
}
.modal-quote {
  font-size: 16px;
  line-height: 1.7;
  padding: 16px;
  background: var(--accent-soft);
  border-radius: var(--radius);
  border-left: 3px solid var(--accent);
  font-style: italic;
}
.modal-quote.poetry-quote {
  font-style: normal;
  background: var(--jade-soft);
  border-left-color: var(--jade);
  font-family: var(--font-display);
  font-size: 17px;
}
.modal-tips {
  font-size: 15px;
  line-height: 1.7;
  color: var(--fg);
  padding: 14px 16px;
  background: var(--bg);
  border-radius: var(--radius);
}

/* ── Empty State ── */
.empty-state {
  text-align: center;
  padding: 64px 24px;
  color: var(--muted);
}
.empty-state-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
.empty-state-text { font-size: 15px; }

/* ── Badge ── */
.count-badge {
  font-size: 12px;
  font-weight: 400;
  opacity: 0.7;
  margin-left: 4px;
}

/* ── Responsive ── */
@media (max-width: 768px) {
  .header { padding: 32px 16px 24px; }
  .controls { padding-left: 16px; padding-right: 16px; }
  .grid-wrap { padding-left: 16px; padding-right: 16px; }
  .grid { grid-template-columns: 1fr; gap: 12px; }
  .card { padding: 16px; }
  .modal { padding: 24px; max-height: 90vh; }
  .modal-title { font-size: 22px; }
  .filter-row { gap: 6px; }
  .filter-chip { padding: 5px 10px; font-size: 12px; }
}

@media (max-width: 480px) {
  .header { padding: 24px 16px 20px; }
  .header-title { letter-spacing: 0.02em; }
  .tab-btn { padding: 10px 8px; font-size: 14px; }
  .grid { gap: 10px; }
  .card { padding: 14px; }
  .card-title { font-size: 16px; }
  .card-quote { font-size: 13px; padding: 8px 10px; }
}

@media (min-width: 1024px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* ── Print ── */
@media print {
  .controls, .modal-overlay, .bookmark-btn { display: none !important; }
  .header::before { display: none; }
  .card { break-inside: avoid; box-shadow: none; border: 1px solid #ddd; }
}

/* ── Enhanced Modal Sections ── */
.modal-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
  gap: 0;
}
.mtab {
  padding: 8px 16px;
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
}
.mtab:hover { color: var(--fg); }
.mtab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.mtab-content { display: none; }
.mtab-content.active { display: block; }

/* ── Pinyin toggle & ruby annotations ── */
.modal-header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
  padding-right: 28px;
}
.pinyin-toggle {
  font-size: 13px;
  padding: 4px 12px;
  border-radius: 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--muted);
  transition: all 0.25s ease;
  white-space: nowrap;
  letter-spacing: 0.05em;
  flex-shrink: 0;
}
.pinyin-toggle:hover { border-color: var(--jade); color: var(--jade); background: var(--jade-soft); }
.pinyin-toggle.on {
  background: var(--jade);
  color: #fff;
  border-color: var(--jade);
  box-shadow: 0 1px 4px rgba(61,122,95,0.25);
}
.original-text {
  font-family: var(--font-display);
  font-size: 17px;
  line-height: 2.4;
  transition: line-height 0.3s ease;
  color: var(--fg);
  padding: 16px 20px;
  background: var(--jade-soft);
  border-radius: var(--radius);
  white-space: pre-line;
}
.pinyin-show .original-text {
  line-height: 2.8;
}
.original-text.poetry-center {
  text-align: center;
}
.original-text ruby {
  ruby-align: center;
  ruby-overhang: auto;
}
.original-text rt {
  font-size: 10px;
  font-weight: 400;
  color: var(--jade);
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  opacity: 0;
  transform: translateY(2px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  letter-spacing: 0;
}
.pinyin-show .original-text rt {
  opacity: 0.7;
  transform: translateY(0);
}
.original-text rp { display: none; }
.trans-pair {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--border);
  align-items: flex-start;
}
.trans-pair:last-child { border-bottom: none; }
.trans-orig {
  flex: 1;
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--fg);
  min-width: 0;
}
.trans-mod {
  flex: 1.2;
  font-size: 14px;
  color: var(--muted);
  min-width: 0;
}
.notes-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.notes-table td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.notes-table td:first-child {
  font-weight: 600;
  color: var(--accent);
  white-space: nowrap;
  width: 80px;
}
.notes-table td:last-child { color: var(--fg); }
.analysis-text {
  font-size: 15px;
  line-height: 1.8;
  color: var(--fg);
  padding: 14px 16px;
  background: var(--bg);
  border-radius: var(--radius);
}
@media (max-width: 480px) {
  .modal { padding: 20px; }
  .modal-title { font-size: 20px; }
  .original-text { font-size: 15px; padding: 12px; }
  .trans-pair { flex-direction: column; gap: 4px; }
  .trans-orig { font-size: 13px; }
  .trans-mod { font-size: 13px; }
  .mtab { padding: 6px 10px; font-size: 13px; }
}

</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <h1 class="header-title">古诗文背诵大全</h1>
  <p class="header-sub">
    <span id="proseCount">34</span>篇文言文 · <span id="poetryCount">144</span>首古诗词
  </p>
</header>

<!-- Controls -->
<nav class="controls">
  <div class="tabs">
    <button class="tab-btn active" data-tab="prose">文言文<span class="count-badge">34</span></button>
    <button class="tab-btn" data-tab="poetry">古诗词<span class="count-badge">144</span></button>
  </div>
  <div class="filter-row" id="filterRow"></div>
  <div style="display:flex;justify-content:flex-end;margin-top:2px;">
    <button class="collapse-all-btn" id="collapseAllBtn">折叠全部</button>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search-input" type="text" id="searchInput" placeholder="搜索篇目、作者、名句…">
  </div>
</nav>

<!-- Grid -->
<main class="grid-wrap">
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-state-icon">📚</div>
    <p class="empty-state-text">没有找到匹配的篇目</p>
  </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="诗文详情">
    <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
// ── Pinyin Map (生僻字/多音字/通假字) ──

const proseContent={"01":{"o":"子曰：\"学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？\"\n\n曾子曰：\"吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？\"\n\n子曰：\"吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。\"\n\n子曰：\"温故而知新，可以为师矣。\"\n\n子曰：\"学而不思则罔，思而不学则殆。\"\n\n子曰：\"贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！\"\n\n子曰：\"知之者不如好之者，好之者不如乐之者。\"\n\n子曰：\"饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。\"\n\n子曰：\"三人行，必有我师焉。择其善者而从之，其不善者而改之。\"\n\n子在川上曰：\"逝者如斯夫，不舍昼夜。\"\n\n子曰：\"三军可夺帅也，匹夫不可夺志也。\"\n\n子夏曰：\"博学而笃志，切问而近思，仁在其中矣。\"","t":[{"o":"学而时习之，不亦说乎？","t":"学习知识并按时温习它，不也是很愉快吗？"},{"o":"有朋自远方来，不亦乐乎？","t":"有志同道合的朋友从远方来，不也是很快乐吗？"},{"o":"人不知而不愠，不亦君子乎？","t":"别人不了解自己，自己却不生气，不也是很有道德修养的君子吗？"},{"o":"吾日三省吾身：为人谋而不忠乎？","t":"我每天多次反省自己：替别人办事是不是尽心竭力了呢？"},{"o":"与朋友交而不信乎？","t":"和朋友交往是不是诚实守信呢？"},{"o":"传不习乎？","t":"老师传授的知识是不是复习了呢？"},{"o":"吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。","t":"我十五岁就有志于做学问，三十岁能独立做事，四十岁能不被外界事物迷惑，五十岁懂得了上天的意旨，六十岁能听得进不同意见，七十岁能顺从心愿做事，而不会超过规矩。"},{"o":"温故而知新，可以为师矣。","t":"温习旧知识从而得到新的理解和体会，就可以做老师了。"},{"o":"学而不思则罔，思而不学则殆。","t":"只学习不思考就会迷惑而无所得，只思考不学习就会疑惑而无所得（甚至危险）。"},{"o":"贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！","t":"贤德啊，颜回！一筐饭，一瓢水，住在简陋的小巷子里，别人都受不了那种贫苦的忧愁，颜回却依然不改变他的快乐。贤德啊，颜回！"},{"o":"知之者不如好之者，好之者不如乐之者。","t":"了解知识的人不如喜爱知识的人，喜爱知识的人不如以学习为乐的人。"},{"o":"饭疏食，饮水，曲肱而枕之，乐亦在其中矣。","t":"吃粗粮，喝冷水，弯着胳膊当枕头，乐趣也就在其中了。"},{"o":"不义而富且贵，于我如浮云。","t":"用不义的手段得到财富和地位，对我来说就像天上的浮云一样（不值一提）。"},{"o":"三人行，必有我师焉。择其善者而从之，其不善者而改之。","t":"几个人一起走路，其中一定有可以做我老师的人。选择他们的优点去学习，看到他们的缺点就反省自己加以改正。"},{"o":"逝者如斯夫，不舍昼夜。","t":"消逝的时光就像这河水一样啊，日日夜夜不停流逝。"},{"o":"三军可夺帅也，匹夫不可夺志也。","t":"三军的主帅可以被夺去，但一个普通人的志向是不能被强迫改变的。"},{"o":"博学而笃志，切问而近思，仁在其中矣。","t":"广泛地学习并且坚定志向，恳切地提问并且多思考当前的事，仁德就在其中了。"}],"n":[{"w":"子曰","m":"孔子说。子，对老师的尊称"},{"w":"时习","m":"按时温习。时，按时；习，温习、实习"},{"w":"说","m":"同\"悦\"，愉快、高兴"},{"w":"愠","m":"生气、恼怒"},{"w":"君子","m":"有道德修养的人"},{"w":"三省","m":"多次反省。三，泛指多次；省，反省"},{"w":"忠","m":"尽心竭力"},{"w":"信","m":"诚实守信"},{"w":"传","m":"老师传授的知识"},{"w":"十有五","m":"十五岁。有，同\"又\"，用于整数和零数之间"},{"w":"立","m":"站立，引申为独立做事、有所成就"},{"w":"不惑","m":"不被外界事物迷惑"},{"w":"天命","m":"上天的意旨，自然的规律"},{"w":"耳顺","m":"能听得进不同意见"},{"w":"从心所欲","m":"顺从心愿"},{"w":"逾","m":"超过、越过"},{"w":"矩","m":"规矩、法度"},{"w":"温故","m":"温习旧知识。故，旧的（知识）"},{"w":"罔","m":"迷惑，感到迷茫而无所适从"},{"w":"殆","m":"疑惑，（精神）疲倦无所得；一说危险"},{"w":"贤哉","m":"贤德啊。贤，有德行的"},{"w":"箪","m":"古代盛饭用的圆形竹器"},{"w":"堪","m":"忍受"},{"w":"好","m":"喜爱、爱好"},{"w":"饭疏食","m":"吃粗粮。饭，吃；疏食，粗粮"},{"w":"曲肱","m":"弯着胳膊。肱，胳膊"},{"w":"不义","m":"不合道义"},{"w":"行","m":"走路、同行"},{"w":"逝者","m":"消逝的时光"},{"w":"斯","m":"这，指河水"},{"w":"舍","m":"同\"止\"，停息、停止"},{"w":"三军","m":"泛指军队。古代一万二千五百人为一军"},{"w":"匹夫","m":"普通人、平民百姓"},{"w":"笃志","m":"坚定志向。笃，坚定"},{"w":"切问","m":"恳切地提问"},{"w":"近思","m":"联系当前实际来思考"}],"a":"这十二章《论语》主要围绕两个方面展开：一是**学习方法**，强调学思结合（\"学而不思则罔，思而不学则殆\"）、温故知新（\"温故而知新\"）、以学为乐（\"知之者不如好之者\"）；二是**修身做人**，倡导自我反省（\"吾日三省吾身\"）、坚守志向（\"匹夫不可夺志\"）、安贫乐道（\"一箪食，一瓢饮，不改其乐\"）。全篇集中体现了孔子对学习和品德的重视，对后世影响深远。"},"02":{"o":"夫君子之行，静以修身，俭以养德。非淡泊无以明志，非宁静无以致远。夫学须静也，才须学也，非学无以广才，非志无以成学。淫慢则不能励精，险躁则不能治性。年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！","t":[{"o":"夫君子之行，静以修身，俭以养德。","t":"品德高尚的人的操行，以静心来修养身心，以俭朴来培养品德。"},{"o":"非淡泊无以明志，非宁静无以致远。","t":"不恬静寡欲就无法明确志向，不宁静专一就无法达到远大的目标。"},{"o":"夫学须静也，才须学也，非学无以广才，非志无以成学。","t":"学习必须专心致志，增长才干必须勤奋学习。不学习无法扩充才干，没有志向无法学有所成。"},{"o":"淫慢则不能励精，险躁则不能治性。","t":"过度享乐和怠惰散漫就不能勉励心志使精神振作，冒险急躁就不能修养性情。"},{"o":"年与时驰，意与日去，","t":"年华随同时光迅速消逝，意志随同岁月一天天消磨，"},{"o":"遂成枯落，多不接世，悲守穷庐，将复何及！","t":"最终像枯枝落叶般衰老凋零，对社会没有任何贡献，悲伤地守着贫穷的破屋，到那时再后悔又怎么来得及呢！"}],"n":[{"w":"夫","m":"发语词，用于句首，引起下文的议论，无实在意义"},{"w":"君子","m":"品德高尚的人"},{"w":"行","m":"操行、品行"},{"w":"静","m":"安静、宁静，指内心专一、不受干扰"},{"w":"修身","m":"修养身心"},{"w":"俭","m":"节俭、俭朴"},{"w":"养德","m":"培养品德"},{"w":"淡泊","m":"恬静寡欲，不追求名利"},{"w":"明志","m":"明确志向"},{"w":"宁静","m":"安宁平静，内心专一"},{"w":"致远","m":"达到远大的目标"},{"w":"广才","m":"扩充才干。广，使……广，增长"},{"w":"淫慢","m":"过度享乐、怠惰散漫。淫，过度；慢，怠惰"},{"w":"励精","m":"勉励心志，使精神振作。励，振奋"},{"w":"险躁","m":"冒险急躁、浮躁不安"},{"w":"治性","m":"修养性情。治，修治"},{"w":"年与时驰","m":"年华随同时光一同飞逝。驰，疾行、飞逝"},{"w":"意与日去","m":"意志随同时间一同消磨。去，消逝"},{"w":"枯落","m":"像枯枝落叶一样凋零"},{"w":"接世","m":"接触社会，对社会有所贡献"},{"w":"穷庐","m":"贫穷简陋的房屋"},{"w":"何及","m":"怎么来得及。及，来得及"}],"a":"这是诸葛亮写给儿子诸葛瞻的一封家书。全篇围绕\"静\"和\"俭\"两个字，告诫儿子要**修身养德、勤学立志**。文章从正反两面说理：正面强调\"淡泊明志、宁静致远\"，反面警示\"淫慢\"\"险躁\"的危害。最后以时光易逝、年华不待作结，语重心长地劝勉儿子珍惜光阴、及早努力。全文不足百字，却字字珠玑，是古代家训中的名篇。"},"03":{"o":"宋之丁氏，家无井而出溉汲，常一人居外。及其家穿井，告人曰：\"吾穿井得一人。\"有闻而传之者曰：\"丁氏穿井得一人。\"国人道之，闻之于宋君。宋君令人问之于丁氏，丁氏对曰：\"得一人之使，非得一人于井中也。\"求闻之若此，不若无闻也。","t":[{"o":"宋之丁氏，家无井而出溉汲，常一人居外。","t":"宋国有一户姓丁的人家，家里没有井，需要到外面去打水浇地，经常要派一个人在外面专管打水。"},{"o":"及其家穿井，告人曰：\"吾穿井得一人。\"","t":"等到他家挖了一口井，告诉别人说：\"我家挖了一口井，等于多得了一个人（的劳力）。\""},{"o":"有闻而传之者曰：\"丁氏穿井得一人。\"","t":"有人听到这话便传扬开来说：\"丁家挖井挖出了一个人。\""},{"o":"国人道之，闻之于宋君。","t":"国都里的人都在谈论这件事，一直传到了宋国国君的耳朵里。"},{"o":"宋君令人问之于丁氏，丁氏对曰：\"得一人之使，非得一人于井中也。\"","t":"宋国国君派人向丁家询问这件事，丁氏回答说：\"（我是说）多得到了一个人的劳力，并不是从井中挖出了一个人啊。\""},{"o":"求闻之若此，不若无闻也。","t":"像这样道听途说，还不如什么都没听到。"}],"n":[{"w":"溉汲","m":"打水浇田。溉，浇灌；汲，从井里打水"},{"w":"穿井","m":"挖井、凿井。穿，挖掘、开凿"},{"w":"居外","m":"住在外面，指在外面（打水）"},{"w":"及","m":"等到"},{"w":"得一人","m":"得到一个人的劳力"},{"w":"闻","m":"听到。此处\"闻之于宋君\"意为被宋君听到"},{"w":"国人","m":"指居住在国都里的人"},{"w":"道之","m":"谈论这件事。道，说、谈论"},{"w":"令人","m":"派人"},{"w":"问之于丁氏","m":"向丁氏询问这件事"},{"w":"对","m":"回答"},{"w":"使","m":"劳役、劳动力"},{"w":"若此","m":"像这样"},{"w":"求","m":"寻求、追求"},{"w":"不若","m":"不如"}],"a":"本文讲述了一个因传言而歪曲事实的故事：丁家挖井后节省了一个劳动力，却被以讹传讹成\"挖井挖出一个人\"。文章通过这个寓言告诉我们：**传言不可轻信，凡事应当亲自调查核实**。正所谓\"耳听为虚，眼见为实\"，对于听到的消息要经过审慎的思考和求证，不可盲目传播。同时也讽刺了那些不辨真伪、以讹传讹的人。"},"04":{"o":"杞国有人忧天地崩坠，身亡所寄，废寝食者。又有忧彼之所忧者，因往晓之，曰：\"天，积气耳，亡处亡气。若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？\"其人曰：\"天果积气，日月星宿，不当坠耶？\"晓之者曰：\"日月星宿，亦积气中之有光耀者，只使坠，亦不能有所中伤。\"其人曰：\"奈地坏乎？\"晓之者曰：\"地，积块耳，充塞四虚，亡处亡块。若躇步跐蹈，终日在地上行止，奈何忧其坏？\"其人舍然大喜，晓之者亦舍然大喜。","t":[{"o":"杞国有人忧天地崩坠，身亡所寄，废寝食者。","t":"杞国有一个人担忧天会塌下来、地会陷下去，自己的身体无处依附，以至于睡不好觉、吃不下饭。"},{"o":"又有忧彼之所忧者，因往晓之，曰：","t":"又有一个人为他的担忧而担忧，于是前去开导他，说："},{"o":"\"天，积气耳，亡处亡气。若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？\"","t":"\"天，不过是聚集在一起的气体罢了，没有哪个地方没有气。你弯腰伸展、呼气吸气，整天都在天（气）中活动休息，为什么要担忧天会塌下来呢？\""},{"o":"其人曰：\"天果积气，日月星宿，不当坠耶？\"","t":"那人说：\"天如果真的是聚集的气体，那日、月、星星，不就会掉下来了吗？\""},{"o":"晓之者曰：\"日月星宿，亦积气中之有光耀者，只使坠，亦不能有所中伤。\"","t":"开导他的人说：\"日、月、星星，也是聚集的气体中有光耀的东西，即使掉下来，也不会击中打伤人。\""},{"o":"其人曰：\"奈地坏乎？\"","t":"那人说：\"地要是陷下去怎么办呢？\""},{"o":"晓之者曰：\"地，积块耳，充塞四虚，亡处亡块。若躇步跐蹈，终日在地上行止，奈何忧其坏？\"","t":"开导他的人说：\"地，不过是聚集在一起的土块罢了，填满了四方空虚之处，没有哪个地方没有土块。你踩踏行走，整天都在地上活动休息，为什么要担忧地会陷下去呢？\""},{"o":"其人舍然大喜，晓之者亦舍然大喜。","t":"那人释然了，非常高兴；开导他的人也释然了，非常高兴。"}],"n":[{"w":"杞国","m":"周代诸侯国名，在今河南杞县一带"},{"w":"崩坠","m":"塌下来、陷下去。崩，倒塌；坠，落下"},{"w":"亡","m":"同\"无\"，没有。\"身亡所寄\"即\"身体无处依附\""},{"w":"所寄","m":"依附的地方"},{"w":"废寝食","m":"顾不上睡觉吃饭。废，放弃、荒废"},{"w":"忧彼之所忧者","m":"为他的担忧而担忧的人"},{"w":"晓","m":"开导、告知，使人明白"},{"w":"积气","m":"聚集的气体"},{"w":"亡处亡气","m":"没有一个地方没有气。两个\"亡\"都同\"无\""},{"w":"若","m":"你"},{"w":"屈伸","m":"弯曲和伸展，指身体的活动"},{"w":"行止","m":"行走和停留"},{"w":"奈何","m":"为什么、怎么"},{"w":"果","m":"果真、确实"},{"w":"星宿","m":"星星的统称"},{"w":"只使","m":"即使、纵使"},{"w":"中伤","m":"击中打伤。中（zhòng），击中"},{"w":"积块","m":"聚集的土块"},{"w":"充塞四虚","m":"填满了四方空虚之处。四虚，四方空虚之处"},{"w":"躇步跐蹈","m":"泛指踩踏行走。躇（chú），踩；步，走；跐（cǐ），踏；蹈（dǎo），顿足"},{"w":"舍然","m":"释然，消除了疑虑的样子。舍，同\"释\"，解除"}],"a":"本文通过杞人无端担忧天地崩坠的故事，讽刺了那些**为不必要的事情而忧虑的人**。杞人的忧虑毫无根据——天不过是积气，地不过是积块，根本不存在崩塌的危险。文章告诉我们：不要为不切实际、毫无根据的事情而担忧烦恼，应当把精力放在切实有用的事情上。这则寓言后来演变为成语\"**杞人忧天**\"，用来比喻不必要的忧虑和担心。"},"05":{"o":"伯牙鼓琴，锺子期听之。方鼓琴而志在太山，锺子期曰：\"善哉乎鼓琴，巍巍乎若太山。\"少选之间而志在流水，锺子期又曰：\"善哉乎鼓琴，汤汤乎若流水。\"锺子期死，伯牙破琴绝弦，终身不复鼓琴，以为世无足复为鼓琴者。","t":[{"o":"伯牙鼓琴，锺子期听之。","t":"伯牙弹琴，锺子期听他弹琴。"},{"o":"方鼓琴而志在太山，锺子期曰：\"善哉乎鼓琴，巍巍乎若太山。\"","t":"正当他弹琴时心里想到巍峨的泰山，锺子期说：\"弹琴弹得真好啊，像巍峨的泰山一样高大！\""},{"o":"少选之间而志在流水，锺子期又曰：\"善哉乎鼓琴，汤汤乎若流水。\"","t":"过了一会儿，伯牙心里又想到了浩荡的流水，锺子期又说：\"弹琴弹得真好啊，像浩荡的流水一样奔涌！\""},{"o":"锺子期死，伯牙破琴绝弦，终身不复鼓琴，以为世无足复为鼓琴者。","t":"锺子期死后，伯牙摔破了琴，扯断了弦，终身不再弹琴，认为世上再也没有值得为之弹琴的人了。"}],"n":[{"w":"鼓琴","m":"弹琴。鼓，弹奏"},{"w":"方","m":"正当……的时候"},{"w":"志","m":"心志、心意，指心里想到"},{"w":"太山","m":"即泰山，山名，在今山东省"},{"w":"善哉","m":"好啊。善，好；哉，表示感叹的语气词"},{"w":"巍巍","m":"高大的样子"},{"w":"少选","m":"形容时间很短，一会儿"},{"w":"汤汤","m":"水流浩荡的样子。汤汤（shāng shāng）"},{"w":"绝弦","m":"弄断琴弦。绝，断"},{"w":"复","m":"再、又"},{"w":"无足","m":"不值得。足，值得"},{"w":"破琴","m":"摔破琴。破，打破"}],"a":"本文讲述了伯牙与锺子期之间动人的**知音故事**。锺子期能从伯牙的琴声中准确领悟到\"高山\"与\"流水\"的心意，二人互为知音、心意相通。锺子期死后，伯牙\"破琴绝弦\"，终身不再弹琴，因为世间再无人能真正听懂他的心声。这个故事告诉我们：**知音难觅，真正理解自己的人极其珍贵**。\n\n本文也是成语\"**高山流水**\"和\"**知音**\"的出处。\"高山流水\"比喻知音或高妙的音乐，\"知音\"指真正了解自己心意的人。"},"06":{"o":"陈康肃公善射，当世无双，公亦以此自矜。尝射于家圃，有卖油翁释担而立，睨之久而不去。见其发矢十中八九，但微颔之。康肃问曰：\"汝亦知射乎？吾射不亦精乎？\"翁曰：\"无他，但手熟尔。\"康肃忿然曰：\"尔安敢轻吾射！\"翁曰：\"以我酌油知之。\"乃取一葫芦置于地，以钱覆其口，徐以杓酌油沥之，自钱孔入，而钱不湿。因曰：\"我亦无他，惟手熟尔。\"康肃笑而遣之。","t":[{"o":"陈康肃公善射，当世无双，公亦以此自矜。","t":"陈康肃公（陈尧咨）擅长射箭，当世没有人能比得上，他也因此自己夸耀自己。"},{"o":"尝射于家圃，有卖油翁释担而立，睨之久而不去。","t":"他曾经在自家的菜园里射箭，有一个卖油的老翁放下担子站在那里，斜着眼看了很久都没有离开。"},{"o":"见其发矢十中八九，但微颔之。","t":"看到他射出的箭十支能中八九支，只是微微地点了点头。"},{"o":"康肃问曰：\"汝亦知射乎？吾射不亦精乎？\"","t":"康肃公问道：\"你也懂得射箭吗？我射箭的技术难道不精湛吗？\""},{"o":"翁曰：\"无他，但手熟尔。\"","t":"老翁说：\"没有别的奥妙，只是手法熟练罢了。\""},{"o":"康肃忿然曰：\"尔安敢轻吾射！\"","t":"康肃公气愤地说：\"你怎么敢轻视我射箭的技术！\""},{"o":"翁曰：\"以我酌油知之。\"","t":"老翁说：\"凭我倒油的经验知道这个道理。\""},{"o":"乃取一葫芦置于地，以钱覆其口，徐以杓酌油沥之，自钱孔入，而钱不湿。","t":"于是拿出一个葫芦放在地上，用一枚铜钱盖在葫芦口上，慢慢地用勺子舀油注入葫芦，油从钱孔注入，而铜钱却没有沾湿。"},{"o":"因曰：\"我亦无他，惟手熟尔。\"","t":"接着说道：\"我也没有什么别的奥妙，只是手法熟练罢了。\""},{"o":"康肃笑而遣之。","t":"康肃公笑着把他打发走了（笑着让他走了）。"}],"n":[{"w":"陈康肃公","m":"即陈尧咨，谥号\"康肃\"。公，尊称"},{"w":"善射","m":"擅长射箭"},{"w":"自矜","m":"自夸、自傲。矜，夸耀"},{"w":"尝","m":"曾经"},{"w":"圃","m":"菜园，此处指家里的场地"},{"w":"释担","m":"放下担子。释，放下"},{"w":"睨","m":"斜着眼看，形容不在意的样子"},{"w":"去","m":"离开"},{"w":"发矢","m":"射出箭。矢，箭"},{"w":"中","m":"射中（zhòng）"},{"w":"颔","m":"下巴，此处作动词，点头"},{"w":"无他","m":"没有别的（奥妙）"},{"w":"但","m":"只是"},{"w":"手熟尔","m":"手法熟练罢了。尔，同\"耳\"，罢了"},{"w":"忿然","m":"气愤的样子"},{"w":"尔","m":"你"},{"w":"安","m":"怎么、哪里"},{"w":"轻","m":"轻视、看不起"},{"w":"酌油","m":"舀油、倒油"},{"w":"乃","m":"于是"},{"w":"葫芦","m":"一种盛器"},{"w":"覆","m":"盖"},{"w":"徐","m":"慢慢地"},{"w":"杓","m":"同\"勺\"，勺子"},{"w":"沥","m":"注入、淋下"},{"w":"因","m":"于是、接着"},{"w":"惟","m":"只、只是"},{"w":"遣","m":"打发、让……走"}],"a":"本文通过卖油翁沥油过钱孔而不湿铜钱的绝技，说明了一个朴素而深刻的道理：**熟能生巧**。陈尧咨善射而自矜，卖油翁以其酌油的经验告诉他，一切高超的技艺都不过是长期反复练习的结果，没有什么值得骄傲的。文章告诉我们：即使有了一技之长，也**不可骄傲自满**，要保持谦虚的态度，因为任何技艺都是勤学苦练的结果。"},"07":{"o":"初，权谓吕蒙曰：\"卿今当涂掌事，不可不学！\"蒙辞以军中多务。权曰：\"孤岂欲卿治经为博士邪！但当涉猎，见往事耳。卿言多务，孰若孤？孤常读书，自以为大有所益。\"蒙乃始就学。及鲁肃过寻阳，与蒙论议，大惊曰：\"卿今者才略，非复吴下阿蒙！\"蒙曰：\"士别三日，即更刮目相待，大兄何见事之晚乎！\"肃遂拜蒙母，结友而别。","t":[{"o":"初，权谓吕蒙曰：\"卿今当涂掌事，不可不学！\"","t":"当初，孙权对吕蒙说：\"你现在当权管事了，不可以不学习！\""},{"o":"蒙辞以军中多务。","t":"吕蒙以军中事务繁多来推辞。"},{"o":"权曰：\"孤岂欲卿治经为博士邪！但当涉猎，见往事耳。\"","t":"孙权说：\"我难道想要你钻研经书当博士吗！只是应当粗略地阅读，了解历史罢了。\""},{"o":"\"卿言多务，孰若孤？孤常读书，自以为大有所益。\"","t":"\"你说事务多，谁比得上我事务多呢？我经常读书，自己认为大有好处。\""},{"o":"蒙乃始就学。","t":"吕蒙于是开始学习。"},{"o":"及鲁肃过寻阳，与蒙论议，大惊曰：\"卿今者才略，非复吴下阿蒙！\"","t":"等到鲁肃经过寻阳的时候，和吕蒙讨论议事，十分惊奇地说：\"你现在的才干和谋略，不再是当年那个吴县的阿蒙了！\""},{"o":"蒙曰：\"士别三日，即更刮目相待，大兄何见事之晚乎！\"","t":"吕蒙说：\"读书人分别三天，就要用新的眼光看待，老兄怎么认清事物这么晚呢！\""},{"o":"肃遂拜蒙母，结友而别。","t":"鲁肃于是拜见了吕蒙的母亲，与吕蒙结为朋友后才分别。"}],"n":[{"w":"初","m":"当初，起初"},{"w":"权","m":"孙权，三国时吴国的建立者"},{"w":"吕蒙","m":"字子明，三国时吴国名将"},{"w":"卿","m":"古代君对臣的亲昵称呼，相当于\"你\""},{"w":"当涂","m":"当道、当权。涂，同道"},{"w":"掌事","m":"掌管事务"},{"w":"辞","m":"推辞"},{"w":"以","m":"用、拿"},{"w":"务","m":"事务"},{"w":"孤","m":"古代王侯的自称"},{"w":"岂","m":"难道，表反问"},{"w":"治经","m":"研究经书。治，研究。经，指《易》《诗》《书》《礼》《春秋》等儒家经典"},{"w":"博士","m":"古代学官名，专掌经学传授"},{"w":"邪","m":"同\"耶\"，语气词，表疑问或反问"},{"w":"涉猎","m":"粗略地阅读"},{"w":"见往事","m":"了解历史。见，了解；往事，历史"},{"w":"孰若","m":"谁比得上，怎么比得上。孰，谁、哪个"},{"w":"就学","m":"开始学习。就，从事、开始"},{"w":"及","m":"到了……的时候"},{"w":"过","m":"经过"},{"w":"寻阳","m":"地名，今湖北黄梅一带"},{"w":"论议","m":"讨论议事"},{"w":"才略","m":"才干和谋略"},{"w":"非复","m":"不再是"},{"w":"吴下","m":"指吴县（今江苏苏州一带）"},{"w":"阿蒙","m":"对吕蒙的昵称，含有小子的意思"},{"w":"士","m":"读书人，此处指有志气的人"},{"w":"更","m":"重新"},{"w":"刮目相待","m":"另眼相看，用新的眼光看待。刮目，擦拭眼睛"},{"w":"见事","m":"认清事物"},{"w":"拜","m":"拜见"},{"w":"结友","m":"结交为朋友"}],"a":"本文讲述了孙权劝勉吕蒙读书学习的故事。吕蒙最初以军务繁忙为由推辞，但在孙权的现身说法和开导下开始读书，最终学识大增，令鲁肃刮目相看。文章说明了两个道理：一是**开卷有益**，读书学习能使人获得进步和提升；二是**学习能改变一个人**，只要肯学，就能脱胎换骨。孙权的善劝和吕蒙的善学都值得学习。"},"08":{"o":"山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？","t":[{"o":"山不在高，有仙则名。","t":"山不在于有多高，有了仙人居住就会出名。"},{"o":"水不在深，有龙则灵。","t":"水不在于有多深，有了蛟龙居住就会显出灵异。"},{"o":"斯是陋室，惟吾德馨。","t":"这是简陋的屋子，只是我的品德好（就不感到简陋了）。"},{"o":"苔痕上阶绿，草色入帘青。","t":"苔痕蔓延到台阶上，一片碧绿；草色映入竹帘里，满目青翠。"},{"o":"谈笑有鸿儒，往来无白丁。","t":"在一起谈笑的都是渊博的学者，往来的没有平庸浅薄的人。"},{"o":"可以调素琴，阅金经。","t":"可以弹奏朴素的古琴，阅读佛经。"},{"o":"无丝竹之乱耳，无案牍之劳形。","t":"没有嘈杂的音乐扰乱耳朵，没有官府的公文使身体劳累。"},{"o":"南阳诸葛庐，西蜀子云亭。","t":"南阳有诸葛亮的草庐，西蜀有扬子云的亭子。"},{"o":"孔子云：何陋之有？","t":"孔子说：\"有什么简陋的呢？\""}],"n":[{"w":"名","m":"出名，有名（名词作动词）"},{"w":"灵","m":"显出灵异（名词作动词）"},{"w":"斯","m":"这，指示代词"},{"w":"馨","m":"散发香气，这里指品德高尚"},{"w":"鸿儒","m":"博学的人。鸿，大；儒，读书人"},{"w":"白丁","m":"平民，这里指没有学问的人"},{"w":"素琴","m":"不加装饰的琴"},{"w":"金经","m":"指佛经（佛经用泥金书写）"},{"w":"丝竹","m":"琴瑟、箫管等乐器的总称，这里指奏乐的声音"},{"w":"案牍","m":"官府的公文"},{"w":"劳","m":"使……劳累（使动用法）"},{"w":"庐","m":"简陋的小屋"},{"w":"何陋之有","m":"宾语前置，即\"有何陋之\"，有什么简陋的呢"}],"a":"本文托物言志，通过对陋室环境、交往人物和生活情趣的描写，表达了作者安贫乐道、高洁傲岸的情操。文章以\"惟吾德馨\"为核心，说明居处虽然简陋，但因主人品德高尚而不觉其陋，体现了不慕荣利、淡泊名利的人生态度。"},"09":{"o":"水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣！","t":[{"o":"水陆草木之花，可爱者甚蕃。","t":"水上、陆地上各种草本木本的花，值得喜爱的有很多。"},{"o":"晋陶渊明独爱菊。","t":"晋代的陶渊明唯独喜爱菊花。"},{"o":"自李唐来，世人甚爱牡丹。","t":"从唐代以来，世上的人们非常喜爱牡丹。"},{"o":"予独爱莲之出淤泥而不染，濯清涟而不妖，","t":"我唯独喜爱莲花，喜爱它从淤泥中长出来却不沾染污秽，在清水里洗涤过却不显得妖媚。"},{"o":"中通外直，不蔓不枝，","t":"它的茎中间贯通，外表笔直，不生枝蔓，不长旁枝。"},{"o":"香远益清，亭亭净植，","t":"香气传播得越远越清幽，笔直洁净地立在那里。"},{"o":"可远观而不可亵玩焉。","t":"可以在远处观赏，却不能靠近去轻慢地玩弄它。"},{"o":"予谓菊，花之隐逸者也；","t":"我认为菊花，是花中的隐士。"},{"o":"牡丹，花之富贵者也；","t":"牡丹，是花中的富贵者。"},{"o":"莲，花之君子者也。","t":"莲花，是花中的君子。"},{"o":"噫！菊之爱，陶后鲜有闻。","t":"唉！对于菊花的喜爱，在陶渊明以后很少听到了。"},{"o":"莲之爱，同予者何人？","t":"对于莲花的喜爱，和我一样的还有谁呢？"},{"o":"牡丹之爱，宜乎众矣！","t":"对于牡丹的喜爱，当然人很多了！"}],"n":[{"w":"蕃","m":"多"},{"w":"独","m":"唯独，只"},{"w":"淤泥","m":"河沟或池塘里积存的污泥"},{"w":"染","m":"沾染（污秽）"},{"w":"濯","m":"洗涤"},{"w":"清涟","m":"水清而有微波的样子，这里指清水"},{"w":"妖","m":"美丽而不正派，妖媚"},{"w":"中通外直","m":"莲茎中间贯通，外形笔直"},{"w":"不蔓不枝","m":"不生枝蔓，不长旁枝（名词作动词）"},{"w":"亭亭","m":"耸立的样子"},{"w":"植","m":"竖立"},{"w":"亵玩","m":"轻慢地玩弄。亵，亲近而不庄重"},{"w":"隐逸","m":"隐居避世"},{"w":"噫","m":"叹词，相当于\"唉\""},{"w":"鲜","m":"少"},{"w":"宜乎","m":"当然，自然"}],"a":"本文托物言志，以莲花\"出淤泥而不染\"的高洁品质来比喻君子不与世俗同流合污的品格。通过菊、牡丹、莲三种花的对比，暗喻隐逸者、富贵者和君子三种人生态度，表达了作者不慕名利、洁身自好的生活追求，以及对追名逐利世风的批判。"},"10":{"o":"一屠晚归，担中肉尽，止有剩骨。途中两狼，缀行甚远。屠惧，投以骨。一狼得骨止，一狼仍从。复投之，后狼止而前狼又至。骨已尽矣，而两狼之并驱如故。屠大窘，恐前后受其敌。顾野有麦场，场主积薪其中，苫蔽成丘。屠乃奔倚其下，弛担持刀。狼不敢前，眈眈相向。少时，一狼径去，其一犬坐于前。久之，目似瞑，意暇甚。屠暴起，以刀劈狼首，又数刀毙之。方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。身已半入，止露尻尾。屠自后断其股，亦毙之。乃悟前狼假寐，盖以诱敌。狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。","t":[{"o":"一屠晚归，担中肉尽，止有剩骨。","t":"一个屠户傍晚回家，担子里的肉已经卖完了，只剩下一些骨头。"},{"o":"途中两狼，缀行甚远。","t":"路上遇到两只狼，紧跟着走了很远。"},{"o":"屠惧，投以骨。","t":"屠户害怕了，把骨头投给狼。"},{"o":"一狼得骨止，一狼仍从。","t":"一只狼得到骨头停下了，另一只狼仍然跟从着。"},{"o":"复投之，后狼止而前狼又至。","t":"屠户再次扔骨头，后一只狼停下了，可是前一只狼又追上来了。"},{"o":"骨已尽矣，而两狼之并驱如故。","t":"骨头已经扔完了，但两只狼像原来一样一起追赶。"},{"o":"屠大窘，恐前后受其敌。","t":"屠户非常窘迫，害怕前后受到狼的夹击。"},{"o":"顾野有麦场，场主积薪其中，苫蔽成丘。","t":"他看到野地里有一个打麦场，场主人把柴草堆积在当中，覆盖成小山似的。"},{"o":"屠乃奔倚其下，弛担持刀。","t":"屠户于是跑过去倚靠在柴草堆下面，放下担子拿起刀。"},{"o":"狼不敢前，眈眈相向。","t":"狼不敢上前，瞪眼朝着屠户。"},{"o":"少时，一狼径去，其一犬坐于前。","t":"过了一会儿，一只狼径直离开了，另一只狼像狗一样蹲坐在前面。"},{"o":"久之，目似瞑，意暇甚。","t":"时间长了，那只狼的眼睛好像闭上了，神情悠闲得很。"},{"o":"屠暴起，以刀劈狼首，又数刀毙之。","t":"屠户突然跳起来，用刀劈狼的脑袋，又连砍几刀把它杀死了。"},{"o":"方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。","t":"屠户刚想走，转身看柴草堆后面，另一只狼正在柴草堆里打洞，打算从通道进入来攻击屠户的后面。"},{"o":"身已半入，止露尻尾。","t":"狼的身子已经钻进一半，只露出屁股和尾巴。"},{"o":"屠自后断其股，亦毙之。","t":"屠户从后面砍断了狼的大腿，也把它杀死了。"},{"o":"乃悟前狼假寐，盖以诱敌。","t":"屠户这才明白前面的那只狼假装睡觉，原来是用这个办法来诱惑对手。"},{"o":"狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。","t":"狼也算狡猾了，可是转眼间两只狼都被杀死了，禽兽的诡诈手段能有多少呢？只是给人增加笑料罢了。"}],"n":[{"w":"屠","m":"屠户，宰杀牲畜的人"},{"w":"缀","m":"紧跟，连接，这里是\"紧跟\"的意思"},{"w":"窘","m":"困窘急迫"},{"w":"敌","m":"敌对，这里是\"攻击\"的意思"},{"w":"顾","m":"回头看，看见"},{"w":"积薪","m":"堆积的柴草"},{"w":"苫蔽","m":"覆盖、遮蔽"},{"w":"弛","m":"放松，这里指放下"},{"w":"眈眈","m":"注视的样子"},{"w":"少时","m":"一会儿"},{"w":"犬坐","m":"像狗一样蹲坐（名词作状语）"},{"w":"瞑","m":"闭眼"},{"w":"暇","m":"空闲，悠闲"},{"w":"暴","m":"突然"},{"w":"洞","m":"打洞（名词作动词）"},{"w":"隧","m":"从通道过去（名词作动词）"},{"w":"尻","m":"屁股"},{"w":"股","m":"大腿"},{"w":"假寐","m":"假装睡觉"},{"w":"盖","m":"原来是"},{"w":"黠","m":"狡猾"},{"w":"变诈","m":"作假、欺骗"},{"w":"几何","m":"多少"},{"w":"耳","m":"罢了，语气助词"}],"a":"本文通过屠户智杀两狼的故事，说明狼再狡猾也斗不过人，任何邪恶势力终将被勇敢和智慧所战胜。文章告诫人们面对恶势力要敢于斗争、善于斗争，不能心存幻想。同时也讽刺了那些耍弄诡计的坏人，最终只会自取灭亡，徒增笑柄。"},"11":{"o":"元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。庭下如积水空明，水中藻、荇交横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。","t":[{"o":"元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。","t":"元丰六年十月十二日夜晚，我脱了衣服打算睡觉，这时月光照进门里，我高兴地起来走到户外。"},{"o":"念无与为乐者，遂至承天寺寻张怀民。","t":"想到没有可以一起游乐的人，于是到承天寺去找张怀民。"},{"o":"怀民亦未寝，相与步于中庭。","t":"怀民也没有睡觉，我们一起在庭院中散步。"},{"o":"庭下如积水空明，水中藻、荇交横，盖竹柏影也。","t":"庭院中的月光宛如一泓积水一样清澈透明，水中的水草纵横交错，原来是竹子和柏树的影子。"},{"o":"何夜无月？何处无竹柏？","t":"哪一夜没有月光？哪里没有竹子和柏树呢？"},{"o":"但少闲人如吾两人者耳。","t":"只是缺少像我们两个这样清闲的人罢了。"}],"n":[{"w":"元丰六年","m":"公元1083年。元丰，宋神宗年号"},{"w":"户","m":"门"},{"w":"欣然","m":"高兴、愉快的样子"},{"w":"念","m":"考虑，想到"},{"w":"遂","m":"于是，就"},{"w":"寝","m":"睡觉"},{"w":"相与","m":"共同，一起"},{"w":"中庭","m":"院子里"},{"w":"空明","m":"清澈透明"},{"w":"藻、荇","m":"均为水草名"},{"w":"盖","m":"原来是"},{"w":"但","m":"只是"},{"w":"闲人","m":"清闲的人，这里兼有自嘲与旷达之意"},{"w":"耳","m":"罢了"}],"a":"本文通过对月夜美景的描写，表达了苏轼被贬黄州后豁达乐观的人生态度。以\"闲人\"自居，既有赏月的悠闲自得，也含有一丝被贬谪后无法报国的淡淡失意与感慨。文章语言简洁，意境优美，将月色、竹影描绘得如诗如画，体现了作者超然物外的心境。"},"12":{"o":"山川之美，古来共谈。高峰入云，清流见底。两岸石壁，五色交辉。青林翠竹，四时俱备。晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。实是欲界之仙都。自康乐以来，未复有能与奇者。","t":[{"o":"山川之美，古来共谈。","t":"山川景色的美丽，自古以来就是人们共同谈论的话题。"},{"o":"高峰入云，清流见底。","t":"巍峨的高山直插云霄，清澈的溪流能看见水底。"},{"o":"两岸石壁，五色交辉。","t":"两岸的石壁色彩斑斓，交相辉映。"},{"o":"青林翠竹，四时俱备。","t":"青翠的树林和竹丛，四季都有。"},{"o":"晓雾将歇，猿鸟乱鸣；","t":"清晨的薄雾将要消散的时候，猿猴和鸟儿此起彼伏地鸣叫。"},{"o":"夕日欲颓，沉鳞竞跃。","t":"傍晚夕阳快要落山的时候，潜游在水中的鱼儿争相跳出水面。"},{"o":"实是欲界之仙都。","t":"这里实在是人间的仙境啊。"},{"o":"自康乐以来，未复有能与奇者。","t":"自从谢灵运之后，就再也没有能欣赏这种奇景的人了。"}],"n":[{"w":"答谢中书书","m":"回复谢中书的信。\"书\"指书信。谢中书，即谢征，曾任中书鸿胪"},{"w":"五色交辉","m":"这里形容石壁色彩斑斓，交相辉映"},{"w":"四时","m":"四季"},{"w":"歇","m":"消散"},{"w":"颓","m":"坠落，这里指太阳落山"},{"w":"沉鳞","m":"潜游在水中的鱼。鳞，代指鱼"},{"w":"欲界","m":"佛教语，三界之一，这里指人间"},{"w":"仙都","m":"神仙居住的美好世界"},{"w":"康乐","m":"指谢灵运，他袭封康乐公"},{"w":"与","m":"参与，这里指欣赏"},{"w":"奇","m":"奇妙的景色"}],"a":"本文以凝练的笔触描绘了山川自然之美，通过高峰、清流、石壁、林竹、晨雾、猿鸟、夕阳、鱼跃等意象，勾勒出一幅如仙境般的山水画卷。文章表达了作者对自然山水的热爱与沉醉，也流露出自谢灵运以来知音难觅的感慨，体现了南北朝时期文人对山水的审美追求。"},"13":{"o":"风烟俱净，天山共色。从流飘荡，任意东西。自富阳至桐庐一百许里，奇山异水，天下独绝。水皆缥碧，千丈见底。游鱼细石，直视无碍。急湍甚箭，猛浪若奔。夹岸高山，皆生寒树，负势竞上，互相轩邈，争高直指，千百成峰。泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。蝉则千转不穷，猿则百叫无绝。鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。横柯上蔽，在昼犹昏；疏条交映，有时见日。","t":[{"o":"风烟俱净，天山共色。","t":"风停雾散，天空和远山呈现出相同的颜色。"},{"o":"从流飘荡，任意东西。","t":"（乘船）随着江流飘荡，任凭它向东或向西。"},{"o":"自富阳至桐庐一百许里，奇山异水，天下独绝。","t":"从富阳到桐庐一百来里，奇山异水，是天下独一无二的。"},{"o":"水皆缥碧，千丈见底。","t":"江水都是青绿色的，千丈之深也能看见水底。"},{"o":"游鱼细石，直视无碍。","t":"游动的鱼和细小的石头，一直看下去毫无障碍。"},{"o":"急湍甚箭，猛浪若奔。","t":"急流比飞箭还快，汹涌的波浪就像奔马一样。"},{"o":"夹岸高山，皆生寒树，","t":"江两岸的高山上，全都生长着耐寒的树木。"},{"o":"负势竞上，互相轩邈，争高直指，千百成峰。","t":"山峦凭借高峻的地势争相向上，彼此争高比远，直指天空，形成千百座山峰。"},{"o":"泉水激石，泠泠作响；","t":"泉水冲击着石头，发出泠泠的声响。"},{"o":"好鸟相鸣，嘤嘤成韵。","t":"美丽的鸟儿互相和鸣，鸣声嘤嘤，和谐动听。"},{"o":"蝉则千转不穷，猿则百叫无绝。","t":"蝉不停地叫着，猿猴也不断地啼鸣。"},{"o":"鸢飞戾天者，望峰息心；","t":"像鸢鸟一样飞上天空（追逐名利）的人，看到这些山峰就会打消念头。"},{"o":"经纶世务者，窥谷忘反。","t":"治理政务的人，看到这些幽美的山谷就会流连忘返。"},{"o":"横柯上蔽，在昼犹昏；","t":"横斜的树枝在上边遮蔽着，在白天也像黄昏时那样昏暗。"},{"o":"疏条交映，有时见日。","t":"稀疏的枝条互相掩映，有时还能见到阳光。"}],"n":[{"w":"风烟","m":"风和雾"},{"w":"共色","m":"相同的颜色"},{"w":"缥碧","m":"青绿色。缥，浅青色"},{"w":"湍","m":"急流的水"},{"w":"奔","m":"奔跑的马（动词作名词）"},{"w":"寒树","m":"耐寒的树，常绿树"},{"w":"负势","m":"凭借（高峻的）地势"},{"w":"轩邈","m":"轩，高；邈，远。这里均作动词，争高比远"},{"w":"直指","m":"直直向上，直插天空"},{"w":"泠泠","m":"形容水声的清越"},{"w":"嘤嘤","m":"鸟鸣声"},{"w":"转","m":"同\"啭\"，鸟鸣"},{"w":"鸢","m":"鹞鹰"},{"w":"戾","m":"至，到达"},{"w":"息心","m":"打消念头，平息功名利禄之心"},{"w":"经纶","m":"筹划、治理"},{"w":"反","m":"同\"返\"，返回"},{"w":"横柯","m":"横斜的树枝"},{"w":"犹","m":"如同，好像"}],"a":"本文以生动传神的笔触描绘了富阳至桐庐一带富春江上的奇山异水，展现了自然山水的雄奇秀丽之美。文章通过对山水声色、动静之态的细致刻画，表达了作者厌弃世俗功名、寄情山水的情趣，也暗含了对追名逐利之风的批判。"},"14":{"o":"沧州南一寺临河干，山门圮于河，二石兽并沉焉。阅十余岁，僧募金重修，求二石兽于水中，竟不可得，以为顺流下矣。棹数小舟，曳铁钯，寻十余里无迹。\n\n一讲学家设帐寺中，闻之笑曰：\"尔辈不能究物理。是非木杮，岂能为暴涨携之去？乃石性坚重，沙性松浮，湮于沙上，渐沉渐深耳。沿河求之，不亦颠乎？\"众服为确论。\n\n一老河兵闻之，又笑曰：\"凡河中失石，当求之于上流。盖石性坚重，沙性松浮，水不能冲石，其反激之力，必于石下迎水处啮沙为坎穴。渐激渐深，至石之半，石必倒掷坎穴中。如是再啮，石又再转。转转不已，遂反溯流逆上矣。求之下流，固颠；求之地中，不更颠乎？\"如其言，果得于数里外。\n\n然则天下之事，但知其一，不知其二者多矣，可据理臆断欤？","t":[{"o":"沧州南一寺临河干，山门圮于河，二石兽并沉焉。","t":"沧州南面的一座寺庙靠近河岸，寺庙的山门倒塌在河中，两个石兽一起沉没在河里。"},{"o":"阅十余岁，僧募金重修，求二石兽于水中，竟不可得，以为顺流下矣。","t":"经过了十多年，僧人们募集资金重修寺庙，在水中寻找两个石兽，竟然没有找到，以为它们顺流而下了。"},{"o":"棹数小舟，曳铁钯，寻十余里无迹。","t":"他们划着几只小船，拖着铁钯，寻找了十多里也没有石兽的踪迹。"},{"o":"一讲学家设帐寺中，闻之笑曰：\"尔辈不能究物理。\"","t":"一位讲学在寺里设馆讲学，听说了这件事笑着说：\"你们这些人不能探究事物的道理。\""},{"o":"\"是非木杮，岂能为暴涨携之去？\"","t":"\"这不是木片，怎么能被暴涨的河水冲走呢？\""},{"o":"\"乃石性坚重，沙性松浮，湮于沙上，渐沉渐深耳。\"","t":"\"石头的性质坚硬沉重，沙子的性质松散轻浮，埋没在沙上，越沉越深罢了。\""},{"o":"\"沿河求之，不亦颠乎？\"众服为确论。","t":"\"沿着河去寻找它，不是太颠倒了吗？\"大家都很佩服，认为是正确的论断。"},{"o":"一老河兵闻之，又笑曰：\"凡河中失石，当求之于上流。\"","t":"一个老河兵听说了这件事，又笑着说：\"凡是河中丢失的石头，应当到上游去寻找。\""},{"o":"\"盖石性坚重，沙性松浮，水不能冲石，其反激之力，必于石下迎水处啮沙为坎穴。\"","t":"\"因为石头的性质坚硬沉重，沙子的性质松散轻浮，水流不能冲走石头，它的反冲击力，一定会在石头下方迎水的地方冲刷沙子形成坑穴。\""},{"o":"\"渐激渐深，至石之半，石必倒掷坎穴中。\"","t":"\"越冲刷越深，到了石头的一半，石头必定会倾倒在坑穴中。\""},{"o":"\"如是再啮，石又再转。转转不已，遂反溯流逆上矣。\"","t":"\"像这样再次冲刷，石头又会再次翻转。不断地翻转，于是就逆流而上了。\""},{"o":"\"求之下流，固颠；求之地中，不更颠乎？\"","t":"\"到下游去寻找，固然是颠倒的；到地下去寻找，不是更加颠倒吗？\""},{"o":"如其言，果得于数里外。","t":"按照他的话去找，果然在上游几里外找到了石兽。"},{"o":"然则天下之事，但知其一，不知其二者多矣，可据理臆断欤？","t":"既然这样，那么天下的事，只知其一、不知其二的太多了，怎么能只凭常理就主观臆断呢？"}],"n":[{"w":"河干","m":"河岸"},{"w":"圮","m":"倒塌"},{"w":"并","m":"一起"},{"w":"阅","m":"经过，经历"},{"w":"棹","m":"划船（名词作动词）"},{"w":"曳","m":"拖拉"},{"w":"铁钯","m":"铁制的耙子"},{"w":"设帐","m":"设馆讲学"},{"w":"尔辈","m":"你们这些人"},{"w":"物理","m":"事物的道理、规律"},{"w":"木杮","m":"木片。杮，削下的木片"},{"w":"暴涨","m":"河水突然涨起"},{"w":"湮","m":"埋没"},{"w":"颠","m":"颠倒，荒唐"},{"w":"确论","m":"正确的言论"},{"w":"盖","m":"因为"},{"w":"啮","m":"咬，这里指冲刷"},{"w":"坎穴","m":"坑洞"},{"w":"倒掷","m":"倾倒，翻落"},{"w":"溯流","m":"逆流而上"},{"w":"固","m":"固然，当然"},{"w":"然则","m":"既然如此，那么"},{"w":"臆断","m":"主观地判断"},{"w":"欤","m":"语气助词，表反问，呢"}],"a":"本文通过寻找沉入河中石兽的故事，说明许多事情不能仅凭常理和主观推断来判断，必须结合实际情况进行具体分析。寺庙僧人和讲学家虽然各有道理，但都脱离了实际；老河兵凭借多年的实际经验做出了正确的判断。文章告诉我们遇事要实事求是，不可主观臆断，实践出真知。"},"15":{"o":"自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日，自非亭午夜分，不见曦月。至于夏水襄陵，沿溯阻绝。或王命急宣，有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。春冬之时，则素湍绿潭，回清倒影。绝巘多生怪柏，悬泉瀑布，飞漱其间。清荣峻茂，良多趣味。每至晴初霜旦，林寒涧肃，常有高猿长啸，属引凄异，空谷传响，哀转久绝。故渔者歌曰：\"巴东三峡巫峡长，猿鸣三声泪沾裳。\"","t":[{"o":"自三峡七百里中，两岸连山，略无阙处。","t":"在三峡七百里当中，两岸山连着山，几乎没有中断的地方。"},{"o":"重岩叠嶂，隐天蔽日，自非亭午夜分，不见曦月。","t":"重重叠叠的岩峰像屏障一样遮住了天光，如果不是正午和半夜，就看不到太阳和月亮。"},{"o":"至于夏水襄陵，沿溯阻绝。","t":"到了夏天江水漫上山陵的时候，下行和上行的航路都被阻断了。"},{"o":"或王命急宣，有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。","t":"有时遇到皇帝的命令必须紧急传达，这时候有时候早晨从白帝城出发，傍晚就到了江陵，这中间有一千二百里，即使骑着快马驾着风，也没有这样快。"},{"o":"春冬之时，则素湍绿潭，回清倒影。","t":"春冬季节，那白色的急流、碧绿的深潭，回旋的清波里倒映着各种景物的影子。"},{"o":"绝巘多生怪柏，悬泉瀑布，飞漱其间。","t":"极高的山峰上生长着许多奇形怪状的柏树，悬挂着的泉水瀑布，在它们中间飞流冲荡。"},{"o":"清荣峻茂，良多趣味。","t":"水清、树荣、山高、草茂，实在有很多趣味。"},{"o":"每至晴初霜旦，林寒涧肃，常有高猿长啸，属引凄异，空谷传响，哀转久绝。","t":"每逢初晴的日子或者结霜的早晨，树林和山涧显出一片清凉和寂静，经常有高处的猿猴拉长声音叫唤，声音连续不断，非常凄凉怪异，空旷的山谷里传来回声，悲哀婉转，很久才消失。"},{"o":"故渔者歌曰：\"巴东三峡巫峡长，猿鸣三声泪沾裳。\"","t":"所以打鱼的人唱道：\"巴东三峡巫峡最长，听见猿猴叫几声眼泪就沾湿了衣裳。\""}],"n":[{"w":"自","m":"在，这里指\"从……到……\""},{"w":"阙","m":"通\"缺\"，中断、空缺"},{"w":"亭午夜分","m":"亭午：正午；夜分：半夜"},{"w":"曦","m":"日光，这里指太阳"},{"w":"襄陵","m":"漫上山陵。襄，上、升。陵，大土山"},{"w":"沿溯","m":"沿：顺流而下；溯：逆流而上"},{"w":"奔","m":"奔跑的骏马"},{"w":"御风","m":"驾着风"},{"w":"不以疾","m":"不如（这样）快。以，认为。疾，快"},{"w":"素湍","m":"白色的急流。素，白色。湍，急流"},{"w":"回清","m":"回旋的清波"},{"w":"绝巘","m":"极高的山峰。绝，极。巘，山峰"},{"w":"飞漱","m":"飞流冲荡"},{"w":"清荣峻茂","m":"水清、树荣、山高、草茂"},{"w":"良","m":"实在、确实"},{"w":"晴初","m":"天刚晴"},{"w":"霜旦","m":"下霜的早晨"},{"w":"肃","m":"肃杀、寒冷"},{"w":"属引","m":"属（zhǔ）：连接。引：延长。指猿声连续不断"},{"w":"凄异","m":"凄凉怪异"},{"w":"响","m":"回声"},{"w":"绝","m":"消失"}],"a":"本文通过对三峡四季景色的描绘，突出了三峡山高谷深、水急浪猛的自然特征。文章按夏、春冬、秋的顺序，写出了三峡不同季节的不同风貌，表现了作者对祖国壮丽河山的热爱之情。全文语言精练，寥寥数语便将三峡雄奇险秀的景色展现得淋漓尽致。"},"16":{"o":"景春曰：\"公孙衍、张仪岂不诚大丈夫哉？一怒而诸侯惧，安居而天下熄。\"\n\n孟子曰：\"是焉得为大丈夫乎？子未学礼乎？丈夫之冠也，父命之；女子之嫁也，母命之，往送之门，戒之曰：'往之女家，必敬必戒，无违夫子！'以顺为正者，妾妇之道也。居天下之广居，立天下之正位，行天下之大道。得志，与民由之；不得志，独行其道。富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫。\"","t":[{"o":"景春曰：\"公孙衍、张仪岂不诚大丈夫哉？一怒而诸侯惧，安居而天下熄。\"","t":"景春说：\"公孙衍和张仪难道不是真正的大丈夫吗？他们一发怒，诸侯就害怕；他们安静下来，天下就平安无事。\""},{"o":"孟子曰：\"是焉得为大丈夫乎？子未学礼乎？\"","t":"孟子说：\"这怎么能算大丈夫呢？你没有学过礼吗？\""},{"o":"丈夫之冠也，父命之；女子之嫁也，母命之，往送之门，戒之曰：'往之女家，必敬必戒，无违夫子！'","t":"男子行加冠礼时，父亲训导他；女子出嫁时，母亲训导她，把她送到门口，告诫她说：'到了你丈夫家里，一定要恭敬，一定要谨慎，不要违背你的丈夫！'"},{"o":"以顺为正者，妾妇之道也。","t":"把顺从当作正道，这是妇女遵循的原则。（孟子暗示公孙衍、张仪只不过像顺从君主的妾妇一样。）"},{"o":"居天下之广居，立天下之正位，行天下之大道。","t":"居住在天下最宽广的住宅里（指\"仁\"），站在天下最中正的位置上（指\"礼\"），走在天下最广阔的大道上（指\"义\"）。"},{"o":"得志，与民由之；不得志，独行其道。","t":"得志的时候，与老百姓一同走正道；不得志的时候，独自践行自己的原则。"},{"o":"富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫。\"","t":"富贵不能使他骄奢淫逸，贫贱不能改变他的志向，威武不能使他屈服，这样的人才称得上是大丈夫。\""}],"n":[{"w":"景春","m":"与孟子同时代的人，纵横家的信奉者"},{"w":"公孙衍、张仪","m":"战国时期著名的纵横家"},{"w":"诚","m":"真正，确实"},{"w":"熄","m":"平息，指战事平息"},{"w":"焉","m":"怎么，哪里"},{"w":"冠","m":"古时男子二十岁行冠礼，表示成年。冠（guàn），动词"},{"w":"命","m":"训导、教导"},{"w":"戒","m":"告诫、警告"},{"w":"女家","m":"你家。女，同\"汝\"，你"},{"w":"夫子","m":"这里指丈夫"},{"w":"广居","m":"宽大的住宅，比喻\"仁\""},{"w":"正位","m":"正中的位置，比喻\"礼\""},{"w":"大道","m":"大路，比喻\"义\""},{"w":"与民由之","m":"与老百姓一同遵循正道而行。由，遵循"},{"w":"淫","m":"使……惑乱、使之骄奢淫逸"},{"w":"移","m":"使……改变（志向）"},{"w":"屈","m":"使……屈服"},{"w":"此之谓","m":"这才叫做。\"此……之谓\"是宾语前置的固定句式"}],"a":"本文通过孟子驳斥景春的观点，提出了\"大丈夫\"的真正标准：不是像公孙衍、张仪那样凭借权势使诸侯畏惧，而是要以\"仁、礼、义\"为准则，坚守原则，做到\"富贵不能淫，贫贱不能移，威武不能屈\"。文章体现了孟子刚健不屈的人格理想和坚守道德操守的精神。"},"17":{"o":"舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。\n\n故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。\n\n人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。\n\n入则无法家拂士，出则无敌国外患者，国恒亡。\n\n然后知生于忧患而死于安乐也。","t":[{"o":"舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。","t":"舜从田野中被起用，傅说从筑墙的泥水匠中被举用，胶鬲从鱼盐贩子中被举用，管夷吾从狱官手里被释放并录用，孙叔敖从海边被举用，百里奚从市井中被举用。"},{"o":"故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。","t":"所以上天将要下达重大使命给这样的人，一定要先使他的内心痛苦，使他的筋骨劳累，使他经受饥饿，使他身受贫困之苦，使他做事颠倒错乱，通过这些来使他的内心警觉，使他的性格坚忍起来，不断增加他不具备的才能。"},{"o":"人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。","t":"一个人常常犯错误，然后才能改正；内心困惑，思虑堵塞，然后才能有所作为；（别人的不满）表现在脸色上，（怨恨）吐发在言语中，然后才能被人了解。"},{"o":"入则无法家拂士，出则无敌国外患者，国恒亡。","t":"（一个国家）内部如果没有守法度的大臣和辅佐君王的贤士，外部如果没有敌对的国家和外国侵犯的危险，这样的国家往往会灭亡。"},{"o":"然后知生于忧患而死于安乐也。","t":"这样以后才知道，忧患（能激励人勤奋）使人生存发展，安乐（使人怠惰）使人走向灭亡。"}],"n":[{"w":"舜","m":"传说中的远古帝王，曾在历山耕田"},{"w":"发","m":"起用，被任用"},{"w":"畎亩","m":"田亩，田间。畎（quǎn），田间的水沟"},{"w":"傅说","m":"殷商时人，曾为人筑墙，后被武丁举用为相"},{"w":"版筑","m":"筑墙。两板相夹，中间填土夯实"},{"w":"举","m":"任用、选拔，被举用"},{"w":"胶鬲","m":"殷商时人，曾贩卖鱼盐"},{"w":"管夷吾","m":"即管仲，曾因罪囚禁，后被齐桓公举用为相"},{"w":"士","m":"狱官。举于士：从狱官手中被举用"},{"w":"孙叔敖","m":"春秋时期楚国令尹（宰相），隐居海边被举用"},{"w":"百里奚","m":"春秋时期虞国人，曾沦为奴隶，后被秦穆公举用"},{"w":"降大任","m":"下达重大责任或使命"},{"w":"苦","m":"使……痛苦（使动用法）"},{"w":"劳","m":"使……劳累（使动用法）"},{"w":"饿","m":"使……挨饿（使动用法）"},{"w":"空乏","m":"财物缺乏，使……受到贫困之苦（使动用法）"},{"w":"拂乱","m":"使……颠倒错乱"},{"w":"动心","m":"使内心受到震动"},{"w":"忍性","m":"使性格坚忍"},{"w":"曾益","m":"增加。曾，同\"增\""},{"w":"恒","m":"常常"},{"w":"过","m":"犯错误"},{"w":"衡","m":"同\"横\"，梗塞，指不顺"},{"w":"作","m":"奋起，有所作为"},{"w":"征","m":"表现、显露"},{"w":"喻","m":"了解、明白"},{"w":"法家","m":"守法度的大臣"},{"w":"拂士","m":"辅佐君王的贤士。拂（bì），同\"弼\"，辅佐"},{"w":"入","m":"在国内"},{"w":"出","m":"在国外"}],"a":"本文通过列举六位历史人物从困境中崛起的事例，论证了\"生于忧患，死于安乐\"的道理。文章指出，上天要将重任交给一个人，必先使其经受种种磨炼，以培养其坚韧的品质和非凡的才能；同样，一个国家如果失去忧患意识，就会走向灭亡。全文告诫人们要有忧患意识，在困境中磨炼自己，不要沉溺于安乐。"},"18":{"o":"太行、王屋二山，方七百里，高万仞，本在冀州之南，河阳之北。\n\n北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也，聚室而谋曰：\"吾与汝毕力平险，指通豫南，达于汉阴，可乎？\"杂然相许。\n\n其妻献疑曰：\"以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？\"杂曰：\"投诸渤海之尾，隐土之北。\"\n\n遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。邻人京城氏之孀妻有遗男，始龀，跳往助之。寒暑易节，始一反焉。\n\n河曲智叟笑而止之曰：\"甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？\"\n\n北山愚公长息曰：\"汝心之固，固不可彻，曾不若孀妻弱子。虽我之死，有子存焉。子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？\"\n\n河曲智叟亡以应。\n\n操蛇之神闻之，惧其不已也，告之于帝。帝感其诚，命夸娥氏二子负二山，一厝朔东，一厝雍南。自此，冀之南，汉之阴，无陇断焉。","t":[{"o":"太行、王屋二山，方七百里，高万仞，本在冀州之南，河阳之北。","t":"太行、王屋两座山，方圆七百里，高七八千丈，本来在冀州的南面，河阳的北面。"},{"o":"北山愚公者，年且九十，面山而居。","t":"北山脚下有个叫愚公的人，年纪将近九十岁了，面对着山居住。"},{"o":"惩山北之塞，出入之迂也，聚室而谋曰：\"吾与汝毕力平险，指通豫南，达于汉阴，可乎？\"","t":"他苦于山北面道路阻塞，进进出出曲折绕远，便集合全家人来商量说：\"我和你们尽全力铲平险峻的大山，使它一直通到豫州的南部，到达汉水南岸，可以吗？\""},{"o":"杂然相许。","t":"大家纷纷表示赞同。"},{"o":"其妻献疑曰：\"以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？\"","t":"他的妻子提出疑问说：\"凭你的力气，连魁父这座小山都不能削平，又能把太行、王屋这两座山怎么样呢？况且把土石放到哪里去呢？\""},{"o":"杂曰：\"投诸渤海之尾，隐土之北。\"","t":"大家纷纷说：\"把它们扔到渤海的边上，隐土的北面。\""},{"o":"遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。","t":"于是愚公带领儿孙中能挑担子的三个人上了山，凿石头，挖泥土，用簸箕和土筐把土石运到渤海的边上。"},{"o":"邻人京城氏之孀妻有遗男，始龀，跳往助之。","t":"邻居京城氏的寡妇有个孤儿，刚刚七八岁，也蹦蹦跳跳地去帮助他们。"},{"o":"寒暑易节，始一反焉。","t":"冬夏换季（即一年），才能往返一次。"},{"o":"河曲智叟笑而止之曰：\"甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？\"","t":"河湾上的智叟讥笑并阻止愚公说：\"你太不聪明了！就凭你风烛残年的余力，连山上的一根草木都毁不了，又能把泥土石头怎么样呢？\""},{"o":"北山愚公长息曰：\"汝心之固，固不可彻，曾不若孀妻弱子。虽我之死，有子存焉。子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？\"","t":"北山愚公长叹一声说：\"你思想顽固，顽固到了不可改变的地步，连寡妇和弱小的孩子都不如。即使我死了，还有儿子在呀。儿子又生孙子，孙子又生儿子；儿子又有儿子，儿子又有孙子；子子孙孙无穷无尽，可是这山却不会再增高加大了，还愁什么挖不平呢？\""},{"o":"河曲智叟亡以应。","t":"河曲智叟无话可答。"},{"o":"操蛇之神闻之，惧其不已也，告之于帝。","t":"手里拿着蛇的山神听说了这件事，怕他不停地挖下去，就向天帝报告了。"},{"o":"帝感其诚，命夸娥氏二子负二山，一厝朔东，一厝雍南。","t":"天帝被愚公的诚心感动了，命令大力神夸娥氏的两个儿子背走了这两座山，一座放在朔方的东部，一座放在雍州的南部。"},{"o":"自此，冀之南，汉之阴，无陇断焉。","t":"从此以后，冀州的南部直到汉水南岸，再也没有高山阻隔了。"}],"n":[{"w":"方","m":"方圆，指面积"},{"w":"仞","m":"古代长度单位，八尺（或说七尺）为一仞"},{"w":"且","m":"将近"},{"w":"惩","m":"苦于"},{"w":"塞","m":"阻塞"},{"w":"迂","m":"曲折绕远"},{"w":"毕力","m":"尽全力。毕，尽、全"},{"w":"汝","m":"你，你们"},{"w":"指","m":"直，一直"},{"w":"汉阴","m":"汉水南岸。山之南、水之北为阳，山之北、水之南为阴"},{"w":"杂然","m":"纷纷地"},{"w":"许","m":"赞同"},{"w":"献疑","m":"提出疑问"},{"w":"曾","m":"用在\"不\"前，加强语气，竟然"},{"w":"损","m":"削减、削减"},{"w":"魁父","m":"小山名"},{"w":"如……何","m":"把……怎么样呢"},{"w":"焉","m":"哪里，疑问代词"},{"w":"诸","m":"之于（合音词）"},{"w":"荷担","m":"挑担子。荷（hè），扛、挑"},{"w":"叩","m":"凿、敲打"},{"w":"箕畚","m":"用竹筐或土筐装土石。名词作状语，用箕畚"},{"w":"龀","m":"换牙，指七八岁"},{"w":"反","m":"同\"返\"，往返"},{"w":"惠","m":"同\"慧\"，聪明"},{"w":"甚矣","m":"太过分了"},{"w":"长息","m":"长叹"},{"w":"固","m":"顽固"},{"w":"彻","m":"通达，这里指改变"},{"w":"穷匮","m":"穷尽"},{"w":"何苦","m":"愁什么。苦，愁"},{"w":"亡","m":"同\"无\"，没有"},{"w":"以应","m":"用来回答"},{"w":"操蛇之神","m":"山神。传说山神手里拿着蛇"},{"w":"已","m":"停止"},{"w":"帝","m":"天帝"},{"w":"负","m":"背"},{"w":"厝","m":"放置、安放"},{"w":"朔东","m":"朔方的东部"},{"w":"雍南","m":"雍州的南部"},{"w":"陇断","m":"即\"垄断\"，山丘高地阻隔"}],"a":"本文通过愚公移山的故事，说明了只要坚持不懈、持之以恒，再大的困难也能克服的道理。愚公面对两座大山，不畏艰难，矢志不移，最终感动了天帝，搬走了大山。文章以此告诫人们：面对困难要有知难而进的精神，只要目标明确、意志坚定、坚持不懈，就一定能取得成功。智叟的\"智\"实为目光短浅，愚公的\"愚\"实为大智若愚。"},"19":{"o":"文帝之后六年，匈奴大入边。乃以宗正刘礼为将军，军霸上；祝兹侯徐厉为将军，军棘门；以河内守亚夫为将军，军细柳，以备胡。\n\n上自劳军。至霸上及棘门军，直驰入，将以下骑送迎。已而之细柳军，军士吏被甲，锐兵刃，彀弓弩，持满。天子先驱至，不得入。先驱曰：\"天子且至！\"军门都尉曰：\"将军令曰：'军中闻将军令，不闻天子之诏。'\"居无何，上至，又不得入。于是上乃使使持节诏将军：\"吾欲入劳军。\"亚夫乃传言开壁门。壁门士吏谓从属车骑曰：\"将军约，军中不得驱驰。\"于是天子乃按辔徐行。至大营，将军亚夫持兵揖曰：\"介胄之士不拜，请以军礼见。\"天子为动，改容式车。使人称谢：\"皇帝敬劳将军。\"成礼而去。\n\n既出军门，群臣皆惊。文帝曰：\"嗟乎，此真将军矣！曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。至于亚夫，可得而犯邪！\"称善者久之。","t":[{"o":"文帝之后六年，匈奴大入边。","t":"汉文帝后元六年，匈奴大举入侵边境。"},{"o":"乃以宗正刘礼为将军，军霸上；祝兹侯徐厉为将军，军棘门；以河内守亚夫为将军，军细柳，以备胡。","t":"于是（文帝）任命宗正刘礼为将军，驻军在霸上；任命祝兹侯徐厉为将军，驻军在棘门；任命河内太守周亚夫为将军，驻军在细柳，用来防备匈奴入侵。"},{"o":"上自劳军。至霸上及棘门军，直驰入，将以下骑送迎。","t":"皇上亲自去慰劳军队。到了霸上和棘门的军营，直接驱车进去，将军及其以下的军官都骑着马迎送。"},{"o":"已而之细柳军，军士吏被甲，锐兵刃，彀弓弩，持满。","t":"不久（皇上）前往细柳军营，只见军营中的官兵都穿着铠甲，兵刃锋利，张开弓弩，拉满弓弦。"},{"o":"天子先驱至，不得入。","t":"天子的先头卫队到了，不能进入军营。"},{"o":"先驱曰：\"天子且至！\"军门都尉曰：\"将军令曰：'军中闻将军令，不闻天子之诏。'\"","t":"先头卫队说：\"天子将要到了！\"军门的都尉说：\"将军有令：'军营中只听将军的命令，不听天子的诏令。'\""},{"o":"居无何，上至，又不得入。","t":"过了不久，皇上到了，还是不能进入。"},{"o":"于是上乃使使持节诏将军：\"吾欲入劳军。\"","t":"于是皇上就派使者拿着符节下诏令给将军：\"我要进去慰劳军队。\""},{"o":"亚夫乃传言开壁门。","t":"周亚夫这才传令打开营门。"},{"o":"壁门士吏谓从属车骑曰：\"将军约，军中不得驱驰。\"","t":"营门的军官对随从的车马说：\"将军规定，军营中不能驱马奔驰。\""},{"o":"于是天子乃按辔徐行。","t":"于是天子就控制住车马慢慢行走。"},{"o":"至大营，将军亚夫持兵揖曰：\"介胄之士不拜，请以军礼见。\"","t":"到了大营，将军周亚夫拿着兵器拱手行礼说：\"穿戴盔甲的将士不行跪拜礼，请允许我以军礼参见（陛下）。\""},{"o":"天子为动，改容式车。使人称谢：\"皇帝敬劳将军。\"","t":"天子被他感动了，脸上的神情变得严肃起来，手扶车前的横木俯下身子表示敬意。派人致意说：\"皇帝敬重地慰劳将军。\""},{"o":"成礼而去。","t":"劳军仪式完成后离开了。"},{"o":"既出军门，群臣皆惊。","t":"出了军营大门以后，群臣都感到震惊。"},{"o":"文帝曰：\"嗟乎，此真将军矣！曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。至于亚夫，可得而犯邪！\"","t":"文帝说：\"唉，这才是真正的将军啊！先前霸上、棘门的军营，简直像儿戏一样，那里的将军本来是可以被偷袭并被俘虏的。至于周亚夫，谁能够侵犯他呢！\""},{"o":"称善者久之。","t":"说\"好\"说了很久。"}],"n":[{"w":"文帝之后六年","m":"汉文帝后元六年（公元前158年）"},{"w":"大入边","m":"大举入侵边境"},{"w":"宗正","m":"官名，负责皇族事务"},{"w":"军","m":"驻军（动词）"},{"w":"河内守","m":"河内郡的太守"},{"w":"备胡","m":"防备匈奴"},{"w":"上","m":"皇上，指汉文帝"},{"w":"自","m":"亲自"},{"w":"劳军","m":"慰劳军队"},{"w":"直驰入","m":"直接驱车进入"},{"w":"将以下骑送迎","m":"将军及其部下骑着马迎送"},{"w":"已而","m":"不久"},{"w":"之","m":"到、往"},{"w":"被甲","m":"穿着铠甲。被，同\"披\""},{"w":"锐兵刃","m":"兵器锋利。锐，使……锋利"},{"w":"彀弓弩","m":"张开弓弩。彀（gòu），张开"},{"w":"持满","m":"把弓拉满"},{"w":"先驱","m":"先头部队、先行人员"},{"w":"且","m":"将要"},{"w":"都尉","m":"武官名"},{"w":"居无何","m":"过了不久"},{"w":"使使","m":"派使者。前一个\"使\"为动词，后一个\"使\"为名词"},{"w":"持节","m":"拿着符节。节，皇帝派遣使者或调动军队的凭证"},{"w":"诏","m":"皇帝下达命令"},{"w":"壁门","m":"营门。壁，营垒"},{"w":"从属车骑","m":"随从的车马"},{"w":"约","m":"规定"},{"w":"驱驰","m":"驱马奔驰"},{"w":"按辔","m":"控制住马缰绳，让马慢行"},{"w":"徐行","m":"慢慢行走"},{"w":"持兵揖","m":"拿着兵器拱手行礼"},{"w":"介胄","m":"穿戴铠甲和头盔。介，铠甲。胄，头盔"},{"w":"不拜","m":"不行跪拜礼"},{"w":"为动","m":"被感动"},{"w":"改容","m":"改变面容，变得严肃"},{"w":"式车","m":"手扶车前横木俯身致敬。式，同\"轼\"，车前横木"},{"w":"称谢","m":"表示问候、致意"},{"w":"既","m":"已经"},{"w":"曩者","m":"先前，从前"},{"w":"若儿戏耳","m":"像儿戏罢了"},{"w":"固","m":"本来"},{"w":"袭而虏","m":"偷袭并俘虏"},{"w":"邪","m":"同\"耶\"，表示疑问的语气词"}],"a":"本文通过汉文帝劳军时在细柳军营的所见所闻，刻画了周亚夫治军严明、刚正不阿的\"真将军\"形象。在霸上和棘门军营，天子可以长驱直入；而在细柳军营，天子不但不能直接进入，还必须遵守军营规矩。文章通过鲜明的对比手法，突出了周亚夫的军事才能和崇高品格，同时也表现了汉文帝的知人善任、胸怀宽广。"},"20":{"o":"世有伯乐，然后有千里马。千里马常有，而伯乐不常有。故虽有名马，祗辱于奴隶人之手，骈死于槽枥之间，不以千里称也。\n\n马之千里者，一食或尽粟一石。食马者不知其能千里而食也。是马也，虽有千里之能，食不饱，力不足，才美不外见，且欲与常马等不可得，安求其能千里也？\n\n策之不以其道，食之不能尽其材，鸣之而不能通其意，执策而临之，曰：\"天下无马！\"呜呼！其真无马邪？其真不知马也！","t":[{"o":"世有伯乐，然后有千里马。","t":"世上先有伯乐（这样的相马专家），然后才会有千里马。"},{"o":"千里马常有，而伯乐不常有。","t":"千里马经常有，可是伯乐却不经常有。"},{"o":"故虽有名马，祗辱于奴隶人之手，骈死于槽枥之间，不以千里称也。","t":"所以即使有了名贵的马，也只是屈辱在马夫的手里，和普通的马一起死在马厩里，不能以千里马而著称。"},{"o":"马之千里者，一食或尽粟一石。","t":"日行千里的马，吃一顿有时能吃完一石粮食。"},{"o":"食马者不知其能千里而食也。","t":"喂马的人不知道它能日行千里，而（像普通的马一样）来喂养它。"},{"o":"是马也，虽有千里之能，食不饱，力不足，才美不外见，且欲与常马等不可得，安求其能千里也？","t":"这样的马，虽然有日行千里的本领，但是吃不饱，力气不足，它的才能和美好素质也就表现不出来，想要和普通的马一样尚且办不到，又怎么能要求它日行千里呢？"},{"o":"策之不以其道，食之不能尽其材，鸣之而不能通其意，执策而临之，曰：\"天下无马！\"","t":"鞭打它不按驱使千里马的方法，喂养它不能使它充分发挥自己的才能，听它嘶鸣却不懂得它的意思，（反而）拿着鞭子站在它跟前，说：\"天下没有千里马！\""},{"o":"呜呼！其真无马邪？其真不知马也！","t":"唉！难道真的没有千里马吗？恐怕是真的不认识千里马吧！"}],"n":[{"w":"伯乐","m":"春秋时期秦国人孙阳，以善于相马闻名"},{"w":"千里马","m":"日行千里的骏马，比喻杰出人才"},{"w":"祗","m":"同\"只\"，只是，仅仅"},{"w":"辱","m":"屈辱，埋没"},{"w":"奴隶人","m":"指地位低下的马夫、仆役"},{"w":"骈死","m":"并列而死。骈（pián），两马并驾，引申为一起"},{"w":"槽枥","m":"马槽、马厩"},{"w":"不以千里称","m":"不用\"千里马\"的称号来称呼它"},{"w":"马之千里者","m":"日行千里的马。\"之\"是定语后置的标志"},{"w":"一食","m":"吃一顿"},{"w":"或","m":"有时"},{"w":"粟","m":"谷子，指粮食"},{"w":"石","m":"古代容量单位，十斗为一石"},{"w":"食马者","m":"喂马的人。食（sì），通\"饲\"，喂"},{"w":"是","m":"这样，这"},{"w":"才美","m":"才能和美好的素质"},{"w":"外见","m":"表现在外面。见（xiàn），同\"现\""},{"w":"且","m":"尚且"},{"w":"等","m":"等同，一样"},{"w":"安","m":"怎么，哪里"},{"w":"策","m":"马鞭，这里用作动词，鞭打"},{"w":"以其道","m":"按照（驱使千里马的）正确方法"},{"w":"尽其材","m":"使其才能充分发挥。材，才能"},{"w":"通其意","m":"通晓它的意思"},{"w":"执策","m":"拿着鞭子"},{"w":"临","m":"面对、靠近"},{"w":"鸣呼","m":"唉，叹词"},{"w":"其","m":"表示反问语气，难道"},{"w":"邪","m":"同\"耶\"，表示疑问的语气词"}],"a":"本文是一篇托物寓意的杂文，作者以千里马比喻有才能的人，以伯乐比喻善于识别人才的统治者，以\"食马者\"比喻不识人才、摧残人才的统治者。文章借千里马的遭遇，抒发了作者对统治者不识人才、埋没人才的愤懑之情，表达了自己怀才不遇的感慨，同时也寄寓了希望统治者能识别人才、重用人才的政治理想。"},"21":{"o":"### 第一则《虽有嘉肴》\n\n虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也。是故学然后知不足，教然后知困。知不足，然后能自反也；知困，然后能自强也。故曰：教学相长也。《兑命》曰\"学学半\"，其此之谓乎！\n\n### 第二则《大道之行也》\n\n大道之行也，天下为公。选贤与能，讲信修睦。故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜、寡、孤、独、废疾者皆有所养，男有分，女有归。货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭。是谓大同。","t":[{"o":"虽有嘉肴，弗食，不知其旨也；","t":"即使有美味的菜，不去品尝，就不知道它的味美；"},{"o":"虽有至道，弗学，不知其善也。","t":"即使有最好的道理，不去学习，就不知道它的好处。"},{"o":"是故学然后知不足，教然后知困。","t":"所以学习以后才知道自己的不足，教导人以后才知道自己有困惑的地方。"},{"o":"知不足，然后能自反也；知困，然后能自强也。","t":"知道自己不足的地方，然后才能自我反省；知道自己困惑的地方，然后才能努力自强。"},{"o":"故曰：教学相长也。","t":"所以说：教与学是互相促进的。"},{"o":"《兑命》曰\"学学半\"，其此之谓乎！","t":"《兑命》说\"教人是学习的一半\"，大概说的就是这个道理吧！"},{"o":"大道之行也，天下为公。","t":"大道实行的时代，天下是人们共有的。"},{"o":"选贤与能，讲信修睦。","t":"选拔推举贤能的人，讲求诚信，培养和睦的气氛。"},{"o":"故人不独亲其亲，不独子其子，","t":"所以人们不单单赡养自己的父母，也不单单抚育自己的孩子，"},{"o":"使老有所终，壮有所用，幼有所长，","t":"要使老年人能安度晚年，壮年人能为社会效力，幼童能健康成长，"},{"o":"矜、寡、孤、独、废疾者皆有所养，","t":"老而无妻、老而无夫、幼而无父、老而无子、残疾的人都能得到供养，"},{"o":"男有分，女有归。","t":"男子有职业，女子有归宿。"},{"o":"货恶其弃于地也，不必藏于己；","t":"对于财货，人们憎恨把它扔在地上的行为，却不一定要自己私藏；"},{"o":"力恶其不出于身也，不必为己。","t":"对于力气，人们憎恨它不从自己身上发挥出来，却不一定为了自己。"},{"o":"是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭。","t":"因此阴谋闭藏不会兴起，盗窃和害人的事情不会发生，所以（家家户户的）大门都不用关上。"},{"o":"是谓大同。","t":"这就叫做\"大同\"社会。"}],"n":[{"w":"嘉","m":"美好"},{"w":"肴","m":"用鱼、肉做的菜"},{"w":"弗","m":"不"},{"w":"旨","m":"味美"},{"w":"至道","m":"最好的道理。至，极、最好"},{"w":"善","m":"好处"},{"w":"是故","m":"因此，所以"},{"w":"困","m":"困惑，理解不清"},{"w":"自反","m":"自我反省"},{"w":"自强","m":"自己奋发图强"},{"w":"教学相长","m":"教与学互相促进"},{"w":"兑命","m":"即《说命》，《尚书》中的一篇"},{"w":"学学半","m":"教人是学习的一半。前一个\"学\"（xiào）同\"斅\"，教导"},{"w":"其此之谓乎","m":"大概说的就是这个道理吧"},{"w":"大道","m":"指古代政治上的最高理想"},{"w":"行","m":"实行、施行"},{"w":"为公","m":"是公有的"},{"w":"与","m":"同\"举\"，推举、选拔"},{"w":"讲信","m":"讲求诚信"},{"w":"修睦","m":"培养和睦关系。修，培养"},{"w":"亲其亲","m":"赡养自己的父母。前一个\"亲\"作动词，以……为亲"},{"w":"子其子","m":"抚育自己的子女。前一个\"子\"作动词，以……为子"},{"w":"终","m":"老有所养，安度晚年"},{"w":"矜","m":"同\"鳏\"，老而无妻"},{"w":"寡","m":"老而无夫"},{"w":"孤","m":"幼而无父"},{"w":"独","m":"老而无子"},{"w":"废疾者","m":"残疾人"},{"w":"分（fèn）","m":"职分、职守"},{"w":"归","m":"女子出嫁，这里指归宿"},{"w":"货","m":"财物"},{"w":"恶（wù）","m":"憎恨、厌恶"},{"w":"谋闭","m":"奸诈之心闭藏"},{"w":"兴","m":"兴起"},{"w":"乱贼","m":"指造反害人的事"},{"w":"作","m":"兴起、发生"},{"w":"外户","m":"大门。外，从外面"},{"w":"大同","m":"指理想社会"}],"a":"**第一则《虽有嘉肴》：** 本文运用类比的手法，从\"嘉肴弗食不知其旨\"引出\"至道弗学不知其善\"，进而论述了教与学互相促进的道理——教人能使自己增长学问，学习能发现自己不足，两者相辅相成。\n\n**第二则《大道之行也》：** 本文描绘了一幅\"大同\"社会的理想蓝图，在这个社会里，天下为公，选贤任能，人人老有所养、壮有所用、幼有所长，社会安宁和谐。文章表达了儒家对理想社会的美好向往。"},"22":{"o":"### 第一则《北冥有鱼》\n\n北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。是鸟也，海运则将徙于南冥。南冥者，天池也。\n\n《齐谐》者，志怪者也。《谐》之言曰：\"鹏之徙于南冥也，水击三千里，抟扶摇而上者九万里，去以六月息者也。\"\n\n野马也，尘埃也，生物之以息相吹也。天之苍苍，其正色邪？其远而无所至极邪？其视下也，亦若是则已矣。\n\n### 第二则《庄子与惠子游于濠梁之上》\n\n庄子与惠子游于濠梁之上。庄子曰：\"鯈鱼出游从容，是鱼之乐也。\"\n\n惠子曰：\"子非鱼，安知鱼之乐？\"\n\n庄子曰：\"子非我，安知我不知鱼之乐？\"\n\n惠子曰：\"我非子，固不知子矣；子固非鱼也，子之不知鱼之乐，全矣！\"\n\n庄子曰：\"请循其本。子曰'汝安知鱼乐'云者，既已知吾知之而问我，我知之濠上也。\"","t":[{"o":"北冥有鱼，其名为鲲。","t":"北海有一条鱼，它的名字叫做鲲。"},{"o":"鲲之大，不知其几千里也；化而为鸟，其名为鹏。","t":"鲲的体积巨大，不知道究竟有几千里；鲲变化成为鸟，它的名字叫做鹏。"},{"o":"鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。","t":"鹏的背，不知道究竟有几千里；当它奋起而飞的时候，那展开的翅膀就像悬挂在天空中的云。"},{"o":"是鸟也，海运则将徙于南冥。南冥者，天池也。","t":"这只鸟，当海面上风起云涌的时候就将要飞往南海。南海，是天然的大池。"},{"o":"《齐谐》者，志怪者也。","t":"《齐谐》这本书，是记载怪异事物的书。"},{"o":"《谐》之言曰：\"鹏之徙于南冥也，水击三千里，抟扶摇而上者九万里，去以六月息者也。\"","t":"《齐谐》书上说：\"当鹏迁往南海时，拍打水面滑行三千里，乘着旋风盘旋而上九万里，它离开北海是乘着六月的大风。\""},{"o":"野马也，尘埃也，生物之以息相吹也。","t":"像野马奔腾一样的雾气，飘飘扬扬的尘埃，都是活动着的生物的气息互相吹拂的结果。"},{"o":"天之苍苍，其正色邪？其远而无所至极邪？其视下也，亦若是则已矣。","t":"天色深蓝，是它真正的颜色呢？还是因为太远而没有尽头看不透呢？鹏从天上往下看，也不过像人在地上看天一样罢了。"},{"o":"庄子与惠子游于濠梁之上。","t":"庄子和惠子在濠水的桥上游玩。"},{"o":"庄子曰：\"鯏鱼出游从容，是鱼之乐也。\"","t":"庄子说：\"鯈鱼在河水中游得多么悠闲自得，这就是鱼儿的快乐呀。\""},{"o":"惠子曰：\"子非鱼，安知鱼之乐？\"","t":"惠子说：\"你又不是鱼，怎么知道鱼的快乐呢？\""},{"o":"庄子曰：\"子非我，安知我不知鱼之乐？\"","t":"庄子说：\"你又不是我，怎么知道我不知道鱼的快乐呢？\""},{"o":"惠子曰：\"我非子，固不知子矣；子固非鱼也，子之不知鱼之乐，全矣！\"","t":"惠子说：\"我不是你，固然不知道你（的想法）；你本来也不是鱼，你不知道鱼的快乐，这是完全可以肯定的！\""},{"o":"庄子曰：\"请循其本。子曰'汝安知鱼乐'云者，既已知吾知之而问我，我知之濠上也。\"","t":"庄子说：\"请回到我们开头的话题。你问我'你哪里知道鱼的快乐'等等，说明你已经知道我知道鱼的快乐了，（所以你才来）问我。我是在濠水的桥上知道的。\""}],"n":[{"w":"北冥","m":"北海。冥，同\"溟\"，海"},{"w":"鲲","m":"传说中的一种大鱼"},{"w":"鹏","m":"传说中的一种大鸟"},{"w":"怒","m":"奋发，这里指鼓起翅膀"},{"w":"垂天之云","m":"悬挂在天空的云"},{"w":"海运","m":"海动，海上风起波涌"},{"w":"徙","m":"迁移"},{"w":"南冥","m":"南海"},{"w":"天池","m":"天然的水池"},{"w":"齐谐","m":"书名，记载怪异事物的书"},{"w":"志怪","m":"记载怪异的事物。志，记载"},{"w":"击","m":"拍打，这里指鹏起飞时翅膀拍打水面"},{"w":"抟","m":"盘旋而上"},{"w":"扶摇","m":"旋风"},{"w":"息","m":"气息，这里指风"},{"w":"野马","m":"指春天林泽间的雾气，浮动如野马奔腾"},{"w":"苍苍","m":"深蓝色"},{"w":"邪","m":"同\"耶\"，疑问语气词"},{"w":"无所至极","m":"没有尽头"},{"w":"是","m":"这样"},{"w":"惠子","m":"即惠施，宋国人，战国时期哲学家，庄子的好友和辩论对手"},{"w":"濠梁","m":"濠水的桥。濠，水名。梁，桥"},{"w":"鯏鱼","m":"银白色的小鱼。鯏（tiáo）"},{"w":"从容","m":"悠闲自得"},{"w":"安","m":"怎么，哪里"},{"w":"固","m":"本来、固然"},{"w":"全矣","m":"完全确定。全，完备、确定"},{"w":"循其本","m":"回到话题的最初。循，追溯。本，本源、开头"},{"w":"云者","m":"这样说"},{"w":"既已","m":"已经"}],"a":"**第一则《北冥有鱼》：** 本文通过描绘鲲鹏的巨大形象和恢弘壮阔的飞行场景，展现了庄子奇特丰富的想象力和宏大开阔的视野。文章以鲲鹏的远飞比喻人应当超越眼前的小天地，追求更高远的精神境界，体现了庄子追求自由、超越世俗的哲学思想。\n\n**第二则《庄子与惠子游于濠梁之上》：** 本文记录了庄子和惠子之间一场关于\"知\"与\"不知\"的趣味辩论。惠子从逻辑的角度质疑庄子不能感知鱼的快乐，而庄子则以巧妙的语言反驳，将惠子的质疑转化为对自己已经\"知之\"的确认。这场辩论展现了庄子机智幽默的辩论风格，也反映了庄子主张人与自然相通、万物可以感知的哲学观点。"},"23":{"o":"晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。\n\n林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。\n\n见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云：\"不足为外人道也。\"\n\n既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。\n\n南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。","t":[{"o":"晋太元中，武陵人捕鱼为业。","t":"东晋太元年间，武陵郡有个人以打鱼为生。"},{"o":"缘溪行，忘路之远近。","t":"他顺着溪水划船前行，忘记了路程有多远。"},{"o":"忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。","t":"忽然遇到一片桃花林，夹着溪流两岸绵延数百步，中间没有别的树木，芳草鲜嫩美丽，落花纷纷飘散。"},{"o":"渔人甚异之，复前行，欲穷其林。","t":"渔人对此感到非常诧异，又继续向前走，想要走到那片林子的尽头。"},{"o":"林尽水源，便得一山，山有小口，仿佛若有光。","t":"桃花林在溪水发源的地方就没有了，在那里出现了一座山，山上有个小洞口，洞里隐隐约约好像有光亮。"},{"o":"便舍船，从口入。","t":"渔人就下了船，从洞口进去。"},{"o":"初极狭，才通人。","t":"起初洞口很狭窄，仅容一个人通过。"},{"o":"复行数十步，豁然开朗。","t":"又走了几十步，突然变得开阔敞亮了。"},{"o":"土地平旷，屋舍俨然，有良田、美池、桑竹之属。","t":"只见那里土地平坦开阔，房屋整整齐齐，有肥沃的田地、美丽的池塘以及桑树、竹子之类的植物。"},{"o":"阡陌交通，鸡犬相闻。","t":"田间小路交错相通，鸡鸣狗叫的声音能互相听到。"},{"o":"其中往来种作，男女衣着，悉如外人。","t":"村里的人来来往往耕种劳作，男男女女的穿戴打扮，完全和外面的人一样。"},{"o":"黄发垂髫，并怡然自乐。","t":"老人和小孩，都安闲快乐，自得其乐。"},{"o":"见渔人，乃大惊，问所从来。具答之。","t":"村里人看到渔人，感到非常惊讶，问他是从哪里来的。渔人详细地回答了他们。"},{"o":"便要还家，设酒杀鸡作食。","t":"就邀请渔人到自己家里去，摆酒杀鸡做饭来款待他。"},{"o":"村中闻有此人，咸来问讯。","t":"村里的人听说来了这么一个人，全都来打听消息。"},{"o":"自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。","t":"他们自己说他们的祖先为了躲避秦朝时的战乱，带领妻子儿女和乡邻来到这个与世隔绝的地方，不再出去了，于是就同外界的人隔绝了。"},{"o":"问今是何世，乃不知有汉，无论魏晋。","t":"他们问渔人现在是什么朝代，他们竟然不知道有汉朝，更不用说魏朝和晋朝了。"},{"o":"此人一一为具言所闻，皆叹惋。","t":"渔人把自己知道的事一一详细地告诉了他们，村里人都感叹惋惜。"},{"o":"余人各复延至其家，皆出酒食。","t":"其余的人各自又把渔人请到自己家中，都拿出美酒佳肴来款待他。"},{"o":"停数日，辞去。","t":"渔人停留了几天，告辞离去。"},{"o":"此中人语云：\"不足为外人道也。\"","t":"这里的人告诉他说：\"这里的情况不值得对外面的人说啊。\""},{"o":"既出，得其船，便扶向路，处处志之。","t":"渔人出来以后，找到了他的船，就顺着来时的路划回去，处处都做了记号。"},{"o":"及郡下，诣太守，说如此。","t":"到了武陵郡城，去拜见太守，报告了这番经历。"},{"o":"太守即遣人随其往，寻向所志，遂迷，不复得路。","t":"太守立即派人跟着他去，寻找先前所做的记号，结果迷了路，再也找不到通往桃花源的路了。"},{"o":"南阳刘子骥，高尚士也，闻之，欣然规往。","t":"南阳人刘子骥，是个志向高洁的隐士，听说了这件事，高兴地计划前往。"},{"o":"未果，寻病终。后遂无问津者。","t":"没有实现，不久就病死了。从此以后，就再也没有人去探寻桃花源了。"}],"n":[{"w":"缘","m":"沿着，顺着"},{"w":"穷","m":"走到尽头"},{"w":"舍","m":"舍弃，这里指放下、丢下（船）"},{"w":"豁然开朗","m":"形容由狭窄幽暗突然变得宽阔明亮"},{"w":"俨然","m":"整齐的样子"},{"w":"阡陌交通","m":"田间小路交错相通。阡陌，田间小路；交通，交错相通"},{"w":"黄发垂髫","m":"指老人和小孩。黄发，旧说是长寿的特征，借指老人；垂髫，垂下来的头发，借指小孩"},{"w":"要","m":"同\"邀\"，邀请"},{"w":"咸","m":"全，都"},{"w":"妻子","m":"妻子和儿女"},{"w":"绝境","m":"与世隔绝的地方"},{"w":"间隔","m":"隔绝，不通音信"},{"w":"无论","m":"不要说，更不必说"},{"w":"延","m":"邀请"},{"w":"具言","m":"详细地说出"},{"w":"叹惋","m":"感叹惋惜"},{"w":"不足","m":"不值得"},{"w":"扶","m":"沿着，顺着"},{"w":"志","m":"做记号"},{"w":"诣","m":"到、往，特指到尊长那里去"},{"w":"规","m":"计划，打算"},{"w":"问津","m":"问路，这里是探访、访求的意思。津，渡口"},{"w":"落英缤纷","m":"落花繁多的样子。落英，落花；缤纷，繁多而纷乱的样子"},{"w":"悉","m":"全，都"},{"w":"怡然","m":"愉快的样子"},{"w":"寻","m":"随即，不久"}],"a":"本文虚构了一个没有战乱、没有压迫、人人平等自由的理想社会——桃花源，表达了作者对黑暗现实的不满和对和平安宁、美好生活的向往。桃花源虽是虚构的世外桃源，但它寄托了广大人民对幸福生活的追求和渴望，也反映了陶渊明对当时战乱频仍、政治黑暗的社会现实的深刻批判。文章最后写桃花源不可复得，暗示这样的理想社会在当时是根本无法实现的。"},"24":{"o":"从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。伐竹取道，下见小潭，水尤清冽。全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。青树翠蔓，蒙络摇缀，参差披拂。\n\n潭中鱼可百许头，皆若空游无所依，日光下澈，影布石上。佁然不动，俶尔远逝，翕忽往来，翕忽尔去。似与游者相乐。\n\n潭西南而望，斗折蛇行，明灭可见。其岸势犬牙差互，不可知其源。\n\n坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。以其境过清，不可久居，乃记之而去。\n\n同游者：吴武陵，龚古，余弟宗玄。隶而从者，崔氏二小生：曰恕己，曰奉壹。","t":[{"o":"从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。","t":"从小丘向西走一百二十步，隔着竹林，听到了水声，好像人身上佩戴的玉珮、玉环相互碰击发出的声音，心里对此感到很高兴。"},{"o":"伐竹取道，下见小潭，水尤清冽。","t":"砍伐竹子开辟出一条道路，往下看见一个小潭，潭水格外清凉。"},{"o":"全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。","t":"小潭以整块石头为底，靠近岸边，石底有些部分翻卷出水面，形成了各种不同的形状，有的像水中的高地，有的像小岛，有的像高低不平的岩石，有的像陡峭的山崖。"},{"o":"青树翠蔓，蒙络摇缀，参差披拂。","t":"青葱的树木和翠绿的藤蔓，蒙盖缠绕、摇曳连缀，参差不齐，随风飘拂。"},{"o":"潭中鱼可百许头，皆若空游无所依，日光下澈，影布石上。","t":"潭中的鱼大约有一百来条，都好像在空中游动，没有什么依傍似的，阳光直照到水底，鱼的影子映在石头上。"},{"o":"佁然不动，俶尔远逝，翕忽往来，翕忽尔去。","t":"鱼儿呆呆地停在那里一动不动，忽然间又向远处游去，来来往往轻快敏捷，好像在和游人逗乐。"},{"o":"似与游者相乐。","t":"好像在和游人一起欢乐。"},{"o":"潭西南而望，斗折蛇行，明灭可见。","t":"向小石潭的西南方向望去，溪水像北斗七星那样曲折，又像蛇那样蜿蜒爬行，时隐时现。"},{"o":"其岸势犬牙差互，不可知其源。","t":"溪岸的形状像狗的牙齿那样参差不齐，不能知道它的源头在哪里。"},{"o":"坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。","t":"坐在小石潭上，四面被竹子和树木环绕包围，寂静寥落没有旁人，使人感到心神凄凉，寒气透骨，幽静深远，充满忧伤。"},{"o":"以其境过清，不可久居，乃记之而去。","t":"因为这里的环境过于凄清，不能长时间停留，于是就把当时的情景记下来便离开了。"},{"o":"同游者：吴武陵，龚古，余弟宗玄。","t":"一同去游览的人有：吴武陵、龚古、我的弟弟宗玄。"},{"o":"隶而从者，崔氏二小生：曰恕己，曰奉壹。","t":"跟着同去的两个姓崔的年轻人，一个叫恕己，一个叫奉壹。"}],"n":[{"w":"篁竹","m":"竹林。篁，竹林"},{"w":"珮环","m":"玉珮和玉环，都是玉制的装饰品"},{"w":"清冽","m":"清凉。冽，寒冷"},{"w":"全石以为底","m":"即\"以全石为底\"，用整块石头作为潭底"},{"w":"坻","m":"水中高地"},{"w":"屿","m":"小岛"},{"w":"嵁","m":"高低不平的岩石"},{"w":"蒙络","m":"蒙盖缠绕"},{"w":"摇缀","m":"摇曳连缀"},{"w":"参差披拂","m":"参差不齐，随风飘动"},{"w":"可","m":"大约"},{"w":"许","m":"用在数词后表示约数，相当于\"来\""},{"w":"佁然","m":"呆呆的样子"},{"w":"俶尔","m":"忽然"},{"w":"翕忽","m":"轻快敏捷的样子"},{"w":"斗折蛇行","m":"像北斗七星那样曲折，像蛇那样蜿蜒爬行"},{"w":"犬牙差互","m":"像狗的牙齿那样参差不齐"},{"w":"悄怆","m":"忧伤的样子"},{"w":"幽邃","m":"幽静深远"},{"w":"以","m":"因为"},{"w":"清","m":"凄清、冷清"},{"w":"隶","m":"附属，随从"},{"w":"从","m":"跟随"},{"w":"小生","m":"年轻人"}],"a":"本文通过描绘小石潭的石、水、鱼、树等景物，借景抒情，先写发现小石潭的喜悦，再写潭中景物的优美，最后因环境的凄清而感到悲伤。这种由乐到悲的情感变化，深刻地反映了作者被贬谪后孤寂悲凉的心境。文章寓情于景，情景交融，是一篇优秀的山水游记。"},"25":{"o":"明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，以至鸟兽、木石，罔不因势象形，各具情态。尝贻余核舟一，盖大苏泛赤壁云。\n\n舟首尾长约八分有奇，高可二黍许。中轩敞者为舱，篛篷覆之。旁开小窗，左右各四，共八扇。启窗而观，雕栏相望焉。闭之，则右刻\"山高月小，水落石出\"，左刻\"清风徐来，水波不兴\"，石青糁之。\n\n船头坐三人，中峨冠而多髯者为东坡，佛印居右，鲁直居左。苏、黄共阅一手卷。东坡右手执卷端，左手抚鲁直背。鲁直左手执卷末，右手指卷，如有所语。东坡现右足，鲁直现左足，各微侧，其两膝相比者，各隐卷底衣褶中。佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属。卧右膝，诎右臂支船，而竖其左膝，左臂挂念珠倚之——珠可历历数也。\n\n舟尾横卧一楫。楫左右舟子各一人。居右者椎髻仰面，左手倚一衡木，右手攀右趾，若啸呼状。居左者右手执蒲葵扇，左手抚炉，炉上有壶，其人视端容寂，若听茶声然。\n\n其船背稍夷，则题名其上，文曰\"天启壬戌秋日，虞山王毅叔远甫刻\"，细若蚊足，钩画了了，其色墨。又用篆章一，文曰\"初平山人\"，其色丹。\n\n通计一舟，为人五；为窗八；为篛篷，为楫，为炉，为壶，为手卷，为念珠各一；对联、题名并篆文，为字共三十有四。而计其长曾不盈寸。盖简桃核修狭者为之。嘻，技亦灵怪矣哉！","t":[{"o":"明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，以至鸟兽、木石，罔不因势象形，各具情态。","t":"明代有个手艺奇妙精巧的人叫王叔远，能够用直径一寸的木头，雕刻成宫殿房屋、器具皿物、人物形象，以及鸟兽、树木石头，无不顺着木头原来的样子来模拟各种事物的形状，各自具有不同的情态。"},{"o":"尝贻余核舟一，盖大苏泛赤壁云。","t":"他曾经赠送给我一个用果核雕刻成的小船，刻的应当是苏轼乘船游赤壁的情景。"},{"o":"舟首尾长约八分有奇，高可二黍许。","t":"小船从头到尾大约八分多一点，高度大约有两个黄米粒那么高。"},{"o":"中轩敞者为舱，篛篷覆之。","t":"中间高起而宽敞的部分是船舱，上面覆盖着箬竹叶做成的船篷。"},{"o":"旁开小窗，左右各四，共八扇。","t":"船舱旁边开着小窗户，左右各四扇，一共八扇。"},{"o":"启窗而观，雕栏相望焉。","t":"打开窗户来看，雕刻着花纹的栏杆左右相对。"},{"o":"闭之，则右刻\"山高月小，水落石出\"，左刻\"清风徐来，水波不兴\"，石青糁之。","t":"关上窗户，就看到右边刻着\"山高月小，水落石出\"，左边刻着\"清风徐来，水波不兴\"，用石青涂在刻字的凹处。"},{"o":"船头坐三人，中峨冠而多髯者为东坡，佛印居右，鲁直居左。","t":"船头坐着三个人，中间戴着高帽子、长着浓密胡须的是苏东坡，佛印在右边，黄鲁直在左边。"},{"o":"苏、黄共阅一手卷。","t":"苏东坡和黄鲁直共同观看一幅书画长卷。"},{"o":"东坡右手执卷端，左手抚鲁直背。","t":"东坡右手拿着画卷的前端，左手抚在鲁直的背上。"},{"o":"鲁直左手执卷末，右手指卷，如有所语。","t":"鲁直左手拿着画卷的末端，右手指着画卷，好像在说什么话似的。"},{"o":"东坡现右足，鲁直现左足，各微侧，其两膝相比者，各隐卷底衣褶中。","t":"东坡露出右脚，鲁直露出左脚，各自微微侧着身子，他们互相靠近的两个膝盖，各自隐藏在画卷下面的衣褶里。"},{"o":"佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属。","t":"佛印极像弥勒菩萨，敞开胸襟露出两乳，抬头仰望，神态表情和苏、黄二人不相类似。"},{"o":"卧右膝，诎右臂支船，而竖其左膝，左臂挂念珠倚之——珠可历历数也。","t":"他平放着右腿，弯曲着右臂支撑在船上，而竖起他的左膝盖，左臂上挂着一串念珠靠在左膝上——念珠可以清清楚楚地数出来。"},{"o":"舟尾横卧一楫。","t":"船尾横放着一支船桨。"},{"o":"楫左右舟子各一人。","t":"船桨的左右两边各有一个船夫。"},{"o":"居右者椎髻仰面，左手倚一衡木，右手攀右趾，若啸呼状。","t":"在右边的人梳着椎形发髻，仰着脸，左手靠着一根横木，右手扳着右脚趾，好像在大声呼叫的样子。"},{"o":"居左者右手执蒲葵扇，左手抚炉，炉上有壶，其人视端容寂，若听茶声然。","t":"在左边的人右手拿着蒲葵扇，左手抚着火炉，炉子上面有个水壶，那个人目光正视，神色平静，好像在听茶水烧开的声音似的。"},{"o":"其船背稍夷，则题名其上，文曰\"天启壬戌秋日，虞山王毅叔远甫刻\"，细若蚊足，钩画了了，其色墨。","t":"那个船底比较平坦，就在上面刻着题名，文字是\"天启壬戌秋日，虞山王毅叔远甫刻\"，笔画细小得像蚊子的脚，一笔一画都清清楚楚，字的颜色是黑的。"},{"o":"又用篆章一，文曰\"初平山人\"，其色丹。","t":"另外还刻了一个篆文图章，文字是\"初平山人\"，字的颜色是红的。"},{"o":"通计一舟，为人五；为窗八；为篛篷，为楫，为炉，为壶，为手卷，为念珠各一；对联、题名并篆文，为字共三十有四。","t":"总计这一条小船上，刻了五个人；八扇窗户；箬竹船篷、船桨、火炉、水壶、手卷、念珠各一件；对联、题名和篆文图章上的字，一共三十四个。"},{"o":"而计其长曾不盈寸。盖简桃核修狭者为之。","t":"可是计算它的长度还不到一寸。原来是挑选了长而窄的桃核来雕刻的。"},{"o":"嘻，技亦灵怪矣哉！","t":"啊，技艺也真是神奇灵妙极了！"}],"n":[{"w":"径寸","m":"直径一寸"},{"w":"罔不","m":"无不，全都"},{"w":"因势象形","m":"顺着木头原来的样子来模拟各种事物的形状。因，顺着；象，模拟"},{"w":"贻","m":"赠"},{"w":"有奇","m":"有余，多一些。奇，零数、余数"},{"w":"黍许","m":"黄米粒那么大。许，上下、左右，表示约数"},{"w":"轩敞","m":"高起而宽敞"},{"w":"篛篷","m":"用箬竹叶做成的船篷"},{"w":"糁","m":"涂"},{"w":"峨冠","m":"高高的帽子"},{"w":"髯","m":"两腮的胡须，泛指胡须"},{"w":"相比","m":"靠近。比，靠近"},{"w":"绝类","m":"极像"},{"w":"矫首","m":"抬头"},{"w":"不属","m":"不相类似"},{"w":"诎","m":"弯曲"},{"w":"历历","m":"分明可数的样子"},{"w":"楫","m":"船桨"},{"w":"椎髻","m":"梳成椎形的发髻"},{"w":"衡","m":"同\"横\""},{"w":"夷","m":"平"},{"w":"了了","m":"清清楚楚"},{"w":"曾不盈寸","m":"还不到一寸。曾，竟然；盈，满"},{"w":"简","m":"挑选"},{"w":"修狭","m":"长而窄"},{"w":"灵怪","m":"神奇灵妙"},{"w":"手卷","m":"横幅的书画长卷"}],"a":"本文通过详细介绍王叔远雕刻核舟的精湛技艺，赞颂了我国古代工艺美术的卓越成就和民间艺人的聪明才智。文章按照空间顺序，从船中到船头、船尾再到船背，有条不紊地描写了核舟的各个部分，最终以\"技亦灵怪矣哉\"的赞叹作结，表达了对雕刻者高超技艺的由衷赞叹。全文说明顺序清晰，描写细致入微，是古代说明文的典范之作。"},"26":{"o":"崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。是日更定，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。\n\n到亭上，有两人铺毡对坐，一童子烧酒炉正沸。见余，大喜曰：\"湖中焉得更有此人！\"拉余同饮。余强饮三大白而别。问其姓氏，是金陵人，客此。\n\n及下船，舟子喃喃曰：\"莫说相公痴，更有痴似相公者！\"","t":[{"o":"崇祯五年十二月，余住西湖。","t":"崇祯五年十二月，我住在西湖边。"},{"o":"大雪三日，湖中人鸟声俱绝。","t":"接连下了三天大雪，湖中行人、飞鸟的声音都消失了。"},{"o":"是日更定，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。","t":"这天晚上初更时分，我划着一叶小舟，裹着毛皮衣，带着火炉，独自前往湖心亭看雪。"},{"o":"雾凇沆砀，天与云与山与水，上下一白。","t":"湖面上冰花一片弥漫，天与云与山与水，浑然一体，白茫茫一片。"},{"o":"湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。","t":"湖上比较清晰的影子，只有西湖长堤的一道痕迹、湖心亭的一个小点，以及我的一叶小舟和舟中的两三个人影罢了。"},{"o":"到亭上，有两人铺毡对坐，一童子烧酒炉正沸。","t":"到了湖心亭上，有两个人铺着毛毡相对而坐，一个书童正在把酒炉里的酒烧得滚沸。"},{"o":"见余，大喜曰：\"湖中焉得更有此人！\"","t":"他们看到我，非常高兴地说：\"在湖中怎么还能碰上这样的人呢！\""},{"o":"拉余同饮。","t":"拉着我一同饮酒。"},{"o":"余强饮三大白而别。","t":"我尽力饮了三大杯酒，然后和他们道别。"},{"o":"问其姓氏，是金陵人，客此。","t":"问他们的姓名，得知是金陵人，在此地客居。"},{"o":"及下船，舟子喃喃曰：\"莫说相公痴，更有痴似相公者！\"","t":"等到下船的时候，船夫喃喃自语说：\"不要说相公您痴，还有像相公一样痴的人呢！\""}],"n":[{"w":"崇祯五年","m":"公元1632年。崇祯，明思宗朱由检的年号"},{"w":"更定","m":"指初更开始，晚上八点左右。更，古代夜间的计时单位"},{"w":"拏","m":"划（船），撑（船）"},{"w":"毳衣","m":"用毛皮制成的衣服。毳，鸟兽的细毛"},{"w":"雾凇","m":"湖面上弥漫的水汽凝成的冰花"},{"w":"沆砀","m":"白气弥漫的样子"},{"w":"一白","m":"全白"},{"w":"一痕","m":"一道痕迹"},{"w":"一芥","m":"一棵小草，比喻极其微小"},{"w":"焉得","m":"怎么能，哪能"},{"w":"更有","m":"再有"},{"w":"大白","m":"大酒杯"},{"w":"客此","m":"在此地客居。客，客居，作客"},{"w":"喃喃","m":"连续不断地小声自语"},{"w":"相公","m":"旧时对士人的尊称"},{"w":"痴","m":"痴迷，这里指对山水雪景的极度迷恋"},{"w":"毡","m":"用鸟兽毛制成的毡子"},{"w":"俱","m":"全，都"}],"a":"本文通过描写作者在雪夜独往湖心亭看雪的奇遇，表达了一种清高脱俗的闲情雅趣和深沉的故国之思。张岱以极为精练的白描手法写雪景，用\"一痕\"\"一点\"\"一芥\"\"两三粒\"等极简的量词，勾勒出天地间苍茫寥廓的意境，既体现了晚明小品文清雅孤绝的风格，也暗含了作者对故国的怀念和对自我精神世界的坚守。文末以舟子\"痴\"的评价作结，表面写\"痴\"，实则寄托深情。"},"27":{"o":"十年春，齐师伐我。公将战，曹刿请见。其乡人曰：\"肉食者谋之，又何间焉？\"刿曰：\"肉食者鄙，未能远谋。\"乃入见。\n\n问：\"何以战？\"公曰：\"衣食所安，弗敢专也，必以分人。\"对曰：\"小惠未遍，民弗从也。\"公曰：\"牺牲玉帛，弗敢加也，必以信。\"对曰：\"小信未孚，神弗福也。\"公曰：\"小大之狱，虽不能察，必以情。\"对曰：\"忠之属也。可以一战。战则请从。\"\n\n公与之乘，战于长勺。公将鼓之。刿曰：\"未可。\"齐人三鼓。刿曰：\"可矣。\"齐师败绩。公将驰之。刿曰：\"未可。\"下视其辙，登轼而望之，曰：\"可矣。\"遂逐齐师。\n\n既克，公问其故。对曰：\"夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。夫大国，难测也，惧有伏焉。吾视其辙乱，望其旗靡，故逐之。\"","t":[{"o":"十年春，齐师伐我。","t":"鲁庄公十年的春天，齐国军队攻打我们鲁国。"},{"o":"公将战，曹刿请见。","t":"鲁庄公将要迎战，曹刿请求拜见鲁庄公。"},{"o":"其乡人曰：\"肉食者谋之，又何间焉？\"","t":"他的同乡说：\"有权位的肉食者会谋划这件事的，你又何必参与呢？\""},{"o":"刿曰：\"肉食者鄙，未能远谋。\"","t":"曹刿说：\"有权位的人目光短浅，不能深谋远虑。\""},{"o":"乃入见。","t":"于是他进宫去拜见鲁庄公。"},{"o":"问：\"何以战？\"","t":"曹刿问道：\"您凭什么条件去打仗？\""},{"o":"公曰：\"衣食所安，弗敢专也，必以分人。\"","t":"鲁庄公说：\"衣食这些使人安逸的东西，我不敢独自享受，一定把它们分给别人。\""},{"o":"对曰：\"小惠未遍，民弗从也。\"","t":"曹刿回答说：\"这种小恩小惠不能遍及百姓，百姓是不会跟从您的。\""},{"o":"公曰：\"牺牲玉帛，弗敢加也，必以信。\"","t":"鲁庄公说：\"祭祀用的牛羊猪、玉器和丝织品，我不敢虚报夸大，一定对神诚实。\""},{"o":"对曰：\"小信未孚，神弗福也。\"","t":"曹刿回答说：\"这只是小信用，未能使神信任，神是不会保佑您的。\""},{"o":"公曰：\"小大之狱，虽不能察，必以情。\"","t":"鲁庄公说：\"大大小小的诉讼案件，即使不能一一明察，也一定根据实情来裁决。\""},{"o":"对曰：\"忠之属也。可以一战。战则请从。\"","t":"曹刿回答说：\"这是尽了本职的一类事情，可以凭这个条件打一仗。打仗时请允许我跟从您去。\""},{"o":"公与之乘，战于长勺。","t":"鲁庄公和他同乘一辆战车，在长勺与齐军作战。"},{"o":"公将鼓之。刿曰：\"未可。\"","t":"鲁庄公将要击鼓进军，曹刿说：\"不行。\""},{"o":"齐人三鼓。刿曰：\"可矣。\"","t":"齐国军队擂了三次鼓，曹刿说：\"可以了。\""},{"o":"齐师败绩。","t":"齐军大败。"},{"o":"公将驰之。刿曰：\"未可。\"","t":"鲁庄公将要驱车追击齐军，曹刿说：\"不行。\""},{"o":"下视其辙，登轼而望之，曰：\"可矣。\"","t":"曹刿走下车来察看齐军战车轮子留下的痕迹，又登上车前横木眺望齐军撤退的情况，才说：\"可以了。\""},{"o":"遂逐齐师。","t":"于是追击齐军。"},{"o":"既克，公问其故。","t":"打了胜仗以后，鲁庄公询问其中的原因。"},{"o":"对曰：\"夫战，勇气也。一鼓作气，再而衰，三而竭。","t":"曹刿回答说：\"打仗，靠的是勇气。第一次击鼓能够振作士兵的勇气，第二次击鼓勇气就衰退了，第三次击鼓勇气就耗尽了。"},{"o":"彼竭我盈，故克之。","t":"他们的勇气耗尽了而我方的勇气正旺盛，所以战胜了他们。"},{"o":"夫大国，难测也，惧有伏焉。","t":"大国是难以推测的，怕他们在那里设有埋伏。"},{"o":"吾视其辙乱，望其旗靡，故逐之。\"","t":"我看到他们的车轮痕迹混乱，望见他们的旗帜倒下了，所以才追击他们。\""}],"n":[{"w":"十年","m":"鲁庄公十年（公元前684年）"},{"w":"齐师","m":"齐国军队"},{"w":"伐","m":"攻打"},{"w":"我","m":"指鲁国。《左传》是鲁国史官所记，故称鲁国为\"我\""},{"w":"肉食者","m":"吃肉的人，指有权位的贵族"},{"w":"间","m":"参与"},{"w":"鄙","m":"浅陋，这里指目光短浅"},{"w":"何以战","m":"即\"以何战\"，凭什么作战。何以，即\"以何\"，宾语前置"},{"w":"安","m":"养，这里指养生的东西"},{"w":"专","m":"独自享有"},{"w":"牺牲","m":"祭祀用的猪、牛、羊等"},{"w":"加","m":"虚夸，以少报多"},{"w":"信","m":"诚实，实情"},{"w":"孚","m":"为人所信服"},{"w":"福","m":"赐福，保佑"},{"w":"狱","m":"诉讼案件"},{"w":"情","m":"实情"},{"w":"忠","m":"尽力做好本分的事"},{"w":"鼓","m":"击鼓进军。名词用作动词"},{"w":"驰","m":"驱车追赶"},{"w":"轼","m":"古代车厢前扶手的横木"},{"w":"既","m":"已经"},{"w":"克","m":"战胜"},{"w":"夫","m":"发语词，无实义"},{"w":"一鼓作气","m":"第一次击鼓能够振作勇气"},{"w":"再","m":"第二次"},{"w":"竭","m":"耗尽"},{"w":"盈","m":"充满，这里指士气旺盛"},{"w":"伏","m":"埋伏"},{"w":"靡","m":"倒下"}],"a":"本文记述了齐鲁长勺之战的经过，通过曹刿与鲁庄公的对话和战场上的指挥，阐明了取信于民是战争胜利的先决条件这一政治观点，同时强调了在战争中把握战机、知己知彼的重要性。曹刿在战前指出\"小大之狱，虽不能察，必以情\"才是可以一战的条件，体现了民本思想；在战斗中提出\"一鼓作气\"和观察\"辙乱旗靡\"再追击的战术原则，表现了其卓越的军事才能。"},"28":{"o":"邹忌修八尺有余，而形貌昳丽。朝服衣冠，窥镜，谓其妻曰：\"我孰与城北徐公美？\"其妻曰：\"君美甚，徐公何能及君也？\"城北徐公，齐国之美丽者也。忌不自信，而复问其妾曰：\"吾孰与徐公美？\"妾曰：\"徐公何能及君也？\"旦日，客从外来，与坐谈，问之客曰：\"吾与徐公孰美？\"客曰：\"徐公不若君之美也。\"\n\n明日徐公来，孰视之，自以为不如；窥镜而自视，又弗如远甚。暮寝而思之，曰：\"吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也。\"\n\n于是入朝见威王，曰：\"臣诚知不如徐公美。臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王：由此观之，王之蔽甚矣。\"\n\n王曰：\"善。\"乃下令：\"群臣吏民能面刺寡人之过者，受上赏；上书谏寡人者，受中赏；能谤讥于市朝，闻寡人之耳者，受下赏。\"\n\n令初下，群臣进谏，门庭若市；数月之后，时时而间进；期年之后，虽欲言，无可进者。\n\n燕、赵、韩、魏闻之，皆朝于齐。此所谓战胜于朝廷。","t":[{"o":"邹忌修八尺有余，而形貌昳丽。","t":"邹忌身高八尺多，而且容貌光艳美丽。"},{"o":"朝服衣冠，窥镜，谓其妻曰：\"我孰与城北徐公美？\"","t":"早晨穿好衣服戴好帽子，照着镜子，对他的妻子说：\"我跟城北的徐公相比谁更漂亮？\""},{"o":"其妻曰：\"君美甚，徐公何能及君也？\"","t":"他的妻子说：\"您漂亮极了，徐公怎么能比得上您呢？\""},{"o":"城北徐公，齐国之美丽者也。","t":"城北的徐公，是齐国的美男子。"},{"o":"忌不自信，而复问其妾曰：\"吾孰与徐公美？\"","t":"邹忌不相信自己比徐公漂亮，又去问他的妾说：\"我跟徐公谁更漂亮？\""},{"o":"妾曰：\"徐公何能及君也？\"","t":"妾说：\"徐公怎么能比得上您呢？\""},{"o":"旦日，客从外来，与坐谈，问之客曰：\"吾与徐公孰美？\"","t":"第二天，有客人从外面来，邹忌与他坐着交谈，问客人说：\"我和徐公谁更漂亮？\""},{"o":"客曰：\"徐公不若君之美也。\"","t":"客人说：\"徐公不如您漂亮。\""},{"o":"明日徐公来，孰视之，自以为不如；","t":"第二天徐公来了，邹忌仔细端详他，自己觉得不如徐公漂亮；"},{"o":"窥镜而自视，又弗如远甚。","t":"再照镜子看看自己，更是觉得远远比不上人家。"},{"o":"暮寝而思之，曰：\"吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也。\"","t":"晚上躺在床上反复思考这件事，说：\"我的妻子认为我漂亮，是因为偏爱我；我的妾认为我漂亮，是因为害怕我；我的客人认为我漂亮，是因为想有求于我。\""},{"o":"于是入朝见威王，曰：\"臣诚知不如徐公美。\"","t":"于是邹忌上朝去拜见齐威王，说：\"我确实知道自己不如徐公漂亮。"},{"o":"臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。","t":"可是我的妻子偏爱我，我的妾害怕我，我的客人想有求于我，都认为我比徐公漂亮。"},{"o":"今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王：由此观之，王之蔽甚矣。\"","t":"如今齐国国土纵横千里，有一百二十座城池，宫中的嫔妃和身边的侍从没有不偏爱大王的，朝廷中的大臣没有不害怕大王的，全国的百姓没有不有求于大王的：由此看来，大王受蒙蔽很深了。\""},{"o":"王曰：\"善。\"","t":"齐威王说：\"说得好。\""},{"o":"乃下令：\"群臣吏民能面刺寡人之过者，受上赏；上书谏寡人者，受中赏；能谤讥于市朝，闻寡人之耳者，受下赏。\"","t":"于是下达命令：\"各位大臣、官吏和百姓能够当面批评我过错的人，给予上等奖赏；上奏章规劝我的人，给予中等奖赏；能够在公共场所议论我的过失并且传到我耳朵里的，给予下等奖赏。\""},{"o":"令初下，群臣进谏，门庭若市；","t":"命令刚下达的时候，群臣都来进言规劝，门前和院子里像集市一样热闹；"},{"o":"数月之后，时时而间进；","t":"几个月以后，有时候间或有人进言规劝；"},{"o":"期年之后，虽欲言，无可进者。","t":"满一年以后，即使想要进言，也没有什么可以进谏的了。"},{"o":"燕、赵、韩、魏闻之，皆朝于齐。","t":"燕国、赵国、韩国、魏国听说了这件事，都到齐国来朝见。"},{"o":"此所谓战胜于朝廷。","t":"这就是人们所说的在朝廷上战胜了别国。"}],"n":[{"w":"修","m":"长，这里指身高"},{"w":"八尺","m":"约合现在的一米六七左右（古代尺短）"},{"w":"昳丽","m":"光艳美丽"},{"w":"朝服衣冠","m":"早晨穿戴好衣帽。朝，早晨；服，穿戴"},{"w":"窥镜","m":"照镜子。窥，照"},{"w":"孰与","m":"与……相比怎么样，谁更……"},{"w":"美","m":"认为……美"},{"w":"孰视","m":"仔细端详。孰，同\"熟\"，仔细"},{"w":"私","m":"偏爱"},{"w":"旦日","m":"第二天"},{"w":"明日","m":"第二天"},{"w":"诚","m":"确实"},{"w":"面","m":"当面，名词作状语"},{"w":"刺","m":"指责，批评"},{"w":"谤讥","m":"指责议论。谤，公开指责别人的过错"},{"w":"市朝","m":"公共场所"},{"w":"间进","m":"间或偶而进言"},{"w":"期年","m":"满一年。期，满一年，读jī"},{"w":"朝于齐","m":"到齐国来朝见"},{"w":"战胜于朝廷","m":"在朝廷上战胜别国，意思是内政修明，不需用武力就能使别国畏服"},{"w":"莫","m":"没有谁"},{"w":"蔽","m":"蒙蔽，这里指受蒙蔽"},{"w":"方千里","m":"纵横千里"}],"a":"本文通过邹忌以自身经历设喻劝说齐威王纳谏的故事，说明了广开言路、修明政治才能使国家强盛的道理。邹忌由家庭生活中的小事联想到国家大事，用类比推理的方法巧妙进谏，体现了高超的劝谏艺术。齐威王从善如流，悬赏求谏，使齐国政治清明、国力强盛，最终\"战胜于朝廷\"，不战而使四方来朝。文章告诉我们：一个人要有自知之明，善于听取不同意见；一个国家要广开言路、修明政治才能兴旺发达。"},"29":{"o":"庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴，乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上，属予作文以记之。\n\n予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯，朝晖夕阴，气象万千。此则岳阳楼之大观也，前人之述备矣。然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？\n\n若夫霪雨霏霏，连月不开，阴风怒号，浊浪排空，日星隐曜，山岳潜形，商旅不行，樯倾楫摧，薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。\n\n至若春和景明，波澜不惊，上下天光，一碧万顷，沙鸥翔集，锦鳞游泳，岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。\n\n嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲，居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰\"先天下之忧而忧，后天下之乐而乐\"乎！噫！微斯人，吾谁与归？\n\n时六年九月十五日。","t":[{"o":"庆历四年春，滕子京谪守巴陵郡。","t":"庆历四年的春天，滕子京被贬谪到巴陵郡做太守。"},{"o":"越明年，政通人和，百废具兴，乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上，属予作文以记之。","t":"到了第二年，政事顺利，百姓和乐，各种荒废的事业都重新兴办起来了，于是重新修建岳阳楼，扩大它原有的规模，把唐代名家和当今人士的诗词歌赋刻在上面，嘱托我写一篇文章来记述这件事。"},{"o":"予观夫巴陵胜状，在洞庭一湖。","t":"我观赏那巴陵郡的美景，都集中在洞庭湖上。"},{"o":"衔远山，吞长江，浩浩汤汤，横无际涯，朝晖夕阴，气象万千。","t":"它衔接远处的群山，吞吐长江的江水，浩浩荡荡，宽阔无边，早晴晚阴，气象万千。"},{"o":"此则岳阳楼之大观也，前人之述备矣。","t":"这就是岳阳楼的雄伟壮丽的景象，前人的记述已经很详尽了。"},{"o":"然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？","t":"既然这样，那么这里北面通向巫峡，南面直到潇水湘水，被贬的官员和诗人，大多在这里聚会，他们观赏自然景物而触发的感情，恐怕会有所不同吧？"},{"o":"若夫霪雨霏霏，连月不开，阴风怒号，浊浪排空，日星隐曜，山岳潜形，商旅不行，樯倾楫摧，薄暮冥冥，虎啸猿啼。","t":"像那阴雨连绵不断，一连几个月都不放晴，阴冷的风怒吼，浑浊的波浪冲向天空，太阳和星星隐藏了光辉，山岳隐没了形体，商人和旅客不能通行，桅杆倒下、船桨折断，傍晚天色昏暗，只听到老虎的咆哮和猿猴的悲啼。"},{"o":"登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。","t":"这时登上这座楼，就会产生离开京城、怀念家乡，担心遭到诽谤、害怕受到讥讽的情感，（会觉得）满眼全是萧条的景象，感慨到了极点而十分悲伤。"},{"o":"至若春和景明，波澜不惊，上下天光，一碧万顷，沙鸥翔集，锦鳞游泳，岸芷汀兰，郁郁青青。","t":"到了春风和煦、阳光明媚的时候，湖面平静，没有惊涛骇浪，天色湖光相连，一片碧绿、广阔无际，沙洲上的鸥鸟时而飞翔、时而停歇，美丽的鱼儿在水中游来游去，岸上的香草和小洲上的兰花，草木茂盛，青翠欲滴。"},{"o":"而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！","t":"有时大片烟雾完全消散，皎洁的月光一泻千里，波动的光闪着金色，静静的月影像沉入水中的玉璧，渔夫的歌声互相唱和，这种快乐哪有穷尽！"},{"o":"登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。","t":"这时登上这座楼，就会感到胸怀开阔、心情愉快，光荣和屈辱一并忘了，在清风中端起酒杯，高兴到了极点。"},{"o":"嗟夫！予尝求古仁人之心，或异二者之为，何哉？","t":"唉！我曾经探求过古代品德高尚的人的思想感情，或许跟上面说的两种思想感情不一样，为什么呢？"},{"o":"不以物喜，不以己悲，居庙堂之高则忧其民，处江湖之远则忧其君。","t":"（他们）不因为外物好坏和自己得失而或喜或悲，在朝廷上做官就为平民百姓担忧，被贬退居偏远江湖就为国君担忧。"},{"o":"是进亦忧，退亦忧。然则何时而乐耶？","t":"这样看来，在朝廷做官也担忧，退处偏远江湖也担忧。既然这样，那么什么时候才快乐呢？"},{"o":"其必曰\"先天下之忧而忧，后天下之乐而乐\"乎！","t":"他们一定会说\"在天下人忧愁之前先忧愁，在天下人快乐之后才快乐\"吧！"},{"o":"噫！微斯人，吾谁与归？","t":"唉！（如果）没有这种人，我同谁一道呢？"},{"o":"时六年九月十五日。","t":"写于庆历六年九月十五日。"}],"n":[{"w":"谪","m":"古代官吏因罪被降职或远调"},{"w":"越","m":"到，及"},{"w":"具","m":"同\"俱\"，全、皆"},{"w":"属","m":"同\"嘱\"，嘱托、嘱咐"},{"w":"胜状","m":"胜景，美景"},{"w":"衔","m":"衔接，连接"},{"w":"浩浩汤汤","m":"水波浩荡的样子。汤汤（shāng shāng）"},{"w":"晖","m":"日光，此处指晴天"},{"w":"迁客骚人","m":"迁客：被贬谪的官员；骚人：诗人。战国时屈原作《离骚》，因此后人也称诗人为骚人"},{"w":"霪雨","m":"连绵不断的雨"},{"w":"排空","m":"冲向天空"},{"w":"曜","m":"光辉、光芒"},{"w":"潜形","m":"隐没形体"},{"w":"薄暮","m":"迫近傍晚。薄，迫近"},{"w":"去国","m":"离开京城。国，国都"},{"w":"景明","m":"阳光明媚。景，日光"},{"w":"锦鳞","m":"美丽的鱼。鳞，代指鱼"},{"w":"岸芷汀兰","m":"岸上的香草和小洲上的兰花。芷，一种香草；汀，小洲"},{"w":"璧","m":"圆形的美玉，这里比喻水中的月影"},{"w":"宠辱偕忘","m":"荣耀和屈辱一并忘了。偕，一起、一并"},{"w":"庙堂","m":"朝廷"},{"w":"微","m":"没有"},{"w":"归","m":"归依，一同"}],"a":"本文通过描写岳阳楼周围的自然景色和不同天气条件下登楼者的不同感受，引出\"古仁人之心\"，表达了作者\"先天下之忧而忧，后天下之乐而乐\"的政治抱负和旷达胸襟。文章表面写景，实则抒发忧国忧民的高尚情怀，体现了作者不以个人得失为念的崇高精神境界，也含有对好友滕子京的规劝和勉励之意。"},"30":{"o":"环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。山行六七里，渐闻水声潺潺而泻出于两峰之间者，酿泉也。峰回路转，有亭翼然临于泉上者，醉翁亭也。作亭者谁？山之僧智仙也。名之者谁？太守自谓也。太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。\n\n若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。朝而往，暮而归，四时之景不同，而乐亦无穷也。\n\n至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。临溪而渔，溪深而鱼肥，酿泉为酒，泉香而酒洌，山肴野蔌，杂然而前陈者，太守宴也。宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。苍颜白发，颓然乎其间者，太守醉也。\n\n已而夕阳在山，人影散乱，太守归而宾客从也。树林阴翳，鸣声上下，游人去而禽鸟乐也。然而禽鸟知山林之乐，而不知人之乐；人知从太守游而乐，而不知太守之乐其乐也。醉能同其乐，醒能述以文者，太守也。太守谓谁？庐陵欧阳修也。","t":[{"o":"环滁皆山也。","t":"环绕着滁州的都是山。"},{"o":"其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。","t":"它西南方向的各个山峰，树林和山谷尤其美丽，远远望去树木茂盛、幽深秀丽的，是琅琊山。"},{"o":"山行六七里，渐闻水声潺潺而泻出于两峰之间者，酿泉也。","t":"沿着山路走六七里，渐渐听到潺潺的水声，从两座山峰之间飞泻而出的，是酿泉。"},{"o":"峰回路转，有亭翼然临于泉上者，醉翁亭也。","t":"山势回环，路也跟着转弯，有一座四角翘起像鸟张开翅膀一样高踞于泉水之上的亭子，是醉翁亭。"},{"o":"作亭者谁？山之僧智仙也。","t":"建造这亭子的是谁？是山里的和尚智仙。"},{"o":"名之者谁？太守自谓也。","t":"给它命名的是谁？是太守用自己的别号来命名的。"},{"o":"太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。","t":"太守和客人来这里喝酒，喝少量就醉了，而且年纪又最大，所以自己给自己起了个别号叫醉翁。"},{"o":"醉翁之意不在酒，在乎山水之间也。","t":"醉翁的情趣不在于喝酒，而在于山水之间。"},{"o":"山水之乐，得之心而寓之酒也。","t":"欣赏山水的乐趣，领会在心中，寄托在喝酒上。"},{"o":"若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。","t":"像那太阳出来，树林中的雾气散开，云彩聚拢，山谷里就昏暗了，阴暗晴朗的变化，就是山间的早晨和晚上。"},{"o":"野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。","t":"野花开放，有一股清幽的香味，美好的树木枝叶繁茂，形成浓郁的绿阴，天高气爽，霜色洁白，水位下降，石头露出，这就是山间四季的景色。"},{"o":"朝而往，暮而归，四时之景不同，而乐亦无穷也。","t":"早晨出去，傍晚回来，四季的景色不同，乐趣也是无穷无尽的。"},{"o":"至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。","t":"至于背着东西的人在路上唱歌，行人在树下休息，前面的人呼喊，后面的人应答，老人弯着腰走，大人拉着小孩走，来来往往络绎不绝的，是滁州人在游玩。"},{"o":"临溪而渔，溪深而鱼肥，酿泉为酒，泉香而酒洌，山肴野蔌，杂然而前陈者，太守宴也。","t":"到溪边钓鱼，溪水深鱼儿肥，用酿泉的水酿酒，泉水香甜酒水清醇，山中的野味野菜，交错地摆在面前的，是太守在宴请宾客。"},{"o":"宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。","t":"宴会喝酒的乐趣，不在于音乐，投壶的人投中了，下棋的人赢了，酒杯和酒筹交互错杂，时起时坐、大声喧哗的，是众位宾客在欢乐。"},{"o":"苍颜白发，颓然乎其间者，太守醉也。","t":"脸色苍老、满头白发，醉醺醺地坐在众人中间的，是太守喝醉了。"},{"o":"已而夕阳在山，人影散乱，太守归而宾客从也。","t":"不久，夕阳落在山头，人影纵横散乱，太守回去、宾客跟从着。"},{"o":"树林阴翳，鸣声上下，游人去而禽鸟乐也。","t":"树林茂密阴蔽，鸟雀叫声到处传来，游人离开后禽鸟欢乐了。"},{"o":"然而禽鸟知山林之乐，而不知人之乐；人知从太守游而乐，而不知太守之乐其乐也。","t":"然而禽鸟只懂得山林的快乐，却不懂得人的快乐；人们只懂得跟随太守游玩的快乐，却不懂得太守以宾客的快乐为快乐。"},{"o":"醉能同其乐，醒能述以文者，太守也。","t":"喝醉了能同大家一起欢乐，酒醒后能用文章来记述这件事的人，是太守。"},{"o":"太守谓谁？庐陵欧阳修也。","t":"太守是谁？是庐陵人欧阳修。"}],"n":[{"w":"壑","m":"山谷"},{"w":"蔚然","m":"草木茂盛的样子"},{"w":"翼然","m":"像鸟张开翅膀一样。翼，名词作状语"},{"w":"辄","m":"就"},{"w":"意","m":"情趣"},{"w":"寓","m":"寄托"},{"w":"霏","m":"雾气"},{"w":"暝","m":"昏暗"},{"w":"晦明","m":"晦，阴暗；明，明亮"},{"w":"芳","m":"花"},{"w":"秀","m":"茂盛、繁茂"},{"w":"负者","m":"背着东西的人"},{"w":"伛偻提携","m":"伛偻（yǔ lǚ），弯腰曲背，指老人；提携，搀扶带领，指小孩"},{"w":"洌","m":"清、清澈"},{"w":"山肴野蔌","m":"山肴，野味；野蔌，野菜。蔌（sù），菜蔬"},{"w":"觥筹","m":"觥（gōng），酒器；筹，酒筹，饮酒计数的签子"},{"w":"阴翳","m":"枝叶茂密遮蔽成荫。翳，遮蔽"},{"w":"乐其乐","m":"以……为乐。前一个\"乐\"为意动用法，\"以……为乐\""}],"a":"本文以\"醉翁之意不在酒，在乎山水之间也\"为线索，通过描写醉翁亭周围的自然景色和滁州百姓游乐的场面，表达了作者\"与民同乐\"的政治理想和寄情山水的旷达情怀。全文用21个\"也\"字结尾，形成一唱三叹的独特韵味，既表现了作者被贬后乐观豁达的人生态度，也体现了他关心百姓、与民同乐的开明政治理念。"},"31":{"o":"先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。诚宜开张圣听，以光先帝遗德，恢弘志士之气，不宜妄自菲薄，引喻失义，以塞忠谏之路也。\n\n宫中府中，俱为一体，陟罚臧否，不宜异同。若有作奸犯科及为忠善者，宜付有司论其刑赏，以昭陛下平明之理，不宜偏私，使内外异法也。\n\n侍中、侍郎郭攸之、费祎、董允等，此皆良实，志虑忠纯，是以先帝简拔以遗陛下。愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。\n\n将军向宠，性行淑均，晓畅军事，试用于昔日，先帝称之曰能，是以众议举宠为督。愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。\n\n亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。先帝在时，每与臣论此事，未尝不叹息痛恨于桓、灵也。侍中、尚书、长史、参军，此悉贞良死节之臣，愿陛下亲之信之，则汉室之隆，可计日而待也。\n\n臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，由是感激，遂许先帝以驱驰。后值倾覆，受任于败军之际，奉命于危难之间，尔来二十有一年矣。\n\n先帝知臣谨慎，故临崩寄臣以大事也。受命以来，夙夜忧叹，恐托付不效，以伤先帝之明，故五月渡泸，深入不毛。今南方已定，兵甲已足，当奖率三军，北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。此臣所以报先帝而忠陛下之职分也。\n\n至于斟酌损益，进尽忠言，则攸之、祎、允之任也。愿陛下托臣以讨贼兴复之效，不效，则治臣之罪，以告先帝之灵。若无兴德之言，则责攸之、祎、允等之慢，以彰其咎；陛下亦宜自谋，以咨诹善道，察纳雅言，深追先帝遗诏，臣不胜受恩感激。\n\n今当远离，临表涕零，不知所言。","t":[{"o":"先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。","t":"先帝开创统一天下的大业还未完成一半，就中途去世了。现在天下分为三国，益州民力困乏，这实在是危急存亡的时刻啊。"},{"o":"然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。","t":"然而在朝廷里侍卫的臣子们毫不懈怠，忠诚有志的将士们在外面奋不顾身，大概是因为追念先帝对他们特殊的厚遇，想要报答给陛下。"},{"o":"诚宜开张圣听，以光先帝遗德，恢弘志士之气，不宜妄自菲薄，引喻失义，以塞忠谏之路也。","t":"（陛下）实在应该广泛听取群臣的意见，来发扬光大先帝遗留下来的美德，振奋有志之士的气概，不应该随便看轻自己，引用不恰当的譬喻，以致堵塞了忠言进谏的道路。"},{"o":"宫中府中，俱为一体，陟罚臧否，不宜异同。","t":"皇宫中和朝廷中，本就是一个整体，晋升、处罚、赞扬、批评，不应该（标准）不同。"},{"o":"若有作奸犯科及为忠善者，宜付有司论其刑赏，以昭陛下平明之理，不宜偏私，使内外异法也。","t":"如果有做奸邪事情、犯科条法令以及尽忠做善事的人，应该交给主管的官员来判定他们受罚或受赏，来显示陛下公平清明的治理，不应该偏袒私心，使宫内和朝廷的刑赏之法不同。"},{"o":"侍中、侍郎郭攸之、费祎、董允等，此皆良实，志虑忠纯，是以先帝简拔以遗陛下。","t":"侍中、侍郎郭攸之、费祎、董允等人，这些都是善良诚实的人，他们的志向和心思忠诚无二，因此先帝选拔出来留给陛下。"},{"o":"愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。","t":"我认为宫里的事情，无论大小，都拿来跟他们商量，然后再去施行，一定能够弥补缺点和疏漏，获得更多的益处。"},{"o":"将军向宠，性行淑均，晓畅军事，试用于昔日，先帝称之曰能，是以众议举宠为督。","t":"将军向宠，性情品行善良公正，精通军事，在以前试用的时候，先帝称赞他有才干，因此大家商议推举他做中部督。"},{"o":"愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。","t":"我认为军营里的事情，都拿来跟他商量，就一定能使军队团结和睦，好的差的各得其所。"},{"o":"亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。","t":"亲近贤臣，疏远小人，这是西汉兴盛的原因；亲近小人，疏远贤臣，这是东汉衰败的原因。"},{"o":"先帝在时，每与臣论此事，未尝不叹息痛恨于桓、灵也。","t":"先帝在世的时候，每次跟我谈论起这些事，没有一次不对桓帝、灵帝的作为感到叹息痛心遗憾的。"},{"o":"侍中、尚书、长史、参军，此悉贞良死节之臣，愿陛下亲之信之，则汉室之隆，可计日而待也。","t":"侍中、尚书、长史、参军，这些人都是坚贞可靠、能够以死报国的忠臣，希望陛下亲近他们、信任他们，那么汉室的复兴，就可以计着日子来等待了。"},{"o":"臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。","t":"我本来是一个平民，亲自在南阳耕种，只求在乱世中保全性命，不奢求在诸侯之中闻名显达。"},{"o":"先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，由是感激，遂许先帝以驱驰。","t":"先帝不嫌弃我出身低微、见识浅陋，委屈自己降低了身份，三次到草庐中来看望我，拿当代的大事来询问我，因此我十分感动振奋，于是答应为先帝奔走效劳。"},{"o":"后值倾覆，受任于败军之际，奉命于危难之间，尔来二十有一年矣。","t":"后来遭遇失败，（我）在战事失败的时候接受了任命，在危难的关头奉命出使，从那时到现在二十一年了。"},{"o":"先帝知臣谨慎，故临崩寄臣以大事也。","t":"先帝知道我做事谨慎，所以在临终前把国家大事托付给我。"},{"o":"受命以来，夙夜忧叹，恐托付不效，以伤先帝之明，故五月渡泸，深入不毛。","t":"接受遗命以来，我日夜忧愁叹息，只怕先帝托付给我的事情不能完成，从而损害先帝的英明，所以我五月渡过泸水，深入到荒凉之地。"},{"o":"今南方已定，兵甲已足，当奖率三军，北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。","t":"现在南方已经平定，兵员装备已经充足，应当率领三军，北伐平定中原，我希望竭尽自己平庸的才智，铲除奸邪凶恶的敌人，复兴汉室，回到原来的都城。"},{"o":"此臣所以报先帝而忠陛下之职分也。","t":"这就是我用来报答先帝、尽忠于陛下的职责本分。"},{"o":"至于斟酌损益，进尽忠言，则攸之、祎、允之任也。","t":"至于考虑朝政的得失兴革，尽力进献忠言，那就是郭攸之、费祎、董允等人的责任了。"},{"o":"愿陛下托臣以讨贼兴复之效，不效，则治臣之罪，以告先帝之灵。","t":"希望陛下把讨伐奸贼、复兴汉室的任务交给我，如果没有成效，就治我的
