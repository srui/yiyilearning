罪，来告慰先帝的在天之灵。"},{"o":"若无兴德之言，则责攸之、祎、允等之慢，以彰其咎；陛下亦宜自谋，以咨诹善道，察纳雅言，深追先帝遗诏，臣不胜受恩感激。","t":"如果没有劝勉发扬圣德的言论，就责罚郭攸之、费祎、董允等人的怠慢，来揭示他们的过失；陛下也应该自行谋划，征询治国的好方法，明察并采纳正确的话，深切追念先帝的遗诏，我就受恩感激不尽了。"},{"o":"今当远离，临表涕零，不知所言。","t":"如今即将远行，面对奏表泪落不止，不知道说了些什么。"}],"n":[{"w":"崩殂","m":"古代指皇帝死亡。崩，天子死亡的讳称；殂（cú），死亡"},{"w":"疲弊","m":"人力缺乏、物力缺乏"},{"w":"秋","m":"时候、时期"},{"w":"盖","m":"句首发语词，表示推测，大概"},{"w":"追","m":"追念"},{"w":"光","m":"发扬光大"},{"w":"恢弘","m":"扩大、振奋"},{"w":"妄自菲薄","m":"过分看轻自己。妄，随便、过分；菲薄，轻视"},{"w":"引喻失义","m":"引用不恰当的譬喻。引喻，引用譬喻；失义，不恰当"},{"w":"陟罚臧否","m":"陟（zhì），晋升；罚，惩罚；臧（zāng），善，赞扬；否（pǐ），恶，批评"},{"w":"简拔","m":"选拔。简，选择"},{"w":"裨补阙漏","m":"弥补缺点和疏漏。裨（bì），弥补、补助；阙，同\"缺\""},{"w":"淑均","m":"善良公正。淑，善；均，平"},{"w":"倾颓","m":"衰败、衰落"},{"w":"布衣","m":"平民百姓"},{"w":"躬耕","m":"亲自耕种。躬，亲自"},{"w":"卑鄙","m":"地位低微、见识浅陋。今义为品德低下，古义不同"},{"w":"猥自枉屈","m":"委屈自己降低了身份。猥，辱，用作谦辞；枉屈，屈尊就卑"},{"w":"驱驰","m":"奔走效劳"},{"w":"夙夜","m":"早晚，日日夜夜。夙（sù），早晨"},{"w":"不毛","m":"不长草木的地方，指荒凉之地"},{"w":"庶","m":"庶几，希望"},{"w":"驽钝","m":"比喻才能平庸。驽，劣马；钝，不锋利的刀"},{"w":"攘除","m":"排除、铲除"},{"w":"斟酌损益","m":"考虑事情的得失兴革。斟酌，考虑；损，减少；益，增加"},{"w":"咨诹","m":"询问。咨诹（zōu），征询"},{"w":"雅言","m":"正确的话、合乎正道的言论"},{"w":"临表涕零","m":"面对奏表流泪。涕零，流泪"}],"a":"本文是诸葛亮在北伐曹魏前写给后主刘禅的奏表，以恳切的言辞表达了作者对先帝刘备知遇之恩的感激之情和对后主的忠贞之心。文章主要提出三条建议：广开言路、赏罚分明、亲贤远佞，同时追述了先帝三顾茅庐的知遇之恩和自己兴复汉室的决心。全文情真意切，既是一位老臣对君主的谆谆告诫，也是一篇感人肺腑的传世名篇。"},"32":{"o":"鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也。生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。生亦我所欲，所欲有甚于生者，故不为苟得也；死亦我所恶，所恶有甚于死者，故患有所不辟也。如使人之所欲莫甚于生，则凡可以得生者何不用也？使人之所恶莫甚于死者，则凡可以辟患者何不为也？由是则生而有不用也，由是则可以辟患而有不为也。是故所欲有甚于生者，所恶有甚于死者。非独贤者有是心也，人皆有之，贤者能勿丧耳。\n\n一箪食，一豆羹，得之则生，弗得则死。呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。万钟则不辩礼义而受之，万钟于我何加焉！为宫室之美、妻妾之奉、所识穷乏者得我与？乡为身死而不受，今为宫室之美为之；乡为身死而不受，今为妻妾之奉为之；乡为身死而不受，今为所识穷乏者得我而为之：是亦不可以已乎？此之谓失其本心。","t":[{"o":"鱼，我所欲也；熊掌，亦我所欲也。","t":"鱼，是我想要的；熊掌，也是我想要的。"},{"o":"二者不可得兼，舍鱼而取熊掌者也。","t":"这两种东西不能同时得到，就舍弃鱼而选取熊掌。"},{"o":"生，亦我所欲也；义，亦我所欲也。","t":"生命，也是我想要的；道义，也是我想要的。"},{"o":"二者不可得兼，舍生而取义者也。","t":"这两种东西不能同时得到，就舍弃生命而选取道义。"},{"o":"生亦我所欲，所欲有甚于生者，故不为苟得也。","t":"生命也是我想要的，但我想要的还有比生命更重要的东西，所以我不做苟且偷生的事。"},{"o":"死亦我所恶，所恶有甚于死者，故患有所不辟也。","t":"死亡也是我厌恶的，但我厌恶的还有比死亡更严重的事，所以有的祸患我不去躲避。"},{"o":"如使人之所欲莫甚于生，则凡可以得生者何不用也？","t":"如果人们想要的东西没有比生命更重要的，那么凡是可以用来保全生命的手段，什么不可以使用呢？"},{"o":"使人之所恶莫甚于死者，则凡可以辟患者何不为也？","t":"如果人们厌恶的东西没有比死亡更严重的，那么凡是可以用来躲避祸患的事，什么不可以做呢？"},{"o":"由是则生而有不用也，由是则可以辟患而有不为也。","t":"通过这种办法就可以活命，可是有的人却不肯采用；通过这种办法就可以躲避祸患，可是有的人却不肯去做。"},{"o":"是故所欲有甚于生者，所恶有甚于死者。","t":"由此可见，人们想要的东西有比生命更重要的，人们厌恶的东西有比死亡更严重的。"},{"o":"非独贤者有是心也，人皆有之，贤者能勿丧耳。","t":"不仅贤人有这种心，人人都有，只是贤人能够不丧失它罢了。"},{"o":"一箪食，一豆羹，得之则生，弗得则死。","t":"一碗饭，一碗汤，吃了就能活下去，不吃就会饿死。"},{"o":"呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。","t":"但如果轻蔑地呵斥着给别人吃，过路的饥人也不会接受；用脚踢着给别人吃，乞丐也不屑于接受。"},{"o":"万钟则不辩礼义而受之，万钟于我何加焉！","t":"可是有的人见了优厚的俸禄却不分辨是否合乎礼义就接受了，优厚的俸禄对我有什么益处呢！"},{"o":"为宫室之美、妻妾之奉、所识穷乏者得我与？","t":"是为了住宅的华丽、妻妾的侍奉、所认识的穷困的人感激我吗？"},{"o":"乡为身死而不受，今为宫室之美为之；","t":"从前（为了礼义）宁可死也不接受（一箪食一豆羹），现在却为了住宅的华丽而接受了；"},{"o":"乡为身死而不受，今为妻妾之奉为之；","t":"从前（为了礼义）宁可死也不接受（一箪食一豆羹），现在却为了妻妾的侍奉而接受了；"},{"o":"乡为身死而不受，今为所识穷乏者得我而为之：","t":"从前（为了礼义）宁可死也不接受（一箪食一豆羹），现在却为了所认识的穷困的人感激我而接受了："},{"o":"是亦不可以已乎？此之谓失其本心。","t":"这种做法不也应该停止了吗？这就叫做丧失了人的本心。"}],"n":[{"w":"得兼","m":"同时得到。兼，同时涉及或具有几种事物"},{"w":"苟得","m":"苟且取得，此处指\"苟且偷生\"，意为只为活命而不择手段"},{"w":"辟","m":"同\"避\"，躲避"},{"w":"箪","m":"古代盛饭的圆形竹器"},{"w":"豆","m":"古代盛食物的器皿，形似高足盘"},{"w":"呼尔","m":"轻蔑地、粗暴地呵斥的样子。尔，助词，表状态"},{"w":"蹴尔","m":"用脚踢的样子。蹴（cù），踩、踏"},{"w":"不屑","m":"认为不值得，这里是不愿意接受的意思"},{"w":"万钟","m":"很厚的俸禄。钟，古代的一种量器"},{"w":"辩","m":"同\"辨\"，辨别、分辨"},{"w":"加","m":"益处、好处"},{"w":"奉","m":"侍奉"},{"w":"得","m":"同\"德\"，感激恩德"},{"w":"乡","m":"同\"向\"，从前、往昔"},{"w":"已","m":"停止、放弃"},{"w":"本心","m":"本来的思想，即羞恶之心、义理之心。指人固有的羞耻心和道义感"}],"a":"本文以鱼和熊掌为喻，提出\"舍生取义\"的中心论点，阐述了义重于生的道理。孟子认为，人天生就有羞恶之心（本心），在生死面前应当坚守道义，不被外在的物质利益所诱惑。文章通过正反对比论证，批评了那些不辨礼义就接受万钟俸禄的人，指出这种行为是\"失其本心\"，告诫人们要保有并坚守天赋的善性和道德底线。"},"33":{"o":"余幼时即嗜学。家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。天大寒，砚冰坚，手指不可屈伸，弗之怠。录毕，走送之，不敢稍逾约。以是人多以书假余，余因得遍观群书。\n\n既加冠，益慕圣贤之道。又患无硕师名人与游，尝趋百里外，从乡之先达执经叩问。先达德隆望尊，门人弟子填其室，未尝稍降辞色。余立侍左右，援疑质理，俯身倾耳以请；或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；俟其欣悦，则又请焉。故余虽愚，卒获有所闻。\n\n当余之从师也，负箧曳屣行深山巨谷中。穷冬烈风，大雪深数尺，足肤皲裂而不知。至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。寓逆旅，主人日再食，无鲜肥滋味之享。同舍生皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人；余则缊袍敝衣处其间，略无慕艳意，以中有足乐者，不知口体之奉不若人也。盖余之勤且艰若此。\n\n今诸生学于太学，县官日有廪稍之供，父母岁有裘葛之遗，无冻馁之患矣；坐大厦之下而诵诗书，无奔走之劳矣；有司业、博士为之师，未有问而不告、求而不得者也；凡所宜有之书，皆集于此，不必若余之手录，假借于人也。其业有不精、德有不成者，非天质之卑，则心不若余之专耳，岂他人之过哉？\n\n东阳马生君则，在太学已二年，流辈甚称其贤。余朝京师，生以乡人子谒余，撰长书以为贽，辞甚畅达。与之论辨，言和而色夷。自谓少时用心于学甚劳，是可谓善学者矣。其将归见其亲也，余故道为学之难以告之。谓余勉乡人以学者，明也；谓余将有求于生，妄也。","t":[{"o":"余幼时即嗜学。","t":"我小时候就特别喜欢读书。"},{"o":"家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。","t":"家里穷，没有办法买书来看，常常向藏书的人家借，亲手抄写，计算着约定的日子归还。"},{"o":"天大寒，砚冰坚，手指不可屈伸，弗之怠。","t":"天气特别冷的时候，砚台里的墨水结成坚硬的冰，手指不能弯曲和伸展，也不放松抄写。"},{"o":"录毕，走送之，不敢稍逾约。","t":"抄写完毕，赶快跑着送还，不敢稍微超过约定的期限。"},{"o":"以是人多以书假余，余因得遍观群书。","t":"因此人们大多愿意把书借给我，我于是能够广泛地阅读各种书籍。"},{"o":"既加冠，益慕圣贤之道。","t":"到了成年以后，更加仰慕古代圣贤的学说。"},{"o":"又患无硕师名人与游，尝趋百里外，从乡之先达执经叩问。","t":"又担心没有学识渊博的老师和名人交游，曾经跑到百里之外，捧着经书向当地有学问的前辈请教。"},{"o":"先达德隆望尊，门人弟子填其室，未尝稍降辞色。","t":"那位前辈德高望重，学生挤满了他的屋子，他却没有稍微把言辞放委婉些，把脸色放温和些。"},{"o":"余立侍左右，援疑质理，俯身倾耳以请；","t":"我站在旁边侍候着，提出疑难、询问道理，弯下身子、侧着耳朵来请教；"},{"o":"或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；","t":"有时遇到他的训斥、呵斥，态度更加恭敬，礼貌更加周到，不敢说一句话来回答；"},{"o":"俟其欣悦，则又请焉。","t":"等到他高兴了，就又去请教。"},{"o":"故余虽愚，卒获有所闻。","t":"所以我虽然愚笨，终于还是获得了很多知识。"},{"o":"当余之从师也，负箧曳屣行深山巨谷中。","t":"当我外出从师求学的时候，背着书箱、拖着破鞋子行走在深山巨谷之中。"},{"o":"穷冬烈风，大雪深数尺，足肤皲裂而不知。","t":"严冬时节，刮着猛烈的风，大雪深达几尺，脚上的皮肤冻裂了都不知道。"},{"o":"至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。","t":"到了旅舍，四肢僵硬不能动弹，服侍的人拿来热水浇洗，用被子围着盖上，很久才暖和过来。"},{"o":"寓逆旅，主人日再食，无鲜肥滋味之享。","t":"住在旅店里，主人每天提供两顿饭，没有新鲜肥美的食物可以享用。"},{"o":"同舍生皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人；","t":"同舍的学生都穿着绣花的丝绸衣服，戴着有红缨和宝石装饰的帽子，腰间挂着白玉环，左边佩戴着刀，右边挂着香囊，光彩照人像神仙一样；"},{"o":"余则缊袍敝衣处其间，略无慕艳意，以中有足乐者，不知口体之奉不若人也。","t":"我却穿着破旧的衣服生活在他们中间，一点也没有羡慕的意思，因为内心有足以快乐的事（读书），不觉得吃的穿的比不上别人。"},{"o":"盖余之勤且艰若此。","t":"我求学时的勤奋和艰苦就像这样。"},{"o":"今诸生学于太学，县官日有廪稍之供，父母岁有裘葛之遗，无冻馁之患矣；","t":"如今在太学里学习的诸位学生，朝廷每天有米粮供给，父母每年有冬皮衣夏布衣的赠送，没有挨冻挨饿的忧患了；"},{"o":"坐大厦之下而诵诗书，无奔走之劳矣；","t":"坐在高大的房屋下面诵读诗书，没有奔走的劳累了；"},{"o":"有司业、博士为之师，未有问而不告、求而不得者也；","t":"有司业、博士做他们的老师，没有问了不告诉、求教却得不到的情况；"},{"o":"凡所宜有之书，皆集于此，不必若余之手录，假借于人也。","t":"凡应该有的书，都集中在这里，不必像我那样亲手抄写，向别人借来看了。"},{"o":"其业有不精、德有不成者，非天质之卑，则心不若余之专耳，岂他人之过哉？","t":"他们的学业如果有不精通、品德如果有未养成的，不是天资低下，就是心思不如我专一罢了，哪里是别人的过错呢？"},{"o":"东阳马生君则，在太学已二年，流辈甚称其贤。","t":"东阳县的马君则，在太学里已经两年了，同辈的人很称赞他的才能。"},{"o":"余朝京师，生以乡人子谒余，撰长书以为贽，辞甚畅达。","t":"我进京朝见皇帝时，马生以同乡晚辈的身份来拜访我，写了一封长信作为见面礼，言辞非常流畅通达。"},{"o":"与之论辨，言和而色夷。","t":"和他讨论辨析问题，他言语平和、脸色从容。"},{"o":"自谓少时用心于学甚劳，是可谓善学者矣。","t":"他说自己少年时在学习上非常刻苦，这可以称得上是善于学习的人了。"},{"o":"其将归见其亲也，余故道为学之难以告之。","t":"他将要回家探望父母，我特意讲讲求学的困难来告诉他。"},{"o":"谓余勉乡人以学者，明也；谓余将有求于生，妄也。","t":"说我这是勉励同乡人努力学习，是说得对的；说我将要对马生有所求，是荒唐的。"}],"n":[{"w":"嗜","m":"特别喜爱"},{"w":"致","m":"得到，此处指买到"},{"w":"假借","m":"借。假，借"},{"w":"逾约","m":"超过约定的期限。逾，超过"},{"w":"加冠","m":"古代男子二十岁行加冠礼，表示成年"},{"w":"硕师","m":"学问渊博的老师。硕，大、渊博"},{"w":"先达","m":"有学问、有道德的前辈。达，通达"},{"w":"叱咄","m":"训斥、呵斥。叱咄（chì duō）"},{"w":"俟","m":"等待"},{"w":"箧","m":"小箱子，此处指书箱"},{"w":"屣","m":"鞋子"},{"w":"皲裂","m":"皮肤因寒冷而裂开"},{"w":"媵人","m":"服侍的人、仆人"},{"w":"汤沃灌","m":"用热水浇洗。汤，热水；沃灌，浇洗"},{"w":"衾","m":"被子"},{"w":"逆旅","m":"旅店"},{"w":"被绮绣","m":"穿着绣花的丝绸衣服。被（pī），同\"披\"，穿"},{"w":"容臭","m":"香囊。臭（xiù），香气"},{"w":"烨然","m":"光彩耀眼的样子"},{"w":"缊袍敝衣","m":"旧丝棉袍和破旧衣服。缊（yùn），旧丝棉；敝，破旧"},{"w":"慕艳","m":"羡慕。艳，欣羡"},{"w":"廪稍","m":"公家按时供给的粮食。廪（lǐn），米仓"},{"w":"裘葛之遗","m":"冬天皮衣和夏天布衣的赠送。裘，皮衣；葛，夏布；遗（wèi），赠送"},{"w":"馁","m":"饥饿"},{"w":"谒","m":"拜访"},{"w":"贽","m":"初次见面时持有的礼物"}],"a":"本文是宋濂写给同乡晚辈马生的一篇赠序，通过回忆自己幼时家贫买不起书、借书手抄、冒寒奔走从师求学的艰辛经历，与当今太学生优越的学习条件形成鲜明对比，勉励后辈珍惜良好的学习环境，专心致志、勤奋向学。文章以现身说法的方式叙事说理，真挚诚恳，具有很强的说服力和感染力。"},"34":{"o":"陈胜者，阳城人也，字涉。吴广者，阳夏人也，字叔。陈涉少时，尝与人佣耕，辍耕之垄上，怅恨久之，曰：\"苟富贵，无相忘。\"佣者笑而应曰：\"若为佣耕，何富贵也？\"陈涉太息曰：\"嗟乎！燕雀安知鸿鹄之志哉！\"\n\n二世元年七月，发闾左适戍渔阳，九百人屯大泽乡。陈胜、吴广皆次当行，为屯长。会天大雨，道不通，度已失期。失期，法皆斩。陈胜、吴广乃谋曰：\"今亡亦死，举大计亦死，等死，死国可乎？\"陈胜曰：\"天下苦秦久矣。吾闻二世少子也，不当立，当立者乃公子扶苏。扶苏以数谏故，上使外将兵。今或闻无罪，二世杀之。百姓多闻其贤，未知其死也。项燕为楚将，数有功，爱士卒，楚人怜之。或以为死，或以为亡。今诚以吾众诈自称公子扶苏、项燕，为天下唱，宜多应者。\"吴广以为然。乃行卜。卜者知其指意，曰：\"足下事皆成，有功。然足下卜之鬼乎！\"陈胜、吴广喜，念鬼，曰：\"此教我先威众耳。\"乃丹书帛曰\"陈胜王\"，置人所罾鱼腹中。卒买鱼烹食，得鱼腹中书，固以怪之矣。又间令吴广之次所旁丛祠中，夜篝火，狐鸣呼曰：\"大楚兴，陈胜王！\"卒皆夜惊恐。旦日，卒中往往语，皆指目陈胜。\n\n吴广素爱人，士卒多为用者。将尉醉，广故数言欲亡，忿恚尉，令辱之，以激怒其众。尉果笞广。尉剑挺，广起，夺而杀尉。陈胜佐之，并杀两尉。召令徒属曰：\"公等遇雨，皆已失期，失期当斩。藉第令毋斩，而戍死者固十六七。且壮士不死即已，死即举大名耳，王侯将相宁有种乎！\"徒属皆曰：\"敬受命。\"乃诈称公子扶苏、项燕，从民欲也。袒右，称大楚。为坛而盟，祭以尉首。陈胜自立为将军，吴广为都尉。","t":[{"o":"陈胜者，阳城人也，字涉。","t":"陈胜是阳城人，字涉。"},{"o":"吴广者，阳夏人也，字叔。","t":"吴广是阳夏人，字叔。"},{"o":"陈涉少时，尝与人佣耕，辍耕之垄上，怅恨久之，曰：\"苟富贵，无相忘。\"","t":"陈涉年轻的时候，曾经同别人一起被雇佣耕地。（有一天，他）停止耕作走到田埂上，惆怅叹息了好一会儿，说：\"如果有朝一日富贵了，不要彼此忘记。\""},{"o":"佣者笑而应曰：\"若为佣耕，何富贵也？\"","t":"雇农们笑着回答说：\"你是个被雇佣种地的人，哪来的富贵呢？\""},{"o":"陈涉太息曰：\"嗟乎！燕雀安知鸿鹄之志哉！\"","t":"陈涉长叹一声说：\"唉！燕雀怎么能知道天鹅的志向呢！\""},{"o":"二世元年七月，发闾左适戍渔阳，九百人屯大泽乡。","t":"秦二世元年七月，朝廷征发贫苦老百姓去驻守渔阳，九百人驻扎在大泽乡。"},{"o":"陈胜、吴广皆次当行，为屯长。","t":"陈胜、吴广都被编入谪戍的队伍里面，担任屯长。"},{"o":"会天大雨，道不通，度已失期。","t":"恰逢遇到天下大雨，道路不通，估计已经误了期限。"},{"o":"失期，法皆斩。","t":"误了期限，按秦朝的法律都要被斩首。"},{"o":"陈胜、吴广乃谋曰：\"今亡亦死，举大计亦死，等死，死国可乎？\"","t":"陈胜、吴广于是商量说：\"现在逃跑也是死，发动起义也是死，同样是死，为国事而死可以吗？\""},{"o":"陈胜曰：\"天下苦秦久矣。吾闻二世少子也，不当立，当立者乃公子扶苏。\"","t":"陈胜说：\"天下百姓受秦朝统治的逼迫已经很久了。我听说秦二世是（秦始皇的）小儿子，不应当立为皇帝，应当立为皇帝的是公子扶苏。\""},{"o":"\"扶苏以数谏故，上使外将兵。今或闻无罪，二世杀之。百姓多闻其贤，未知其死也。\"","t":"\"扶苏因为多次劝谏的缘故，皇上派（他）在外面带兵。现在有人听说他没有什么罪，秦二世却杀了他。老百姓大都听说他很贤明，还不知道他已经死了。\""},{"o":"\"项燕为楚将，数有功，爱士卒，楚人怜之。或以为死，或以为亡。\"","t":"\"项燕是楚国的将领，多次立有战功，爱护士兵，楚国人都很爱戴他。有人认为他死了，有人认为他逃跑了。\""},{"o":"\"今诚以吾众诈自称公子扶苏、项燕，为天下唱，宜多应者。\"","t":"\"现在如果把我们的队伍假称是公子扶苏和项燕的队伍，向天下人发出起义的倡导，应该有很多响应的人。\""},{"o":"吴广以为然。","t":"吴广认为（这个见解）很对。"},{"o":"乃行卜。卜者知其指意，曰：\"足下事皆成，有功。然足下卜之鬼乎！\"","t":"于是去占卜。占卜的人知道他们的意图，说：\"你们的事情都能成功，能建立功业。然而你们向鬼神问过吉凶吗！\""},{"o":"陈胜、吴广喜，念鬼，曰：\"此教我先威众耳。\"","t":"陈胜、吴广很高兴，考虑占卜人所说的向鬼神问吉凶的事，说：\"这是教我们先威服众人罢了。\""},{"o":"乃丹书帛曰\"陈胜王\"，置人所罾鱼腹中。","t":"于是用丹砂在丝帛上写\"陈胜称王\"，放在别人所捕的鱼的肚子里。"},{"o":"卒买鱼烹食，得鱼腹中书，固以怪之矣。","t":"士兵们买鱼回来烹食，发现了鱼肚子里的丝帛，本来就已经觉得奇怪了。"},{"o":"又间令吴广之次所旁丛祠中，夜篝火，狐鸣呼曰：\"大楚兴，陈胜王！\"","t":"又暗中指使吴广到驻地旁边丛林里的神庙中，晚上用竹笼罩着火（装作鬼火），像狐狸一样嗥叫着大喊：\"大楚复兴，陈胜称王！\""},{"o":"卒皆夜惊恐。旦日，卒中往往语，皆指目陈胜。","t":"士兵们整夜都惊恐不安。第二天，士兵们中到处谈论这件事，都指指点点、互相看着陈胜。"},{"o":"吴广素爱人，士卒多为用者。","t":"吴广平时很关爱别人，士兵们大多愿意为他效力。"},{"o":"将尉醉，广故数言欲亡，忿恚尉，令辱之，以激怒其众。","t":"押送（戍卒）的军官喝醉了，吴广故意多次说想要逃跑，使军官愤怒，让军官责辱自己，以此来激怒那些士兵。"},{"o":"尉果笞广。尉剑挺，广起，夺而杀尉。","t":"军官果然用竹板打了吴广。军官拔出剑，吴广跳起来，夺过剑来杀死了军官。"},{"o":"陈胜佐之，并杀两尉。","t":"陈胜帮助他，一起杀死了两个军官。"},{"o":"召令徒属曰：\"公等遇雨，皆已失期，失期当斩。藉第令毋斩，而戍死者固十六七。\"","t":"（陈胜）召集并号令所属的人说：\"你们诸位遇到大雨，都已经误了期限，误了期限就要被斩首。即使仅免于斩首，戍守边塞死的人本来也要占到十分之六七。\""},{"o":"\"且壮士不死即已，死即举大名耳，王侯将相宁有种乎！\"","t":"\"况且好汉不死便罢了，要死就要取得大名声啊，王侯将相难道是天生的贵种吗！\""},{"o":"徒属皆曰：\"敬受命。\"","t":"所属的人都说：\"愿意听从命令。\""},{"o":"乃诈称公子扶苏、项燕，从民欲也。袒右，称大楚。","t":"于是假称是公子扶苏、项燕的队伍，顺从人民的愿望。大家露出右臂（作为起义的标志），号称大楚。"},{"o":"为坛而盟，祭以尉首。","t":"筑起高台宣誓，用两尉的头祭天。"},{"o":"陈胜自立为将军，吴广为都尉。","t":"陈胜自立为将军，吴广担任都尉。"}],"n":[{"w":"佣耕","m":"受雇佣为人耕种"},{"w":"辍","m":"停止"},{"w":"垄","m":"田间的土埂"},{"w":"苟","m":"如果"},{"w":"若","m":"你"},{"w":"太息","m":"长叹"},{"w":"燕雀","m":"燕子和麻雀，比喻目光短浅的人"},{"w":"鸿鹄","m":"天鹅，比喻志向远大的人"},{"w":"闾左","m":"指代贫苦百姓。闾，古代二十五家为一闾，贫者居住闾左，富者居住闾右"},{"w":"适戍","m":"被强迫去戍守边疆。适（zhé），同\"谪\""},{"w":"度","m":"估计、揣测。度（duó）"},{"w":"亡","m":"逃跑"},{"w":"等","m":"同样"},{"w":"立","m":"确立、立为国君"},{"w":"数","m":"屡次、多次。数（shuò）"},{"w":"将兵","m":"统率军队。将（jiàng），率领"},{"w":"唱","m":"同\"倡\"，倡导、发起"},{"w":"卜","m":"占卜，古人用龟甲或蓍草推测吉凶"},{"w":"指意","m":"意图"},{"w":"丹书帛","m":"用丹砂在丝帛上写字。丹，朱砂；书，写"},{"w":"罾","m":"鱼网，此处名词作动词，用网捕"},{"w":"间","m":"暗中、秘密地"},{"w":"丛祠","m":"树木丛中的神庙"},{"w":"篝火","m":"用竹笼罩着火。篝，竹笼。这里作动词"},{"w":"往往","m":"到处"},{"w":"素","m":"平时、一向"},{"w":"忿恚","m":"使……恼怒。忿恚（fèn huì），恼怒，此处为使动用法"},{"w":"笞","m":"用鞭、杖或竹板打"},{"w":"挺","m":"拔"},{"w":"藉第令","m":"即使、假若。藉（jiè），第，令，都是\"即使、假若\"的意思"},{"w":"十六七","m":"十分之六七"},{"w":"袒右","m":"露出右臂，作为起义的标志"}],"a":"本文节选自《史记·陈涉世家》，记述了中国历史上第一次大规模农民起义——大泽乡起义的起因和经过。文章通过陈涉\"燕雀安知鸿鹄之志哉\"的少时壮志，到\"王侯将相宁有种乎\"的起义宣言，生动刻画了陈涉这位农民起义领袖的形象，揭示了秦末\"天下苦秦久矣\"的社会矛盾，反映了人民反抗暴政的正义性和历史的必然趋势。"}};
const poetryContent={"001":{"o":"鹅，鹅，鹅，\n曲项向天歌。\n白毛浮绿水，\n红掌拨清波。","t":[{"o":"鹅，鹅，鹅，曲项向天歌。","t":"鹅啊鹅啊鹅，弯着脖子朝天高声鸣叫。"},{"o":"白毛浮绿水，红掌拨清波。","t":"白色的羽毛漂浮在碧绿的水面上，红色的脚掌拨动着清澈的水波。"}],"n":[{"w":"咏","m":"用诗词来描写、赞美"},{"w":"曲项","m":"弯着脖子。项，脖子的后部"},{"w":"向天歌","m":"朝着天空鸣叫"},{"w":"红掌","m":"鹅红色的脚蹼"},{"w":"拨","m":"划动、拨动"},{"w":"清波","m":"清澈的水波"}],"a":"这首诗相传为骆宾王七岁时所作，以儿童的视角观察鹅的形态与动作，生动传神。\"白毛\"\"绿水\"\"红掌\"\"清波\"色彩鲜明，视觉对比强烈；\"浮\"与\"拨\"一动一静，将鹅在水中悠然游弋的画面描绘得栩栩如生。全诗语言清新自然，朗朗上口，是中国儿童最早接触的古诗之一。"},"002":{"o":"解落三秋叶，\n能开二月花。\n过江千尺浪，\n入竹万竿斜。","t":[{"o":"解落三秋叶，能开二月花。","t":"它能吹落秋天的树叶，也能催开早春二月的花朵。"},{"o":"过江千尺浪，入竹万竿斜。","t":"它刮过江面能卷起千尺巨浪，吹入竹林能使万竿竹子倾斜。"}],"n":[{"w":"解","m":"能够，可以"},{"w":"三秋","m":"深秋，农历九月。也泛指秋季"},{"w":"二月","m":"早春，农历二月"},{"w":"过","m":"经过，掠过"},{"w":"千尺","m":"虚指，形容浪很高"},{"w":"万竿","m":"虚指，形容竹子很多"},{"w":"斜","m":"倾斜，读作xiá（押韵）"}],"a":"这首诗通篇咏\"风\"却不着一个\"风\"字，通过风吹落秋叶、吹开春花、掀起巨浪、吹斜竹林四个场景，从不同角度展现了风的力量。全诗对仗工整，\"三秋\"对\"二月\"、\"千尺\"对\"万竿\"，数字对仗精妙，将无形的風写得有声有色、可感可触，体现了诗人高超的艺术构思。"},"003":{"o":"锄禾日当午，\n汗滴禾下土。\n谁知盘中餐，\n粒粒皆辛苦。","t":[{"o":"锄禾日当午，汗滴禾下土。","t":"正午烈日当头时给庄稼锄草，汗水一滴滴落入禾苗下的泥土中。"},{"o":"谁知盘中餐，粒粒皆辛苦。","t":"有谁知道我们盘中的饭食，每一粒都饱含着农民的辛苦。"}],"n":[{"w":"悯","m":"怜悯、同情"},{"w":"锄禾","m":"给庄稼锄草松土"},{"w":"日当午","m":"太阳正当天空中央，指正午时分"},{"w":"盘中餐","m":"盘子里的饭食"},{"w":"粒粒","m":"每一粒"},{"w":"皆","m":"都"}],"a":"这首诗以朴实的语言描绘了农民在烈日下辛勤劳作的场景，前两句写劳动之苦，后两句由叙事转为议论，用反问句引发读者深思。\"粒粒皆辛苦\"已成为千古名句，提醒人们珍惜粮食、尊重劳动。全诗明白如话却振聋发聩，体现了诗人对劳动人民的深切同情。"},"004":{"o":"床前明月光，\n疑是地上霜。\n举头望明月，\n低头思故乡。","t":[{"o":"床前明月光，疑是地上霜。","t":"明亮的月光洒在床前，让人恍惚以为是地上结了一层白霜。"},{"o":"举头望明月，低头思故乡。","t":"抬起头仰望天上皎洁的明月，低下头不禁思念起遥远的故乡。"}],"n":[{"w":"静夜思","m":"在宁静的夜晚产生的思绪"},{"w":"疑","m":"怀疑，以为"},{"w":"霜","m":"秋天地面凝结的白色冰晶"},{"w":"举头","m":"抬头"},{"w":"故乡","m":"家乡"}],"a":"这首诗是中国最著名的思乡诗，以月光引发乡愁，情景交融。\"疑是地上霜\"写出了人在半梦半醒间的恍惚之感，极为真实；\"举头\"与\"低头\"两个动作的转换，将游子由望月到思乡的情感变化刻画得细腻入微。全诗语言质朴无华，却能道出千百年来远离故土之人共同的心声。"},"005":{"o":"春眠不觉晓，\n处处闻啼鸟。\n夜来风雨声，\n花落知多少。","t":[{"o":"春眠不觉晓，处处闻啼鸟。","t":"春天的夜晚睡得香甜，不知不觉天已亮了，醒来听到到处都是鸟儿的鸣叫声。"},{"o":"夜来风雨声，花落知多少。","t":"回想昨夜隐约听到的风雨声，不知道有多少花瓣被风吹落了。"}],"n":[{"w":"晓","m":"天亮，早晨"},{"w":"不觉","m":"不知不觉"},{"w":"啼鸟","m":"鸟的鸣叫声"},{"w":"夜来","m":"昨夜"},{"w":"知多少","m":"不知道有多少，表示担心、惋惜"}],"a":"这首诗写春晨即景，以\"不觉\"二字开篇，传达出春日睡眠的酣畅舒适。诗人不写繁花盛开，而写风雨之后花落多少，用惜花之情表达对春光流逝的淡淡惆怅。全诗从听觉入手，\"啼鸟\"的喧闹与\"花落\"的惋惜形成对比，以小见大，含蓄蕴藉，是唐诗中以少胜多的典范之作。"},"006":{"o":"草长莺飞二月天，\n拂堤杨柳醉春烟。\n儿童散学归来早，\n忙趁东风放纸鸢。","t":[{"o":"草长莺飞二月天，拂堤杨柳醉春烟。","t":"早春二月，青草生长，黄莺飞舞，杨柳的枝条轻拂堤岸，仿佛沉醉在春天的烟雾之中。"},{"o":"儿童散学归来早，忙趁东风放纸鸢。","t":"孩子们放学回来得很早，赶紧趁着刮起的东风放起了风筝。"}],"n":[{"w":"村居","m":"在乡村居住"},{"w":"莺","m":"黄莺，一种鸣声婉转的鸟"},{"w":"二月天","m":"农历二月，早春时节"},{"w":"拂堤","m":"形容杨柳枝条很长，下垂轻拂堤岸"},{"w":"春烟","m":"春天里如烟如雾的迷蒙景色"},{"w":"散学","m":"放学"},{"w":"纸鸢","m":"风筝。鸢，老鹰一类的鸟"}],"a":"这首诗描绘了一幅生机勃勃的乡村春景图。前两句写自然之景，草长莺飞、杨柳如烟，渲染出浓郁的春天气息；后两句转写人事，儿童放学的欢快与放风筝的天真活泼相映成趣。全诗动静结合，有声有色，洋溢着对春天的赞美和对童年生活的喜爱。"},"007":{"o":"牧童骑黄牛，\n歌声振林樾。\n意欲捕鸣蝉，\n忽然闭口立。","t":[{"o":"牧童骑黄牛，歌声振林樾。","t":"牧童骑在黄牛背上，嘹亮的歌声在树林间回荡。"},{"o":"意欲捕鸣蝉，忽然闭口立。","t":"他想要去捕捉树上鸣叫的蝉，突然停止了歌声，一声不响地站住了。"}],"n":[{"w":"所见","m":"诗人偶然看到的情景"},{"w":"牧童","m":"放牛的孩子"},{"w":"振","m":"振荡，回荡"},{"w":"林樾","m":"树林。樾，树阴"},{"w":"意欲","m":"心里想要"},{"w":"鸣蝉","m":"正在鸣叫的蝉"},{"w":"闭口立","m":"闭上嘴巴站住不动"}],"a":"这首诗捕捉了一个富有生活情趣的瞬间：牧童由纵情高歌到突然静立不动，从\"动\"到\"静\"的变化极具戏剧性，将儿童天真机灵的神态刻画得惟妙惟肖。全诗如同一幅生动的乡村风俗画，不加雕饰却妙趣横生，体现了诗人对乡村生活的细致观察和由衷喜爱。"},"008":{"o":"小娃撑小艇，\n偷采白莲回。\n不解藏踪迹，\n浮萍一道开。","t":[{"o":"小娃撑小艇，偷采白莲回。","t":"一个小孩撑着小船，偷偷地采了白莲蓬往回走。"},{"o":"不解藏踪迹，浮萍一道开。","t":"他不懂得怎样掩盖自己留下的痕迹，小船把水面上的浮萍荡开了一条长长的水路。"}],"n":[{"w":"小娃","m":"小孩儿"},{"w":"撑","m":"用篙抵住水底使船前进"},{"w":"小艇","m":"小船"},{"w":"白莲","m":"白色的莲花"},{"w":"不解","m":"不懂得，不知道"},{"w":"踪迹","m":"行动的痕迹"},{"w":"浮萍","m":"一种漂浮在水面上的水生植物"}],"a":"这首诗描写一个小孩偷采白莲后天真地不懂得隐藏踪迹的有趣场景。\"偷\"字点出孩子的顽皮，\"不解\"二字更显其天真无邪——他并非有意暴露，而是根本不知道浮萍被荡开的痕迹会出卖自己。全诗充满童趣，既有画面感又有故事性，令人会心一笑，倍感可爱。"},"009":{"o":"江南可采莲，\n莲叶何田田。\n鱼戏莲叶间。\n鱼戏莲叶东，\n鱼戏莲叶西，\n鱼戏莲叶南，\n鱼戏莲叶北。","t":[{"o":"江南可采莲，莲叶何田田。","t":"江南又到了可以采摘莲蓬的季节，莲叶长得多么茂盛挺拔。"},{"o":"鱼戏莲叶间。鱼戏莲叶东，鱼戏莲叶西，鱼戏莲叶南，鱼戏莲叶北。","t":"鱼儿在莲叶间嬉戏玩耍。鱼儿在莲叶东边嬉戏，鱼儿在莲叶西边嬉戏，鱼儿在莲叶南边嬉戏，鱼儿在莲叶北边嬉戏。"}],"n":[{"w":"江南","m":"长江以南的地区"},{"w":"可","m":"正是……的好时候"},{"w":"田田","m":"莲叶茂盛挺拔的样子"},{"w":"戏","m":"嬉戏、游玩"},{"w":"间","m":"中间"}],"a":"这是汉乐府中的一首采莲歌，也是中国最早的五言诗之一。诗中以\"鱼戏莲叶\"的反复咏唱，以东、西、南、北四个方位的变化，展现了鱼儿在莲叶间自由穿梭的欢快景象，也暗喻了采莲人愉悦的心情。全诗节奏明快，循环往复，如同一首欢快的劳动歌谣，洋溢着浓郁的水乡生活气息。"},"010":{"o":"泉眼无声惜细流，\n树阴照水爱晴柔。\n小荷才露尖尖角，\n早有蜻蜓立上头。","t":[{"o":"泉眼无声惜细流，树阴照水爱晴柔。","t":"泉眼悄然无声，似乎珍惜着细细的水流；树阴倒映在水面，仿佛也喜爱这晴日的温柔。"},{"o":"小荷才露尖尖角，早有蜻蜓立上头。","t":"嫩荷叶刚刚从水面露出尖尖的小角，就已经有蜻蜓飞来停在上面了。"}],"n":[{"w":"泉眼","m":"泉水的出口"},{"w":"惜","m":"珍惜，爱惜"},{"w":"细流","m":"细小的水流"},{"w":"晴柔","m":"晴天的温柔"},{"w":"小荷","m":"刚刚长出的嫩荷叶"},{"w":"尖尖角","m":"没有展开的嫩荷叶尖端"}],"a":"这首诗描写初夏时节一个小池塘的精致景色。前两句赋予泉水和树阴以人的情感，\"惜\"和\"爱\"使自然景物充满了温情。后两句最为人称道，\"才露\"与\"早有\"前后呼应，将蜻蜓与小荷相依相伴的画面写得生动有趣，也常被用来比喻新事物刚刚崭露头角便受到关注。"},"011":{"o":"白日依山尽，\n黄河入海流。\n欲穷千里目，\n更上一层楼。","t":[{"o":"白日依山尽，黄河入海流。","t":"夕阳依傍着西山慢慢沉落，滔滔黄河朝着大海汹涌奔流。"},{"o":"欲穷千里目，更上一层楼。","t":"想要看到千里之外更远的风景，就要再登上更高的一层楼。"}],"n":[{"w":"鹳雀楼","m":"古楼名，在今山西永济，楼有三层，前望中条山，下临黄河"},{"w":"白日","m":"太阳"},{"w":"依","m":"依傍，靠着"},{"w":"尽","m":"消失，落下"},{"w":"欲","m":"想要"},{"w":"穷","m":"穷尽，看到尽头"},{"w":"千里目","m":"看到千里之外的视野"}],"a":"这首诗前两句写登楼所见之壮阔景象，落日与黄河一纵一横，意境雄浑。后两句由景入理，将\"站得高才能看得远\"的朴素道理融入诗句之中，蕴含着积极进取、不断追求更高境界的人生哲理。\"欲穷千里目，更上一层楼\"已成为千古传诵的励志名句，激励着人们不断攀登、开拓眼界。"},"012":{"o":"松下问童子，\n言师采药去。\n只在此山中，\n云深不知处。","t":[{"o":"松下问童子，言师采药去。","t":"在松树下询问隐者的徒弟，他说师父进山采药去了。"},{"o":"只在此山中，云深不知处。","t":"师父就在这座大山里，可是云雾迷漫，不知道他究竟在哪里。"}],"n":[{"w":"隐者","m":"隐居山林不愿做官的人"},{"w":"不遇","m":"没有遇到"},{"w":"童子","m":"隐者的徒弟、书童"},{"w":"言","m":"说"},{"w":"师","m":"师父，指隐者"},{"w":"云深","m":"云雾浓密深远"},{"w":"不知处","m":"不知道在什么地方"}],"a":"这首诗以问答的形式展开，简洁的对话中蕴含丰富的内容。访隐者不遇，本应失望，但\"只在此山中，云深不知处\"却将读者的视线引向那白云深处的幽远意境，隐者虽不可见，其高洁出尘的形象却透过云雾隐约浮现。全诗似淡实浓，以不遇写相遇，以不见写其人，含蓄有致。"},"013":{"o":"千山鸟飞绝，\n万径人踪灭。\n孤舟蓑笠翁，\n独钓寒江雪。","t":[{"o":"千山鸟飞绝，万径人踪灭。","t":"群山之中不见一只飞鸟的影子，所有道路上也都看不到人的踪迹。"},{"o":"孤舟蓑笠翁，独钓寒江雪。","t":"只有一叶孤舟上，一位身披蓑衣、头戴斗笠的老翁，独自在漫天风雪的江面上垂钓。"}],"n":[{"w":"绝","m":"断绝，消失"},{"w":"万径","m":"虚指，形容所有的道路"},{"w":"人踪","m":"人的踪迹、脚印"},{"w":"孤舟","m":"孤零零的一条小船"},{"w":"蓑笠翁","m":"披着蓑衣、戴着斗笠的老渔翁"},{"w":"蓑","m":"用草或棕编成的雨衣"},{"w":"笠","m":"用竹篾编成的挡雨帽子"}],"a":"这首诗描绘了一幅幽静寒冷的独钓图。前两句以\"千山\"\"万径\"的广阔空间衬托\"鸟飞绝\"\"人踪灭\"的绝对寂静，营造出天地间一片空茫的氛围。后两句聚焦于冰雪中的一叶孤舟，渔翁独钓的形象既是写实，也是诗人自身孤傲不屈人格的象征。全诗二十字中尽显孤独与坚守，意境高远。"},"014":{"o":"春种一粒粟，\n秋收万颗子。\n四海无闲田，\n农夫犹饿死。","t":[{"o":"春种一粒粟，秋收万颗子。","t":"春天播下一粒种子，秋天可以收获万颗粮食。"},{"o":"四海无闲田，农夫犹饿死。","t":"普天之下没有一块荒废的田地，可是辛勤的农民却还是会被饿死。"}],"n":[{"w":"粟","m":"谷子，泛指粮食作物"},{"w":"子","m":"指粮食的籽粒"},{"w":"四海","m":"指全天下"},{"w":"闲田","m":"荒废闲置的田地"},{"w":"犹","m":"还，仍然"}],"a":"这首诗用鲜明的对比揭露了封建社会的不合理现实：农民辛勤耕种使得\"四海无闲田\"，收获的粮食何止万颗，然而种粮人却依然难逃饿死的命运。\"犹饿死\"三个字力透纸背，将丰收与饿死的强烈反差直陈于读者眼前，震撼人心。全诗语言质朴却掷地有声，是古代悯农诗中最具批判力量的篇章之一。"},"015":{"o":"小时不识月，\n呼作白玉盘。\n又疑瑶台镜，\n飞在青云端。","t":[{"o":"小时不识月，呼作白玉盘。","t":"小时候不认识月亮，把它叫作白玉做成的盘子。"},{"o":"又疑瑶台镜，飞在青云端。","t":"又怀疑它是仙境瑶台上的明镜，飞挂在高高的青云之端。"}],"n":[{"w":"朗月行","m":"乐府旧题，\"行\"是古诗的一种体裁"},{"w":"不识","m":"不认识，不了解"},{"w":"呼作","m":"称呼为，叫作"},{"w":"白玉盘","m":"白玉做成的盘子"},{"w":"疑","m":"怀疑，以为"},{"w":"瑶台","m":"传说中神仙居住的地方"},{"w":"青云","m":"高空中的云"}],"a":"这段节选以儿童的视角描写月亮，天真烂漫，想象奇特。小李白先是把月亮当成\"白玉盘\"，继而又觉得像是天上仙境里的镜子飞到了云端，两个比喻层层递进，既写出了月亮的圆润明亮，又赋予了它仙境般的神秘色彩。全诗充满了童真童趣，也展现了诗人从小便有的丰富想象力。"},"016":{"o":"离离原上草，一岁一枯荣。\n野火烧不尽，春风吹又生。\n远芳侵古道，晴翠接荒城。\n又送王孙去，萋萋满别情。","t":[{"o":"离离原上草，一岁一枯荣。","t":"原野上长满了茂盛的青草，每年都会经历一次枯萎和繁茂。"},{"o":"野火烧不尽，春风吹又生。","t":"野火无法将它完全烧尽，春风一吹它又重新生长出来。"},{"o":"远芳侵古道，晴翠接荒城。","t":"远处的芳草蔓延到了古老的驿道，阳光下翠绿的草色一直连接到荒凉的城墙。"},{"o":"又送王孙去，萋萋满别情。","t":"又要送别远行的游子了，这茂密的青草仿佛也充满了依依惜别之情。"}],"n":[{"w":"赋得","m":"按照指定题目作诗"},{"w":"离离","m":"草木茂盛的样子"},{"w":"一岁","m":"一年"},{"w":"枯荣","m":"枯萎和繁茂"},{"w":"远芳","m":"远处的芳草"},{"w":"侵","m":"侵占，蔓延到"},{"w":"晴翠","m":"阳光下翠绿的草色"},{"w":"王孙","m":"贵族子弟，此指被送别的友人"},{"w":"萋萋","m":"草木茂盛的样子"}],"a":"这首诗以古原上的野草起兴，借草的顽强生命力来衬托离别之情。\"野火烧不尽，春风吹又生\"是千古名句，写出了野草旺盛的生命力，也被后人用来比喻新事物有着强大的生命力，任何力量也扼杀不了。全诗将咏物与抒情融为一体，前四句写草之生命力，后四句由草及人、借草送别，情景交融，浑然天成。"},"017":{"o":"空山不见人，\n但闻人语响。\n返景入深林，\n复照青苔上。","t":[{"o":"空山不见人，但闻人语响。","t":"空旷的山谷里看不到人影，只听到隐隐约约的人声回响。"},{"o":"返景入深林，复照青苔上。","t":"夕阳的余光透过树林射入深林之中，又映照在幽暗处的青苔上面。"}],"n":[{"w":"鹿柴","m":"王维辋川别墅的一处地名。柴，通\"寨\"，用树木编成的栅栏"},{"w":"空","m":"空旷、空寂"},{"w":"但","m":"只"},{"w":"返景","m":"夕阳返照的光。景，同\"影\"，日光"},{"w":"复","m":"又"}],"a":"这首诗以\"空山\"开篇，却用\"人语响\"来反衬山的寂静，以声写静，手法精妙。后两句写夕阳余晖照入深林落在青苔之上，一束暖光点缀在幽暗的林间，更衬托出山林的幽深静谧。全诗视听结合，以动衬静，以明衬暗，是王维\"诗中有画，画中有诗\"风格的典型体现，营造出一种空灵清寂的禅意境界。"},"018":{"o":"碧玉妆成一树高，\n万条垂下绿丝绦。\n不知细叶谁裁出，\n二月春风似剪刀。","t":[{"o":"碧玉妆成一树高，万条垂下绿丝绦。","t":"高高的柳树仿佛被碧玉精心装扮过一般，千万条柳枝如同绿色的丝带随风飘垂。"},{"o":"不知细叶谁裁出，二月春风似剪刀。","t":"不知道这细细的柳叶是谁裁剪出来的，原来二月的春风就像一把灵巧的剪刀。"}],"n":[{"w":"碧玉","m":"青绿色的美玉，比喻柳树的翠绿"},{"w":"妆成","m":"装饰打扮而成"},{"w":"丝绦","m":"丝编的带子，比喻柳枝"},{"w":"裁","m":"裁剪"},{"w":"二月","m":"农历二月，早春时节"}],"a":"这首诗以新奇的比喻咏赞春天里的垂柳。前两句将柳树比作碧玉妆成的少女，柳枝比作绿色丝带，形象而美丽。后两句想象尤为奇特——把春风比作剪刀，裁出了片片细叶，将无形的春风化为有形的创造者。这个比喻新颖独特，既写出了春柳之美，又赞美了春天的创造力，成为咏柳诗中最精彩的作品之一。"},"019":{"o":"两个黄鹂鸣翠柳，\n一行白鹭上青天。\n窗含西岭千秋雪，\n门泊东吴万里船。","t":[{"o":"两个黄鹂鸣翠柳，一行白鹭上青天。","t":"两只黄鹂鸟在翠绿的柳枝间鸣叫，一行白鹭展翅飞上了蔚蓝的天空。"},{"o":"窗含西岭千秋雪，门泊东吴万里船。","t":"从窗户望去可以看到西岭上千年不化的积雪，门前停泊着从东吴远行万里而来的船只。"}],"n":[{"w":"黄鹂","m":"一种鸟，羽毛黄色，鸣声悦耳"},{"w":"白鹭","m":"一种水鸟，羽毛白色，腿长"},{"w":"窗含","m":"窗户像画框一样框住远处的景色"},{"w":"西岭","m":"成都西边的岷山"},{"w":"千秋雪","m":"千年不化的积雪"},{"w":"泊","m":"停泊"},{"w":"东吴","m":"古地名，今江苏、浙江一带"},{"w":"万里船","m":"从万里之外远行而来的船只"}],"a":"这首诗四句皆对仗，一句一景，如四幅图画拼合在一起。前两句写近景和动景，黄鹂、翠柳、白鹭、青天，色彩明丽；后两句写远景，千年积雪和万里行船将时空拉得极为开阔。全诗由近及远、由动到静，视野开阔却秩序井然，体现了杜甫律诗的精湛功力，也表达了诗人战乱后重返草堂时喜悦开阔的心情。"},"020":{"o":"迟日江山丽，\n春风花草香。\n泥融飞燕子，\n沙暖睡鸳鸯。","t":[{"o":"迟日江山丽，春风花草香。","t":"春天的阳光使得江山显得格外秀丽，春风吹拂带来了花草的阵阵芳香。"},{"o":"泥融飞燕子，沙暖睡鸳鸯。","t":"泥土融化变得湿润，燕子飞来飞去衔泥筑巢；河边的沙地被太阳晒得暖暖的，鸳鸯成双成对地安然入睡。"}],"n":[{"w":"迟日","m":"春天的太阳。迟，缓慢，指春季日照时间渐长"},{"w":"泥融","m":"泥土融化变软"},{"w":"鸳鸯","m":"一种水鸟，常成对出现，象征美好爱情"}],"a":"这首诗以清新明快的笔调描绘了春天的美好景象。前两句从大处着眼，写阳光普照下的山河秀丽和春风送来的花草幽香；后两句从小处落笔，燕子的忙碌飞翔与鸳鸯的慵懒安睡形成动与静的对比，生动传神。全诗二十字中涵盖了视觉、嗅觉、触觉等多种感受，营造出一幅和谐安宁的春日图景。"},"021":{"o":"黄河远上白云间，\n一片孤城万仞山。\n羌笛何须怨杨柳，\n春风不度玉门关。","t":[{"o":"黄河远上白云间，一片孤城万仞山。","t":"黄河犹如从远方的白云间奔腾而来，玉门关孤独地矗立在万仞高山之中。"},{"o":"羌笛何须怨杨柳，春风不度玉门关。","t":"何必用羌笛吹奏那哀怨的《折杨柳》曲来埋怨春光呢？要知道，春风是吹不到玉门关以外的。"}],"n":[{"w":"凉州词","m":"唐代曲调名，凉州在今甘肃武威一带"},{"w":"万仞","m":"形容极高。仞，古代长度单位"},{"w":"羌笛","m":"羌族的一种管乐器"},{"w":"杨柳","m":"指《折杨柳》曲，古代送别时常奏此曲"},{"w":"度","m":"越过"},{"w":"玉门关","m":"古关隘名，在今甘肃敦煌西"}],"a":"这首边塞诗意境雄浑而苍凉。首句黄河与白云相接，视野极为壮阔；\"孤城\"嵌入\"万仞山\"中，更显边塞的荒凉孤寂。后两句委婉含蓄，以\"春风不度\"既是写实（玉门关外确实荒寒），也暗喻朝廷对戍边将士的恩泽难以到达，字里行间流露出对守边将士的深切同情。"},"022":{"o":"葡萄美酒夜光杯，\n欲饮琵琶马上催。\n醉卧沙场君莫笑，\n古来征战几人回。","t":[{"o":"葡萄美酒夜光杯，欲饮琵琶马上催。","t":"精美的酒杯中盛着甘醇的葡萄美酒，正要开怀畅饮，却听到马上奏起了琵琶，催促着出发。"},{"o":"醉卧沙场君莫笑，古来征战几人回。","t":"即使醉倒在沙场上请诸位也不要嘲笑，自古以来出征打仗的将士有几人能活着回来呢？"}],"n":[{"w":"夜光杯","m":"一种精美的酒杯，传说能在夜间发光"},{"w":"琵琶","m":"一种弦乐器"},{"w":"马上催","m":"骑在马上弹奏琵琶催促出发"},{"w":"沙场","m":"战场"},{"w":"古来","m":"自古以来"},{"w":"征战","m":"出征打仗"}],"a":"这首边塞诗以豪迈悲壮的笔调描写了将士们战前痛饮的场景。美酒与琵琶交织出盛宴的华美与紧迫，\"醉卧沙场\"看似旷达豪放，实则暗含悲凉——\"古来征战几人回\"将旷达推向了悲壮的极致。全诗在豪放与悲凉之间取得了微妙的平衡，既展现了将士们的英雄气概，也表达了对战争残酷的深沉感慨。"},"023":{"o":"秦时明月汉时关，\n万里长征人未还。\n但使龙城飞将在，\n不教胡马度阴山。","t":[{"o":"秦时明月汉时关，万里长征人未还。","t":"依然是秦汉时的明月和边关，跋涉万里出征的将士至今仍未归还。"},{"o":"但使龙城飞将在，不教胡马度阴山。","t":"倘若像飞将军李广那样的名将还在，绝不会让胡人的骑兵越过阴山南下。"}],"n":[{"w":"出塞","m":"出征到边塞。塞，边界上的险要之处"},{"w":"秦时明月汉时关","m":"秦汉时代的明月和边关，互文见义"},{"w":"长征","m":"远征"},{"w":"但使","m":"只要，倘若"},{"w":"龙城飞将","m":"指汉代的飞将军李广，匈奴畏惧其威名"},{"w":"不教","m":"不让，不准"},{"w":"胡马","m":"胡人的骑兵"},{"w":"阴山","m":"山脉名，在今内蒙古，古代北方的天然屏障"}],"a":"这首诗被誉为唐代七绝压卷之作。首句\"秦时明月汉时关\"将时间拉至千年之前，暗示边患自古延续至今，令人感慨万千。后两句表达了对和平的渴望——只要有良将守边，便能保境安民。全诗意境开阔，气象雄浑，既有对戍边将士的深切同情，也有对国家安宁的美好期盼，被后人广为传诵。"},"024":{"o":"寒雨连江夜入吴，\n平明送客楚山孤。\n洛阳亲友如相问，\n一片冰心在玉壶。","t":[{"o":"寒雨连江夜入吴，平明送客楚山孤。","t":"冷雨连夜洒满江面，笼罩着吴地的夜空，清晨送别友人，只留下楚山孤独的身影。"},{"o":"洛阳亲友如相问，一片冰心在玉壶。","t":"如果洛阳的亲友问起我的情况，请告诉他们，我的心依然像玉壶中的冰一样晶莹纯洁。"}],"n":[{"w":"芙蓉楼","m":"故址在今江苏镇江"},{"w":"辛渐","m":"诗人的友人"},{"w":"连江","m":"满江，与江水连成一片"},{"w":"吴","m":"古地名，指镇江一带"},{"w":"平明","m":"黎明，天刚亮"},{"w":"楚山","m":"泛指镇江一带的山"},{"w":"冰心","m":"比喻纯洁清明的内心"},{"w":"玉壶","m":"玉制的壶，比喻高洁"}],"a":"这首送别诗不写离愁别绪，而以高洁自许为核心。\"一片冰心在玉壶\"是千古名句，以冰之晶莹、玉之纯净来比喻自己虽然身处逆境，却依然保持着清明高洁的品格。全诗以凄凉的秋雨送别起笔，却以明朗坚定的自白收束，情感由低沉转为昂扬，展现了诗人坦荡磊落的胸怀和坚守节操的信念。"},"025":{"o":"千里黄云白日曛，\n北风吹雁雪纷纷。\n莫愁前路无知己，\n天下谁人不识君。","t":[{"o":"千里黄云白日曛，北风吹雁雪纷纷。","t":"千里范围内黄云密布，太阳变得昏暗不明，北风呼啸着吹送大雁，大雪纷纷扬扬飘落下来。"},{"o":"莫愁前路无知己，天下谁人不识君。","t":"不必担心前行的路上没有知心朋友，天下有谁不认识你呢？"}],"n":[{"w":"董大","m":"唐代著名琴师董庭兰，排行第一，故称\"大\""},{"w":"曛","m":"昏暗，指太阳黯淡无光"},{"w":"知己","m":"彼此相互了解而情谊深切的朋友"},{"w":"君","m":"您，指董大"}],"a":"这首送别诗一改传统送别诗的伤感基调，以豪迈旷达的气势鼓舞友人。前两句描写送别时的凄凉冬景，黄云、白日、北风、飞雁、大雪，营造出苍茫壮阔的氛围。后两句笔锋一转，\"莫愁前路无知己\"充满信心与力量，与景色的悲凉形成强烈反差，体现出诗人豪迈豁达的胸襟，也使这首诗成为送别诗中最具阳刚之气的名篇。"},"026":{"o":"少小离家老大回，乡音无改鬓毛衰。\n儿童相见不相识，笑问客从何处来。","t":[{"o":"少小离家老大回，乡音无改鬓毛衰。","t":"年轻时离开家乡，年老时才回来，家乡的口音没有改变，但鬓发已经稀疏花白。"},{"o":"儿童相见不相识，笑问客从何处来。","t":"村里的孩子们见到我都不认识，笑着问我是从哪里来的客人。"}],"n":[{"w":"少小","m":"年幼时"},{"w":"老大","m":"年老了"},{"w":"乡音","m":"家乡的口音"},{"w":"鬓毛衰","m":"鬓发稀疏、脱落。衰，减少、疏落"},{"w":"不相识","m":"不认识"},{"w":"客","m":"客人，这里指诗人自己"}],"a":"这首诗以朴实无华的语言写尽了岁月流逝与物是人非的感慨。诗人年少离乡、暮年归来，乡音未改却容颜已老，儿童的天真一问更令人倍觉酸楚。全诗在看似轻松的对话中，寄托了深沉的故园之思与人生感慨，情感真挚，韵味悠长。"},"027":{"o":"不论平地与山尖，无限风光尽被占。\n采得百花成蜜后，为谁辛苦为谁甜。","t":[{"o":"不论平地与山尖，无限风光尽被占。","t":"无论是在平地上还是在高高的山顶，无限的美好风光都被蜜蜂所占据。"},{"o":"采得百花成蜜后，为谁辛苦为谁甜。","t":"蜜蜂采遍百花酿成了蜂蜜之后，究竟是为谁辛苦劳作，又是为谁酿造甘甜呢？"}],"n":[{"w":"山尖","m":"山峰的最高处"},{"w":"占","m":"占据，这里指蜜蜂飞遍各处"},{"w":"采得","m":"采集得到"},{"w":"为谁","m":"替谁、为谁"}],"a":"这首诗借蜜蜂采蜜的辛劳，暗喻劳动人民辛苦劳作却享受不到劳动成果的社会现实。前两句写蜜蜂飞遍山川田野，不辞辛苦；后两句以反问作结，引人深思，寓意深刻。诗人以小见大，借物喻人，既赞美了勤劳的品质，也流露出对社会不公的愤慨与同情。"},"028":{"o":"蓬头稚子学垂纶，侧坐莓苔草映身。\n路人借问遥招手，怕得鱼惊不应人。","t":[{"o":"蓬头稚子学垂纶，侧坐莓苔草映身。","t":"一个头发蓬乱的小孩正在学钓鱼，侧身坐在莓苔上，野草遮掩着他的身体。"},{"o":"路人借问遥招手，怕得鱼惊不应人。","t":"过路的人向他问路，他远远地摆摆手不肯回答，生怕惊跑了鱼儿。"}],"n":[{"w":"蓬头","m":"头发蓬乱的样子"},{"w":"稚子","m":"小孩子"},{"w":"垂纶","m":"钓鱼。纶，钓鱼用的丝线"},{"w":"莓苔","m":"泛指生长在阴湿地方的苔藓"},{"w":"映身","m":"遮蔽身体"},{"w":"借问","m":"向人打听问路"},{"w":"遥招手","m":"远远地摆手"},{"w":"应","m":"回答、应答"}],"a":"这首诗以传神的笔触描绘了一个天真可爱的小儿钓鱼的情景。诗人抓住\"侧坐\"\"遥招手\"等细节，生动刻画了孩子认真又机警的模样，充满童趣。全诗不用典、不藻饰，朴素自然却情趣盎然，展现了乡村生活中纯真动人的一幕。"},"029":{"o":"敕勒川，阴山下。\n天似穹庐，笼盖四野。\n天苍苍，野茫茫，\n风吹草低见牛羊。","t":[{"o":"敕勒川，阴山下。","t":"敕勒族居住的平原，就在阴山脚下。"},{"o":"天似穹庐，笼盖四野。","t":"天空像圆顶的毡帐，笼罩着四面八方辽阔的原野。"},{"o":"天苍苍，野茫茫，风吹草低见牛羊。","t":"蓝天苍苍茫茫，草原无边无际，风吹过茂密的牧草，露出了成群的牛羊。"}],"n":[{"w":"敕勒川","m":"敕勒族居住的平原。川，平川、平原"},{"w":"阴山","m":"山脉名，在今内蒙古自治区中部"},{"w":"穹庐","m":"游牧民族居住的圆顶毡帐，即蒙古包"},{"w":"四野","m":"四面的原野"},{"w":"苍苍","m":"深青色，形容天空辽阔深远"},{"w":"茫茫","m":"辽阔无边的样子"},{"w":"见","m":"同\"现\"，显露、出现"}],"a":"这是北朝时期流传于敕勒族的民歌，以雄浑壮阔的笔调描绘了北方草原的壮丽风光。全诗由近及远、由静到动，从阴山脚下的平川写到苍茫的天空与无边的草原，最后以\"风吹草低见牛羊\"的动态画面收束，展现了北方游牧民族豪迈奔放的精神气质，意境壮美，气势磅礴。"},"030":{"o":"西塞山前白鹭飞，桃花流水鳜鱼肥。\n青箬笠，绿蓑衣，斜风细雨不须归。","t":[{"o":"西塞山前白鹭飞，桃花流水鳜鱼肥。","t":"西塞山前白鹭在自由飞翔，桃花盛开，春水上涨，水中的鳜鱼正肥美。"},{"o":"青箬笠，绿蓑衣，斜风细雨不须归。","t":"头戴青色的箬笠，身披绿色的蓑衣，在斜风细雨中垂钓，不想回家。"}],"n":[{"w":"西塞山","m":"山名，在今浙江湖州"},{"w":"白鹭","m":"一种水鸟，羽毛白色"},{"w":"桃花流水","m":"桃花盛开的季节，春水盛涨"},{"w":"鳜鱼","m":"一种淡水鱼，味道鲜美"},{"w":"箬笠","m":"用竹叶或竹篾编成的斗笠"},{"w":"蓑衣","m":"用草或棕编成的雨衣"},{"w":"不须归","m":"不想回去，不愿意回家"}],"a":"这首词描绘了一幅清新秀丽的江南春雨垂钓图。白鹭飞翔、桃花流水、肥美鳜鱼，色彩鲜明，充满生机；而青箬笠、绿蓑衣的渔翁在斜风细雨中悠然自得，更添隐逸闲适之趣。全词意境优美，声色俱佳，表达了诗人寄情山水、逍遥自在的隐逸情怀。"},"031":{"o":"月黑雁飞高，单于夜遁逃。\n欲将轻骑逐，大雪满弓刀。","t":[{"o":"月黑雁飞高，单于夜遁逃。","t":"没有月光的黑夜，大雁高高飞起，敌军的首领趁夜色偷偷逃跑了。"},{"o":"欲将轻骑逐，大雪满弓刀。","t":"正要率领轻骑兵去追击敌人，漫天大雪已经落满了将士们的弓箭和佩刀。"}],"n":[{"w":"月黑","m":"没有月光、漆黑的夜晚"},{"w":"单于","m":"匈奴的首领称号，这里泛指敌军首领"},{"w":"遁逃","m":"逃跑"},{"w":"将","m":"率领"},{"w":"轻骑","m":"轻装快速的骑兵"},{"w":"逐","m":"追击"},{"w":"满","m":"落满、覆盖"}],"a":"这首边塞诗以简练的笔触渲染了紧张激烈的战场氛围。\"月黑\"之夜、\"雁飞\"之惊，暗示敌军趁夜溃逃；\"大雪满弓刀\"一句尤为传神，写出了边塞严寒与将士们不畏艰苦、奋勇追击的英雄气概。全诗节奏紧凑，气势雄壮，意境苍凉，尽显边塞战争的壮烈与豪迈。"},"032":{"o":"天门中断楚江开，碧水东流至此回。\n两岸青山相对出，孤帆一片日边来。","t":[{"o":"天门中断楚江开，碧水东流至此回。","t":"天门山从中间断裂，长江从中奔涌而过，碧绿的江水向东流到这里回旋激荡。"},{"o":"两岸青山相对出，孤帆一片日边来。","t":"两岸的青山对峙耸立，一片孤帆从太阳升起的地方驶来。"}],"n":[{"w":"天门山","m":"位于今安徽和县与芜湖之间的长江两岸"},{"w":"中断","m":"从中间断开"},{"w":"楚江","m":"长江。古代安徽一带属楚国，故称楚江"},{"w":"回","m":"回旋、转折"},{"w":"相对出","m":"相对耸立，好像迎面而出"},{"w":"孤帆","m":"孤单的船帆，代指一只船"},{"w":"日边","m":"太阳升起的地方"}],"a":"这首诗描绘了天门山的壮丽景色和长江奔流的雄伟气势。首句以\"中断\"写山势之奇，次句以\"回\"字写水势之猛，三句以\"相对出\"赋予青山动感，末句以孤帆远影收束全篇。全诗色彩明丽，气势开阔，动静结合，展现了诗人豪放飘逸的风格和对祖国山河的热爱。"},"033":{"o":"朝辞白帝彩云间，千里江陵一日还。\n两岸猿声啼不住，轻舟已过万重山。","t":[{"o":"朝辞白帝彩云间，千里江陵一日还。","t":"清晨告别了仿佛在彩云之间的白帝城，千里之遥的江陵一天之内就可以到达。"},{"o":"两岸猿声啼不住，轻舟已过万重山。","t":"长江两岸的猿猴叫声还在耳边回荡不停，轻快的小船已经穿过了重重叠叠的山峦。"}],"n":[{"w":"白帝城","m":"在今重庆奉节，地势很高"},{"w":"彩云间","m":"形容白帝城地势高耸，如在云彩之中"},{"w":"江陵","m":"今湖北荆州"},{"w":"一日还","m":"一天就到达，形容船行极快"},{"w":"啼不住","m":"叫声不断"},{"w":"轻舟","m":"轻快的小船"},{"w":"万重山","m":"万重，形容山很多。层层叠叠的山峦"}],"a":"这首诗写于诗人被赦后从白帝城乘舟东下之时，全诗洋溢着轻松欢快的感情。首句以\"彩云间\"写白帝城之高，次句以\"千里\"与\"一日\"对比写舟行之快，后两句以猿声未歇而舟已过万重山的夸张手法，渲染了船行的迅速与诗人心中的喜悦。气势奔放，节奏明快，是李白浪漫主义诗风的典范之作。"},"034":{"o":"李白乘舟将欲行，忽闻岸上踏歌声。\n桃花潭水深千尺，不及汪伦送我情。","t":[{"o":"李白乘舟将欲行，忽闻岸上踏歌声。","t":"我正乘着船准备出发，忽然听到岸上传来合着节拍唱歌的声音。"},{"o":"桃花潭水深千尺，不及汪伦送我情。","t":"桃花潭的水即使有千尺之深，也比不上汪伦送我的这份深情厚谊。"}],"n":[{"w":"将欲行","m":"即将出发、将要离去"},{"w":"踏歌","m":"一边唱歌一边用脚踏地打节拍"},{"w":"桃花潭","m":"在今安徽泾县西南"},{"w":"千尺","m":"虚数，形容水很深"},{"w":"不及","m":"比不上"}],"a":"这首诗以朴素的语言表达了真挚深厚的友情。前两句叙事，写诗人正要启程时忽闻歌声，惊喜之情溢于言表；后两句以桃花潭水的深来比喻友情的深厚，以夸张手法写出情谊之深不可测。全诗直抒胸臆，信手写来，自然真切，感人至深，是送别诗中的千古名篇。"},"035":{"o":"月落乌啼霜满天，江枫渔火对愁眠。\n姑苏城外寒山寺，夜半钟声到客船。","t":[{"o":"月落乌啼霜满天，江枫渔火对愁眠。","t":"月亮落下去了，乌鸦在啼叫，寒霜布满了天空，面对着江边的枫树和渔火，满怀愁绪难以入眠。"},{"o":"姑苏城外寒山寺，夜半钟声到客船。","t":"姑苏城外的寒山寺，在半夜时分传来了悠远的钟声，飘到了我乘坐的客船上。"}],"n":[{"w":"乌啼","m":"乌鸦啼叫"},{"w":"霜满天","m":"寒霜弥漫天空，形容秋夜寒冷"},{"w":"江枫","m":"江边的枫树"},{"w":"渔火","m":"渔船上的灯火"},{"w":"对愁眠","m":"伴着愁绪入睡"},{"w":"姑苏","m":"苏州的别称"},{"w":"寒山寺","m":"在苏州城西枫桥附近的一座古寺"},{"w":"客船","m":"旅客乘坐的船，这里指诗人所乘之船"}],"a":"这首诗以极其精炼的笔触勾勒出一幅幽静凄美的秋夜泊舟图。月落、乌啼、霜天、江枫、渔火，营造出清冷孤寂的氛围；而夜半寒山寺的钟声悠然传来，更添旅人愁思。全诗以景写情，声色俱备，动静相间，将羁旅之愁与江南水乡的清幽意境完美融合，堪称唐人绝句中的经典之作。"},"036":{"o":"独怜幽草涧边生，上有黄鹂深树鸣。\n春潮带雨晚来急，野渡无人舟自横。","t":[{"o":"独怜幽草涧边生，上有黄鹂深树鸣。","t":"我唯独喜爱涧边生长的幽幽青草，树丛深处有黄鹂鸟在婉转鸣叫。"},{"o":"春潮带雨晚来急，野渡无人舟自横。","t":"傍晚时分，春潮伴着雨水来得急促，荒野的渡口空无一人，只有小船独自横在水面上。"}],"n":[{"w":"独怜","m":"唯独喜爱。怜，爱"},{"w":"幽草","m":"幽深处的青草"},{"w":"涧","m":"山间的小河沟"},{"w":"黄鹂","m":"黄莺鸟"},{"w":"深树","m":"树丛深处"},{"w":"春潮","m":"春天的潮水"},{"w":"野渡","m":"荒野的渡口"},{"w":"舟自横","m":"小船独自横浮在水面上"}],"a":"这首诗以清丽的笔触描绘了滁州西涧的春日暮景。幽草、黄鹂、春潮、骤雨、野渡、横舟，构成一幅宁静恬淡的水乡画卷。末句\"野渡无人舟自横\"尤为传神，以小船自横的闲适之态寄托了诗人淡泊宁静的心境。全诗动静相映，声色兼备，意境幽美，体现了诗人闲适自得的人生态度。"},"037":{"o":"日照香炉生紫烟，遥看瀑布挂前川。\n飞流直下三千尺，疑是银河落九天。","t":[{"o":"日照香炉生紫烟，遥看瀑布挂前川。","t":"太阳照耀着香炉峰，升起了紫色的云烟，远远望去，瀑布像白练一样挂在山前。"},{"o":"飞流直下三千尺，疑是银河落九天。","t":"飞腾的水流直泻而下有三千尺之高，让人怀疑是天上的银河落到了人间。"}],"n":[{"w":"香炉","m":"庐山香炉峰"},{"w":"紫烟","m":"日光照射下升腾的紫色云雾"},{"w":"挂前川","m":"挂在山前面的河流上"},{"w":"飞流","m":"飞腾而下的水流"},{"w":"三千尺","m":"虚数，形容瀑布极高"},{"w":"银河","m":"天上的银河"},{"w":"九天","m":"天的最高处"}],"a":"这首诗以大胆的想象和极度的夸张描绘了庐山瀑布的雄伟壮观。\"飞流直下三千尺\"写尽了瀑布的磅礴气势，\"疑是银河落九天\"更是神来之笔，将瀑布比作从天上倾泻而下的银河，想象力惊人。全诗气势恢宏，色彩瑰丽，展现了李白诗歌浪漫主义的典型风格，是描写瀑布的千古绝唱。"},"038":{"o":"故人西辞黄鹤楼，烟花三月下扬州。\n孤帆远影碧空尽，唯见长江天际流。","t":[{"o":"故人西辞黄鹤楼，烟花三月下扬州。","t":"老朋友在黄鹤楼与我辞别，在繁花似锦的三月顺江而下前往扬州。"},{"o":"孤帆远影碧空尽，唯见长江天际流。","t":"孤帆的远影渐渐消失在碧空尽头，只看见滚滚长江向天际流去。"}],"n":[{"w":"故人","m":"老朋友，指孟浩然"},{"w":"西辞","m":"从西边辞别。黄鹤楼在扬州之西"},{"w":"黄鹤楼","m":"在今湖北武汉蛇山上"},{"w":"烟花","m":"形容春天繁花似锦、烟雾迷蒙的景色"},{"w":"下扬州","m":"顺江东下去扬州"},{"w":"碧空尽","m":"消失在蓝天的尽头"},{"w":"天际流","m":"流向天边"}],"a":"这首送别诗以绚丽开阔的春景衬托离别之情，别具一格。\"烟花三月\"写尽江南春色的美好，而目送孤帆远去、直至消失于天际，尽显诗人对友人的深厚情谊与依依不舍。全诗意境开阔，色彩明丽，以景传情，在送别的感伤中透出潇洒飘逸之气，堪称送别诗的千古绝唱。"},"039":{"o":"独在异乡为异客，每逢佳节倍思亲。\n遥知兄弟登高处，遍插茱萸少一人。","t":[{"o":"独在异乡为异客，每逢佳节倍思亲。","t":"独自漂泊在异乡作他乡之客，每当遇到美好的节日就更加思念家中的亲人。"},{"o":"遥知兄弟登高处，遍插茱萸少一人。","t":"远远想到兄弟们今天登高远望的时候，每个人都插着茱萸，只少了我一个人。"}],"n":[{"w":"九月九日","m":"重阳节，古人有登高、插茱萸的习俗"},{"w":"山东","m":"指华山以东，王维的家乡蒲州在华山以东"},{"w":"异乡","m":"他乡、外乡"},{"w":"佳节","m":"美好的节日"},{"w":"登高","m":"重阳节有登高避灾的习俗"},{"w":"茱萸","m":"一种香草，重阳节佩戴可以避邪"},{"w":"少一人","m":"少了诗人自己"}],"a":"这首诗以质朴的语言写出了游子的思乡之情，\"每逢佳节倍思亲\"已成为千古传诵的名句。诗人不直写自己思念兄弟，而是从对方着笔，想象家乡兄弟登高时发现少了一个人，曲折含蓄地表达了深切的思念。全诗感情真挚，构思巧妙，以反写正，深情婉转，令人动容。"},"040":{"o":"渭城朝雨浥轻尘，客舍青青柳色新。\n劝君更尽一杯酒，西出阳关无故人。","t":[{"o":"渭城朝雨浥轻尘，客舍青青柳色新。","t":"渭城的清晨下了一场雨，润湿了路上的轻尘，客舍旁的柳树被雨水冲洗后显得格外青翠清新。"},{"o":"劝君更尽一杯酒，西出阳关无故人。","t":"请你再干了这一杯酒吧，向西出了阳关之后就再也没有老朋友了。"}],"n":[{"w":"元二","m":"诗人的朋友，姓元，排行第二"},{"w":"使安西","m":"出使到安西（今新疆一带）"},{"w":"渭城","m":"秦时的咸阳城，在长安西北"},{"w":"浥","m":"润湿"},{"w":"客舍","m":"旅店"},{"w":"更尽","m":"再喝完"},{"w":"阳关","m":"古关名，在今甘肃敦煌西南"},{"w":"故人","m":"老朋友"}],"a":"这首送别诗以清新的春景反衬离别的伤感，情景交融。\"劝君更尽一杯酒，西出阳关无故人\"将深沉的离愁化为临别时的殷勤劝酒，语言朴素却情意深长，既有对朋友远行的关切与担忧，也有对别后孤独的慨叹。全诗语浅情深，意境悠远，后被谱为《阳关三叠》，成为千古传唱的送别名曲。"},"041":{"o":"好雨知时节，当春乃发生。\n随风潜入夜，润物细无声。\n野径云俱黑，江船火独明。\n晓看红湿处，花重锦官城。","t":[{"o":"好雨知时节，当春乃发生。","t":"好雨好像知道时令节气，到了春天就适时地降下。"},{"o":"随风潜入夜，润物细无声。","t":"随着春风在夜晚悄悄地来临，默默地滋润着万物，细微得听不到声音。"},{"o":"野径云俱黑，江船火独明。","t":"田野间的小路和天空的云全都黑沉沉的，只有江边船上的一盏灯火独自闪亮。"},{"o":"晓看红湿处，花重锦官城。","t":"等到清晨去看那些被雨水润湿的红花，整个锦官城里繁花带着雨水，显得沉甸甸的。"}],"n":[{"w":"知时节","m":"好像懂得时令节气"},{"w":"乃","m":"就"},{"w":"发生","m":"降下、出现"},{"w":"潜","m":"悄悄地"},{"w":"润物","m":"滋润万物"},{"w":"野径","m":"田野间的小路"},{"w":"花重","m":"花因沾雨水而显得沉甸甸"},{"w":"锦官城","m":"成都的别称"}],"a":"这首诗以细腻的笔触描绘了春夜降雨的景象，表达了诗人对春雨的喜悦之情。\"随风潜入夜，润物细无声\"是千古名句，将春雨悄然而至、默默滋润万物的特点写得传神入化。全诗从\"知\"字落笔，以拟人手法赋予春雨灵性，由夜写到晨，由听觉到视觉，层次分明，意境优美，充分体现了杜甫体物入微的艺术功力。"},"042":{"o":"黄四娘家花满蹊，千朵万朵压枝低。\n留连戏蝶时时舞，自在娇莺恰恰啼。","t":[{"o":"黄四娘家花满蹊，千朵万朵压枝低。","t":"黄四娘家的花开满了小路，千朵万朵的花把枝条都压弯了。"},{"o":"留连戏蝶时时舞，自在娇莺恰恰啼。","t":"流连在花丛中的蝴蝶不停地翩翩飞舞，自由自在的娇莺发出清脆婉转的鸣叫。"}],"n":[{"w":"江畔","m":"江边，指锦江之畔"},{"w":"独步","m":"独自散步"},{"w":"黄四娘","m":"杜甫在成都草堂时的邻居"},{"w":"蹊","m":"小路"},{"w":"压枝低","m":"花朵繁多把枝条都压弯了"},{"w":"留连","m":"依恋不舍，不愿离去"},{"w":"戏蝶","m":"嬉戏飞舞的蝴蝶"},{"w":"恰恰","m":"形容鸟叫声清脆婉转"}],"a":"这首诗描绘了一幅生机勃勃的春日繁花图。\"花满蹊\"\"压枝低\"写花之繁盛，\"戏蝶时时舞\"\"娇莺恰恰啼\"以动衬静，为画面增添了灵动的气息。全诗色彩明丽，声态俱佳，营造出欢快愉悦的氛围，展现了诗人在成都草堂时期难得的闲适心情，也表达了对春天美好景色的热爱。"},"043":{"o":"湖光秋月两相和，潭面无风镜未磨。\n遥望洞庭山水翠，白银盘里一青螺。","t":[{"o":"湖光秋月两相和，潭面无风镜未磨。","t":"洞庭湖的水光与秋天的月色交相辉映，湖面风平浪静，就像一面尚未打磨的铜镜。"},{"o":"遥望洞庭山水翠，白银盘里一青螺。","t":"远远望去，洞庭湖中的山水苍翠葱郁，就像是白银盘里放着一颗青色的螺。"}],"n":[{"w":"洞庭","m":"洞庭湖，在湖南北部"},{"w":"两相和","m":"湖光与秋月交相辉映，和谐融洽"},{"w":"潭面","m":"湖面"},{"w":"镜未磨","m":"比喻湖面平静，像没打磨的铜镜"},{"w":"山水翠","m":"山水一片苍翠"},{"w":"白银盘","m":"比喻月光下的湖面"},{"w":"青螺","m":"比喻湖中的君山，形似青螺"}],"a":"这首诗以巧妙的比喻描绘了秋夜洞庭湖的宁静秀美。月光与湖光交融，湖面如未磨的铜镜，君山如白银盘中的青螺，比喻新颖贴切，令人叹服。全诗意境空灵澄澈，色彩素雅和谐，以极简的笔触勾勒出洞庭湖的壮阔与秀美，展现了诗人旷达乐观的胸襟与高超的艺术表现力。"},"044":{"o":"九曲黄河万里沙，浪淘风簸自天涯。\n如今直上银河去，同到牵牛织女家。","t":[{"o":"九曲黄河万里沙，浪淘风簸自天涯。","t":"弯弯曲曲的黄河裹挟着万里黄沙，大浪翻滚、狂风呼啸，仿佛从天边奔涌而来。"},{"o":"如今直上银河去，同到牵牛织女家。","t":"如今我要直上九天银河去，一起去到牛郎织女的家中做客。"}],"n":[{"w":"九曲","m":"形容黄河弯弯曲曲"},{"w":"万里沙","m":"黄河携带的大量泥沙"},{"w":"浪淘","m":"波浪翻滚冲刷"},{"w":"风簸","m":"狂风掀动颠簸"},{"w":"天涯","m":"天边"},{"w":"银河","m":"天上的银河"},{"w":"牵牛织女","m":"牛郎星和织女星"}],"a":"这首诗以豪迈的气魄描绘了黄河奔腾壮阔的景象。前两句写黄河之雄浑，浪涛翻滚、风沙弥漫，气势磅礴；后两句突发奇想，要顺着黄河直上银河探访牵牛织女，将现实与神话巧妙融合。全诗想象瑰丽，气势雄壮，展现了诗人积极乐观、昂扬向上的精神风貌和丰富的浪漫主义想象力。"},"045":{"o":"天街小雨润如酥，草色遥看近却无。\n最是一年春好处，绝胜烟柳满皇都。","t":[{"o":"天街小雨润如酥，草色遥看近却无。","t":"京城的街道上飘着细密的小雨，润泽如酥油般细腻，远远看去有一层淡淡的绿色，走近了却又几乎看不到。"},{"o":"最是一年春好处，绝胜烟柳满皇都。","t":"这正是一年中最美的春天景色，远远胜过暮春时节满城柳絮飘飞的皇都风光。"}],"n":[{"w":"水部张十八员外","m":"指张籍，他在兄弟中排行十八，任水部员外郎"},{"w":"天街","m":"京城长安的街道"},{"w":"润如酥","m":"细润光滑如酥油"},{"w":"近却无","m":"走近看反而看不到"},{"w":"最是","m":"正是"},{"w":"春好处","m":"春天最美好的时候"},{"w":"绝胜","m":"远远胜过"},{"w":"皇都","m":"京城长安"}],"a":"这首诗以细腻入微的观察捕捉了早春的独特之美。\"草色遥看近却无\"是千古传诵的名句，将早春小草刚刚萌发时远看有、近看无的微妙状态写得极为传神。诗人认为早春的清新胜过暮春的繁华，体现了他独特的审美眼光。全诗清新自然，比喻精妙，表达了对早春美景的由衷赞美。"},"046":{"o":"慈母手中线，游子身上衣。\n临行密密缝，意恐迟迟归。\n谁言寸草心，报得三春晖。","t":[{"o":"慈母手中线，游子身上衣。","t":"慈爱的母亲手中拿着针线，为即将远行的儿子缝制衣裳。"},{"o":"临行密密缝，意恐迟迟归。","t":"临行前一针一线密密地缝着，心里担心儿子在外迟迟不能回来。"},{"o":"谁言寸草心，报得三春晖。","t":"谁说小草那一点点嫩绿的心意，能够报答得了春天阳光般的深厚恩情呢？"}],"n":[{"w":"游子","m":"离家在外的人"},{"w":"密密缝","m":"一针针缝得很密实"},{"w":"意恐","m":"担心、恐怕"},{"w":"寸草心","m":"小草的嫩心，比喻子女微小的心意"},{"w":"三春晖","m":"春天的阳光，比喻母亲的恩情"},{"w":"报得","m":"报答得了"}],"a":"这首诗以日常生活中的缝衣场景歌颂了伟大而深沉的母爱。前四句以白描手法写母亲临行前密密缝衣的细节，平实却极为感人；末两句以寸草与春晖的比喻，表达了对母爱的无限感恩与难以回报的深情。全诗语言质朴无华，情感真挚动人，以小见大，千百年来引起无数读者的共鸣，是歌颂母爱的千古名篇。"},"047":{"o":"远上寒山石径斜，白云生处有人家。\n停车坐爱枫林晚，霜叶红于二月花。","t":[{"o":"远上寒山石径斜，白云生处有人家。","t":"沿着弯弯曲曲的石子小路登上秋天的远山，在白云飘浮的地方隐隐约约有几户人家。"},{"o":"停车坐爱枫林晚，霜叶红于二月花。","t":"停下马车是因为喜爱这深秋枫林的晚景，经霜的枫叶比二月的春花还要红艳。"}],"n":[{"w":"寒山","m":"深秋时节的山"},{"w":"石径斜","m":"石子铺成的小路弯弯曲曲。斜，弯曲"},{"w":"白云生处","m":"白云升腾飘浮的地方，指高山深处"},{"w":"坐","m":"因为"},{"w":"枫林晚","m":"傍晚时分的枫树林"},{"w":"霜叶","m":"被秋霜染红的枫叶"},{"w":"红于","m":"比……更红"},{"w":"二月花","m":"二月的春花"}],"a":"这首诗描绘了深秋山间的壮美景色，抒发了诗人对秋天枫林的热爱之情。\"霜叶红于二月花\"是千古名句，以春花衬托红叶，将秋色写得比春光更为灿烂热烈，一扫传统的悲秋之感。全诗色彩鲜明，意境开阔，在清冷的秋山中透出勃勃生机，展现了诗人积极向上的生活态度和独特的审美情趣。"},"048":{"o":"清明时节雨纷纷，路上行人欲断魂。\n借问酒家何处有，牧童遥指杏花村。","t":[{"o":"清明时节雨纷纷，路上行人欲断魂。","t":"清明时节细雨纷纷地下着，路上的行人愁绪满怀，好像丢了魂似的。"},{"o":"借问酒家何处有，牧童遥指杏花村。","t":"向人打听哪里有酒家可以歇脚，牧童远远地指着杏花深处的村庄。"}],"n":[{"w":"清明","m":"二十四节气之一，在四月上旬"},{"w":"纷纷","m":"形容雨下得很密"},{"w":"行人","m":"出门在外的旅人"},{"w":"断魂","m":"形容心情极其愁苦"},{"w":"借问","m":"向人打听"},{"w":"酒家","m":"酒店"},{"w":"遥指","m":"远远地指着"},{"w":"杏花村","m":"杏花深处的村庄"}],"a":"这首诗以清新流畅的语言描绘了清明时节的典型场景。细雨纷纷、行人断魂，渲染出凄迷忧愁的氛围；而牧童遥指杏花村，画面骤然一亮，由愁转喜，为全诗增添了一抹明媚的色彩。全诗起承转合自然流畅，情景交融，意境深远，以极平易的文字写出了深远悠长的韵味，是流传最广的唐诗之一。"},"049":{"o":"千里莺啼绿映红，水村山郭酒旗风。\n南朝四百八十寺，多少楼台烟雨中。","t":[{"o":"千里莺啼绿映红，水村山郭酒旗风。","t":"辽阔的江南大地上黄莺欢唱，绿叶映衬着红花，水边的村庄和山间的城郭到处飘扬着酒旗。"},{"o":"南朝四百八十寺，多少楼台烟雨中。","t":"南朝遗留下来的四百八十座寺庙，有多少楼台殿阁都笼罩在蒙蒙烟雨之中。"}],"n":[{"w":"莺啼","m":"黄莺鸣叫"},{"w":"绿映红","m":"绿叶与红花互相映衬"},{"w":"山郭","m":"山边的城镇"},{"w":"酒旗风","m":"酒旗在风中飘动。酒旗，酒店挂的招牌旗帜"},{"w":"南朝","m":"指宋、齐、梁、陈四个朝代"},{"w":"四百八十寺","m":"形容寺庙众多，非实数"},{"w":"楼台","m":"亭台楼阁"},{"w":"烟雨","m":"蒙蒙细雨"}],"a":"这首诗以宏大的视野描绘了江南春景的壮丽与秀美。前两句写明媚的春光，莺歌燕舞、花红柳绿、酒旗飘扬，色彩鲜明，生机盎然；后两句笔锋一转，将目光投向烟雨中若隐若现的古寺楼台，增添了一份历史的深沉与惆怅。全诗将自然美景与人文历史巧妙交融，既赞美了江南之美，也暗含对历史的感慨与反思。"},"050":{"o":"江南好，风景旧曾谙。\n日出江花红胜火，春来江水绿如蓝。\n能不忆江南？","t":[{"o":"江南好，风景旧曾谙。","t":"江南多么美好，那里的风景我从前就很熟悉。"},{"o":"日出江花红胜火，春来江水绿如蓝。","t":"太阳出来时江边的花朵比火焰还要红艳，春天到来时江水碧绿如同蓝色的染料。"},{"o":"能不忆江南？","t":"怎么能不思念江南呢？"}],"n":[{"w":"忆江南","m":"词牌名，也是题目"},{"w":"谙","m":"熟悉"},{"w":"江花","m":"江边的花"},{"w":"红胜火","m":"比火还要红"},{"w":"蓝","m":"蓝草，一种可以提取蓝色染料的植物"},{"w":"能不","m":"怎么能不"}],"a":"这首词以精炼的语言勾勒出江南春景的绚丽画面。词人用\"红胜火\"\"绿如蓝\"两个鲜明的色彩对比，将江南春日的明艳动人描绘得淋漓尽致。全词从\"旧曾谙\"的回忆写起，以\"能不忆\"的反问收束，首尾呼应，感情真挚，语言清新流畅，表达了对江南美景的深切怀念和无限热爱。"},"051":{"o":"江上往来人，但爱鲈鱼美。\n君看一叶舟，出没风波里。","t":[{"o":"江上往来人，但爱鲈鱼美。","t":"江上来来往往的行人，只喜爱鲈鱼味道的鲜美。"},{"o":"君看一叶舟，出没风波里。","t":"请您看看那一叶小舟，在风浪中忽隐忽现、出没无常。"}],"n":[{"w":"渔者","m":"捕鱼的人"},{"w":"但","m":"只"},{"w":"鲈鱼","m":"一种味道鲜美的鱼，产于江南"},{"w":"一叶舟","m":"像一片树叶一样的小船"},{"w":"出没","m":"忽隐忽现，时出时没"},{"w":"风波","m":"风浪"}],"a":"这首诗语言质朴，对比鲜明。前两句写岸上食客只知品尝鲈鱼的鲜美，后两句笔锋一转，将镜头对准风浪中颠簸的小舟，展现渔人捕鱼的艰辛与危险。诗人借此表达对劳动人民的深切同情，也暗含\"谁知盘中餐，粒粒皆辛苦\"的深意，寓意深刻，发人深省。"},"052":{"o":"爆竹声中一岁除，\n春风送暖入屠苏。\n千门万户曈曈日，\n总把新桃换旧符。","t":[{"o":"爆竹声中一岁除，春风送暖入屠苏。","t":"在阵阵爆竹声中送走了旧年，人们迎着和暖的春风开怀畅饮屠苏酒。"},{"o":"千门万户曈曈日，总把新桃换旧符。","t":"初升的太阳照耀着千家万户，人们都忙着把旧的桃符取下，换上新的桃符。"}],"n":[{"w":"元日","m":"农历正月初一，即春节"},{"w":"一岁除","m":"一年过去了"},{"w":"屠苏","m":"指屠苏酒，古人春节时饮用的药酒"},{"w":"曈曈","m":"光辉灿烂的样子"},{"w":"新桃、旧符","m":"桃符是古代挂在门上的桃木板，上画神像以驱邪，每年除夕更换"}],"a":"这首诗以新春佳节为背景，描绘了一幅欢乐祥和的过年图景。爆竹声声、春风送暖、旭日东升、桃符更新，四个画面层层递进，将新年的热闹气氛渲染得淋漓尽致。此诗也暗含诗人推行新法、除旧布新的政治抱负，借新春万象更新之景，抒发了对变革图强的美好期望。"},"053":{"o":"京口瓜洲一水间，\n钟山只隔数重山。\n春风又绿江南岸，\n明月何时照我还。","t":[{"o":"京口瓜洲一水间，钟山只隔数重山。","t":"京口和瓜洲之间只隔着一条长江，钟山也只隔着几座山峰。"},{"o":"春风又绿江南岸，明月何时照我还。","t":"春风又一次吹绿了江南的大地，明月什么时候才能照着我回到故乡呢？"}],"n":[{"w":"泊船","m":"停船靠岸"},{"w":"瓜洲","m":"在今江苏扬州南，长江北岸"},{"w":"京口","m":"今江苏镇江，长江南岸"},{"w":"一水","m":"指长江"},{"w":"钟山","m":"今南京紫金山"},{"w":"绿","m":"吹绿，用作动词"},{"w":"还","m":"回到故乡"}],"a":"这首诗是王安石途经瓜洲时所作的思乡之作。前两句以地理空间写距离之近，暗示离家不远却难以归去。第三句\"春风又绿江南岸\"是千古名句，一个\"绿\"字化静为动，将春风拂过的生机勃勃展现得淋漓尽致。末句以明月寄托思归之情，情景交融，含蓄深沉，表达了诗人对故乡的深切眷恋。"},"054":{"o":"茅檐长扫净无苔，\n花木成畦手自栽。\n一水护田将绿绕，\n两山排闼送青来。","t":[{"o":"茅檐长扫净无苔，花木成畦手自栽。","t":"茅草房檐下经常打扫得干干净净没有青苔，成行的花木都是主人亲手栽种的。"},{"o":"一水护田将绿绕，两山排闼送青来。","t":"一条小溪护卫着田野，将绿色的庄稼环绕其中；两座青山仿佛推门而入，送来满眼的苍翠。"}],"n":[{"w":"湖阴先生","m":"杨德逢的号，王安石晚年邻居"},{"w":"茅檐","m":"茅屋的屋檐下，指庭院"},{"w":"长扫","m":"经常打扫"},{"w":"畦","m":"田地中分成的小区"},{"w":"排闼","m":"推开门。闼，门"},{"w":"护田","m":"护卫着田地"},{"w":"送青来","m":"送来青翠的山色"}],"a":"这首诗题写在邻居湖阴先生的墙壁上，前两句赞美主人勤劳整洁的生活情趣，后两句运用拟人手法，将山水写得充满灵性——溪水\"护\"田，青山\"推门\"送翠，生动有趣。全诗以清新自然的笔调，展现了田园生活的宁静美好，也体现了诗人退居后淡泊闲适的心境。"},"055":{"o":"水光潋滟晴方好，\n山色空蒙雨亦奇。\n欲把西湖比西子，\n淡妆浓抹总相宜。","t":[{"o":"水光潋滟晴方好，山色空蒙雨亦奇。","t":"晴天时西湖波光粼粼的样子正美好，雨天时山色朦胧也别有一番奇妙。"},{"o":"欲把西湖比西子，淡妆浓抹总相宜。","t":"如果把西湖比作美女西施，无论淡妆还是浓抹都同样美丽动人。"}],"n":[{"w":"饮湖上","m":"在西湖上饮酒"},{"w":"初晴后雨","m":"起初晴天后来下雨"},{"w":"潋滟","m":"水波荡漾、波光闪动的样子"},{"w":"方好","m":"正好"},{"w":"空蒙","m":"朦胧、迷茫的样子"},{"w":"西子","m":"即西施，春秋越国美女"},{"w":"淡妆浓抹","m":"淡雅的妆饰和浓艳的妆饰"},{"w":"相宜","m":"合适、适宜"}],"a":"这首诗是苏轼咏西湖的千古绝唱。前两句分别描绘西湖晴天的水光和雨天的山色，点明西湖无论晴雨各有其美。后两句以绝妙比喻将西湖比作西施，晴如\"浓抹\"、雨如\"淡妆\"，赋予了西湖人格化的灵动之美。自此西湖又称\"西子湖\"，一个精妙的比喻让西湖名扬天下。"},"056":{"o":"横看成岭侧成峰，\n远近高低各不同。\n不识庐山真面目，\n只缘身在此山中。","t":[{"o":"横看成岭侧成峰，远近高低各不同。","t":"从正面看庐山是连绵的山岭，从侧面看则是高耸的山峰，从远处近处高处低处看去，呈现的景象各不相同。"},{"o":"不识庐山真面目，只缘身在此山中。","t":"之所以认不清庐山的真正面目，只是因为自己就身在这庐山之中。"}],"n":[{"w":"西林壁","m":"西林寺的墙壁。西林寺在庐山"},{"w":"横看","m":"从正面看"},{"w":"侧","m":"从侧面看"},{"w":"各不同","m":"各不相同"},{"w":"不识","m":"认不清、看不明"},{"w":"真面目","m":"真实的面貌"},{"w":"只缘","m":"只因为"},{"w":"身在此山中","m":"自己身处庐山之中"}],"a":"这是一首寓理于景的哲理诗。前两句描绘庐山从不同角度观看呈现不同面貌，生动写出了庐山的千姿百态。后两句由此生发哲理思考：当局者迷，旁观者清。身在其中反而看不清全貌与真相。这一道理具有普遍意义，启迪人们要从多角度观察事物，才能获得全面的认识。"},"057":{"o":"黑云翻墨未遮山，\n白雨跳珠乱入船。\n卷地风来忽吹散，\n望湖楼下水如天。","t":[{"o":"黑云翻墨未遮山，白雨跳珠乱入船。","t":"乌云像打翻的墨汁还没来得及遮住群山，白花花的雨点就像珍珠一样乱蹦乱跳地飞入船中。"},{"o":"卷地风来忽吹散，望湖楼下水如天。","t":"忽然刮来一阵大风将云雨吹散，望湖楼下的湖水平静得就像晴朗的天空。"}],"n":[{"w":"望湖楼","m":"在杭州西湖边的一座楼"},{"w":"醉书","m":"醉中所写"},{"w":"翻墨","m":"打翻墨汁，形容云层极黑"},{"w":"跳珠","m":"跳跃的珍珠，形容雨点飞溅"},{"w":"卷地风","m":"席卷大地的狂风"},{"w":"水如天","m":"湖水像天空一样清澈平静"}],"a":"这首诗以极为精炼的笔触，生动描绘了夏日西湖上一场来去匆匆的暴雨。前两句写暴雨骤至——乌云翻滚、大雨倾盆；第三句写风起云散；末句写雨过天晴，湖面如镜。四句诗四个画面，节奏明快，比喻新奇，将一场急雨写得有声有色、淋漓尽致，充分展现了苏轼豪放洒脱的诗风。"},"058":{"o":"竹外桃花三两枝，\n春江水暖鸭先知。\n蒌蒿满地芦芽短，\n正是河豚欲上时。","t":[{"o":"竹外桃花三两枝，春江水暖鸭先知。","t":"竹林外边开着三两枝桃花，春天江水变暖鸭子最先知道。"},{"o":"蒌蒿满地芦芽短，正是河豚欲上时。","t":"满地生长着蒌蒿，芦苇刚抽出短短的嫩芽，这正是一年春江水暖河豚将要逆流而上的时节。"}],"n":[{"w":"惠崇","m":"北宋僧人，能诗善画"},{"w":"春江晚景","m":"惠崇所画的一幅画名"},{"w":"蒌蒿","m":"一种生长在水边的草本植物"},{"w":"芦芽","m":"芦苇的嫩芽"},{"w":"河豚","m":"一种鱼，肉质鲜美，春天沿江而上"},{"w":"欲上","m":"将要逆流而上"}],"a":"这是一首著名的题画诗。诗人面对惠崇的画作，不仅描写了画面上的翠竹、桃花、春江、群鸭、蒌蒿、芦芽，还凭想象补充了画面之外的河豚，虚实结合，使画面更添生机。其中\"春江水暖鸭先知\"一句尤为传神，以鸭子戏水暗示春水回暖，既合乎画理又富有哲理，成为千古名句。"},"059":{"o":"生当作人杰，\n死亦为鬼雄。\n至今思项羽，\n不肯过江东。","t":[{"o":"生当作人杰，死亦为鬼雄。","t":"活着就应当做人中的豪杰，死了也要做鬼中的英雄。"},{"o":"至今思项羽，不肯过江东。","t":"直到今天人们还在思念项羽，因为他宁死也不肯渡江退回江东。"}],"n":[{"w":"人杰","m":"人中的豪杰"},{"w":"鬼雄","m":"鬼中的英雄"},{"w":"项羽","m":"秦末农民起义领袖，后败于刘邦"},{"w":"江东","m":"长江下游以东地区，项羽最初起兵之地"},{"w":"不肯过江东","m":"项羽兵败至乌江，本可渡江回江东重整旗鼓，但他自觉无颜面对江东父老，自刎而亡"}],"a":"这首诗借古讽今，气魄雄浑。李清照以项羽宁死不屈的英雄气概，辛辣讽刺了南宋朝廷苟且偷安、弃国南逃的怯懦行径。前两句慷慨激昂，高歌生死大义；后两句以项羽之事点明主题。全诗字字铿锵，掷地有声，展现了女诗人忧国忧民的壮烈情怀，与一般婉约词风形成鲜明对比。"},"060":{"o":"梅子黄时日日晴，\n小溪泛尽却山行。\n绿阴不减来时路，\n添得黄鹂四五声。","t":[{"o":"梅子黄时日日晴，小溪泛尽却山行。","t":"梅子黄熟的时候天天都是晴朗的好天气，乘小船走到小溪的尽头，再改走山路继续前行。"},{"o":"绿阴不减来时路，添得黄鹂四五声。","t":"山路上的绿树浓阴与来时一样浓密，还增添了几声黄鹂清脆的鸣叫。"}],"n":[{"w":"三衢","m":"今浙江衢州"},{"w":"梅子黄时","m":"指江南梅雨季节，一般多雨"},{"w":"日日晴","m":"天天晴朗，与往年不同"},{"w":"泛","m":"乘船"},{"w":"尽","m":"尽头"},{"w":"却","m":"再，又"},{"w":"绿阴","m":"绿树的浓荫"},{"w":"不减","m":"没有减少，一样浓密"}],"a":"这首诗记录了初夏时节一次愉快的出行。首句点明时令——梅子黄时本应阴雨连绵，偏偏日日晴朗，旅途好运；次句写水路转山路，行程悠然。后两句以绿阴和鸟鸣衬托归途的愉悦，\"不减\"写景之美依旧，\"添得\"更增几分生机。全诗笔调轻快，情景交融，将初夏山行的清新喜悦表达得恰到好处。"},"061":{"o":"死去元知万事空，\n但悲不见九州同。\n王师北定中原日，\n家祭无忘告乃翁。","t":[{"o":"死去元知万事空，但悲不见九州同。","t":"本来就知道人死后万事皆空，只是悲伤看不到祖国统一。"},{"o":"王师北定中原日，家祭无忘告乃翁。","t":"等到宋朝军队向北收复中原的那一天，举行家祭时别忘了把这个好消息告诉你们的父亲。"}],"n":[{"w":"示儿","m":"给儿子看，写给儿子"},{"w":"元知","m":"本来就知道"},{"w":"九州同","m":"指全国统一"},{"w":"王师","m":"朝廷的军队"},{"w":"北定中原","m":"向北收复中原失地"},{"w":"家祭","m":"家中祭祀祖先"},{"w":"乃翁","m":"你的父亲，陆游自称"}],"a":"这是陆游临终前写给儿子的遗嘱诗，也是他一生爱国情怀的最终绝唱。诗人自知将死，万念皆可放下，唯独不见祖国统一成为至死不灭的遗憾。他叮嘱儿子将来收复中原之日，莫忘告慰先人。全诗质朴无华却感人至深，一位老人至死不渝的爱国之心跃然纸上，读来令人潸然泪下。"},"062":{"o":"三万里河东入海，\n五千仞岳上摩天。\n遗民泪尽胡尘里，\n南望王师又一年。","t":[{"o":"三万里河东入海，五千仞岳上摩天。","t":"三万里长的黄河滚滚东流入海，五千仞高的华山巍巍直插云天。"},{"o":"遗民泪尽胡尘里，南望王师又一年。","t":"沦陷区的人民在金人铁蹄下眼泪都已流干，他们向南盼望朝廷的军队又盼了一年。"}],"n":[{"w":"将晓","m":"天快要亮"},{"w":"篱门","m":"竹篱笆门"},{"w":"三万里河","m":"指黄河，极言其长"},{"w":"五千仞岳","m":"指华山等北方名山，极言其高"},{"w":"摩天","m":"接触到天，形容极高"},{"w":"遗民","m":"沦陷区的人民"},{"w":"胡尘","m":"金人兵马扬起的尘土，指金人统治"},{"w":"王师","m":"朝廷的军队"}],"a":"这首诗以壮阔雄伟的山河起笔，与悲愤欲绝的遗民形成强烈反差。前两句歌颂祖国大好河山的壮丽，后两句转入对沦陷区人民的深切同情。\"泪尽\"二字触目惊心，\"又一年\"三字道尽无尽的失望与期盼。诗人以北望中原的沉痛心情，含蓄地批评了南宋朝廷的不思北伐，忧国忧民之情溢于言表。"},"063":{"o":"梅子金黄杏子肥，\n麦花雪白菜花稀。\n日长篱落无人过，\n惟有蜻蜓蛱蝶飞。","t":[{"o":"梅子金黄杏子肥，麦花雪白菜花稀。","t":"梅子已经变成金黄色，杏子也长得肥美饱满，荞麦花雪白一片，油菜花已渐渐稀疏。"},{"o":"日长篱落无人过，惟有蜻蜓蛱蝶飞。","t":"白天越来越长，篱笆前没有人经过，只有蜻蜓和蝴蝶在自由自在地飞舞。"}],"n":[{"w":"四时田园杂兴","m":"范成大写的一组田园诗，共六十首"},{"w":"肥","m":"果实丰满肥大"},{"w":"麦花","m":"麦子开的花"},{"w":"篱落","m":"篱笆"},{"w":"惟有","m":"只有"},{"w":"蛱蝶","m":"蝴蝶的一种"}],"a":"这首诗描绘了初夏时节江南农村的恬静风光。前两句以梅子、杏子、麦花、菜花四种植物的色彩与形态，勾勒出一幅五彩缤纷的田园画卷。后两句以\"无人过\"写村中宁静，以蜻蜓蝴蝶飞舞反衬夏日的悠长闲适。全诗色彩明丽，静中有动，展现了一幅自然和谐的乡村画卷。"},"064":{"o":"昼出耘田夜绩麻，\n村庄儿女各当家。\n童孙未解供耕织，\n也傍桑阴学种瓜。","t":[{"o":"昼出耘田夜绩麻，村庄儿女各当家。","t":"白天出去耕田锄草，夜晚搓麻线做活，村里的男男女女各司其职、各自操持家务。"},{"o":"童孙未解供耕织，也傍桑阴学种瓜。","t":"小孙子虽然还不懂得耕织之事，也在桑树荫下学着大人的样子种瓜玩耍。"}],"n":[{"w":"耘田","m":"在田间除草"},{"w":"绩麻","m":"把麻搓成线"},{"w":"各当家","m":"各人担当各自的家务"},{"w":"未解","m":"不懂得"},{"w":"供","m":"从事"},{"w":"傍","m":"靠近"},{"w":"桑阴","m":"桑树的荫凉处"}],"a":"这首诗生动再现了宋代农村繁忙而有序的劳动生活。前两句写大人白天耕田、夜晚绩麻，昼夜忙碌；后两句将镜头转向孩童，他们虽不懂耕织，却在桑荫下饶有兴致地模仿大人种瓜。这一细节充满童趣与温情，既表现了劳动人民的勤劳朴实，也展现了农家生活的天伦之乐，令人倍感亲切。"},"065":{"o":"毕竟西湖六月中，\n风光不与四时同。\n接天莲叶无穷碧，\n映日荷花别样红。","t":[{"o":"毕竟西湖六月中，风光不与四时同。","t":"毕竟是六月里的西湖，风光与其他时节确实大不相同。"},{"o":"接天莲叶无穷碧，映日荷花别样红。","t":"碧绿的莲叶一直铺到天边，一眼望不到尽头，在阳光映照下的荷花显得格外鲜艳红润。"}],"n":[{"w":"晓出","m":"早晨走出"},{"w":"净慈寺","m":"杭州西湖边的一座寺庙"},{"w":"林子方","m":"诗人的朋友"},{"w":"毕竟","m":"到底，终究"},{"w":"四时","m":"这里指其他时节"},{"w":"无穷碧","m":"无边无际的碧绿"},{"w":"别样红","m":"格外鲜红"}],"a":"这首诗以壮阔绚丽的笔触描绘了六月西湖的荷花盛景。前两句以感叹领起，强调六月西湖之美非同寻常；后两句以\"接天\"写莲叶之广，以\"无穷\"写碧色之深，以\"映日\"写荷花之娇，以\"别样\"写红色之艳。碧叶红花、蓝天绿水的色彩交织，构成一幅气势恢宏、明艳动人的西湖夏日画卷，令人叹为观止。"},"066":{"o":"胜日寻芳泗水滨，\n无边光景一时新。\n等闲识得东风面，\n万紫千红总是春。","t":[{"o":"胜日寻芳泗水滨，无边光景一时新。","t":"在美好的日子里来到泗水河边寻觅春色，无边无际的风光焕然一新。"},{"o":"等闲识得东风面，万紫千红总是春。","t":"轻而易举就认识了春风的面貌，因为那万紫千红的花朵都是春天的杰作。"}],"n":[{"w":"胜日","m":"好日子，天气晴朗的日子"},{"w":"寻芳","m":"寻找春天的花草美景"},{"w":"泗水滨","m":"泗水河边，在今山东曲阜"},{"w":"无边","m":"没有边际"},{"w":"一时新","m":"一下子焕然一新"},{"w":"等闲","m":"轻易，随便"},{"w":"东风","m":"春风"},{"w":"万紫千红","m":"形容百花齐放、色彩缤纷"}],"a":"这首诗表面上是春日踏青赏景之作，实则是一首寓理于景的哲理诗。泗水是当年孔子讲学之地，\"寻芳\"暗喻求圣人之道，\"东风\"象征圣贤教化。后两句\"等闲识得东风面，万紫千红总是春\"既是对春天繁花似锦的赞美，也暗含\"道\"无处不在的理趣。全诗看似写景，实则说理，景美而意深。"},"067":{"o":"半亩方塘一鉴开，\n天光云影共徘徊。\n问渠那得清如许？\n为有源头活水来。","t":[{"o":"半亩方塘一鉴开，天光云影共徘徊。","t":"半亩大的方形池塘像一面打开的镜子，天空的光彩和云朵的倒影在水中一起浮动。"},{"o":"问渠那得清如许？为有源头活水来。","t":"问它怎么会如此清澈？因为有源头的活水源源不断地流进来。"}],"n":[{"w":"方塘","m":"方形的水池"},{"w":"一鉴开","m":"像一面镜子打开"},{"w":"天光云影","m":"天空的光亮和云的倒影"},{"w":"徘徊","m":"在水中浮动"},{"w":"渠","m":"它，指方塘"},{"w":"那得","m":"怎么能够"},{"w":"清如许","m":"像这样清澈"},{"w":"活水","m":"源头不断流来的新鲜水"}],"a":"这是一首以景喻理的名篇。诗人以方塘比喻人的心灵，以活水比喻不断学习的新知识。方塘之所以清澈明净，是因为有源头活水不断注入；人的心智之所以通透明达，是因为不断读书学习。全诗以形象生动的比喻阐释了\"学无止境\"的深刻道理，将抽象的哲理化为可感可触的画面，意味悠长。"},"068":{"o":"山外青山楼外楼，\n西湖歌舞几时休？\n暖风熏得游人醉，\n直把杭州作汴州。","t":[{"o":"山外青山楼外楼，西湖歌舞几时休？","t":"青山之外还有青山，楼阁之外还有楼阁，西湖边上的歌舞什么时候才能停止呢？"},{"o":"暖风熏得游人醉，直把杭州作汴州。","t":"暖洋洋的春风把游人们熏得如醉如痴，简直把杭州当成了故都汴州。"}],"n":[{"w":"临安","m":"今浙江杭州，南宋都城"},{"w":"邸","m":"旅店"},{"w":"休","m":"停止"},{"w":"暖风","m":"表面指春风，暗指南宋统治者沉迷享乐的风气"},{"w":"游人","m":"指权贵达官"},{"w":"直","m":"简直"},{"w":"汴州","m":"即汴京，今河南开封，北宋都城"}],"a":"这是一首流传千古的政治讽刺诗。诗人以鲜明的对比揭示了一个令人痛心的现实：南宋统治者面对半壁江山沦丧，不思收复失地，反而在杭州醉生梦死、歌舞升平。\"直把杭州作汴州\"一句尤为辛辣，揭露了统治者的苟且偷安与忘本。全诗看似写景，实则字字含泪，饱含着忧国忧民的愤激之情。"},"069":{"o":"应怜屐齿印苍苔，\n小扣柴扉久不开。\n春色满园关不住，\n一枝红杏出墙来。","t":[{"o":"应怜屐齿印苍苔，小扣柴扉久不开。","t":"大概是园主人怕我的木屐踩坏了青苔，轻轻敲了许久的柴门也没有人来开。"},{"o":"春色满园关不住，一枝红杏出墙来。","t":"满园的春色是关不住的，一枝红色的杏花已经伸出墙外来了。"}],"n":[{"w":"不值","m":"没有遇到，指没有遇到园主人"},{"w":"应","m":"大概，应该"},{"w":"怜","m":"爱惜，怜惜"},{"w":"屐齿","m":"木屐底下的齿"},{"w":"苍苔","m":"青苔"},{"w":"小扣","m":"轻轻敲打"},{"w":"柴扉","m":"柴门"}],"a":"这首诗以一次访友不遇的寻常经历，写出了极富哲理的诗意。前两句写访园未果的些许失落，后两句笔锋一转，虽然未能入园，但一枝探出墙外的红杏却泄露了满园春色。这既是写春景的佳句，也蕴含着深刻的哲理——一切新生美好的事物是任何力量都封锁不住的，它总会找到出路，绽放光彩。"},"070":{"o":"绿遍山原白满川，\n子规声里雨如烟。\n乡村四月闲人少，\n才了蚕桑又插田。","t":[{"o":"绿遍山原白满川，子规声里雨如烟。","t":"绿色铺满了山坡和原野，白色的水光映满了河川，杜鹃鸟在如烟的细雨中声声啼叫。"},{"o":"乡村四月闲人少，才了蚕桑又插田。","t":"乡村四月里很少有闲人，刚刚忙完采桑养蚕，又赶紧去田间插秧。"}],"n":[{"w":"山原","m":"山地和原野"},{"w":"白满川","m":"指水田里蓄满了水，映着天光泛出白色"},{"w":"子规","m":"杜鹃鸟"},{"w":"雨如烟","m":"细雨蒙蒙像烟雾一样"},{"w":"才了","m":"刚刚结束"},{"w":"蚕桑","m":"养蚕和采桑叶"},{"w":"插田","m":"插秧"}],"a":"这首诗以清新明丽的笔调展现了江南农村四月间的繁忙景象。前两句描绘自然风光——绿野白川、子规烟雨，构成一幅水墨画般的江南春景；后两句转入人事，写农人采桑养蚕和田间插秧的忙碌。全诗以景衬人，以美景写劳作，既赞美了劳动人民的勤劳，又流露出对田园生活的喜爱，景美情真，意趣盎然。"},"071":{"o":"我家洗砚池头树，\n朵朵花开淡墨痕。\n不要人夸好颜色，\n只留清气满乾坤。","t":[{"o":"我家洗砚池头树，朵朵花开淡墨痕。","t":"我家洗砚池边的那棵梅树，朵朵梅花开放，都像是用淡墨点画而成的。"},{"o":"不要人夸好颜色，只留清气满乾坤。","t":"不需要别人夸赞它的颜色多么好看，只想将清高的气节留存在天地之间。"}],"n":[{"w":"墨梅","m":"水墨画中的梅花"},{"w":"洗砚池","m":"传说王羲之洗砚台的池子，这里是借用"},{"w":"淡墨痕","m":"淡淡的墨迹"},{"w":"清气","m":"清高的气节"},{"w":"乾坤","m":"天地之间"}],"a":"这首诗是王冕题写在自己所画墨梅图上的作品。墨梅不以艳丽的色彩取悦世人，而是以淡墨的素雅展现高洁的品格。诗人借墨梅自喻，表达了自己不愿随波逐流、谄媚权贵的人生态度，只愿坚守清正的操守。全诗以梅喻人，托物言志，\"只留清气满乾坤\"一句气韵高远，展现了诗人傲岸不屈的精神品格。"},"072":{"o":"千锤万凿出深山，\n烈火焚烧若等闲。\n粉骨碎身浑不怕，\n要留清白在人间。","t":[{"o":"千锤万凿出深山，烈火焚烧若等闲。","t":"经过千万次的锤打和开凿才从深山中采出石灰石，烈火焚烧对它来说就像平常的事一样。"},{"o":"粉骨碎身浑不怕，要留清白在人间。","t":"即使粉身碎骨也全然不怕，只为把清白的本色留在人世间。"}],"n":[{"w":"石灰吟","m":"赞颂石灰的诗"},{"w":"千锤万凿","m":"形容开采石灰石十分艰难"},{"w":"若等闲","m":"好像很平常的事"},{"w":"粉骨碎身","m":"形容石灰石被烧成粉末"},{"w":"浑不怕","m":"全然不怕"},{"w":"清白","m":"表面指石灰洁白的颜色，暗喻高尚的节操"}],"a":"这首诗借石灰自喻，是一首典型的托物言志之作。诗人以石灰从开采到煅烧再到粉碎的过程，象征人生经历的种种磨难。\"烈火焚烧若等闲\"写出了面对考验的从容淡定，\"要留清白在人间\"则发出了坚守节操的铮铮誓言。于谦一生为官清廉、为国尽忠，最终含冤而死，这首诗正是他光明磊落一生的真实写照。"},"073":{"o":"咬定青山不放松，\n立根原在破岩中。\n千磨万击还坚劲，\n任尔东西南北风。","t":[{"o":"咬定青山不放松，立根原在破岩中。","t":"竹子紧紧咬住青山一点也不放松，它的根原本就扎在破碎的岩石缝之中。"},{"o":"千磨万击还坚劲，任尔东西南北风。","t":"无论经历多少折磨和打击依然坚韧挺拔，任凭你东南西北风怎样吹打也不屈服。"}],"n":[{"w":"竹石","m":"扎根在岩石中的竹子"},{"w":"咬定","m":"紧紧咬住，比喻扎根极深"},{"w":"立根","m":"扎根"},{"w":"破岩","m":"破裂的岩石缝"},{"w":"千磨万击","m":"无数的磨难和打击"},{"w":"坚劲","m":"坚韧挺拔"},{"w":"任尔","m":"任凭你"},{"w":"东西南北风","m":"从四面八方吹来的风，比喻各种打击和磨难"}],"a":"这首诗借竹子扎根岩石、坚韧不拔的形象，表达了不屈不挠的精神品格。\"咬定\"二字极富力度，将竹子顽强扎根的形象刻画得栩栩如生。后两句写竹子任凭风吹雨打依然坚劲，实则以竹喻人，表达了诗人面对人生逆境和世俗压力时绝不屈服的刚硬骨气。全诗语言刚健有力，意境雄浑，读来令人振奋。"},"074":{"o":"浩荡离愁白日斜，\n吟鞭东指即天涯。\n落红不是无情物，\n化作春泥更护花。","t":[{"o":"浩荡离愁白日斜，吟鞭东指即天涯。","t":"浩浩荡荡的离愁别绪在夕阳西下时涌上心头，吟咏着挥鞭向东，从此便是远走天涯。"},{"o":"落红不是无情物，化作春泥更护花。","t":"飘落的花瓣并不是无情之物，它化为春天的泥土，还能更好地培育和保护新的花朵。"}],"n":[{"w":"己亥","m":"己亥年，即1839年"},{"w":"浩荡","m":"广阔深远的样子"},{"w":"离愁","m":"离别的愁绪"},{"w":"白日斜","m":"太阳西斜"},{"w":"吟鞭","m":"一边吟诗一边挥鞭"},{"w":"天涯","m":"天边，指远离京城的地方"},{"w":"落红","m":"落花"},{"w":"化作春泥","m":"变成春天的泥土"}],"a":"这首诗是龚自珍辞官南归途中所作。前两句写离别的愁绪与远离京城的感慨，情调苍凉深沉。后两句是千古传诵的名句，诗人以落花自喻，表达虽已离开朝廷，仍愿为国家和后辈贡献力量的赤诚之心。\"落红不是无情物，化作春泥更护花\"意境优美而寄托深远，将离别的伤感升华为奉献的豪情，至今仍被广泛引用。"},"075":{"o":"青青园中葵，朝露待日晞。\n阳春布德泽，万物生光辉。\n常恐秋节至，焜黄华叶衰。\n百川东到海，何时复西归？\n少壮不努力，老大徒伤悲。","t":[{"o":"青青园中葵，朝露待日晞。","t":"园中葵菜一片碧绿，上面的朝露等待着阳光将它晒干。"},{"o":"阳春布德泽，万物生光辉。","t":"温暖的春天散布着恩泽，万物都焕发出勃勃生机与光彩。"},{"o":"常恐秋节至，焜黄华叶衰。","t":"常常担心秋天到来，花叶都会变得枯黄衰败。"},{"o":"百川东到海，何时复西归？","t":"千百条河流向东奔流入海，什么时候才能再向西流回来呢？"},{"o":"少壮不努力，老大徒伤悲。","t":"年轻力壮的时候不奋发努力，到了老年就只能白白地悲伤叹息了。"}],"n":[{"w":"长歌行","m":"汉乐府曲调名"},{"w":"葵","m":"葵菜，一种蔬菜"},{"w":"晞","m":"晒干"},{"w":"布德泽","m":"施予恩惠，散布温暖"},{"w":"焜黄","m":"枯黄"},{"w":"华叶","m":"花和叶子"},{"w":"百川","m":"众多河流"},{"w":"徒","m":"白白地，徒然"}],"a":"这是汉乐府中最为脍炙人口的名篇之一。全诗由园中葵菜起兴，先写春天万物生长的蓬勃景象，再写秋来花叶凋零的衰败之景，继而以百川东流不复返为喻，层层铺垫，最终引出\"少壮不努力，老大徒伤悲\"的千古名句。全诗借自然景象感叹时光易逝、生命短暂，劝勉人们珍惜年华、奋发进取，以朴素的语言道出深刻的人生哲理。"},"076":{"o":"独坐幽篁里，弹琴复长啸。\n深林人不知，明月来相照。","t":[{"o":"独坐幽篁里，弹琴复长啸。","t":"独自坐在幽深的竹林中，一边弹琴一边放声长啸。"},{"o":"深林人不知，明月来相照。","t":"在这深深的林子里没有人知晓我的存在，只有一轮明月来陪伴照耀着我。"}],"n":[{"w":"幽篁","m":"幽深的竹林。篁，竹林"},{"w":"长啸","m":"撮口发出悠长清越的声音，古代文人一种抒发情怀的方式"},{"w":"深林","m":"指幽深的竹林"},{"w":"相照","m":"照耀着我，陪伴着我"}],"a":"这首诗以极其简淡的笔触，描绘了诗人独居竹林弹琴长啸的闲适生活，营造出一种清幽宁静、物我两忘的意境。诗中\"人不知\"与\"明月来相照\"形成对照，表面写孤独，实则表达诗人超脱尘俗、与自然合一的禅意心境，体现了王维\"诗中有画，画中有诗\"的艺术风格。全诗仅二十字，却含蓄蕴藉，韵味悠长，是山水田园诗中的精品。"},"077":{"o":"自古逢秋悲寂寥，我言秋日胜春朝。\n晴空一鹤排云上，便引诗情到碧霄。","t":[{"o":"自古逢秋悲寂寥，我言秋日胜春朝。","t":"自古以来人们每到秋天就悲叹寂寞萧索，我却说秋天远远胜过那春天的早晨。"},{"o":"晴空一鹤排云上，便引诗情到碧霄。","t":"万里晴空中一只白鹤冲破云层展翅高飞，这景象把我吟诗的情怀也带到了碧蓝的九霄之上。"}],"n":[{"w":"寂寥","m":"寂寞萧条"},{"w":"春朝","m":"春天的早晨，泛指春天"},{"w":"排云上","m":"冲破云层，凌空直上。排，推开、冲破"},{"w":"碧霄","m":"蓝天，青天"}],"a":"这首诗一反自古以来\"悲秋\"的传统文学主题，以昂扬的姿态宣称\"秋日胜春朝\"，展现了诗人乐观豁达的人生态度和不屈的斗志。\"晴空一鹤\"是全诗的灵魂意象，那只冲天而起的白鹤既是实景描写，更是诗人自身精神的写照——即便身处贬谪的困境，依然志存高远、豪情万丈。全诗格调高远，气势雄浑，读来令人振奋。"},"078":{"o":"终古高云簇此城，秋风吹散马蹄声。\n河流大野犹嫌束，山入潼关不解平。","t":[{"o":"终古高云簇此城，秋风吹散马蹄声。","t":"自古以来高耸的云层簇拥着这座雄关，秋风呼啸吹散了行旅的马蹄声。"},{"o":"河流大野犹嫌束，山入潼关不解平。","t":"黄河奔流在广阔的原野上还嫌受到约束，群山进入潼关境内也不肯平坦安宁。"}],"n":[{"w":"终古","m":"自古以来，久远"},{"w":"簇","m":"簇拥，聚集"},{"w":"犹嫌束","m":"还嫌受到束缚、约束"},{"w":"不解平","m":"不懂得什么是平坦，指山势起伏不平"}],"a":"这首诗描写了潼关一带壮阔雄险的自然景象，诗人笔下的黄河\"犹嫌束\"、群山\"不解平\"，赋予了自然景物以桀骜不驯的性格，实际上寄托了少年谭嗣同渴望冲破束缚、追求自由的壮志豪情。全诗气象雄浑，意境开阔，写山写水皆有声有色，将潼关的险要地势与诗人的少年锐气融为一体，展现出一种昂扬向上的精神力量。"},"079":{"o":"峨眉山月半轮秋，影入平羌江水流。\n夜发清溪向三峡，思君不见下渝州。","t":[{"o":"峨眉山月半轮秋，影入平羌江水流。","t":"秋高气爽，峨眉山上挂着半轮明月，月影倒映在平羌江的水面上，随着江水缓缓流淌。"},{"o":"夜发清溪向三峡，思君不见下渝州。","t":"夜间乘船从清溪出发驶向三峡，思念友人却不得相见，只好怀着依依之情顺流而下渝州。"}],"n":[{"w":"半轮秋","m":"半圆的秋月。秋点明季节"},{"w":"平羌","m":"即青衣江，在峨眉山东北"},{"w":"清溪","m":"指清溪驿，在今四川犍为"},{"w":"三峡","m":"瞿塘峡、巫峡、西陵峡的合称"},{"w":"君","m":"指友人，一说指峨眉山月"},{"w":"渝州","m":"今重庆市"}],"a":"这是李白青年时期初次出蜀时所作的一首纪行诗，短短四句中嵌入五个地名，却毫不堆砌，行云流水般自然流畅。诗中以山月相伴、月影随行的优美意象，烘托出诗人离乡时对故地山水的深深依恋。\"思君不见\"含蓄隽永，既是对友人的思念，也是对蜀中月色的留恋，情景交融，余韵悠长。"},"080":{"o":"岐王宅里寻常见，崔九堂前几度闻。\n正是江南好风景，落花时节又逢君。","t":[{"o":"岐王宅里寻常见，崔九堂前几度闻。","t":"当年在岐王的府邸里经常见到你的身影，在崔九的厅堂前也多次听到你的歌声。"},{"o":"正是江南好风景，落花时节又逢君。","t":"如今正值江南风景最美的时节，在这落花纷飞的日子里，又与你重逢了。"}],"n":[{"w":"李龟年","m":"唐代著名乐师，擅长歌唱，受唐玄宗赏识"},{"w":"岐王","m":"唐玄宗的弟弟李范，封岐王"},{"w":"崔九","m":"崔涤，排行第九，与唐玄宗关系密切"},{"w":"寻常见","m":"经常见到。寻常，经常、平常"},{"w":"落花时节","m":"暮春时节，暗喻国运衰落"}],"a":"这首诗以个人遭遇折射时代沧桑，前两句追忆开元盛世的繁华往事，后两句写安史之乱后流落江南的重逢之感。\"落花时节\"语带双关，既是写实的暮春之景，更暗喻大唐国运的衰败凋零。全诗无一悲字，却字字含悲；无一泪字，却句句带泪，以含蓄蕴藉的笔法传达出深沉的今昔之感和家国之痛，被誉为杜甫绝句中\"压卷之作\"。"},"081":{"o":"强欲登高去，无人送酒来。\n遥怜故园菊，应傍战场开。","t":[{"o":"强欲登高去，无人送酒来。","t":"勉强想着去登高饮酒应景，可是行军途中没有人送酒来。"},{"o":"遥怜故园菊，应傍战场开。","t":"远远地怜惜长安故园中的菊花，此刻它们应该正开在战场旁边吧。"}],"n":[{"w":"九日","m":"指九月九日重阳节，古有登高饮酒、赏菊的习俗"},{"w":"强欲","m":"勉强想要"},{"w":"送酒","m":"用陶渊明重阳饮酒的典故，王弘遣白衣人送酒"},{"w":"怜","m":"怜惜，同情"},{"w":"故园","m":"指长安，当时被安史叛军占据"}],"a":"这首五言绝句以重阳节为背景，将思乡之情与忧国之痛融为一体。诗人不说思念长安，却说\"怜故园菊\"，又说菊花\"应傍战场开\"，把花与战场联系在一起，化柔美为悲壮，寄托了对国家战乱的深切忧虑。\"傍战场开\"四个字触目惊心，美好的花朵与残酷的战火并置，以小见大，言简意深，令人读之酸楚。"},"082":{"o":"回乐烽前沙似雪，受降城外月如霜。\n不知何处吹芦管，一夜征人尽望乡。","t":[{"o":"回乐烽前沙似雪，受降城外月如霜。","t":"回乐烽火台前的沙漠在月色照耀下白如积雪，受降城外的月光清冷得如同秋霜。"},{"o":"不知何处吹芦管，一夜征人尽望乡。","t":"不知从何处传来幽怨的芦管笛声，这一夜戍守边关的将士们都忍不住遥望故乡的方向。"}],"n":[{"w":"受降城","m":"唐代为防御突厥而筑的城池，在今内蒙古"},{"w":"回乐烽","m":"回乐县附近的烽火台。回乐，唐县名"},{"w":"芦管","m":"芦笛，一种管乐器"},{"w":"征人","m":"出征或戍边的将士"},{"w":"望乡","m":"遥望故乡"}],"a":"这首边塞诗将视觉与听觉完美结合，前两句以\"沙似雪\"\"月如霜\"描绘出一幅苍凉荒寒的边塞月夜图景，色调冷寂凄清。第三句笛声骤起，打破了夜的沉寂，也触动了征人心中最柔软的思乡之情。末句\"尽望乡\"三字极有分量，一个\"尽\"字写出了所有将士不约而同的乡愁，将个人的思念升华为群体的共鸣，感人至深。"},"083":{"o":"谁家玉笛暗飞声，散入春风满洛城。\n此夜曲中闻折柳，何人不起故园情。","t":[{"o":"谁家玉笛暗飞声，散入春风满洛城。","t":"是谁家的玉笛在暗中吹奏出悠扬的乐声？笛声随着春风飘散，弥漫了整个洛阳城。"},{"o":"此夜曲中闻折柳，何人不起故园情。","t":"今夜笛声中听到了《折杨柳》的曲调，谁能不被唤起对故乡的思念之情呢？"}],"n":[{"w":"洛城","m":"洛阳城"},{"w":"暗飞声","m":"悄悄地传出笛声"},{"w":"折柳","m":"即《折杨柳》曲，汉乐府曲名，古人折柳赠别，此曲多用来表达离愁别绪"},{"w":"故园情","m":"思念故乡的情感"},{"w":"何人","m":"谁人，反问语气"}],"a":"这首诗以春夜笛声引发思乡之情，构思巧妙。诗人不写自己思乡，而是用\"何人不起故园情\"的反问句式，将个人的乡愁推而广之，暗示天下所有游子都会被这笛声触动。春风满城与笛声飘散相映衬，\"折柳\"既是曲名又暗含离别之意，一语双关，自然贴切。全诗由听觉入手，以情感作结，意境优美，情韵悠长。"},"084":{"o":"故园东望路漫漫，双袖龙钟泪不干。\n马上相逢无纸笔，凭君传语报平安。","t":[{"o":"故园东望路漫漫，双袖龙钟泪不干。","t":"向东遥望故乡，归路漫长而遥远，双袖沾满泪水湿漉漉地一直不曾干过。"},{"o":"马上相逢无纸笔，凭君传语报平安。","t":"在马背上与你匆匆相逢，身边没有纸笔写家书，就请你替我捎个口信报个平安吧。"}],"n":[{"w":"入京使","m":"回京城的使者"},{"w":"故园","m":"指长安的家"},{"w":"漫漫","m":"漫长遥远的样子"},{"w":"龙钟","m":"泪水沾湿、淋漓的样子"},{"w":"凭","m":"请，烦请"},{"w":"传语","m":"捎口信"}],"a":"这首诗真实而生动地表现了远行之人对家乡的深切思念。前两句写思乡之泪，\"龙钟\"与\"不干\"极言泪多情切；后两句写偶遇使者，因没有纸笔只能捎个口信。\"报平安\"三字看似平淡，却蕴含着深沉的感情——明明思乡心切、泪湿双袖，却只报平安，不诉离愁，既怕家人担忧，也含蓄地表达了游子的隐忍与大度。全诗语言质朴自然，情感真挚动人。"},"085":{"o":"草树知春不久归，百般红紫斗芳菲。\n杨花榆荚无才思，惟解漫天作雪飞。","t":[{"o":"草树知春不久归，百般红紫斗芳菲。","t":"花草树木知道春天不久就要归去，各自使出百般本领争奇斗艳。"},{"o":"杨花榆荚无才思，惟解漫天作雪飞。","t":"杨花和榆荚似乎没有什么才华心思，只懂得像雪花一样漫天飞舞。"}],"n":[{"w":"不久归","m":"即将结束，快要归去"},{"w":"百般红紫","m":"指各种颜色的花朵"},{"w":"斗芳菲","m":"争奇斗艳。芳菲，花草的芳香，代指花草"},{"w":"杨花","m":"柳絮"},{"w":"榆荚","m":"榆树的果实，形似钱币，又称榆钱"},{"w":"无才思","m":"没有才华心思，此处用拟人手法"},{"w":"惟解","m":"只懂得"}],"a":"这首诗以拟人手法写晚春景象，妙趣横生。花草争艳是\"有才思\"者的表现，而杨花榆荚虽\"无才思\"却也以漫天飞舞的方式参与春天的盛会，别有一番情趣。诗中寓含哲理——万物各有其性，不必以统一的标准衡量价值。也有解者认为这是诗人嘲讽无才之人随波逐流，但通观全诗，更像是赞美每种生命都有自己独特的存在方式。"},"086":{"o":"君问归期未有期，巴山夜雨涨秋池。\n何当共剪西窗烛，却话巴山夜雨时。","t":[{"o":"君问归期未有期，巴山夜雨涨秋池。","t":"你问我什么时候回去，可归期遥遥无法确定。此刻巴山的夜雨绵绵不绝，已经涨满了秋天的池塘。"},{"o":"何当共剪西窗烛，却话巴山夜雨时。","t":"什么时候我们才能一起在西窗下剪烛夜谈，到那时再回叙今晚巴山夜雨中的思念之情。"}],"n":[{"w":"寄北","m":"寄给在北方的妻子（一说友人）"},{"w":"巴山","m":"泛指四川一带的山"},{"w":"何当","m":"什么时候，何时才能"},{"w":"共剪西窗烛","m":"在西窗下共同剪烛芯，代指亲密交谈"},{"w":"却话","m":"再回叙，回头说起"}],"a":"这首诗构思精巧，时空交错。前两句写此刻的孤独——归期未定、巴山夜雨；后两句想象未来重逢时的温馨画面。\"巴山夜雨\"在诗中出现两次，第一次是眼前的凄凉实景，第二次是将来回忆中的温暖话题，同一景象因心境不同而产生截然不同的感受。这种以未来的欢聚反衬今日的孤寂的手法，使思念之情更为深长动人。"},"087":{"o":"僵卧孤村不自哀，尚思为国戍轮台。\n夜阑卧听风吹雨，夜阑卧听风吹雨，铁马冰河入梦来。","t":[{"o":"僵卧孤村不自哀，尚思为国戍轮台。","t":"年老体衰僵直地躺在偏僻孤村里，却不为自己感到悲哀，心中依然想着为国家去戍守边疆。"},{"o":"夜阑卧听风吹雨，铁马冰河入梦来。","t":"深夜躺在床上听着风雨交加的声音，迷蒙中仿佛骑着披甲的战马跨过冰封的河流冲入梦境。"}],"n":[{"w":"僵卧","m":"躺卧不起，形容年老体衰"},{"w":"孤村","m":"荒僻的小村"},{"w":"不自哀","m":"不为自己感到悲哀"},{"w":"戍轮台","m":"戍守边疆。轮台，在今新疆，泛指边疆"},{"w":"夜阑","m":"夜深"},{"w":"铁马","m":"披着铁甲的战马"},{"w":"冰河","m":"冰封的河流，指北方寒冷的战场"}],"a":"这首诗写于陆游六十八岁闲居故乡时，以慷慨悲壮之笔抒发报国之志。前两句\"不自哀\"与\"尚思\"形成转折，年迈体衰却不悲叹个人命运，仍心系国家安危。后两句将现实中风雨之声与梦境中的铁马冰河交融，虚实相生，把诗人至老不衰的爱国激情表现得淋漓尽致。全诗感情苍凉悲壮，读来令人感佩于这位爱国诗人的赤诚之心。"},"088":{"o":"前不见古人，后不见来者。\n念天地之悠悠，独怆然而涕下。","t":[{"o":"前不见古人，后不见来者。","t":"向前看不到古代的贤明君主，向后看不到未来的圣明之人。"},{"o":"念天地之悠悠，独怆然而涕下。","t":"想到天地如此浩渺无垠、时间如此悠远绵长，我独自一人悲从中来，不禁潸然泪下。"}],"n":[{"w":"幽州台","m":"即黄金台，又称蓟北楼，故址在今北京"},{"w":"古人","m":"指古代的贤君明主，如燕昭王"},{"w":"来者","m":"指后世贤明之人"},{"w":"悠悠","m":"形容时间的久远和空间的广大"},{"w":"怆然","m":"悲伤凄凉的样子"},{"w":"涕下","m":"流下眼泪"}],"a":"这首诗以宏大的时空为背景，抒写了诗人怀才不遇的悲愤与孤独。前两句俯仰古今，时间维度上感到前无古人、后无来者的寂寞；第三句放眼天地，空间维度上更觉宇宙浩渺、人生渺小。在无限的时间与空间之中，一个\"独\"字凸现出诗人不被理解的深沉孤独。全诗不事雕琢，纯以气势取胜，苍凉悲壮，被誉为千古绝唱。"},"089":{"o":"枯藤老树昏鸦，小桥流水人家，古道西风瘦马。\n夕阳西下，断肠人在天涯。","t":[{"o":"枯藤老树昏鸦，小桥流水人家，古道西风瘦马。","t":"枯萎的藤蔓缠绕着衰老的大树，黄昏时分乌鸦归巢栖息；小桥下流水潺潺，旁边住着几户人家；荒凉的古道上西风凛冽，一匹瘦马驮着游子艰难行走。"},{"o":"夕阳西下，断肠人在天涯。","t":"夕阳渐渐西沉，那肝肠寸断的游子还漂泊在遥远的天涯。"}],"n":[{"w":"天净沙","m":"曲牌名，属于散曲中的小令"},{"w":"昏鸦","m":"黄昏时归巢的乌鸦"},{"w":"人家","m":"农户，农家"},{"w":"古道","m":"荒凉古老的驿道"},{"w":"断肠","m":"形容极度悲伤"},{"w":"天涯","m":"天边，指远离家乡的地方"}],"a":"这首小令被誉为\"秋思之祖\"，以白描手法排列九个意象，前三句每句三个画面，不用一个动词却自然成景，堪称蒙太奇手法的典范。\"小桥流水人家\"的温馨宁静反衬出游子漂泊的凄苦，前后形成强烈对比。末句\"断肠人在天涯\"画龙点睛，点明游子漂泊他乡的思乡之痛。全曲仅二十八字，却意境深远，情景交融，将羁旅之愁表现得淋漓尽致。"},"090":{"o":"飞来山上千寻塔，闻说鸡鸣见日升。\n不畏浮云遮望眼，自缘身在最高层。","t":[{"o":"飞来山上千寻塔，闻说鸡鸣见日升。","t":"飞来峰上有一座极高极高的宝塔，听说鸡鸣时分站在这里就能看见旭日东升。"},{"o":"不畏浮云遮望眼，自缘身在最高层。","t":"不怕天上的浮云遮住我远望的视线，只因为我站在宝塔的最高一层。"}],"n":[{"w":"飞来峰","m":"在今浙江杭州西湖灵隐寺前"},{"w":"千寻","m":"极言其高。寻，古代长度单位，八尺为一寻"},{"w":"闻说","m":"听说"},{"w":"不畏","m":"不怕"},{"w":"浮云","m":"暗喻奸佞小人或蒙蔽圣听的谗言"},{"w":"自缘","m":"自然是因为，只因为"},{"w":"最高层","m":"最高处，暗喻立足高远"}],"a":"这首诗借登高远望来表达政治理想和人生态度。\"不畏浮云遮望眼\"化用了王安石变法中不怕阻力的坚定信念，\"身在最高层\"既是实写登高，也暗喻站位高远、胸襟开阔。全诗蕴含深刻哲理：站得高才能看得远，掌握了正确的思想和认识方法，就不会被假象所蒙蔽。诗风刚劲有力，气势不凡，充分体现了王安石作为政治家的胆识与气魄。"},"091":{"o":"岱宗夫如何？齐鲁青未了。\n造化钟神秀，阴阳割昏晓。\n荡胸生曾云，决眦入归鸟。\n会当凌绝顶，一览众山小。","t":[{"o":"岱宗夫如何？齐鲁青未了。","t":"泰山到底是什么样的呢？从齐到鲁，那青翠的山色绵延不绝，一眼望不到尽头。"},{"o":"造化钟神秀，阴阳割昏晓。","t":"大自然将神奇秀丽的景色汇聚于此，山的南北两面分割出明暗不同的晨昏。"},{"o":"荡胸生曾云，决眦入归鸟。","t":"层层的云气升腾而起令人心胸激荡，极力睁大眼睛眺望归鸟飞入山谷。"},{"o":"会当凌绝顶，一览众山小。","t":"终有一天我要登上泰山的最高峰，俯瞰群山，那时其他山峰都将显得渺小。"}],"n":[{"w":"岱宗","m":"即泰山，五岳之首"},{"w":"齐鲁","m":"泰山以北为齐，以南为鲁"},{"w":"未了","m":"不尽，绵绵不绝"},{"w":"造化","m":"大自然，天地"},{"w":"钟","m":"聚集，集中"},{"w":"阴阳","m":"山南为阳，山北为阴"},{"w":"割昏晓","m":"分割出昏暗与明亮"},{"w":"曾云","m":"层云。曾同\"层\""},{"w":"决眦","m":"极力睁大眼睛。眦，眼角"},{"w":"会当","m":"终当，终要"},{"w":"凌","m":"登上"}],"a":"这首诗是杜甫青年时期的代表作，全诗由远及近、由整体到局部，层层铺写泰山的高大雄伟。开篇设问引人入胜，继而写泰山的广阔、神奇、高峻，最后以\"会当凌绝顶，一览众山小\"收束全篇，表达了诗人不怕困难、勇于攀登的雄心壮志。这两句不仅写出了泰山的雄伟气象，更蕴含着深刻的人生哲理，千百年来激励着无数人奋发向上。"},"092":{"o":"莫笑农家腊酒浑，丰年留客足鸡豚。\n山重水复疑无路，柳暗花明又一村。\n箫鼓追随春社近，衣冠简朴古风存。\n从今若许闲乘月，拄杖无时夜叩门。","t":[{"o":"莫笑农家腊酒浑，丰年留客足鸡豚。","t":"不要笑话农家腊月酿的酒浑浊，丰收之年他们待客的菜肴十分丰盛。"},{"o":"山重水复疑无路，柳暗花明又一村。","t":"山峦重叠、水道曲折，正怀疑前面没有路了，忽然柳绿花艳间又出现了一个村庄。"},{"o":"箫鼓追随春社近，衣冠简朴古风存。","t":"吹箫打鼓的热闹声此起彼伏，原来春社祭祀即将来临，村民们衣着打扮简朴，古老的风俗依然保存。"},{"o":"从今若许闲乘月，拄杖无时夜叩门。","t":"从今以后如果允许我闲时乘着月色来游玩，我会随时拄着拐杖在夜晚来敲你的家门。"}],"n":[{"w":"腊酒","m":"腊月酿造的酒"},{"w":"浑","m":"浑浊，指酒未经过滤"},{"w":"豚","m":"猪"},{"w":"山重水复","m":"山峦重重，水道弯弯"},{"w":"柳暗花明","m":"柳色深绿，花色明丽"},{"w":"春社","m":"古代立春后祭祀土地神的日子"},{"w":"古风","m":"古代的风俗习惯"},{"w":"无时","m":"随时"}],"a":"这首诗描绘了一幅色彩鲜明的农村风俗画。\"山重水复疑无路，柳暗花明又一村\"是千古传诵的名句，不仅写出了山西村优美的自然风光和曲折的路途，更蕴含着深刻的哲理——在困境中坚持前行，往往会豁然开朗，出现新的转机和希望。全诗将写景、叙事、抒情融为一体，展现了乡间的淳朴民风和诗人的喜悦之情，格调明快，意趣盎然。"},"093":{"o":"折戟沉沙铁未销，自将磨洗认前朝。\n东风不与周郎便，铜雀春深锁二乔。","t":[{"o":"折戟沉沙铁未销，自将磨洗认前朝。","t":"一支折断的铁戟沉埋在沙中还未曾锈蚀，我亲自把它磨洗干净，认出这是前朝的遗物。"},{"o":"东风不与周郎便，铜雀春深锁二乔。","t":"如果东风不给周瑜以方便，恐怕结果将是曹操取胜，大乔小乔都会被锁进铜雀台里。"}],"n":[{"w":"折戟","m":"折断的戟，泛指兵器"},{"w":"未销","m":"没有锈蚀"},{"w":"将","m":"拿起"},{"w":"前朝","m":"指汉末三国时期"},{"w":"东风","m":"指赤壁之战中助周瑜火攻的东南风"},{"w":"周郎","m":"周瑜，三国时东吴名将"},{"w":"铜雀","m":"铜雀台，曹操在邺城所建"},{"w":"二乔","m":"东吴美女大乔和小乔，分别嫁给孙策和周瑜"}],"a":"这首咏史诗以小见大，借一件沉沙折戟引出对赤壁之战的历史反思。诗人不从正面评论这场战役，而是从反面假设\"东风不与周郎便\"，以二乔的命运来暗示东吴的存亡，构思新颖独到。诗中既有对历史偶然性的感慨，也隐含着对自己生不逢时、英雄无用武之地的感叹。全诗笔调轻巧，却寓意深远，是杜牧咏史绝句中的代表作。"},"094":{"o":"庭中有奇树，绿叶发华滋。\n攀条折其荣，将以遗所思。\n馨香盈怀袖，路远莫致之。\n此物何足贵？但感秋经岁。","t":[{"o":"庭中有奇树，绿叶发华滋。","t":"庭院中有一棵珍奇的树，长满了翠绿的叶子，花朵开得十分繁盛。"},{"o":"攀条折其荣，将以遗所思。","t":"攀着枝条摘下了美丽的花朵，打算把它送给心中思念的人。"},{"o":"馨香盈怀袖，路远莫致之。","t":"花香浓郁充满了我的衣襟和衣袖，可是路途遥远无法送达。"},{"o":"此物何足贵？但感秋经岁。","t":"这花有什么值得珍贵的呢？只是有感于时节的变迁、岁月的流逝罢了。"}],"n":[{"w":"奇树","m":"珍奇的树木"},{"w":"发华滋","m":"花开得繁盛。华同\"花\"，滋，繁盛"},{"w":"荣","m":"花"},{"w":"遗","m":"赠送"},{"w":"所思","m":"思念的人"},{"w":"馨香","m":"芳香的气味"},{"w":"盈","m":"充满"},{"w":"莫致之","m":"无法送达"},{"w":"秋经岁","m":"指经过了一年的时光，感慨时光流逝"}],"a":"这首诗以折花寄远这一日常细节，表达了深切的相思之情。诗由树及花、由花及人，层层递进：先写花的美丽，再写折花的用意，继而写花不能送达的遗憾，最后感叹花本身不足贵，珍贵的只是那份思念之情。全诗语言朴素自然，情感真挚深沉，以小见大，将思念与对时光流逝的感慨巧妙交织，是《古诗十九首》中抒写离愁别绪的佳作。"},"095":{"o":"亭亭山上松，瑟瑟谷中风。\n风声一何盛，松枝一何劲！\n冰霜正惨凄，终岁常端正。\n岂不罹凝寒？松柏有本性。","t":[{"o":"亭亭山上松，瑟瑟谷中风。","t":"高高耸立在山上的松树，迎着山谷中呼啸而来的瑟瑟寒风。"},{"o":"风声一何盛，松枝一何劲！","t":"风声是多么猛烈啊，松枝却是多么刚劲挺拔！"},{"o":"冰霜正惨凄，终岁常端正。","t":"冰霜正严酷凄寒地降临，松树却一年到头始终保持着端正挺拔的身姿。"},{"o":"岂不罹凝寒？松柏有本性。","t":"难道它不会遭受严寒的侵袭吗？只是松柏天生就有坚贞不屈的本性啊。"}],"n":[{"w":"从弟","m":"堂弟"},{"w":"亭亭","m":"高耸挺拔的样子"},{"w":"瑟瑟","m":"风声"},{"w":"一何","m":"多么"},{"w":"劲","m":"刚劲有力"},{"w":"惨凄","m":"严酷寒冷"},{"w":"端正","m":"挺拔直立"},{"w":"罹","m":"遭受"},{"w":"凝寒","m":"严寒"},{"w":"本性","m":"天生的品性"}],"a":"这首诗全篇以松柏为喻，借物言志。诗人通过对山上松树在狂风冰霜中依然挺拔不屈的生动描写，赞美了松柏坚贞的本性，以此勉励堂弟要在艰难环境中保持高洁的品格。风声愈烈、松枝愈劲的对比描写，更有力地凸显了松柏的坚强不屈。全诗语言质朴刚健，格调苍劲有力，以比兴手法将咏物与言志完美结合，是建安诗歌中咏物言志的名篇。"},"096":{"o":"八方各异气，千里殊风雨。\n剧哉边海民，寄身于草野。\n妻子象禽兽，行止依林阻。\n柴门何萧条，狐兔翔我宇。","t":[{"o":"八方各异气，千里殊风雨。","t":"天下四面八方的气候各不相同，相隔千里风雨也截然不一样。"},{"o":"剧哉边海民，寄身于草野。","t":"边海一带的百姓真是困苦到了极点，他们只能寄身在荒野草莽之中。"},{"o":"妻子象禽兽，行止依林阻。","t":"妻子儿女的穿着打扮如同禽兽一般，起居行走都依傍着山林险阻之处。"},{"o":"柴门何萧条，狐兔翔我宇。","t":"柴门内外是多么荒凉萧条，狐狸野兔竟然在我住的屋子里穿来跑去。"}],"n":[{"w":"八方","m":"四面八方，指各地"},{"w":"各异气","m":"气候各不相同"},{"w":"剧","m":"艰难，困苦"},{"w":"边海民","m":"边远沿海地区的百姓"},{"w":"草野","m":"荒野"},{"w":"禽兽","m":"指衣不蔽体，形同禽兽"},{"w":"林阻","m":"山林险阻之处"},{"w":"翔","m":"这里指行走、出入"},{"w":"宇","m":"房屋，屋宇"}],"a":"这首诗描写了边海地区人民的悲惨生活，表达了诗人对底层百姓深切的同情。诗以\"八方各异气\"起兴，转而聚焦边海之民的苦难——他们衣食无着、形同禽兽、居所荒废、狐兔出没，种种触目惊心的细节构成了一幅凄惨的画面。曹植身为王族，却将目光投向最底层的民众，体现了可贵的民本思想。全诗情感深沉，笔调悲凉，具有强烈的艺术感染力。"},"097":{"o":"城阙辅三秦，风烟望五津。\n与君离别意，同是宦游人。\n海内存知己，天涯若比邻。\n无为在歧路，儿女共沾巾。","t":[{"o":"城阙辅三秦，风烟望五津。","t":"雄伟的长安城由三秦之地拱卫，隔着风烟遥望蜀地的五津渡口。"},{"o":"与君离别意，同是宦游人。","t":"和你离别的伤感涌上心头，我们都是远离家乡在外做官的人啊。"},{"o":"海内存知己，天涯若比邻。","t":"只要四海之内有你这样的知心朋友，即使远在天涯海角也如同近邻一般。"},{"o":"无为在歧路，儿女共沾巾。","t":"不要在分别的岔路口，像小儿女那样让泪水沾湿了手帕。"}],"n":[{"w":"少府","m":"县尉的别称"},{"w":"之任","m":"赴任"},{"w":"蜀州","m":"今四川崇州"},{"w":"城阙","m":"指长安"},{"w":"三秦","m":"指关中一带"},{"w":"五津","m":"四川岷江上的五个渡口，代指蜀地"},{"w":"宦游","m":"外出做官"},{"w":"海内","m":"四海之内，指全天下"},{"w":"比邻","m":"近邻"},{"w":"无为","m":"不要，无须"},{"w":"儿女","m":"像小儿女那样"},{"w":"沾巾","m":"泪水沾湿手帕"}],"a":"这首送别诗一改传统送别诗的缠绵哀伤，以开阔的胸襟和豪迈的气概独树一帜。\"海内存知己，天涯若比邻\"是千古传诵的名句，它告诉人们真正的友谊不会因距离而衰减，以旷达的胸襟超越了离别的伤感。末句劝慰友人不要像小儿女般哭泣，更显示出诗人豁达开朗的品格。全诗格调高昂，气象宏大，是初唐五律的代表作。"},"098":{"o":"清晨入古寺，初日照高林。\n曲径通幽处，禅房花木深。\n山光悦鸟性，潭影空人心。\n万籁此都寂，但余钟磬音。","t":[{"o":"清晨入古寺，初日照高林。","t":"清晨走进这座古老的寺院，初升的太阳照耀着高高的树林。"},{"o":"曲径通幽处，禅房花木深。","t":"弯弯曲曲的小路通向幽静的深处，禅房掩映在繁茂的花木丛中。"},{"o":"山光悦鸟性，潭影空人心。","t":"山中美好的风光使鸟儿也感到愉悦，清澈的潭水中的倒影令人心中的杂念尽消。"},{"o":"万籁此都寂，但余钟磬音。","t":"此时各种声音都沉寂了下来，只剩下悠扬的钟磬之声回荡在寺院中。"}],"n":[{"w":"破山寺","m":"即兴福寺，在今江苏常熟"},{"w":"禅院","m":"寺院中僧人修行居住的院落"},{"w":"初日","m":"初升的太阳"},{"w":"曲径","m":"弯曲的小路"},{"w":"幽处","m":"幽静的地方"},{"w":"悦","m":"使……愉悦"},{"w":"空人心","m":"使人忘却世俗杂念"},{"w":"万籁","m":"自然界中各种声音"},{"w":"钟磬","m":"寺院中的打击乐器"}],"a":"这首诗以清新的笔触描绘了古寺禅院的幽静之美，抒发了寄情山水的恬淡心境。\"曲径通幽处\"已成广为流传的成语，生动地表现了禅院深邃宁静的意境。\"山光悦鸟性，潭影空人心\"一联最为精妙，以景悟道，将自然之美与心灵净化融为一体。末尾以万籁俱寂中唯余钟磬之声作结，余韵袅袅，令人仿佛身临其境，感受到超脱尘俗的禅意。"},"099":{"o":"青山横北郭，白水绕东城。\n此地一为别，孤蓬万里征。\n浮云游子意，落日故人情。\n挥手自兹去，萧萧班马鸣。","t":[{"o":"青山横北郭，白水绕东城。","t":"青翠的山峦横卧在城郭的北面，波光粼粼的流水环绕着城东。"},{"o":"此地一为别，孤蓬万里征。","t":"在这里一旦分别，你就像那随风飘转的孤蓬一样踏上万里征途。"},{"o":"浮云游子意，落日故人情。","t":"天上的浮云飘忽不定，就像远行游子的心意；徐徐落日缓缓下沉，宛如故人依依不舍的深情。"},{"o":"挥手自兹去，萧萧班马鸣。","t":"挥手告别从此离开，离别的马儿也不禁发出萧萧的悲鸣。"}],"n":[{"w":"郭","m":"外城墙"},{"w":"孤蓬","m":"随风飘转的蓬草，比喻远行的友人"},{"w":"征","m":"远行"},{"w":"浮云","m":"飘动的云，比喻游子行踪不定"},{"w":"游子","m":"离家远游的人"},{"w":"萧萧","m":"马鸣声"},{"w":"班马","m":"离群的马。班，分别、离群"}],"a":"这首送别诗以工整的对仗和优美的意象著称。\"青山\"与\"白水\"色彩明丽，一\"横\"一\"绕\"勾勒出送别的环境。\"浮云游子意，落日故人情\"以自然景物比喻离情别绪，浮云飘荡似游子之漂泊，落山依山似故人之不舍，情景浑然一体。末句以马鸣收束，连马也为离别而悲鸣，更衬托出友人间深厚的情谊。全诗对仗工稳，意境开阔，既有离别的伤感，又不失李白特有的豪迈气度。"},"100":{"o":"东皋薄暮望，徙倚欲何依。\n树树皆秋色，山山唯落晖。\n牧人驱犊返，猎马带禽归。\n相顾无相识，长歌怀采薇。","t":[{"o":"东皋薄暮望，徙倚欲何依。","t":"傍晚时分在东皋纵目远望，徘徊不定不知该归依何处。"},{"o":"树树皆秋色，山山唯落晖。","t":"每一棵树都染上了秋天的色彩，每一座山都沐浴在夕阳的余晖之中。"},{"o":"牧人驱犊返，猎马带禽归。","t":"牧人驱赶着牛犊走在回家的路上，猎人骑着马带着猎物归来。"},{"o":"相顾无相识，长歌怀采薇。","t":"环顾四周没有一个相识的人，只能放声长歌，怀念起古代伯夷、叔齐采薇隐居的生活。"}],"n":[{"w":"东皋","m":"地名，在今山西河津，王绩隐居之处"},{"w":"薄暮","m":"傍晚，日将落时"},{"w":"徙倚","m":"徘徊不定"},{"w":"依","m":"归依，依托"},{"w":"犊","m":"小牛"},{"w":"禽","m":"猎获的鸟兽"},{"w":"采薇","m":"伯夷、叔齐隐居首阳山采薇而食，此处借指隐居生活"}],"a":"这首诗是王绩的代表作，也是唐诗中较早的一首五言律诗。诗人在秋日薄暮的东皋远望，目之所及是满山的秋色与落晖，以及牧人猎户的归来——这些归家的景象更衬托出诗人的无所归依之感。\"相顾无相识\"道出了诗人在现实中知音难觅的孤独，末句以\"采薇\"之典表达了对隐逸生活的向往。全诗意境萧散恬淡，在质朴自然的风格中流露出淡淡的惆怅与对淳朴古风的追求。"},"101":{"o":"东临碣石，以观沧海。\n水何澹澹，山岛竦峙。\n树木丛生，百草丰茂。\n秋风萧瑟，洪波涌起。\n日月之行，若出其中；\n星汉灿烂，若出其里。\n幸甚至哉，歌以咏志。","t":[{"o":"东临碣石，以观沧海。","t":"向东登上碣石山，来观赏苍茫的大海。"},{"o":"水何澹澹，山岛竦峙。","t":"海水多么宽阔浩荡，山岛高高地挺立在海边。"},{"o":"树木丛生，百草丰茂。","t":"树木和百草丛生，十分繁茂。"},{"o":"秋风萧瑟，洪波涌起。","t":"秋风吹动萧瑟的声响，海中涌着巨大的海浪。"},{"o":"日月之行，若出其中；","t":"太阳和月亮的运行，好像是从这浩瀚的海洋中发出的。"},{"o":"星汉灿烂，若出其里。","t":"银河星光灿烂，好像是从这浩瀚的海洋中产生出来的。"},{"o":"幸甚至哉，歌以咏志。","t":"我真是幸运极了，用歌唱来表达自己的思想感情吧。"}],"n":[{"w":"临","m":"登上，来到"},{"w":"碣石","m":"山名，在今河北省昌黎以北"},{"w":"沧海","m":"大海，这里指渤海"},{"w":"澹澹","m":"水波荡漾的样子"},{"w":"竦峙","m":"高高耸立"},{"w":"萧瑟","m":"形容秋风吹过的声音"},{"w":"洪波","m":"巨大的波浪"},{"w":"星汉","m":"银河"},{"w":"幸甚至哉","m":"庆幸得很，好极了"}],"a":"这是曹操北征乌桓胜利班师途中登临碣石山时所作。诗人借大海的壮阔景象，表达了统一天下的雄心壮志和博大胸怀。\"日月之行，若出其中；星汉灿烂，若出其里\"四句是千古名句，以夸张的手法写大海吞吐日月星辰的气势，实则抒发诗人吞吐宇宙的宏伟抱负。全诗气势磅礴，格调雄浑，是建安文学的代表之作。"},"102":{"o":"客路青山外，行舟绿水前。\n潮平两岸阔，风正一帆悬。\n海日生残夜，江春入旧年。\n乡书何处达？归雁洛阳边。","t":[{"o":"客路青山外，行舟绿水前。","t":"旅途在青山之外，行船在碧绿的江水之上。"},{"o":"潮平两岸阔，风正一帆悬。","t":"潮水涨满，两岸与江水齐平，整个江面十分开阔；顺风行船，一帆高挂。"},{"o":"海日生残夜，江春入旧年。","t":"夜幕还没有完全褪去，一轮红日已从海上升起；江上已有春天的气息，旧年未尽春天就已到来。"},{"o":"乡书何处达？归雁洛阳边。","t":"我的家信要寄往何处？希望北归的大雁捎到洛阳去。"}],"n":[{"w":"次","m":"停宿，停泊"},{"w":"北固山","m":"在今江苏镇江北"},{"w":"客路","m":"旅途"},{"w":"潮平","m":"潮水涨满，与岸齐平"},{"w":"风正","m":"风顺而和"},{"w":"残夜","m":"夜将尽未尽的时候"},{"w":"乡书","m":"家信"},{"w":"归雁","m":"大雁每年秋天飞往南方，春天飞回北方，古人常借雁传书"}],"a":"此诗写诗人旅途中泊舟北固山下所见所感。\"海日生残夜，江春入旧年\"是千古名句，写出了新事物必将取代旧事物的哲理，蕴含着时序交替的自然规律。尾联以\"乡书\"与\"归雁\"相呼应，将漂泊在外的思乡之情表达得含蓄深沉。全诗意境开阔，情景交融，既有壮美的江景，又有绵长的乡思。"},"103":{"o":"杨花落尽子规啼，闻道龙标过五溪。\n我寄愁心与明月，随君直到夜郎西。","t":[{"o":"杨花落尽子规啼，闻道龙标过五溪。","t":"在杨花落尽、子规啼叫的暮春时节，听说你被贬到龙标，要经过五溪才能到达。"},{"o":"我寄愁心与明月，随君直到夜郎西。","t":"我把我忧愁的心思寄托给明月，希望它能随着你一直走到夜郎以西。"}],"n":[{"w":"左迁","m":"贬官降职"},{"w":"龙标","m":"古地名，在今湖南黔阳"},{"w":"子规","m":"即杜鹃鸟，啼声哀婉"},{"w":"五溪","m":"湖南西部五条溪流的合称"},{"w":"夜郎","m":"古代西南少数民族国名，在今贵州一带"}],"a":"这首诗是李白听到好友王昌龄被贬龙标尉时所写的一首怀念友人的七言绝句。首句以暮春萧瑟的景色起兴，渲染了凄凉的气氛。后两句\"我寄愁心与明月，随君直到夜郎西\"是全诗精华，诗人将明月人格化，把对友人的同情和关切托付给明月，让明月陪伴友人远行。想象奇特，感情深挚，体现了李白诗歌浪漫主义的艺术风格。"},"104":{"o":"单车欲问边，属国过居延。\n征蓬出汉塞，归雁入胡天。\n大漠孤烟直，长河落日圆。\n萧关逢候骑，都护在燕然。","t":[{"o":"单车欲问边，属国过居延。","t":"我乘着一辆车去慰问边关，经过居延属国。"},{"o":"征蓬出汉塞，归雁入胡天。","t":"像随风飘飞的蓬草一样飘出了汉朝的边塞，又像北归的大雁飞入胡人的天空。"},{"o":"大漠孤烟直，长河落日圆。","t":"浩瀚无边的沙漠中一缕烽烟直直升起，无尽的黄河上空一轮落日又大又圆。"},{"o":"萧关逢候骑，都护在燕然。","t":"在萧关遇到了侦察的骑兵，得知都护正在燕然前线。"}],"n":[{"w":"单车","m":"一辆车，形容轻车简从"},{"w":"问边","m":"慰问边关守军"},{"w":"属国","m":"典属国，这里指吐蕃"},{"w":"居延","m":"古地名，在今甘肃张掖西北"},{"w":"征蓬","m":"飘飞的蓬草，比喻漂泊的旅人"},{"w":"大漠","m":"广阔无垠的沙漠"},{"w":"孤烟","m":"烽烟"},{"w":"长河","m":"黄河"},{"w":"萧关","m":"古关名，在今宁夏固原"},{"w":"候骑","m":"侦察骑兵"},{"w":"都护","m":"边疆最高长官"},{"w":"燕然","m":"山名，在今蒙古国"}],"a":"此诗是王维奉命赴边疆慰问将士途中所作的一首纪行诗。\"大漠孤烟直，长河落日圆\"是千古壮句，被王国维赞为\"千古壮观\"。一个\"直\"字写出了大漠孤烟的劲拔坚毅，一个\"圆\"字写出了落日的低圆苍茫。这两句以精练的笔墨勾画出塞外雄浑壮美的独特风光，笔力苍劲，意境雄浑，堪称唐诗中描写边塞风光的绝唱。"},"105":{"o":"渡远荆门外，来从楚国游。\n山随平野尽，江入大荒流。\n月下飞天镜，云生结海楼。\n仍怜故乡水，万里送行舟。","t":[{"o":"渡远荆门外，来从楚国游。","t":"乘船远行，路过荆门一带，来到楚地游览。"},{"o":"山随平野尽，江入大荒流。","t":"山随着低平的原野的出现而逐渐消失，江水在一望无际的原野中奔流。"},{"o":"月下飞天镜，云生结海楼。","t":"月亮倒映在水面上，犹如天上飞来一面明镜；云霞升起，变幻莫测，如同结成了海市蜃楼。"},{"o":"仍怜故乡水，万里送行舟。","t":"我还是喜爱这来自故乡的水，它不远万里来送我的行舟。"}],"n":[{"w":"荆门","m":"山名，在今湖北宜都长江南岸"},{"w":"楚国","m":"古国名，今湖北一带"},{"w":"大荒","m":"广阔无际的原野"},{"w":"飞天镜","m":"指月亮在水中的倒影"},{"w":"海楼","m":"海市蜃楼，这里指江上云霞的奇妙景象"},{"w":"怜","m":"爱恋，喜爱"},{"w":"故乡水","m":"指从四川流下来的长江水，李白是四川人"}],"a":"这是李白青年时期出蜀时所作的送别诗。颔联\"山随平野尽，江入大荒流\"用移动的视角写景，生动描绘了船过荆门山后由山地变为平原的壮阔景象。尾联\"仍怜故乡水，万里送行舟\"不说自己思念故乡，而说故乡之水一路送行，将故乡拟人化，含蓄地表达了诗人对故乡的依依惜别之情。全诗意境高远，想象瑰丽，是李白诗歌浪漫风格的典型体现。"},"106":{"o":"孤山寺北贾亭西，水面初平云脚低。\n几处早莺争暖树，谁家新燕啄春泥。\n乱花渐欲迷人眼，浅草才能没马蹄。\n最爱湖东行不足，绿杨阴里白沙堤。","t":[{"o":"孤山寺北贾亭西，水面初平云脚低。","t":"从孤山寺的北面到贾亭的西面，春水初涨，湖面与岸齐平，白云低垂，同湖面连成一片。"},{"o":"几处早莺争暖树，谁家新燕啄春泥。","t":"几只早来的黄莺争着飞到向阳的树枝上栖息，不知谁家新来的燕子正衔着春泥筑巢。"},{"o":"乱花渐欲迷人眼，浅草才能没马蹄。","t":"各种繁花渐渐让人目不暇接，浅浅的春草刚好能够遮没马蹄。"},{"o":"最爱湖东行不足，绿杨阴里白沙堤。","t":"我最喜爱湖东一带总是游览不够，尤其是绿杨掩映中的白沙堤。"}],"n":[{"w":"钱塘湖","m":"即杭州西湖"},{"w":"孤山寺","m":"在西湖孤山上"},{"w":"贾亭","m":"贾全所建的亭子"},{"w":"云脚","m":"接近地面的云气"},{"w":"早莺","m":"初春的黄莺"},{"w":"争暖树","m":"争着飞到向阳的树枝上"},{"w":"行不足","m":"游不够"},{"w":"白沙堤","m":"即白堤，西湖中一条长堤"}],"a":"这首诗是白居易任杭州刺史时所作，描绘了西湖早春的明媚风光。中间两联最为精彩：\"几处早莺争暖树，谁家新燕啄春泥\"写动物，\"乱花渐欲迷人眼，浅草才能没马蹄\"写植物，处处紧扣\"早\"和\"新\"二字，用词精准。\"渐欲\"和\"才能\"二词将早春花草初发的状态描写得恰到好处。全诗以\"行\"字为线索，移步换景，将西湖早春的盎然生机描绘得淋漓尽致。"},"107":{"o":"结庐在人境，而无车马喧。\n问君何能尔？心远地自偏。\n采菊东篱下，悠然见南山。\n山气日夕佳，飞鸟相与还。\n此中有真意，欲辨已忘言。","t":[{"o":"结庐在人境，而无车马喧。","t":"住在喧嚣的人世间，却没有车马的喧闹声。"},{"o":"问君何能尔？心远地自偏。","t":"问我为什么能够这样？心灵远离尘世，所居之地自然就显得偏远了。"},{"o":"采菊东篱下，悠然见南山。","t":"在东边篱笆下采摘菊花，不经意间看见了南山。"},{"o":"山气日夕佳，飞鸟相与还。","t":"山中的云气在傍晚时分尤其美好，飞鸟结伴归巢。"},{"o":"此中有真意，欲辨已忘言。","t":"这里面蕴含着人生的真正意义，想要辨明它却不知怎么用言语来表达。"}],"n":[{"w":"结庐","m":"建造房屋"},{"w":"人境","m":"人世间，人们聚居的地方"},{"w":"尔","m":"这样"},{"w":"心远","m":"心灵远离世俗"},{"w":"悠然","m":"闲适自得的样子"},{"w":"见","m":"同\"现\"，或解为无意中看见"},{"w":"日夕","m":"傍晚"},{"w":"相与还","m":"结伴归巢"},{"w":"真意","m":"人生的真正意义"}],"a":"这是陶渊明归隐田园后所作《饮酒》组诗中的第五首，也是最著名的一首。\"采菊东篱下，悠然见南山\"是千古绝唱，写出了诗人超脱世俗、与自然融为一体的闲适心境。一个\"见\"字尤妙，表现的是一种无意中与南山相见的悠然自得，而非刻意去看。全诗融说理、抒情、写景于一体，语言平淡自然却意蕴深远，体现了陶渊明诗歌的独特风格和人生追求。"},"108":{"o":"昔人已乘黄鹤去，此地空余黄鹤楼。\n黄鹤一去不复返，白云千载空悠悠。\n晴川历历汉阳树，芳草萋萋鹦鹉洲。\n日暮乡关何处是？烟波江上使人愁。","t":[{"o":"昔人已乘黄鹤去，此地空余黄鹤楼。","t":"传说中的仙人已经乘着黄鹤飞去了，这里只留下一座空空的黄鹤楼。"},{"o":"黄鹤一去不复返，白云千载空悠悠。","t":"黄鹤一去再也没有飞回来，千年来只有白云悠悠地飘荡。"},{"o":"晴川历历汉阳树，芳草萋萋鹦鹉洲。","t":"阳光照耀下汉阳的树木清晰可见，鹦鹉洲上的芳草长得非常茂盛。"},{"o":"日暮乡关何处是？烟波江上使人愁。","t":"天色已暮，故乡在何方？眼前只见烟波浩渺的江面，真叫人发愁。"}],"n":[{"w":"黄鹤楼","m":"故址在今湖北武汉蛇山"},{"w":"昔人","m":"指传说中的仙人"},{"w":"悠悠","m":"飘荡的样子"},{"w":"晴川","m":"阳光照耀下的江面"},{"w":"历历","m":"清晰分明的样子"},{"w":"萋萋","m":"草木茂盛的样子"},{"w":"鹦鹉洲","m":"长江中的小洲"},{"w":"乡关","m":"故乡"}],"a":"这首诗被后人誉为\"唐人七律第一\"，相传李白登黄鹤楼见此诗后叹道\"眼前有景道不得，崔颢题诗在上头\"。前半部分以仙人乘鹤的传说入诗，连用三个\"黄鹤\"，气势流转，一气呵成。后半部分由写景转入抒情，\"日暮乡关何处是？烟波江上使人愁\"将日暮怀乡的愁情融入浩渺的烟波之中，意境开阔而情感深沉。全诗气势恢宏，意境悠远，堪称登临诗的巅峰之作。"},"109":{"o":"唧唧复唧唧，木兰当户织。不闻机杼声，唯闻女叹息。\n\n问女何所思，问女何所忆。女亦无所思，女亦无所忆。昨夜见军帖，可汗大点兵，军书十二卷，卷卷有爷名。阿爷无大儿，木兰无长兄，愿为市鞍马，从此替爷征。\n\n东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。旦辞爷娘去，暮宿黄河边，不闻爷娘唤女声，但闻黄河流水鸣溅溅。旦辞黄河去，暮至黑山头，不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。\n\n万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。将军百战死，壮士十年归。\n\n归来见天子，天子坐明堂。策勋十二转，赏赐百千强。可汗问所欲，木兰不用尚书郎，愿驰千里足，送儿还故乡。\n\n爷娘闻女来，出郭相扶将；阿姊闻妹来，当户理红妆；小弟闻姊来，磨刀霍霍向猪羊。开我东阁门，坐我西阁床，脱我战时袍，著我旧时裳。当窗理云鬓，对镜帖花黄。出门看火伴，火伴皆惊忙：同行十二年，不知木兰是女郎。\n\n雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？","t":[{"o":"唧唧复唧唧，木兰当户织。不闻机杼声，唯闻女叹息。","t":"叹息声一声接一声，木兰对着门在织布。听不到织布机发出的声音，只听到姑娘在叹息。"},{"o":"问女何所思，问女何所忆。女亦无所思，女亦无所忆。","t":"问姑娘在想些什么，问姑娘在惦记什么。姑娘也没有想什么，姑娘也没有惦记什么。"},{"o":"昨夜见军帖，可汗大点兵，军书十二卷，卷卷有爷名。阿爷无大儿，木兰无长兄，愿为市鞍马，从此替爷征。","t":"昨夜看到征兵的文书，可汗在大规模征兵。征兵的名册很多卷，卷卷上面都有父亲的名字。父亲没有大儿子，木兰没有哥哥，愿意为此去买马鞍和马，从此代替父亲出征。"},{"o":"东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。","t":"到东市买了骏马，到西市买了马鞍和鞍垫，到南市买了马缰绳，到北市买了长鞭。"},{"o":"旦辞爷娘去，暮宿黄河边，不闻爷娘唤女声，但闻黄河流水鸣溅溅。","t":"早上辞别父母离开，晚上宿营在黄河边。听不到父母呼唤女儿的声音，只能听到黄河水奔腾流淌的声音。"},{"o":"旦辞黄河去，暮至黑山头，不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。","t":"早上辞别黄河离开，晚上到达黑山头。听不到父母呼唤女儿的声音，只能听到燕山胡人的战马嘶鸣的声音。"},{"o":"万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。将军百战死，壮士十年归。","t":"不远万里奔赴战场，翻越重重山峰就像飞起来那样迅速。北方的寒气传送着打更的声音，清冷的月光照射着铁打的铠甲。将士们经过无数次出生入死的战斗，有些战死沙场，有些征战多年后胜利归来。"},{"o":"归来见天子，天子坐明堂。策勋十二转，赏赐百千强。可汗问所欲，木兰不用尚书郎，愿驰千里足，送儿还故乡。","t":"归来朝见天子，天子坐在明堂上。记功很多次，赏赐了很多财物。可汗问木兰想要什么，木兰不愿意做尚书郎这样的高官，只希望骑上一匹千里马，送我回到故乡。"},{"o":"爷娘闻女来，出郭相扶将；阿姊闻妹来，当户理红妆；小弟闻姊来，磨刀霍霍向猪羊。","t":"父母听说女儿回来了，互相搀扶着到城外迎接；姐姐听说妹妹回来了，对着门户梳妆打扮起来；弟弟听说姐姐回来了，霍霍地磨刀准备杀猪宰羊。"},{"o":"开我东阁门，坐我西阁床，脱我战时袍，著我旧时裳。当窗理云鬓，对镜帖花黄。","t":"打开我东面阁楼的门，坐进我西面阁楼的床，脱下我打仗时穿的战袍，穿上我以前的女儿装。当着窗户对着镜子梳理美丽的头发，在脸上贴上装饰的花黄。"},{"o":"出门看火伴，火伴皆惊忙：同行十二年，不知木兰是女郎。","t":"走出门去看同行的战友，战友们都非常惊诧：在一起同行打仗十二年，竟然不知道木兰是个女孩子。"},{"o":"雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？","t":"雄兔的两只前脚时常动弹，雌兔的两只眼睛时常眯着；当两只兔子贴着地面奔跑时，怎么能辨别出哪只是雄兔，哪只是雌兔呢？"}],"n":[{"w":"唧唧","m":"叹息声"},{"w":"机杼","m":"织布机的声音"},{"w":"军帖","m":"征兵的文书"},{"w":"可汗","m":"古代西北少数民族对君主的尊称"},{"w":"军书","m":"征兵的名册"},{"w":"市","m":"买"},{"w":"鞍鞯","m":"马鞍和马鞍下的垫子"},{"w":"辔头","m":"驾驭牲口的嚼子和缰绳"},{"w":"戎机","m":"战争"},{"w":"朔气","m":"北方的寒气"},{"w":"金柝","m":"古时军中白天做饭、晚上打更用的器具"},{"w":"明堂","m":"古代帝王举行大典的朝堂"},{"w":"策勋","m":"记功"},{"w":"尚书郎","m":"尚书省的官员"},{"w":"帖花黄","m":"古代妇女的一种面部装饰"},{"w":"扑朔","m":"动弹的样子"},{"w":"迷离","m":"眯着眼的样子"}],"a":"《木兰诗》是北朝乐府民歌的代表作，与《孔雀东南飞》并称为\"乐府双璧\"。全诗以时间为序，叙述了木兰女扮男装、替父从军、征战沙场、凯旋回朝、辞官还乡的故事。诗歌语言朴素生动，大量运用了排比、对偶、反复等修辞手法。\"万里赴戎机，关山度若飞\"用简练的笔触概括了十年的征战生涯，\"当窗理云鬓，对镜帖花黄\"则细腻地刻画了木兰恢复女儿身时的喜悦。结尾以双兔为喻，巧妙风趣。全诗塑造了一个勤劳善良、坚毅勇敢、不慕功名的巾帼英雄形象。"},"110":{"o":"神龟虽寿，犹有竟时。\n腾蛇乘雾，终为土灰。\n老骥伏枥，志在千里。\n烈士暮年，壮心不已。\n盈缩之期，不但在天；\n养怡之福，可得永年。\n幸甚至哉，歌以咏志。","t":[{"o":"神龟虽寿，犹有竟时。","t":"神龟虽然长寿，也还有死去的时候。"},{"o":"腾蛇乘雾，终为土灰。","t":"腾蛇虽然能乘云驾雾，最终也免不了化为土灰。"},{"o":"老骥伏枥，志在千里。","t":"年老的千里马虽然伏在马槽旁，它的雄心仍然是驰骋千里。"},{"o":"烈士暮年，壮心不已。","t":"有志向的人到了晚年，奋发进取的雄心不会停止。"},{"o":"盈缩之期，不但在天；","t":"人寿命的长短，不单是由上天决定的。"},{"o":"养怡之福，可得永年。","t":"只要保持身心健康，就可以延年益寿。"},{"o":"幸甚至哉，歌以咏志。","t":"我真是幸运极了，用歌唱来表达自己的思想感情吧。"}],"n":[{"w":"神龟","m":"传说中长寿的龟"},{"w":"竟","m":"终结，指死亡"},{"w":"腾蛇","m":"传说中一种能腾云驾雾的蛇"},{"w":"骥","m":"千里马"},{"w":"枥","m":"马槽"},{"w":"烈士","m":"有远大志向的人"},{"w":"盈缩","m":"这里指寿命的长短"},{"w":"养怡","m":"调养身心，保持心情愉快"},{"w":"永年","m":"长寿"}],"a":"这首诗是曹操在平定乌桓后所作，表达了诗人对人生有限的清醒认识和积极进取的人生态度。\"老骥伏枥，志在千里。烈士暮年，壮心不已\"是千古传诵的名句，以\"老骥\"自比，表达了诗人虽然年迈但壮志不减的英雄气概。\"盈缩之期，不但在天\"则体现了朴素的唯物主义思想，强调人的主观能动性。全诗慷慨激昂，气势雄浑，展现了曹操老当益壮、自强不息的精神风貌。"},"111":{"o":"八月湖水平，涵虚混太清。\n气蒸云梦泽，波撼岳阳城。\n欲济无舟楫，端居耻圣明。\n坐观垂钓者，徒有羡鱼情。","t":[{"o":"八月湖水平，涵虚混太清。","t":"八月洞庭湖水盛涨与岸齐平，水天含混迷迷接连天空。"},{"o":"气蒸云梦泽，波撼岳阳城。","t":"云梦大泽水气蒸腾白白茫茫，波涛汹涌似乎把岳阳城撼动。"},{"o":"欲济无舟楫，端居耻圣明。","t":"想要渡水却没有船只，闲居不仕有愧于圣明天子。"},{"o":"坐观垂钓者，徒有羡鱼情。","t":"坐在湖边观看垂竿钓鱼的人，白白地产生羡鱼之情。"}],"n":[{"w":"张丞相","m":"指张九龄"},{"w":"涵虚","m":"包含天空，指天空倒映在水中"},{"w":"太清","m":"天空"},{"w":"云梦泽","m":"古时两大湖泊，在今湖北南部和湖南北部"},{"w":"济","m":"渡水"},{"w":"舟楫","m":"船和桨，这里比喻做官的途径"},{"w":"端居","m":"闲居"},{"w":"圣明","m":"太平盛世"},{"w":"羡鱼情","m":"比喻希望出仕做官的愿望"}],"a":"这首诗是一首干谒诗，是孟浩然想要请张九龄引荐而出仕所作。前半部分写洞庭湖的壮阔景象，\"气蒸云梦泽，波撼岳阳城\"是千古名句，以\"蒸\"和\"撼\"两个动词极力表现洞庭湖的磅礴气势，令人叹为观止。后半部分由写景转入抒情，巧妙地以\"欲济无舟楫\"比喻自己想做官却没有门路，以\"坐观垂钓者，徒有羡鱼情\"含蓄地表达求人引荐的愿望。全诗委婉含蓄，不落俗套，是干谒诗中的佳作。"},"112":{"o":"驿外断桥边，寂寞开无主。已是黄昏独自愁，更着风和雨。\n无意苦争春，一任群芳妒。零落成泥碾作尘，只有香如故。","t":[{"o":"驿外断桥边，寂寞开无主。","t":"驿站之外的断桥旁边，梅花寂寞地开放着，无人做主，无人欣赏。"},{"o":"已是黄昏独自愁，更着风和雨。","t":"已经到了黄昏时分，梅花独自忧愁，更又遭到风雨的摧残。"},{"o":"无意苦争春，一任群芳妒。","t":"梅花不打算苦苦争夺春色，任凭百花去嫉妒。"},{"o":"零落成泥碾作尘，只有香如故。","t":"即使凋零落地被碾成泥土和灰尘，梅花依然和往常一样散发出缕缕清香。"}],"n":[{"w":"驿","m":"驿站"},{"w":"无主","m":"无人欣赏，无人做主"},{"w":"更着","m":"又遭受，又加上"},{"w":"苦","m":"竭力，拼命"},{"w":"一任","m":"任凭"},{"w":"群芳","m":"百花"},{"w":"零落","m":"调谢脱落"},{"w":"碾","m":"压碎，碾碎"}],"a":"这是一首咏物词，借咏梅来表达词人高洁的品质和坚贞不屈的精神。上片写梅花的遭遇：生长在荒僻之处，无人赏识，又遭风雨侵袭。下片写梅花的精神：不与百花争艳，即使凋零碾碎，依然清香如故。\"零落成泥碾作尘，只有香如故\"是全词的点睛之笔，以梅花的品格象征词人即使遭遇不幸也绝不与世俗同流合污的高尚节操。全词以梅喻人，托物言志，物我交融。"},"113":{"o":"戍鼓断人行，边秋一雁声。\n露从今夜白，月是故乡明。\n有弟皆分散，无家问死生。\n寄书长不达，况乃未休兵。","t":[{"o":"戍鼓断人行，边秋一雁声。","t":"戍楼上的更鼓声阻断了行人的来往，边塞的秋天传来一只孤雁的哀鸣。"},{"o":"露从今夜白，月是故乡明。","t":"从今夜就进入了白露节气，月亮还是故乡的最明亮。"},{"o":"有弟皆分散，无家问死生。","t":"有兄弟却都分散在各地，已经没有了家，无法探问各自的死活。"},{"o":"寄书长不达，况乃未休兵。","t":"寄往家中的信长久不能送达，更何况战争至今还没有停止。"}],"n":[{"w":"舍弟","m":"谦称自己的弟弟"},{"w":"戍鼓","m":"戍楼上的更鼓"},{"w":"断人行","m":"指路上行人断绝"},{"w":"白","m":"指白露节气"},{"w":"况乃","m":"何况，况且"},{"w":"未休兵","m":"战争还没有停止"}],"a":"这首诗是杜甫在安史之乱期间客居秦州时所作。\"露从今夜白，月是故乡明\"是千古名句，看似不合常理——天下月亮本一样明亮，但在思乡之人眼中故乡的月亮格外明亮，这种主观感受真实而深刻地表达了诗人深切的思乡之情。全诗由望月引发思乡念亲之情，将个人遭遇与时代苦难紧密联系在一起，情感沉郁顿挫，体现了杜诗\"沉郁顿挫\"的典型风格。"},"114":{"o":"三年谪宦此栖迟，万古惟留楚客悲。\n秋草独寻人去后，寒林空见日斜时。\n汉文有道恩犹薄，湘水无情吊岂知？\n寂寂江山摇落处，怜君何事到天涯！","t":[{"o":"三年谪宦此栖迟，万古惟留楚客悲。","t":"贾谊被贬长沙在这里居留了三年，如今只留下千古以来客居楚地之人的悲哀。"},{"o":"秋草独寻人去后，寒林空见日斜时。","t":"你在人去之后独自寻觅着秋草，在寒林之中只能看见夕阳斜照的景象。"},{"o":"汉文有道恩犹薄，湘水无情吊岂知？","t":"汉文帝是明君 yet 对你的恩情尚且薄凉，湘水无情，你凭吊屈原他怎会知道？"},{"o":"寂寂江山摇落处，怜君何事到天涯！","t":"在这寂寞荒凉的江山草木凋零之处，可怜你为什么被贬谪到了这天之涯！"}],"n":[{"w":"贾谊","m":"西汉著名政论家、文学家，曾被贬长沙"},{"w":"谪宦","m":"贬官"},{"w":"栖迟","m":"居留，停留"},{"w":"楚客","m":"客居楚地的人，指贾谊，也暗指作者自己"},{"w":"汉文","m":"汉文帝刘恒"},{"w":"恩犹薄","m":"恩情还是淡薄"},{"w":"吊","m":"凭吊，贾谊曾作《吊屈原赋》"},{"w":"摇落","m":"草木凋零"},{"w":"天涯","m":"极远的地方"}],"a":"这首诗是刘长卿被贬南巴尉途经长沙时所作，表面是吊古，实为伤今。诗人借贾谊的被贬，来抒发自己被贬的悲愤。\"汉文有道恩犹薄\"一句最为含蓄深刻，连汉文帝这样有名的明君对贤臣都刻薄寡恩，弦外之音不言而喻。全诗将古人、今人融为一体，看似句句写贾谊，实则句句写自己，借古伤今，悲凉凄婉，具有很强的艺术感染力。"},"115":{"o":"一封朝奏九重天，夕贬潮州路八千。\n欲为圣明除弊事，肯将衰朽惜残年！\n云横秦岭家何在？雪拥蓝关马不前。\n知汝远来应有意，好收吾骨瘴江边。","t":[{"o":"一封朝奏九重天，夕贬潮州路八千。","t":"早晨向皇帝上了一封奏章，晚上就被贬到八千里外的潮州。"},{"o":"欲为圣明除弊事，肯将衰朽惜残年！","t":"本想替圣明的皇帝清除弊政，哪里肯因为自己衰老而吝惜残余的年月！"},{"o":"云横秦岭家何在？雪拥蓝关马不前。","t":"阴云横罩着秦岭，我的家在哪里？大雪阻塞了蓝关，马儿也不肯前行。"},{"o":"知汝远来应有意，好收吾骨瘴江边。","t":"知道你远道赶来应有深意，正好在瘴气弥漫的江边收敛我的尸骨。"}],"n":[{"w":"左迁","m":"贬官降职"},{"w":"蓝关","m":"在今陕西蓝田县南"},{"w":"湘","m":"韩愈的侄孙韩湘"},{"w":"九重天","m":"借指皇帝"},{"w":"弊事","m":"弊政，指迎佛骨入宫"},{"w":"衰朽","m":"衰老"},{"w":"残年","m":"晚年"},{"w":"秦岭","m":"终南山"},{"w":"瘴江","m":"指岭南一带瘴气弥漫的河流"},{"w":"收吾骨","m":"收拾我的尸骨"}],"a":"这首诗是韩愈因上《论佛骨表》谏迎佛骨而被贬潮州刺史途中所作。\"欲为圣明除弊事，肯将衰朽惜残年\"表现了韩愈忠而获罪、虽九死而不悔的凛然正气。\"云横秦岭家何在？雪拥蓝关马不前\"写景壮阔悲凉，云横雪拥，英雄失路，情景交融，堪称千古名句。尾联\"好收吾骨瘴江边\"则以沉痛之语作结，既表达了对前途的悲观，又透出刚直不阿的铮铮铁骨。全诗气势磅礴，悲壮激越。"},"116":{"o":"晨起动征铎，客行悲故乡。\n鸡声茅店月，人迹板桥霜。\n槲叶落山路，枳花明驿墙。\n因思杜陵梦，凫雁满回塘。","t":[{"o":"晨起动征铎，客行悲故乡。","t":"清晨起床整理车马铃铛准备出发，客居他乡的旅人思念着故乡而悲伤。"},{"o":"鸡声茅店月，人迹板桥霜。","t":"鸡叫声传来，茅草店上方挂着残月，板桥上铺满了白霜，上面留下了行人的足迹。"},{"o":"槲叶落山路，枳花明驿墙。","t":"槲叶飘落在山路上，枳树的白花照亮了驿站的墙壁。"},{"o":"因思杜陵梦，凫雁满回塘。","t":"于是想起了昨夜梦中的杜陵，凫雁充满了曲折的池塘。"}],"n":[{"w":"商山","m":"在今陕西商洛"},{"w":"征铎","m":"远行车马上的铃铛"},{"w":"茅店","m":"茅草客店"},{"w":"槲","m":"一种落叶乔木"},{"w":"枳","m":"一种灌木或小乔木，春天开白花"},{"w":"杜陵","m":"在长安城南，温庭筠曾在此居住"},{"w":"凫","m":"野鸭"},{"w":"回塘","m":"曲折的池塘"}],"a":"这首诗写的是旅人早行的情景。\"鸡声茅店月，人迹板桥霜\"是千古名句，诗人仅用六个名词（鸡声、茅店、月、人迹、板桥、霜）组合成两句诗，没有一个动词，却将早行的凄凉景象描绘得如在眼前。这种纯用名词意象叠加的手法，被后人称为\"意象叠加\"的典范。全诗紧扣\"早行\"二字，从视觉、听觉等多角度描写早行之景，情景交融，将旅人思乡的哀愁抒发得淋漓尽致。"},"117":{"o":"一上高城万里愁，蒹葭杨柳似汀洲。\n溪云初起日沉阁，山雨欲来风满楼。\n鸟下绿芜秦苑夕，蝉鸣黄叶汉宫秋。\n行人莫问当年事，故国东来渭水流。","t":[{"o":"一上高城万里愁，蒹葭杨柳似汀洲。","t":"一登上咸阳古城的高楼便引发了万里乡愁，蒹葭和杨柳长得像水中的小洲。"},{"o":"溪云初起日沉阁，山雨欲来风满楼。","t":"溪边乌云刚刚升起，太阳已经沉落在寺阁之后；山雨即将到来，狂风已经灌满了城楼。"},{"o":"鸟下绿芜秦苑夕，蝉鸣黄叶汉宫秋。","t":"黄昏时分鸟雀飞落在秦代宫苑长满绿草的废墟上，秋天蝉在汉代宫殿的枯黄树叶间鸣叫。"},{"o":"行人莫问当年事，故国东来渭水流。","t":"过路人不要追问从前的事情，故国已逝，只有渭水一如既往地向东流去。"}],"n":[{"w":"咸阳","m":"秦朝都城，在今陕西咸阳"},{"w":"蒹葭","m":"芦苇"},{"w":"汀洲","m":"水中小洲"},{"w":"溪云初起","m":"溪水上空云雾初起"},{"w":"日沉阁","m":"太阳沉没在佛寺阁楼之后"},{"w":"绿芜","m":"绿色的杂草丛"},{"w":"秦苑","m":"秦代的宫苑"},{"w":"汉宫","m":"汉代的宫殿"},{"w":"渭水","m":"渭河，流经咸阳"}],"a":"这首诗是许浑登咸阳古城楼远眺时所作的怀古伤今之作。\"山雨欲来风满楼\"是千古名句，既写实景，又暗含对晚唐王朝危机四伏、动荡不安的忧虑。颈联\"鸟下绿芜秦苑夕，蝉鸣黄叶汉宫秋\"以秦汉遗迹的荒凉来暗示唐王朝的衰败，将历史的沧桑与现实的忧虑融为一体。全诗在写景中寄寓了对国家命运的深沉忧虑，格调苍凉悲壮，是晚唐怀古诗中的佳作。"},"118":{"o":"相见时难别亦难，东风无力百花残。\n春蚕到死丝方尽，蜡炬成灰泪始干。\n晓镜但愁云鬓改，夜吟应觉月光寒。\n蓬山此去无多路，青鸟殷勤为探看。","t":[{"o":"相见时难别亦难，东风无力百花残。","t":"相见很难，离别更难，何况在这东风无力、百花凋谢的暮春时节。"},{"o":"春蚕到死丝方尽，蜡炬成灰泪始干。","t":"春蚕直到死亡才停止吐丝，蜡烛燃尽成灰时像泪一样的蜡油才能滴干。"},{"o":"晓镜但愁云鬓改，夜吟应觉月光寒。","t":"清晨对镜梳妆，只担心如云的鬓发改变颜色；夜晚长吟不寐，必然感到月光下的寒冷。"},{"o":"蓬山此去无多路，青鸟殷勤为探看。","t":"对方的住处从这里去没有多远的路，希望有青鸟一样的使者为我殷勤地去探看。"}],"n":[{"w":"丝","m":"谐音\"思\"，相思之情"},{"w":"蜡炬","m":"蜡烛"},{"w":"云鬓","m":"形容女子浓美如云的头发"},{"w":"蓬山","m":"蓬莱山，传说中的仙山，这里指对方的住处"},{"w":"青鸟","m":"神话中西王母的信使，这里指传递消息的人"}],"a":"这首诗是李商隐\"无题\"诗中最著名的一首，描写了暮春时节与所爱之人痛苦离别的深情。\"春蚕到死丝方尽，蜡炬成灰泪始干\"是传诵千古的名句，以\"丝\"谐音\"思\"，用春蚕吐丝和蜡烛燃烧来比喻至死不渝的爱情和绵绵不尽的相思，形象贴切，感情深挚。全诗构思精巧，意象优美，情感缠绵悱恻，体现了李商隐诗歌深情绵邈、绮丽精工的艺术特色。"},"119":{"o":"十五从军征，八十始得归。\n道逢乡里人，家中有阿谁？\n遥看是君家，松柏冢累累。\n兔从狗窦入，雉从梁上飞。\n中庭生旅谷，井上生旅葵。\n舂谷持作饭，采葵持作羹。\n羹饭一时熟，不知贻阿谁。\n出门东向看，泪落沾我衣。","t":[{"o":"十五从军征，八十始得归。","t":"十五岁就应征去参军，八十岁才得以回到家乡。"},{"o":"道逢乡里人，家中有阿谁？","t":"路上遇到一个乡里的人，问：\"我家里还有哪些人健在？\""},{"o":"遥看是君家，松柏冢累累。","t":"\"远远看去那就是你的家，松柏之间坟墓一个连着一个。\""},{"o":"兔从狗窦入，雉从梁上飞。","t":"野兔从狗洞里钻进钻出，野鸡在屋脊上飞来飞去。"},{"o":"中庭生旅谷，井上生旅葵。","t":"院子里长着野生的谷子，井台上长着野生的葵菜。"},{"o":"舂谷持作饭，采葵持作羹。","t":"把谷子捣掉壳用来做饭，采摘葵菜用来做汤。"},{"o":"羹饭一时熟，不知贻阿谁。","t":"汤和饭一会儿都做好了，却不知道送给谁吃。"},{"o":"出门东向看，泪落沾我衣。","t":"走出家门向东张望，眼泪落下来沾湿了衣裳。"}],"n":[{"w":"始","m":"才"},{"w":"阿谁","m":"谁"},{"w":"冢","m":"坟墓"},{"w":"累累","m":"一个接一个的样子"},{"w":"狗窦","m":"给狗出入的墙洞"},{"w":"雉","m":"野鸡"},{"w":"旅谷","m":"野生的谷子"},{"w":"旅葵","m":"野生的葵菜"},{"w":"舂","m":"把谷物的壳捣掉"},{"w":"羹","m":"汤"},{"w":"贻","m":"送给"}],"a":"这是一首汉乐府叙事诗，以一个老兵的视角揭露了封建兵役制度给人民带来的深重灾难。\"十五从军征，八十始得归\"以极度浓缩的数字对比，写出了老兵一生征战之苦。归家后所见是一幅家破人亡的凄惨画面：兔入狗洞、雉飞梁上、庭生旅谷、井生旅葵，以荒凉破败的环境暗示家人皆已亡故。\"羹饭一时熟，不知贻阿谁\"以极平淡的叙事传达出极深沉的悲痛，结尾\"泪落沾我衣\"更是催人泪下。全诗不加任何评论，以白描手法叙事写景，却比任何议论都更有力量。"},"120":{"o":"树绕村庄，水满陂塘。倚东风，豪兴徜徉。小园几许，收尽春光。有桃花红，李花白，菜花黄。\n远远围墙，隐隐茅堂。飏青旗，流水桥旁。偶然乘兴，步过东冈。正莺儿啼，燕儿舞，蝶儿忙。","t":[{"o":"树绕村庄，水满陂塘。倚东风，豪兴徜徉。","t":"绿树环绕着村庄，春水满了池塘。倚着温暖的东风，带着豪情逸兴悠闲地漫步。"},{"o":"小园几许，收尽春光。有桃花红，李花白，菜花黄。","t":"小小的园子有多大呢？却收尽了这大好的春光。有红色的桃花，白色的李花，黄色的菜花。"},{"o":"远远围墙，隐隐茅堂。
