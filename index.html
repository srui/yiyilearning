<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上海小学英语 · 2025新教材</title>
<style>
@import url('https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;600;700;900&family=Fredoka:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(170deg,#0d1b2a 0%,#1b2838 40%,#2d4a3e 100%);min-height:100vh;color:#ecf0f1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}

.hero{text-align:center;margin-bottom:50px}
.hero h1{font-family:'Fredoka',sans-serif;font-size:2.4em;color:#ffd200;margin-bottom:8px;text-shadow:0 2px 20px rgba(255,210,0,.15)}
.hero p{color:rgba(255,255,255,.35);font-size:1em;line-height:1.8}

.section-label{color:rgba(255,255,255,.2);font-size:.8em;letter-spacing:4px;text-transform:uppercase;margin-bottom:16px}

.grids{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:560px;width:100%;margin-bottom:40px}

.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:28px 24px;text-align:center;cursor:pointer;transition:all .25s;position:relative;text-decoration:none;color:#ecf0f1;overflow:hidden}
.card:hover{background:rgba(255,255,255,.08);transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.2);color:#ecf0f1}
.card:active{transform:translateY(0)}

.card .grade{font-family:'Fredoka',sans-serif;font-size:1.5em;font-weight:700;color:#fff;margin-bottom:4px}
.card .label{font-size:.88em;color:rgba(255,255,255,.4)}
.card .status{display:inline-block;margin-top:12px;font-size:.72em;padding:4px 12px;border-radius:20px}
.card .status.ready{background:rgba(255,210,0,.12);color:#ffd200}
.card .status.soon{background:rgba(255,255,255,.06);color:rgba(255,255,255,.25)}
.card .tag{position:absolute;top:14px;right:14px;font-size:.7em;padding:3px 10px;border-radius:12px;background:rgba(255,210,0,.12);color:#ffd200}

/* 大融合卡片 */
.fusion-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:32px 24px;text-align:center;cursor:pointer;transition:all .25s;position:relative;text-decoration:none;color:#ecf0f1;max-width:560px;width:100%;margin-bottom:20px;display:block;overflow:hidden}
.fusion-card:hover{background:rgba(255,210,0,.06);border-color:rgba(255,210,0,.15);transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.2);color:#ecf0f1}
.fusion-card .fusion-title{font-family:'Fredoka',sans-serif;font-size:1.3em;font-weight:700;color:#ffd200;margin-bottom:6px}
.fusion-card .fusion-desc{font-size:.88em;color:rgba(255,255,255,.35)}
.fusion-card .status{display:inline-block;margin-top:12px;font-size:.72em;padding:4px 12px;border-radius:20px}
.fusion-card .status.soon{background:rgba(255,255,255,.06);color:rgba(255,255,255,.25)}

@media(max-width:500px){
  .hero h1{font-size:1.7em}
  .grids{grid-template-columns:1fr}
  .card{padding:22px 20px}
}
@media(min-width:501px) and (max-width:1024px){
  .hero h1{font-size:2.2em}
  .card{padding:32px 28px}
  .card .grade{font-size:1.7em}
}
</style>
</head>
<body>

<div class="hero">
  <h1>English World</h1>
  <p>选择年级开始复习</p>
</div>

<div class="section-label">按年级复习</div>

<div class="grids">
  <a class="card" href="g1a/index.html">
    <div class="grade">Grade 1A</div>
    <div class="label">一年级上册</div>
    <div class="status soon">敬请期待</div>
  </a>
  <a class="card" href="g1b/index.html">
    <div class="grade">Grade 1B</div>
    <div class="label">一年级下册</div>
    <div class="status soon">敬请期待</div>
  </a>
  <a class="card" href="g2a/index.html">
    <div class="tag">NEW</div>
    <div class="grade">Grade 2A</div>
    <div class="label">二年级上册</div>
    <div class="status ready">开始学习</div>
  </a>
  <a class="card" href="g2b/index.html">
    <div class="grade">Grade 2B</div>
    <div class="label">二年级下册</div>
    <div class="status soon">敬请期待</div>
  </a>
</div>

<a class="fusion-card" href="all/index.html">
  <div class="fusion-title">All-in-One · 全年级大融合</div>
  <div class="fusion-desc">1-5年级所有词汇短句大合集，一次搞定</div>
  <div class="status soon">敬请期待</div>
</a>

<a class="fusion-card" href="guwen/" style="border-color:rgba(61,122,95,.2);">
  <div class="fusion-title" style="color:#7ec8a0;">古诗文背诵大全</div>
  <div class="fusion-desc">34篇文言文 + 144首古诗词 · 逐句翻译 · 注释赏析 · 生僻字注音</div>
  <div class="status ready">开始学习</div>
</a>

<a class="fusion-card" href="economics/" style="border-color:rgba(102,126,234,.2);">
  <div class="fusion-title" style="color:#a78bfa;">小E学院 · 儿童经济学启蒙</div>
  <div class="fusion-desc">亲子课程 24 课 + 冒险故事书 · 用经济学思维认识世界</div>
  <div class="status ready">开始学习</div>
</a>

</body>
</html>
